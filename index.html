<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><title>Это База!</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');:root{--bg:#0b0d12;--card:#151a23;--line:#2a3240;--text:#f7f8fb;--muted:#9199a9;--lime:#c8ff35;--red:#ff7080}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#263018 0,transparent 30%),var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;min-height:100vh}.wrap{max-width:820px;margin:auto;padding:26px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:75px}.logo{font-size:19px;font-weight:800;letter-spacing:-.05em}.logo i{color:var(--lime);font-style:normal}.tag{color:var(--muted);font:12px 'DM Mono';border:1px solid var(--line);border-radius:99px;padding:8px 11px}.hero{margin-bottom:40px}.eyebrow{font:12px 'DM Mono';color:var(--lime);letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px}.title{font-size:clamp(42px,10vw,80px);line-height:.96;letter-spacing:-.07em;margin:0 0 17px}.lead{font-size:16px;color:var(--muted);max-width:470px}.menu{display:grid;gap:12px}.menu button,.back{width:100%;text-align:left;padding:22px 22px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(140deg,#181e29,#11151d);color:var(--text);cursor:pointer;font:700 17px Manrope;transition:.2s}.menu button:hover,.back:hover{border-color:var(--lime);transform:translateY(-2px)}.menu button span{display:block;color:var(--muted);font-size:12px;font-weight:500;margin-top:6px}.screen{display:none}.screen.active{display:block}.back{background:transparent;color:var(--muted);font-size:13px;padding:12px 15px;margin-bottom:17px;width:auto}.packlist{display:grid;gap:9px}.pack{display:flex;justify-content:space-between;align-items:center;padding:17px 18px;background:#141922;border:1px solid var(--line);border-radius:15px;color:var(--text);cursor:pointer;text-align:left}.pack:hover{border-color:var(--lime)}.pack strong{font-size:14px}.pack small{color:var(--muted);font:12px 'DM Mono'}.question{background:linear-gradient(145deg,#171d28,#11151d);border:1px solid var(--line);border-radius:24px;padding:25px 24px 22px}.qmeta{display:flex;justify-content:space-between;color:var(--muted);font:12px 'DM Mono';margin-bottom:22px}.qtext{font-size:clamp(20px,4vw,29px);line-height:1.35;letter-spacing:-.03em;min-height:160px}.form{display:flex;gap:9px;margin-top:25px}.input{flex:1;min-width:0;background:#0c0f15;border:1px solid #374152;border-radius:13px;padding:15px;color:var(--text);font:500 16px Manrope;outline:none}.input:focus{border-color:var(--lime);box-shadow:0 0 0 4px #c8ff3520}.check{background:var(--lime);border:0;border-radius:13px;padding:0 21px;font-weight:800;cursor:pointer}.feedback{height:29px;padding-top:13px;font-weight:700;font-size:14px}.ok{color:var(--lime)}.bad{color:var(--red)}.progress{height:4px;background:#252d3a;border-radius:5px;margin-top:17px}.bar{height:100%;background:var(--lime);transition:.3s}.foot{display:flex;justify-content:space-between;color:var(--muted);font:12px 'DM Mono';margin-top:15px}@media(max-width:520px){.top{margin-bottom:52px}.form{flex-direction:column}.check{height:51px}.qtext{min-height:220px}.title{font-size:58px}}
</style></head><body><main class="wrap"><header class="top"><div class="logo">QUIZ<i>.</i></div><div class="tag">ЭРУДИЦИЯ / 2026</div></header><section id="home" class="screen active"><div class="hero"><div class="eyebrow">Тренировочная база</div><h1 class="title">Это<br>База!</h1><p class="lead">Вопросы, которые не отпускают. Выбирай пакет или бросай себе случайный вызов.</p></div><div class="menu"><button onclick="showPacks()">Выбор пакета<span>Идти по порядку и прокачивать серию</span></button><button onclick="randomQuestion()">Случайный вопрос<span>Один вопрос из всей базы прямо сейчас</span></button></div></section><section id="packs" class="screen"><button class="back" onclick="goHome()">← На главную</button><div class="eyebrow">Выбери набор</div><h2 class="title" style="font-size:clamp(34px,7vw,54px);margin-bottom:25px">Пакеты</h2><div id="packlist" class="packlist"></div></section><section id="quiz" class="screen"><button class="back" onclick="showPacks()">← К пакетам</button><div class="question"><div class="qmeta"><span id="packname"></span><span id="counter"></span></div><div id="qtext" class="qtext"></div><form id="form" class="form"><input id="answer" class="input" placeholder="Введите ваш ответ…" autocomplete="off"><button class="check">Проверить</button></form><div id="feedback" class="feedback"></div><div class="progress"><div id="bar" class="bar"></div></div></div><div class="foot"><span>ENTER — проверить</span><span id="score">0 правильных</span></div></section></main><script>const packs=[{"id": "6009", "title": "Кубок Оливье", "questions": [{"number": 1, "text": "Рихард Штраус, описывая в симфонической поэме \"Дон Жуан\" похождения ловеласа, сразу переходит к делу. Как подметил критик, ОНА у Штрауса длится 11 секунд. Назовите ЕЕ.", "answer": "Прелюдия", "complexity": "95.21; 85.19", "handout": "0"}, {"number": 2, "text": "Перед вами название песни одной немецкой группы. В тексте песни звучит фраза \"два, три или четыре!\".  Восстановите в исходном виде слово на раздаточном материале, которое мы изменили.", "answer": "Beer [бир]", "complexity": "28.14; 35.19", "handout": "1"}, {"number": 3, "text": "На одной карикатуре работники тюрьмы пугают ЕГО, чтоб обнаружить подкоп. Назовите ЕГО.", "answer": "страус", "complexity": "91.62; 92.59", "handout": "0"}, {"number": 4, "text": "Фанаты полагают, что Даниэль Айяла очень любит Рождество. Свои догадки они подтверждают тем, что он не раз получал АЛЬФЫ в конце года, например 22 декабря. Назовите АЛЬФУ двумя словами, начинающимися на одну букву.", "answer": "красная карточка", "complexity": "71.26; 75.93", "handout": "0"}, {"number": 5, "text": "Бразильские СМИ сообщили, что одно слово стало именем нарицательным со значением “несравненный”. Напишите это слово, в котором все гласные одинаковые.", "answer": "Пеле.", "complexity": "94.61; 87.04", "handout": "0"}, {"number": 6, "text": "В 1908 году в США вышел фильм \"Шерлок Холмс и великая загадка убийства\". Несмотря на название, фильм снят... Закончите мысль, использовав два омонима.", "answer": "по [произведению] По", "complexity": "27.55; 27.78", "handout": "0"}, {"number": 7, "text": "Фильм из предыдущего вопроса можно назвать первым в истории ИМ. Автомобильный журнал пишет, что первый ОН появился в 1948 году. Назовите ЕГО.", "answer": "кроссовер", "complexity": "53.29; 37.04", "handout": "0"}, {"number": 8, "text": "В Швеции произошла уникальная авария: автомобиль врезался в НЕЁ. Какой была ОНА в произведении 1968 года?", "answer": "желтой.", "complexity": "63.47; 66.67", "handout": "0"}, {"number": 9, "text": "По мнению автора вопроса, персонаж Айзека Азимова, который становится смертным, это гробик. Какие два слова мы заменили одним?", "answer": "киборг наоборот.", "complexity": "53.89; 51.85", "handout": "0"}, {"number": 10, "text": "Перед вами фрагмент картины \"Наполеон Бонапарт в своем рабочем кабинете в Тюильри\". Благодаря ПЕРВЫМ и ВТОРОЙ эта картина являлась тонкой пропагандой, подчеркивающей работоспособность Наполеона. Назовите ПЕРВЫЕ и ВТОРУЮ.", "answer": "часы, свеча", "complexity": "97.61; 87.04", "handout": "1"}, {"number": 11, "text": "В баскском языке слова “нож” и “топор” происходят от слова “ОН”, что считается доказательством древности этого языка. Назовите ЕГО.", "answer": "Камень.", "complexity": "87.43; 88.89", "handout": "0"}, {"number": 12, "text": "Жители одной австрийской деревни устали от шума и выхлопных газов. Результатом стала постройка большой парковки на окраине деревни и появление второго ЕГО в Австрии. Назовите ЕГО.", "answer": "метрополитен", "complexity": "32.93; 31.48", "handout": "0"}, {"number": 13, "text": "На карикатуре в разговоре с женой ОН подтверждает, что ночью был в доме своей бывшей, и объясняет, что это его работа. Назовите ЕГО, используя дефис.", "answer": "Санта-Клаус.", "complexity": "76.05; 61.11", "handout": "0"}, {"number": 14, "text": "Художник Энгель Набиуллин изобразил создание ЕГО. Рисунок выполнен в монохроме, с минимумом цветных деталей. Напишите целиком слово, от которого мы оставили треть.", "answer": "снеговика.", "complexity": "37.73; 37.04", "handout": "0"}, {"number": 15, "text": "Плиний в своей \"Естественной истории\" сообщает, что материалом для ИХ хижин служат глина, скорлупа яиц и птичьи перья. Назовите ИХ.", "answer": "пигмеи.", "complexity": "14.97; 16.67", "handout": "0"}, {"number": 16, "text": "Статья, посвящённая экодукам, называется «ОНА для НЕЁ». Назовите ЕЁ.", "answer": "зебра.", "complexity": "40.72; 33.33", "handout": "0"}, {"number": 17, "text": "Рождественский штоллен это традиционная немецкая выпечка с миндалëм, изюмом и цукатами. В 1978 году в ГДР штоллен планировали запретить из-за дефицита ЕЁ. Назовите ЕЁ словом, восходящим к корню со значением “быть сильным”.", "answer": "валюта", "complexity": "1.20; 5.56", "handout": "0"}, {"number": 18, "text": "Немецкое выражение, в котором упоминается ПЕРВАЯ и ВТОРОЙ, не о неуклюжести, а о способности решить трудную задачу. Назовите ПЕРВУЮ и ВТОРОЙ словами на соседние буквы алфавита.", "answer": "корова, лед", "complexity": "53.29; 38.89", "handout": "0"}, {"number": 19, "text": "Полагают, что картина Дега «Интерьер» изображает ссору в супружеской спальне. Однако Феликс Кремер считает эту версию несостоятельной, ведь ОНА на картине ТАКАЯ. Назовите ТАКУЮ ЕЁ.", "answer": "односпальная кровать", "complexity": "42.52; 44.44", "handout": "0"}, {"number": 20, "text": "Британская газета The Guardian [Зе Гардиан] назвала Бэнкси новым ИКСОМ. Одно из слов вопроса мы сократили. Восстановите это слово в исходном виде.", "answer": "Диккенсом", "complexity": "35.93; 31.48", "handout": "1"}, {"number": 21, "text": "Предыдущий вопрос был написан несколько месяцев назад и мог войти в более ранние турниры, но автор твердо сказал себе — “ПРОПУСК”. Заполните ПРОПУСК несколькими словами.", "answer": "не трогай, это на “Оливье”", "complexity": "89.22; 83.33", "handout": "0"}, {"number": 22, "text": "Группа людей выстроила необычную конструкцию, используя целых десять тысяч двести книг. Экземпляры какой книги они использовали?", "answer": "Книга рекордов Гиннесса.", "complexity": "16.17; 24.07", "handout": "0"}, {"number": 23, "text": "Юстус фон Либих назвал \"Лающей собакой\" реакцию, которая проходит с характерными пламенем и звуком. Примечательно, что превращение в произведении начала XIX-го века описано с похожими сопутствующими эффектами. Какой элемент выделяется в ходе упомянутой химической реакции?", "answer": "сера", "complexity": "56.29; 62.96", "handout": "0"}, {"number": 24, "text": "В немецкой традиции Крампус — существо, похожее на дьявола, которое сопровождает Санта-Клауса. На рождественской открытке начала прошлого века Крампус изображен ПРОПУСК. Название какого издания мы пропустили?", "answer": "за рулём\nЗачет; точный ответ", "complexity": "55.69; 66.67", "handout": "0"}, {"number": 25, "text": "В постмодернистском мультфильме три поросенка прячутся от волка в домике. Через некоторое время поросята слышат шум на крыше, разжигают огонь и ставят котел. Затем поросята замечают, что в окно заглядывают ОНИ. Назовите имя любого из НИХ.", "answer": "Рудольф", "complexity": "94.61; 85.19", "handout": "0"}, {"number": 26, "text": "На англоязычной карикатуре Санта-Клаус попросил нанять ему в помощники человека для определенной работы. Но вместо этого пригласили музыканта, выступающего… в каком жанре?", "answer": "рэп.", "complexity": "26.95; 35.19", "handout": "0"}, {"number": 27, "text": "Фермеры устанавливают на полях высокие Т-образные конструкции, которые предназначены для НИХ. В других НИХ каждая героиня использует собственный стиль ведения боя. Назовите ИХ двумя словами.", "answer": "хищные птицы.", "complexity": "41.32; 35.19", "handout": "0"}, {"number": 28, "text": "Главный герой фильма «Большой Лебовски» — безработный безамбициозный лентяй, заполняющий свободное время игрой в боулинг. В первых кадрах фильма можно увидеть ЭТО. В некоторых фильмах ЭТО используют для демонстрации заброшенности местности. Назовите ЭТО.", "answer": "перекати-поле", "complexity": "88.02; 83.33", "handout": "0"}, {"number": 29, "text": "На картине Шарля Хоффба́уера изображена модная дама, которая собирается уходить из людного ресторана, даже не сделав заказ. На картине можно увидеть ИХ. По мнению искусствоведа, именно ОНИ стали причиной ухода. Назовите ИХ двумя словами на соседние буквы алфавита.", "answer": "одинаковые платья.", "complexity": "35.93; 24.07", "handout": "0"}, {"number": 30, "text": "На рождественском рекламном плакате изображение ЕГО сопровождается фразой: \"То, что пожелали бы себе Мария и Иосиф\". Назовите ЕГО словом с приставкой или заимствованным словом.", "answer": "подгузник", "complexity": "59.88; 55.56", "handout": "0"}, {"number": 31, "text": "Каким английским семибуквенным неологизмом называются такие головоломки?", "answer": "windoku.", "complexity": "28.74; 20.37", "handout": "1"}, {"number": 32, "text": "Ученые обнаружили камень с картой, сделанной в IV веке до нашей эры. Одну из точек на этой карте учёные не смогли сопоставить с современными данными, поэтому полагают, что эта точка — ОНА. Назовите ЕЕ словом с приставкой.", "answer": "сверхновая", "complexity": "44.31; 35.19", "handout": "0"}, {"number": 33, "text": "В одном мультфильме находящийся на поверхности кит выполняет роль ИКСА для определенных рыб. Единственный немецкий ИКС назвали в честь Фердинанда Цеппелина. Назовите ИКС словом с двумя корнями.", "answer": "авианосец.", "complexity": "59.88; 59.26", "handout": "0"}, {"number": 34, "text": "Китайская поэтесса Су Хуэй написала поэму, представляющую собой квадрат из иероглифов размером 29 на 29. Эта поэма — ИКС. ИКС не является ИКСОМ. Какое слово мы заменили на ИКС?", "answer": "палиндром", "complexity": "89.22; 87.04", "handout": "0"}, {"number": 35, "text": "Дуплет, два вопроса по 30 секунд обсуждения каждый, ответы сдаются на одном бланке.\n1. Журналист спросил орнитолога Игоря Землянских, действительно ли ПРОПУСК счастье? Заполните ПРОПУСК двумя словами.\n2. Группа сирийцев безуспешно пыталась пересечь границу, спрятавшись в грузовике с овощами. В итоге их ПРОПУСК пограничники. Заполните ПРОПУСК тремя словами.", "answer": "1. аист приносит 2. нашли в капусте.", "complexity": "86.23; 77.78", "handout": "0"}, {"number": 36, "text": "«Поэма Конца» эго-футуриста Василиска Гнедова завершает цикл из пятнадцати поэм, в которых последовательно аннигилировались различные художественные элементы. Кирилл Корчагин сравнивает “Поэму конца” с… каким произведением второй половины двадцатого века?", "answer": "4’33”", "complexity": "34.13; 27.78", "handout": "0"}, {"number": 40, "text": "Анна ВИнер приводит гипотезу, согласно которой Тим БЕрнерс-Ли часто отсутствовал на рабочем месте. При этом Винер упоминает номер комнаты. Напишите этот номер.", "answer": "404", "complexity": "73.33", "handout": "0"}]}, {"id": "6246", "title": "Дикая Охота", "questions": [{"number": 1, "text": "Рассказывают, что после выхода на пенсию хоккейный тренер Анатолий Тарасов занялся дачей, где нашёл применение старому инвентарю: например, стал использовать клюшки для бани. Какое слово с приставкой мы заменили в предыдущем предложении?", "answer": "подвязки.", "complexity": "73.68", "handout": "0"}, {"number": 2, "text": "Рассказывают, что один сотрудник киностудии То́хо был грузным, неуклюжим и напоминал обезьяну, поэтому коллеги дали ему некое прозвище. В 1950-е годы на студии То́хо был снят первый фильм... О ком?", "answer": "Годзилла.", "complexity": "89.47", "handout": "0"}, {"number": 3, "text": "Недавно стали известны новые детали биографии императора Гелиогабала, в связи с чем в экспозиции одного музея у императора изменилось ЭТО. Напишите ЭТО, которое предпочитает капитан вашей команды.", "answer": "я.", "complexity": "52.63", "handout": "0"}, {"number": 4, "text": "На иллюстрациях Артура Рекхема к «Алисе в стране чудес» девочка выглядит очень реалистично, в то время как другие персонажи изображены гротескно, а их пропорции искажены. Считается, что именно картины Рекхема послужили источником вдохновения для известного мексиканца, который работал… Ответьте двумя словами: над чем?", "answer": "«Лабиринт Фавна».", "complexity": "63.16", "handout": "1"}, {"number": 5, "text": "По замыслу этого человека, Христос должен был состоять из всего сущего на земле, однако замысел так и не был реализован из-за угрозы отлучения от церкви. Назовите этого человека.", "answer": "Джузеппе Арчимбольдо.", "complexity": "94.74", "handout": "0"}, {"number": 6, "text": "[Ведущему: не озвучивать кавычки вокруг слова «ОН»]\nСтадо бегущих бизонов уничтожило несколько дорогих камер, а исполнитель главной роли упал с коня и едва не сломал позвоночник, но «ОН» всё-таки вышел на экраны. Видео с другими НИМИ были популярны в Тик-токе в конце 2023 года. Какие три слова мы заменили словом ОН?", "answer": "танцующий с волками.", "complexity": "63.16", "handout": "0"}, {"number": 7, "text": "В конце жизни святая Наталия Никомидийская долго скиталась, не находя себе места, но к числу ТАКИХ мучениц Наталью относят из-за того, что она умерла ненасильственной смертью. Какое прилагательное с приставкой мы заменили на «ТАКАЯ»?", "answer": "бескровная.", "complexity": "42.11", "handout": "0"}, {"number": 8, "text": "Говорят, что разработанному в СССР аналогу операционной системы UNIX [юникс] изначально хотели дать название, в котором мы пропустили две буквы. Воспроизведите это название в изначальном виде.", "answer": "UNAS [унас].", "complexity": "63.16", "handout": "1"}, {"number": 9, "text": "В вопросе слово «ЭТО» заменяет другое слово. Близкие художника Отто Дикса присылали ему на фронт карандаши и бумагу, чтобы тот мог работать прямо в окопе. Дикс считал войну абсурдной, и, желая подчеркнуть свою отстранённость, писал на ЭТОМ. Напишите на ЭТОМ то, что дало ЭТОМУ название.", "answer": "espero.", "complexity": "42.11", "handout": "0"}, {"number": 10, "text": "В вопросе слово «ОНО» заменяет другие два слова. На картине «Прибытие почты» изображено небольшое поселение в Гренландии. По словам искусствоведов, долгожданная почта символизирует ЕГО. Ответьте, используя белорусских редакторов: что делает лирическая героиня Алёны Швец во время НЕГО?", "answer": "собирает букет полевых цветов.", "complexity": "63.16", "handout": "0"}, {"number": 10, "text": "На одной из страниц сайта журнала \"Дилетант\" упоминаются взятие Смоленска Витовтом, возвращение Тимура в Самарканд и вступление на папский престол Иннокентия VII. Безошибочно назовите год, которому посвящена данная страница.", "answer": "1404.", "complexity": "", "handout": "0"}, {"number": 11, "text": "Дуплет. Два вопроса по 30 секунд обсуждения каждый. Ответы сдаются на одном бланке.\n1. Каким восьмибуквенным английским неологизмом автор вопроса назвал отношения между членами экипажа корабля?\n2. Каким восьмибуквенным английским неологизмом автор вопроса назвал отношения между членами шайки лесных разбойников?", "answer": "1. shiphood [шипхуд]; 2. hoodship [худшип].", "complexity": "36.84", "handout": "0"}, {"number": 12, "text": "[Ведущему: слегка выделить голосом слова «Не там»]\nДуплет. Два вопроса по 30 секунд обсуждения каждый. После того, как вы придумаете ответ на первый вопрос дуплета, второй может показаться вам очевидным, но искать его нужно НЕ ТАМ.\n1. На картине «Bal masque l’opera» [бал маск ль опера́] — бал-маскарад в опере — изображена оброненная кем-то визитка. Какие пять букв на ней написаны?\n2. На одной карикатуре изображены коровы и нечто, напоминающее спич-баблы. Однако, если приглядеться, оказывается, что это вовсе не спич-баблы, ведь в них написана… Ответьте пятью буквами: формула чего?", "answer": "1. Manet; 2. метан.", "complexity": "26.32", "handout": "0"}, {"number": 13, "text": "[Ведущему: истошно заорать после слова «пропуски»]\nКинолюбитель пишет, что после выхода фильма на кассетах непугливые зрители использовали ПРОПУСК ОДИН, чтобы получше рассмотреть лицо ПРОПУСК ДВА на крупных планах. Заполните пропуски [ИСТОШНЫЙ КРИК ВЕДУЩЕГО] похожими словами.", "answer": "паузу, Пазу́зу.", "complexity": "10.53", "handout": "0"}, {"number": 14, "text": "Вероятно, вам не очень-то нужно это изображение, но мы всё равно решили дать вам раздатку. Каким окказионализмом автор вопроса назвал эту картину?", "answer": "дикспик.", "complexity": "15.79", "handout": "1"}, {"number": 15, "text": "Труп мужчины, обнаруженный в небольшом пространстве под одной АЛЬФОЙ, объяснили неудачной попыткой вуайеризма. Согласно сомнительной версии, АЛЬФА получила название за сходство с реликвией, хранящейся в соборе Сан-Лоре́нцо. Назовите АЛЬФУ двумя словами.", "answer": "чаша Ге́нуя.", "complexity": "10.53", "handout": "0"}, {"number": 16, "text": "Вы получили раздаточный материал к вопросу номер 19, сейчас он вам не понадобится. ЕЁ влияние было заметно и на экране. Например, в одном из эпизодов «Звёздного пути» жители деревни, известные как Ко́мсы, конфликтуют с так называемыми Я́нгами. Назовите ЕЁ двумя словами.", "answer": "Холодная война.", "complexity": "63.16", "handout": "1"}, {"number": 17, "text": "Вы получили раздаточный материал к вопросу номер 19, сейчас он вам не понадобится. Марти́н Монестье́ пишет, что, в отличие от других мест, в некоторых городах Италии к сожжению не приговаривали за первый проступок, поэтому находились умники, которые позволяли себе ещё немного погрешить. Автор вопроса сравнивает выбор таких городов для проживания с выбором ВТОРОЙ или ТРЕТЬЕЙ. Назовите двумя словами ВТОРУЮ или двумя словами ТРЕТЬЮ.", "answer": "жёлтая дорожка.", "complexity": "63.16", "handout": "1"}, {"number": 18, "text": "Вы получили раздаточный материал к вопросу номер 19, сейчас он вам не понадобится. Во время учёбы в Познани Мариа́н Рее́вский, Е́жи Ружи́цкий и Генрик Зыга́льский обучались в том числе и на специализированных курсах. Ряд исследований указывает на то, что поляки добились успеха благодаря математическому методу, а не лингвистическому. Ответьте, используя слово греческого происхождения: что сделали Рее́вский, Ружи́цкий и Зыга́льский уже в 1932 году?", "answer": "расшифровали «Энигму».", "complexity": "73.68", "handout": "1"}, {"number": 19, "text": "В романе «Похождения бравого солдата Швейка» заглавный герой часто ведёт себя раздражающе. Рассуждая о данной манере поведения Швейка, автор одного эссе цитирует героя фильма 1999 года. Назовите этот фильм.", "answer": "«Зелёный слоник».", "complexity": "57.89", "handout": "1"}, {"number": 20, "text": "[Ведущему: не озвучивать капитализацию слова «Пионеры» и кавычки вокруг него]\nНа раздаточном материале мы заменили одну букву тремя. Герои песни с розданным вам названием СДЕЛАЛИ ЭТО и делятся своим уникальным опытом. Другие «Пионеры», конечно, не СДЕЛАЛИ ЭТО. Ответьте несколькими словами: что такое «СДЕЛАТЬ ЭТО»?", "answer": "превысить скорость света.", "complexity": "36.84", "handout": "1"}, {"number": 21, "text": "Один блогер критикует современный учебник истории, в котором, с одной стороны, о многом умалчивается, а, с другой стороны, объём создаётся за счёт ненужной информации. Далее блогер упоминает ЕГО. Ответьте устойчивым выражением из двух слов: что такое ОНО?", "answer": "Прокрустово ложе.", "complexity": "26.32", "handout": "1"}, {"number": 22, "text": "В одном вымышленном мире при создании аналога ИКСА была использована магия иллюзий и, что забавно, некромантия. Назовите ИКС словом, произошедшим от греческого и латинского корней.", "answer": "телевизор.", "complexity": "21.05", "handout": "0"}, {"number": 23, "text": "Согласно легенде, злой колдун натравил на жителей одного острова демонов во время праздника. Колдуна победили, но страх перед демонами остался. Так появился ОН. Назовите его одним словом или двумя словами, которые начинаются на парные согласные.", "answer": "Нье́пи.", "complexity": "0.00", "handout": "0"}, {"number": 24, "text": "Перед вами часть памятника, расположенного в центральноевропейском городе. Назовите любого из людей, чьи имена скрыты на раздаточном материале.", "answer": "[Мариа́н] Рее́вский.", "complexity": "94.74", "handout": "1"}, {"number": 25, "text": "Автор вопроса находит забавным, что уроженец Майа́на получил награду с формулировкой, часть которой вы видите на раздаточном материале. Назовите этого уроженца.", "answer": "[Фредерик] Мистраль.", "complexity": "15.79", "handout": "1"}, {"number": 26, "text": "В 1700 году Гасье́н выпустил мемуары одного человека, а спустя примерно полтора века Огюст и его коллега прочли их. Эти события Святослав Иванов назвал «ПРОПУСК автора, сделавших его знаменитым». Заполните ПРОПУСК тремя словами.", "answer": "д’Артаньян и три.", "complexity": "10.53", "handout": "0"}, {"number": 27, "text": "Рассуждая о серой морали героев Александра Дюма, Святослав Иванов называет мушкетёров славными парнями. Какое существительное мы заменили другим в тексте вопроса?", "answer": "ублюдками.", "complexity": "78.95", "handout": "0"}, {"number": 28, "text": "В саундтреке известной экранизации во время испытания можно услышать звуки, похожие на стоматологическое оборудование. По словам режиссёра, это сделано для того, чтобы зритель сочувствовал главному герою и тоже испытывал дискомфорт. О какой экранизации идёт речь?", "answer": "«Dune».", "complexity": "78.95", "handout": "0"}, {"number": 29, "text": "В рецензии на балет, поставленный по античному сюжету, говорится, что божественный гнев пал на людей из-за того, что те использовали по отношению к очень красивой героине словосочетание «ТАКАЯ ОНА». Другая ОНА действительно ТАКАЯ. Какие два слова, начинающиеся на одну и ту же букву, мы заменили словами «ТАКАЯ ОНА»?", "answer": "вторая Венера.", "complexity": "47.37", "handout": "0"}, {"number": 30, "text": "В этом вопросе «АЛЬФА» — замена. Пушка Несвижского замка, стрелявшая огненными ядрами, носила название «АЛЬФА». Кто рассказал о конфликте с другими АЛЬФАМИ в первой половине 20-го века?", "answer": "Ка́рел Ча́пек.", "complexity": "73.68", "handout": "0"}, {"number": 31, "text": "В 1968 году Испанию на Евровидении должен был представлять уроженец Барселоны Хуан Серра́т, но в последний момент исполнителя заменили. Некоторые предполагают, что многочисленные «ла-ла-ла» в конкурсной песне появились из-за НИХ. «ОНИ» созданы в первой половине 2000-ых. Назовите ИХ.", "answer": "Трудности перевода.", "complexity": "31.58", "handout": "0"}, {"number": 32, "text": "Диктатор Анто́ниу Салаза́р в молодости получил перелом ноги, в результате чего был ограничен в выборе. От политических оппонентов Салазар получил почти такое же прозвище, какое было у ЭТОГО ПРАВИТЕЛЯ. Назовите ЭТОГО ПРАВИТЕЛЯ.", "answer": "Гай Юлий Цезарь Август Германик.", "complexity": "47.37", "handout": "0"}, {"number": 33, "text": "В 1960-ые Дуглас Э́нгельбарт отмечал увеличение количества специалистов в сфере — видимо, уже тогда ПЕРВЫЕ могли избежать ВТОРОГО. Назовите ПЕРВЫХ и ВТОРОЙ словами, начинающимися одинаково.", "answer": "программисты, призыв.", "complexity": "89.47", "handout": "0"}, {"number": 34, "text": "В романе «Союз еврейских полисменов» при описании того, как ветер играет листьями, упоминается ОН. Назовите ЕГО односложным словом.", "answer": "дрейдл.", "complexity": "52.63", "handout": "0"}, {"number": 35, "text": "Можно сказать, что АЛЬФА закончилась в 1790 году, когда известный человек вернулся в Англию после долгого отсутствия и был признан невиновным в потере корабля. АЛЬФА немного отличается от названия литературного произведения. Ответьте тремя словами: что такое АЛЬФА?", "answer": "Одиссея капитана Бла́я.", "complexity": "47.37", "handout": "0"}, {"number": 36, "text": "ИКС и ИГРЕК в вопросе — замены. Сериал быстро стал популярным, и уже в начале 1990-ых создатели начали получать коммерческие предложения. Так, в одной рекламе ИКС сидит на школьном дворе и не может решить, как поступить с пачкой шоколада — в этот момент ИГРЕК советует ИКСУ поделиться с друзьями. Фамилия какого ученого похожа на ИГРЕКИКС?", "answer": "[Дуглас] Энгельбарт.", "complexity": "36.84", "handout": "0"}, {"number": 37, "text": "В одной из серий Totally Spies [тотали спайс] босс заглавных героинь говорит, что они стали шпионками в столь раннем возрасте из-за особого шпионского гена, хотя раньше тот объяснял выбор природными талантами. Блогер Даниил Корте́з связывает это сюжетное изменение с ИКСАМИ, известными из одной франшизы. Что такое ИКСЫ?", "answer": "мидихлорианы.", "complexity": "73.68", "handout": "0"}, {"number": 38, "text": "Жан-Батист Фурье́, помимо разработок в области волновой теории, также занимался осушением болот, строительством дорог в Грено́бле и работал над книгой о Египте. Э́лви Рей Смит шутит, что у Фурье была большая ОНА. Назовите ЕЁ двумя словами, начинающимися на одну и ту же букву.", "answer": "полоса пропускания.", "complexity": "0.00", "handout": "0"}, {"number": 39, "text": "По словам специалистов, ИКРА помогает в адаптации к условиям окружающей среды — например, способ подойдёт для тех, кто собирается приехать в КАИР. Какие слова заменены словами ИКРА и КАИР?", "answer": "Сауна, Асуа́н.", "complexity": "5.26", "handout": "0"}, {"number": 40, "text": "Ведущий одного подкаста, рассказывая об Иране, отмечает, что в НЁМ существуют механизмы, позволяющие обходить наложенные свыше санкции. Назовите ЕГО двумя словами.", "answer": "исламский банкинг.", "complexity": "10.53", "handout": "0"}, {"number": 41, "text": "АЛЬФА в вопросе заменяет два слова, начинающиеся на парные согласные. На Корсике развиты преступные формирования. Однажды у здания в Ая́ччо была обнаружена АЛЬФА — чуть менее популярный вариант, но дело в том, что в здании располагалось посольство Марокко. Назовите поселение, известное другой АЛЬФОЙ.", "answer": "Хогсмид.", "complexity": "26.32", "handout": "0"}, {"number": 42, "text": "Женщины, состоявшие в португальском подпольном движении, должны были защищать партийные документы. На случай визита тайной полиции в домах подпольщиц всегда ПРОПУСК. При описании того, как ПРОПУСК, в произведении 1980-х упоминается цветок. Заполните ПРОПУСК двумя словами, начинающимися на одну и ту же букву.", "answer": "горел газ.", "complexity": "73.68", "handout": "0"}, {"number": 43, "text": "Персонажи одного слэшера отправляются на природу, чтобы полюбоваться живописными видами. Антагонист произведения — АТИ́Д, пришедший с КА́РИ. Какие слова заменены на АТИД и КАРИ.", "answer": "Гуль, гор", "complexity": "15.79", "handout": "0"}, {"number": 44, "text": "Джеймс По́скетт отмечает, что Научная революция была следствием проникновения в Европу знаний из других культур. Примечательно, что в XVI–XVII [шестнадцатом-семнадцатом] веках труды некоторых европейских учёных изначально были ПРОПУСК. Заполните ПРОПУСК тремя словами, которые начинаются одинаково.", "answer": "написаны на науатле.", "complexity": "47.37", "handout": "0"}, {"number": 45, "text": "ИКС в вопросе заменяет несколько слов. Кардинал Йозеф Фрингс в разгар «голодной зимы» на проповеди рассказал о послаблениях, касающихся одной из заповедей. Благодаря Фрингсу в немецком появился новый ИКС. Назовите другой ИКС, появившийся в Советском Союзе.", "answer": "скоммуниздить", "complexity": "10.53", "handout": "0"}, {"number": 46, "text": "В 1899 году Ма́ршалл Те́йлор рассорился с обидчивым нанимателем. Тейлору пришлось нанять экипаж, чтобы за раз унести последний ИКС. Что мы заменили ИКСОМ?", "answer": "гонорар.", "complexity": "57.89", "handout": "0"}, {"number": 47, "text": "[Ведущему: Ма Хэ прочитать слитно: МАХЭ́]\nИмя мореплавателя Джан Хэ, которое тот носил от рождения, звучит как Ма Хэ. В детстве будущий путешественник увлечённо слушал истории, которые дед, а потом и отец, собрали за время НЕГО. Назовите ЕГО коротким словом.", "answer": "хадж.", "complexity": "94.74", "handout": "0"}, {"number": 48, "text": "Во Вьетнаме вполне обычным было право на некий выбор, предмет которого расценивался как знак преданности правящей династии. Именно поэтому около сорока процентов вьетнамцев являются ИМИ. Ответьте словом с двумя корнями: кем именно?", "answer": "однофамильцами.", "complexity": "84.21", "handout": "0"}, {"number": 49, "text": "Одна организация ищет родителей для эмбрионов из криохранилища. Дети, выросшие из таких эмбрионов, поэтично сравниваются с НИМИ. Другим ИМ приписывается уверенность в собственной уникальности. Назовите ЕЁ.", "answer": "снежинка.", "complexity": "89.47", "handout": "0"}, {"number": 50, "text": "Примечательно, что жертвоприношения детей, некогда проводившиеся на территории Перу, были призваны «успокоить» ЕГО. Назовите ЕГО испанским словом с дефисом.", "answer": "Эль-Ни́ньо.", "complexity": "94.74", "handout": "0"}, {"number": 51, "text": "«Полдень Лаха́йны» — довольно редкий астрономический феномен. Интернет-пользователь шутит, что туристы стремятся застать «Полдень Лахайны», чтобы насладиться высоким ПЕРВЫМ. В целях предосторожности значение ВТОРОГО тоже должно быть как можно выше. Назовите ПЕРВЫЙ и ВТОРОЙ трёхбуквенными анаграммами.", "answer": "fps, spf.", "complexity": "68.42", "handout": "1"}, {"number": 52, "text": "[Ведущему: кавычки в вопросе следует игнорировать]\nНаткнувшись на кукольную голову, потерянную кем-то на пляже, один ОН невольно воплотил в жизнь жутковатого персонажа «Истории». Назовите ЕГО, использовав дефис.", "answer": "рак-отшельник.", "complexity": "73.68", "handout": "0"}, {"number": 53, "text": "В талмуде некоторые фрагменты текста содержатся в изолированных блоках. Такая компоновка страницы появилась в Италии, а источником вдохновения, по одной из версий, стала планировка ЕГО. Ответьте двумя словами на соседние буквы алфавита: что такое ОНО?", "answer": "Венецианское гетто.", "complexity": "47.37", "handout": "1"}, {"number": 54, "text": "[Ведущему: прочитать рукаВЧИки, но не рукавички]\nВ появившейся с началом 60-х чёрной шутке женщина оправдывает ЕГО применение тем, что не умеет вязать рука́вчики. Назовите ЕГО одним словом точно.", "answer": "талидоми́д.", "complexity": "89.47", "handout": "0"}, {"number": 55, "text": "Военный термин «le plastron» [ле пластро́н] обозначал участников учений, роль которых – терпеть поражение под ударом товарищей. Ролан Барт отмечает, что этот термин стал частью литературного лексикона… Какого соотечественника?", "answer": "[маркиз Донасье́н Альфо́нс Франсуа́ де] Сад.", "complexity": "10.53", "handout": "0"}, {"number": 56, "text": "В акционерное общество по добыче золота в горах Ноин-Улы́ до октябрьской революции входили франкоговорящие аристократы. Восстановите название этого общества, которое лишь тремя буквами отличается от названия индийского города.", "answer": "Монголор.", "complexity": "26.32", "handout": "1"}, {"number": 57, "text": "На выполнение заказа у немецкого художника уходило довольно мало времени. Символично, что, по примеру гуманистов, он время от времени писал фамилию на греческий манер. Через минуту напишите обе версии фамилии.", "answer": "Кра́нах, Хро́нос.", "complexity": "21.05", "handout": "0"}, {"number": 58, "text": "В этом вопросе слово ОНО заменяет два других слова. В условиях послевоенного дефицита один немецкий журнал в ряде кулинарных рецептов перешёл на НЕГО. Согласно расхожей фразе, ОНО отсутствует… У чего?", "answer": "у истории.", "complexity": "52.63", "handout": "0"}, {"number": 59, "text": "По словам Альбе́рто Ма́нгеля, в старости его собственное тело будто начало жить самостоятельно. Осознавая, к чему всё идёт, писатель называет престарелое тело своим ИКСОМ. Словарь братьев Гримм приводит для слова ИКС два определения. Назовите ИКСА.", "answer": "доппельгангер.", "complexity": "63.16", "handout": "0"}, {"number": 60, "text": "Иногда небольшие собаки отдыхали от рутинной домашней работы, грея ноги хозяевам в церкви. Согласно старому английскому анекдоту, как-то раз в церкви начался переполох, стоило священнику упомянуть ЕГО над адским пламенем. Ответьте словом, обе гласные которого одинаковы: что такое ОН?", "answer": "ве́ртел.", "complexity": "52.63", "handout": "0"}, {"number": 61, "text": "В 1960-е годы Ро́уленд Э́метт собрал шуточный ИКС. Своего ИКСА у него не было, но термины он знал, поэтому использовал кирпич, голову слона и птиц, клюющих карты. Шутят, что даже ИКС Эметта потянет ИГРЕК. Какие слова, которые в английском начинаются на соседние буквы алфавита, мы заменили ИКСОМ и ИГРЕКОМ?", "answer": "computer, Doom [дум].", "complexity": "73.68", "handout": "0"}, {"number": 62, "text": "В начале 1960-х Фрэнка За́ппу пригласили на комедийное телешоу, так как он изобрёл способ играть ПРОПУСК. Заппа использовал смычок и барабанные палочки, а также дул в металлическую трубку. С какой строчкой рифмуются два пропущенных слова в произведении начала 1920-х?", "answer": "ехали медведи.", "complexity": "10.53", "handout": "0"}, {"number": 63, "text": "Архитектор Э́эро Са́аринен создавал и мебель. Он считал, что четыре ножки у стула — это беспорядочное, некрасивое и непрактичное нагромождение, брезгливо называя нижние части таких стульев трубами. Напишите в исходном виде слово, в котором мы пропустили две буквы.", "answer": "трущобами.", "complexity": "47.37", "handout": "0"}, {"number": 64, "text": "Однажды в марте художница Амели́ Пи́чард сделала девятнадцатипроцентную скидку на все свои работы, желая привлечь внимание к… Чему?", "answer": "разнице в заработной плате между мужчинами и женщинами.", "complexity": "21.05", "handout": "0"}, {"number": 65, "text": "ИКС в этом вопросе заменяет одно слово. Другой героиней известного художника стала его мачеха, которой прописали постельный режим. Обозреватель пишет, что художник хорошо передал, насколько маленьким стал её ИКС. Назовите этого художника.", "answer": "[Э́ндрю] Уа́йет.", "complexity": "78.95", "handout": "0"}, {"number": 66, "text": "В спрятанной от вас правой части картины Эндрю Уайета на тумбочке лежит она. Дже́нис Скри́вингтон пишет, что это и метафора закрытого пространства, в которое попала героиня, и визуальная рифма с композицией картины. Напишите в исходном виде слово из первого предложения, в котором мы пропустили пять букв.", "answer": "раковина.", "complexity": "63.16", "handout": "1"}, {"number": 67, "text": "Герой абсурдного произведения, увидев выпирающую особенность внешности лангусти́на, назвал того именем известного детского персонажа и удивился, сколько же тот насти́гнул. Какие слова мы заменили в предыдущем предложении словами «лангустин» и «настигнул»?", "answer": "нарвал, наврал.", "complexity": "94.74", "handout": "0"}, {"number": 68, "text": "Дональд Трамп сделал процедуру выбора вице-президента себе в пару открытой, в лицо говоря кандидатам плохое и хорошее. Телеведущий Сти́вен Колбе́р пошутил, что Трамп выбирает вице-президента в стиле «ИКСА». Один спин-офф «ИКСА» называется «Слушай своё сердце». Какое слово мы заменили ИКСОМ?", "answer": "холостяк.", "complexity": "26.32", "handout": "0"}, {"number": 69, "text": "Писатель Чарльз Форт собирал истории о таинственных исчезновениях и загадочных находках. Назовите ЭТО СЛОВО. Считается, что именно в работе Форта впервые использовано ЭТО СЛОВО.", "answer": "телепортация.", "complexity": "5.26", "handout": "0"}, {"number": 70, "text": "Интерес к наследию Чарльза Форта оказался живучим, а школа его последователей процветала, к чему некоторые относились с иронией. Паре героев «Воспламеняющей взглядом» Стивена Кинга даже советуют читать Форта о паранормальных способностях вместо… Чьей книги?", "answer": "[Бе́нджамина] Спо́ка.", "complexity": "47.37", "handout": "0"}, {"number": 71, "text": "В этом вопросе АЛЬФА заменяет другое слово. Раньше в Европе ёмкости для АЛЬФ часто делали в виде небольших корабликов. Стол таким образом становился метафорой моря. Название какой АЛЬФЫ родственно слову «море»?", "answer": "розмарин.", "complexity": "21.05", "handout": "0"}, {"number": 72, "text": "В этом вопросе ИКС заменяет короткое слово. Ёмкости для специй из предыдущего вопроса называли ИКСАМИ, что восходит к латинскому корню. Слово ИКС в другом значении, вероятно, связано с Ноевым ковчегом, а увидеть эти ИКСЫ можно в розма́ринах. Что мы заменили словом «розма́рина»?", "answer": "бази́лика.", "complexity": "42.11", "handout": "0"}, {"number": 73, "text": "Слово ОНО в этом вопросе заменяет другое слово. В 1543 году Генрих VIII объявил Шотландии войну, одна из целей которой была связана с принцем Эдуардом. Эту войну иногда называют «Грубое ОНО». В названии какой картины есть ОНО?", "answer": "«Сватовство майора».", "complexity": "89.47", "handout": "0"}, {"number": 74, "text": "В ходе танзанийского восстания ма́джи-ма́джи погибло 15 немцев и десятки тысяч повстанцев. Те смело шли в бой из-за местного знахаря, который утверждал, что его зелье ДЕЛАЕТ ЭТО. Автор вопроса не смог СДЕЛАТЬ ЭТО, но в попытках фигурировали пыль и беда. Какие четыре слова мы заменили словами ДЕЛАЕТ ЭТО?", "answer": "превращает пули в воду.", "complexity": "52.63", "handout": "0"}, {"number": 75, "text": "В 1953 году Великобритания провела ядерные испытания на безлюдной территории, предоставленной властями Австралии. Согласно шуточной теории заговора, власти при выборе места руководствовались жаждой мести. Какое несклоняемое слово входит в название этой территории?", "answer": "э́му.", "complexity": "52.63", "handout": "0"}, {"number": 76, "text": "В одной песне странная английская группа Henry Cow [ге́нри ка́у] рассуждает о том, что выглядевший заманчиво капитализм смертельно опасен. Использованная начитанными музыкантами метафора ещё страннее: ИКС оказался ИГРЕКОМ. Слова «ИКС» и «ИГРЕК» совсем не похожи друг на друга. Назовите ИКСА или ИГРЕКА.", "answer": "Бу́джум.", "complexity": "", "handout": "0"}, {"number": 77, "text": "В статье, касающейся аспектов ЕЁ биографии, говорится, что ОНА родилась в творческой семье и рано начала играть в театре. Далее сказано, что на одном из спектаклей ЕЁ заметил известный человек. В заключении автор говорит, что сотрудничество с этим человеком помогло ЕЙ получить желаемую всемирную славу — правда, на совсем другом поприще. Назовите ЕЁ фамилию.", "answer": "Самари́.", "complexity": "", "handout": "0"}, {"number": 78, "text": "В середине 1990-х потрясённая Наоми Ше́мер перевела на иврит произведение 1865 года и положила его на музыку. О каком произведении идёт речь?", "answer": "[стихотворение] «O Captain! My Captain!».", "complexity": "", "handout": "0"}, {"number": 79, "text": "В этом вопросе слово ОН является заменой. У просвещённого монарха Адольфа Фридриха тоже была необычная коллекция. Вероятно, среди всех экспонатов самым дорогим для Фридриха был ОН королевы. Кто в начале 1930-х посвятил картину ЕМУ?", "answer": "Фрида Кало.", "complexity": "", "handout": "0"}]}, {"id": "5892", "title": "Синхронный турнир «Мой Енот – Тугосеря»", "questions": [{"number": 1, "text": "Говоря об одном из неясных образов «Поэмы без героя», Лев Ло́сев предлагает порассуждать о ритуальном значении ИКСА, связанном с поминками. ИКС отсутствует в «Поминках по Финнегану», но есть в «Дублинцах». Какое слово заменено ИКСОМ?", "answer": "блин.", "complexity": "64.71; 65.52", "handout": "1"}, {"number": 2, "text": "В греческой кинокомедии под названием «ЭТО» юноша, влюблённый в дочь крупной землевладелицы из соседней деревни, не получает благословения от её родни и решается на отчаянный шаг. Назовите ЭТО двумя словами, которые начинаются на одну букву.", "answer": "«Похищение Персефо́ны».", "complexity": "67.65; 89.66", "handout": "0"}, {"number": 3, "text": "Хотя Алесса́ндро Марче́лло был композитором-любителем, в 1981 году музыка, вдохновленная адажио из его концерта, прозвучала… В каком фильме?", "answer": "«Профессионал».", "complexity": "91.18; 86.21", "handout": "0"}, {"number": 4, "text": "Дже́нна Карвуни́дис перенесла несколько выкидышей и только в 39 смогла доносить ребёнка до достаточно большого срока. Забавно, что Дже́нну, чей ребёнок позже осознал себя небинарной личностью, считают человеком, который придумал ИХ. Назовите ИХ.", "answer": "гендер-пати.", "complexity": "35.29; 51.72", "handout": "0"}, {"number": 5, "text": "Певец Пит Си́гер, бывший гражданским активистом, говорил, что трёхлетний ребёнок отказывается от АЛЬФЫ, так как начинает считать ту пропагандой. Вышедшая в 1937 году АЛЬФА была запрещена, хотя и являлась пропагандой. Есть мнение, что запрет был связан с излишним буквализмом в толковании выражения «отец народов». Назовите АЛЬФУ.", "answer": "колыбельная.", "complexity": "26.47; 20.69", "handout": "0"}, {"number": 6, "text": "Мотыга по-шумерски – al (аль). Шумерская «Песня мотыги» – вероятно, самое древнее произведение, в котором есть ОНА. Что такое ОНА?", "answer": "аллитерация.", "complexity": "17.65; 31.03", "handout": "0"}, {"number": 6, "text": "На раздатке — верхняя часть игрового поля со страницы одного сайта. Найдите короткий ответ: какую форму имеет всё игровое поле?", "answer": "404.", "complexity": "", "handout": "1"}, {"number": 7, "text": "Какого оптика журили за грубую смерть фантазии?", "answer": "[Исаа́ка] Ньютона.", "complexity": "35.29; 72.41", "handout": "0"}, {"number": 8, "text": "В опере Курта Вайля известная композиция исполняется от лица проституток, которые сначала просят показать дорогу до дверей бара, а затем дорогу к красивому мальчику. Какой топоним присутствует в названии этой композиции?", "answer": "Алаба́ма.", "complexity": "52.94; 58.62", "handout": "0"}, {"number": 9, "text": "[указание чтецу – второй вопрос дуплета надо читать сразу же после первого]\nДуплет. Два вопроса, на первый будет дано 0 секунд, на второй 60. Ответы сдаются на одном бланке.\nПеред вами результат опроса учёных о том, какую интерпретацию квантовой механики они считают верной. \n1)\tНи один из опрошенных не высказался в пользу довольно популярной интерпретации. Вы можете назвать эту интерпретацию, использовав слова на парные согласные.\n2)\tСколько всего учёных участвовало в опросе?", "answer": "1)\tзаткнись и считай.\n2)\t48.", "complexity": "8.82; 20.69", "handout": "1"}, {"number": 10, "text": "В оригинальной озвучке фильма «Гроздья гнева», полного аллюзий на Исход из Египта, герой говорит о домашних животных, но потом поясняет, что имеются в виду машины. Машины какой фирмы?", "answer": "Caterpillar.", "complexity": "11.77; 31.03", "handout": "0"}, {"number": 11, "text": "Тип германского доспеха, отличавшийся надёжностью и защитой практически всех уязвимых мест, назывался миланским. Связано это с тем, что доспех начал распространяться в начале XVI века. Восстановите в исходном виде слово, в котором пропущены восемь букв.", "answer": "максимилиановским.", "complexity": "17.65; 20.69", "handout": "0"}, {"number": 12, "text": "В вопросе слово ТАКОЙ заменяет слово, образованное от двух корней. За наросты на голове эстеменнозу́ха иногда называют ТАКИМ ящером. На флаге какой страны есть другое ТАКОЕ существо?", "answer": "Уга́нда.", "complexity": "17.65; 10.35", "handout": "0"}, {"number": 13, "text": "Денис Пузырёв приводит такое мнение: все крупные состояния Северной Осетии имеют один корень. Какое слово заменено в предыдущем предложении?", "answer": "исток.", "complexity": "8.82; 13.79", "handout": "0"}, {"number": 14, "text": "Дуплет. Два вопроса по 30 секунд обсуждения каждый. Ответы сдаются на одном бланке.\n1)\tПеред вами работа Бэ́нкси, которая появилась около места, где вскоре должна была начаться выставка… Кого?\n2)\tВ байопике, снятом Йосом Сте́ллингом, роль сына исполнил Эд Колме́йер, а вот ЕЁ сыграла Лю́си Сингели́нг. Напишите ЕЁ имя.", "answer": "1)\t[Жан-Мишель] Баския́.\n2)\tСа́ския.", "complexity": "17.65; 24.14", "handout": "1"}, {"number": 15, "text": "Перед вами определение рэйва из закона 1994 года. В том же году группа Autechre выпустила сингл, в буклете к которому советовала держать рядом с диджеем юриста и музыковеда. Автор вопроса сравнил Autechre с австрийцем, родившимся в 1874 году. Назовите этого австрийца.", "answer": "[Арнольд] Шёнберг.", "complexity": "2.94; 20.69", "handout": "1"}, {"number": 16, "text": "Согласно одной гипотезе, имя Зарату́стра может восходить к выражению со значением «хозяин определённых животных». Интересно, что в одной из частей «Авесты» рассказывается о Вишта́спе, который первым принял новое учение, будучи правителем… Какой центральноазиатской области?", "answer": "Ба́ктрия.", "complexity": "47.06; 37.93", "handout": "0"}, {"number": 17, "text": "По мнению историка То́маса А́дамса Апчёрча, название романа подразумевает, что за тонкой плёнкой материального благополучия скрывались упадок и разложение американского общества. О каком романе XIX века идёт речь?", "answer": "«Позолоченный век».", "complexity": "20.59; 6.90", "handout": "0"}, {"number": 18, "text": "По легенде он работал сторожем, а затем возил дрова. А что он получает на изображении, в основу которого легла картина Са́но Ди Пье́тро?", "answer": "ветка.", "complexity": "44.12; 44.83", "handout": "0"}, {"number": 19, "text": "Обычно считается, что ПТСР отрицательно влияет на эмпатию. Автор вопроса считает, что в качестве обратного примера можно привести «ИХ». Мы не просим вас «ИХ» цитировать, просто назовите «ИХ» тремя словами.", "answer": "«Слёзы в дожде».", "complexity": "0.00; 0.00", "handout": "0"}, {"number": 20, "text": "Экспериментальный дуплет с большим полем перебора – минут на 10. Два вопроса по 30 секунд обсуждения каждый. Ответы сдаются на одном бланке.\n1)\tВ «Очерках русской смуты» Антон Дени́кин пишет, что революционная толпа стремилась принизить всё выделяющееся. Дени́кин называет происходящее ЕЮ. Назовите ЕЁ двумя словами, первое из которых греческого происхождения.\n2)\tДже́ральд Арба́кл пишет, что популярные ситкомы рисуют идеал нормальной семьи, в которой всё хорошо, и, таким образом, создают ЕЁ. Назовите ЕЁ двумя словами, первое из которых греческого происхождения.", "answer": "1)\tапология невежества.\n2)\tмифология оптимизма.", "complexity": "8.82; 0.00", "handout": "0"}, {"number": 21, "text": "На полях оригинала партитуры время от времени можно встретить буквы ВТ [вэ тэ]. Партитуры чего?", "answer": "Ленинградской симфонии.", "complexity": "11.77; 17.24", "handout": "0"}, {"number": 22, "text": "АЛЬФА в этом вопросе заменяет другое слово. В финальной части седьмой симфонии Шостако́вича присутствует печальная и величественная тема, как память о павших. Эта тема исполняется в ритме АЛЬФЫ. Назовите человека, в творчестве которого АЛЬФА оказалась последней.", "answer": "[И́нгмар] Бе́ргман.", "complexity": "14.71; 31.03", "handout": "0"}, {"number": 23, "text": "В пещере Кра́пина в Хорватии было обнаружено множество костей неандертальцев, некоторые из которых были порезанные, а некоторые – частично обожжённые. Станислав Дробыше́вский, рассказывая о находках в пещере, характеризует произошедшее как ИКС. Главный герой «ИКСА», вышедшего на экраны в 1980 году, – антрополог. Назовите ИКС двумя словами.", "answer": "ад каннибалов.", "complexity": "61.77; 37.93", "handout": "0"}, {"number": 24, "text": "В уже известной вам пещере Кра́пина были также найдены одни из самых древних украшений в мире. Рассказывая об этом, Станислав Дробыше́вский задаётся тем же вопросом, что и герой… Какого произведения XIX века?", "answer": "«Мо́царт и Салье́ри».", "complexity": "20.59; 27.59", "handout": "0"}, {"number": 25, "text": "В вопросе есть замены. Ле́то II Атре́йдес мог бы сказать, что он ПЕРВЫЙ, ТРЕТИЙ и ЧЕТВЁРТЫЙ. В чьём произведении лирический герой заявлял, что он ПЕРВЫЙ, ВТОРОЙ, ТРЕТИЙ и ЧЕТВЁРТЫЙ?", "answer": "[Гавриил] Держа́вин.", "complexity": "41.18; 58.62", "handout": "0"}, {"number": 26, "text": "Дэвид Линч вспоминал, что в день съёмок дул сильный ветер, и песок поднимался с дюн. В получившейся сцене суровый пустынный пейзаж пересекается с размышлениями героя о дальнейших действиях. Какая буква добавлена в одно из слов вопроса?", "answer": "ч.", "complexity": "55.88; 51.72", "handout": "0"}, {"number": 27, "text": "Авангардный художник Вим Дельвуа́ для изготовления витражей использует рентгеновские снимки. Один из витражей работы Дельвуа́ изображает сцену из… Какого романа XIX века?", "answer": "«Собор Парижской богоматери».", "complexity": "11.77; 31.03", "handout": "0"}, {"number": 28, "text": "Делая отсылку к Оксимиро́ну с его строчкой «так творить начал Йо́зеф Бойс», рэпер Шаро́н в одном из треков заявляет, что «ведёт тотальную игру, так творить начал ИКС». Назовите имя и фамилию ИКСА, начинающиеся на соседние буквы алфавита.", "answer": "Йо́хан Кройф.", "complexity": "44.12; 65.52", "handout": "0"}, {"number": 29, "text": "Дуплет. Два вопроса по 30 секунд обсуждения. Ответы сдаются на одном бланке. Про эти вопросы тестеры говорили, что они дичь, но смешные.\n1)\tОНА, несмотря на название, питается в основном ягодами и моллюсками, а не злаками. Напишите первые три буквы из ЕЁ названия.\n2)\tЕГО название не является звукоподражанием, а восходит к турецкому глаголу со значением «рыгать». Напишите первые три буквы из ЕГО названия.", "answer": "1)\tржа.\n2)\tкек.", "complexity": "17.65; 20.69", "handout": "0"}, {"number": 30, "text": "В одном советском стихотворении 1970-х есть строки «Не дарите цветов государству, где правда карается». Какая уроженка Кли́вленда упоминается в следующих строках?", "answer": "[Э́ллисон] Кра́узе.", "complexity": "11.77; 27.59", "handout": "0"}, {"number": 31, "text": "В фильме, в котором Цезарь выступает антагонистом, в сценах, где показывают северную деревню главных героев, часто звучит мелодия одной песни. Назовите одним словом напиток, который упоминается в её оригинальном тексте.", "answer": "сидр.", "complexity": "26.47; 10.35", "handout": "0"}, {"number": 32, "text": "На раздаточном материале мы дважды пропустили одни и те же девять букв. Восстановите любой из пропусков.", "answer": "шила на гиг.", "complexity": "82.35; 86.21", "handout": "1"}, {"number": 33, "text": "Певица Умка чувствовала себя своей среди советских хиппи-автостопщиков, поэтому в нескольких песнях к слову «трасса» у неё одинаковая рифма. В 2007 году в своём «живом журнале» Умка пожелала счастливого полёта… Какому американцу?", "answer": "[Курту] Воннегу́ту.", "complexity": "8.82; 3.45", "handout": "0"}, {"number": 34, "text": "Автор телеграм-канала, посвященного английскому сленгу, отмечает, что розданное вам сокращение раскованная молодёжь использует для ускорения процесса и упоминает фразу из фильма конца 70-х. Какого именно фильма?", "answer": "«Обыкновенное чудо».", "complexity": "17.65; 17.24", "handout": "1"}, {"number": 35, "text": "Перед вами надпись на рюкзаке для программиста. Пропущенные шесть букв составляют топоним из произведения конца 30-х годов ХХ века. Напишите этот топоним.", "answer": "Bag End.", "complexity": "20.59; 17.24", "handout": "1"}, {"number": 36, "text": "Песня одной немецкой группы называется «Vitamin C». Британские музыкальные журналисты относят творчество этой группы к так называемому крафт-року. Напишите в любом порядке, какую букву и на какую мы заменили в одном из слов этого вопроса.", "answer": "уф.", "complexity": "58.82; 62.07", "handout": "0"}]}, {"id": "5517", "title": "Асинхронный турнир «S-sides»", "questions": [{"number": 1, "text": "Введение к просветительской книге гласит — настало время вновь ДЕЛАТЬ ЭТО. Автор вопроса за последний год СДЕЛАЛ ЭТО более 150 раз. Ответьте двумя словами, которые начинаются на соседние буквы: что именно сделал?", "answer": "открыл пиво.", "complexity": "19.23", "handout": "1"}, {"number": 2, "text": "Ветеринар Уи́льям Ю́атт однажды лечил колику у носорога. Носорогу влили в рот полпинты лауда́нума и три пинты касторового масла, пытались поставить клизму, дать слабительное и перевернуть на другой бок, связав верёвками. Тем не менее, носорог умер. Какое слово мы заменили в этом вопросе?", "answer": "выжил.", "complexity": "38.46", "handout": "0"}, {"number": 3, "text": "Одна группа гордилась своей бедностью. Например, клавишница даже на концертах использовала ЕЁ. Назовите ЕЁ двумя словами, которые начинаются на соседние буквы алфавита.", "answer": "гладильная доска", "complexity": "11.54", "handout": "0"}, {"number": 4, "text": "Неаполитанскую пиццу многие считают самой правильной. В США пиццу в неаполитанском стиле называют словом apizza [эби́цца], которое произошло от неаполитанского словосочетания. Напишите слово, пропущенное на раздаточном материале в его переводе с неаполитанского на английский.", "answer": "the.", "complexity": "69.23", "handout": "1"}, {"number": 5, "text": "В романе Уи́лки Ко́ллинза одного персонажа долгое время подозревают в преступлении, но преступником неожиданно оказывается другой. Комментатор замечает, что ПЕРВЫЕ лгут, а ВТОРЫЕ говорят правду. Напишите в правильном порядке слова, которые мы заменили словами «ПЕРВЫЕ» и «ВТОРЫЕ».", "answer": "фамилии, имена.", "complexity": "61.54", "handout": "1"}, {"number": 6, "text": "Персонажа Екатерины Павловой, у которого синие губы и красные глаза, лирическая героиня сравнивает с ИКСОМ — видимо, лёжа в этот момент справа от героя. Назовите ИКС двумя словами, которые начинаются на одну и ту же букву.", "answer": "флаг Франции.", "complexity": "76.92", "handout": "0"}, {"number": 7, "text": "В англоязычном произведении Мю́риэль Рука́йзер проклятие настигает ЕГО за то, что он, отвечая на вопрос, не упомянул женщину. Назовите ЕГО имя.", "answer": "Эдип.", "complexity": "57.69", "handout": "0"}, {"number": 8, "text": "[Ведущему: при офлайн-игре раздаточный материал нужно раздать. В онлайне — просто вывести на экран текст раздаточного материала вместо текста вопроса. Прочитать при этом нужно версию вопроса для ведущего.]\nКакое короткое английское слово стало названием фестиваля… [Ведущему: тут сделайте паузу в 30 секунд, чтобы команды подумали, что вопрос действительно закончился], посвящённого дизайну в движении?", "answer": "Demo [де́мо].", "complexity": "26.92", "handout": "1"}, {"number": 9, "text": "Стареющий герой А́йдана Мо́ффата, флиртуя с девушкой, говорит, что в его бороде есть ОНИ. Назовите ИХ тремя словами.", "answer": "пятьдесят оттенков серого.", "complexity": "19.23", "handout": "0"}, {"number": 10, "text": "Банкирка Мэгги Лена Уокер родилась в бедной семье. Говоря об этом, она упоминала корзину с бельём на голове вместо... чего и где?", "answer": "серебряной ложки во рту.", "complexity": "88.46", "handout": "0"}, {"number": 11, "text": "При езде на беспилотном автомобиле иногда может возникать проблема вагонетки — при неизбежной аварии автомобиль должен сделать выбор либо в пользу сохранения жизни пассажиров, либо в пользу уменьшения количества жертв. О́уэн Ба́ртер предполагает, что ТАКИЕ беспилотные автомобили будут в первую очередь спасать пассажиров, а СЯКИЕ — минимизировать количество жертв. Слова, которые мы заменили словами «ТАКИЕ» и «СЯКИЕ», начинаются на одну и ту же букву. Напишите эти слова.", "answer": "дорогие, дешёвые.", "complexity": "69.23", "handout": "0"}, {"number": 12, "text": "Однажды компания-производитель мороженого «Ха́аген-Дас» подала в суд на «Фрю́сен Глэ́дье», утверждая, что «Фрюсен Глэдье» — это нечто вроде «И́КСА». Но закономерно пососала би́бу. Какое имя собственное мы заменили ИКСОМ?", "answer": "Abibas [абиба́с].", "complexity": "30.77", "handout": "0"}, {"number": 13, "text": "В восемнадцатом веке к арт-дилерам в обществе относились презрительно. Из‑за этого в среде арт-дилеров слово «source» [сорс] стало ПЕРВЫМ, а «place» [плэйс] — ВТОРЫМ. Назовите ПЕРВЫЙ тремя словами и ВТОРОЙ тремя словами.", "answer": "эвфемизм слова «buy», эвфемизм слова «sell».", "complexity": "50.00", "handout": "1"}, {"number": 14, "text": "Хо́льгер Шу́кай считал важным, чтобы все участники процесса заранее получили представление об общей структуре, поэтому предпочитал термин «спонтанная ОНА». Назовите ЕЁ словом латинского происхождения.", "answer": "композиция.", "complexity": "3.85", "handout": "0"}, {"number": 15, "text": "Розыгрыш «Ленин‑гриб» был делом рук музыканта, художника и перформера Сергея Курёхина. В следующем за розданным вам предложении англоязычной статьи о Курёхине он назван многои́ксовым. Какое слово мы заменили и́ксом?", "answer": "дефис.", "complexity": "57.69", "handout": "1"}, {"number": 16, "text": "В произведениях одного жанра электронной музыки одновременно звучит множество нот, а общее их количество доходит до миллионов. Своё название «трэш» этот жанр получил из‑за внешнего вида. Какое слово мы заменили словом «трэш»?", "answer": "блэк.", "complexity": "15.39", "handout": "0"}, {"number": 17, "text": "Фале́с Миле́тский считается великим математиком, но достоверно определить его достижения почти невозможно. В рассказе об этом упоминаются Прокл Диадо́х, Евде́м Ро́досский и ОНИ. Индо́лог Ке́ннет Вэ́лпи приводит гипотезу, согласно которой ОНИ и последующие не имелись в виду буквально, а призваны были изобразить движение. Назовите ИХ двумя словами.", "answer": "третьи руки.", "complexity": "19.23", "handout": "0"}, {"number": 18, "text": "Результаты экспериментов, в которых шимпанзе делят бананы, теория предсказывает хорошо. Поэтому Ру́тгер Бре́гман считает, что первое слово одного термина надо поменять. Напишите этот термин из двух слов.", "answer": "homo economicus [хо́мо эконо́микус].", "complexity": "0.00", "handout": "0"}, {"number": 19, "text": "Перед вами — название рода небольших вирусов, которые паразитируют на крупных вирусах и чувствуют себя как дома. Напишите название этого рода вирусов полностью.", "answer": "Sputnikvirus.", "complexity": "15.39", "handout": "1"}, {"number": 20, "text": "Автор памфлета 1630 года скептически относился к новой моде. На иллюстрации к памфлету герб гильдии ИХ держат два трубочиста, а на самом гербе изображено, в частности, облако дыма, исходящее из ануса. Напишите имя и фамилию того из НИХ, кто родился в Англии в 1835 году, а свою компанию основал в 1847.", "answer": "Фи́лип Мо́ррис.", "complexity": "61.54", "handout": "0"}, {"number": 21, "text": "Исследование показало, что американцы, родившиеся в одной стране, умирали от определённых болезней в среднем на 4–5 лет раньше, чем другие американцы. Дело в том, что в НЁМ есть ещё и соответствие о́ргану. Назовите ЕГО двумя словами, которые начинаются на парные согласные либо двумя словами, которые начинаются на одну и ту же букву.", "answer": "китайский гороскоп.", "complexity": "26.92", "handout": "0"}, {"number": 22, "text": "Реклейминг — это явление, при котором группа людей, не принимаемая обществом, присваивает себе обидное прозвище. В статье о реклейминге Рита Дворкина отмечает, что слово «сионист» изначально тоже было обидным прозвищем. Напишите в исходном виде слово, которое мы сократили.", "answer": "импрессионист.", "complexity": "80.77", "handout": "0"}, {"number": 23, "text": "Вопрос перед вами. Время.", "answer": "1D.", "complexity": "73.08", "handout": "1"}, {"number": 24, "text": "Демона Ма́ксвелла в английских источниках иногда называют ТАКИМ. В произведени, впервые опубликованном в 1997 году, ТАКОЙ была ОНА. Назовите ЕЁ одним словом.", "answer": "шляпа.", "complexity": "61.54", "handout": "0"}, {"number": 25, "text": "В одном когнитивном тесте группу людей сравнивали с группой обезьян. Люди в среднем справлялись с заданием лучше, но один из людей был существенно хуже остальных. Рассказывая об этом, Джо́зеф Хе́нрик называет этого человека не только ТАКИМ ИМ, но и СЯКИМ ИМ. Какие словосочетания мы заменили словами «ТАКОЕ ОНО» и «СЯКОЕ ОНО»?", "answer": "слабое звено, недостающее звено.", "complexity": "92.31", "handout": "0"}, {"number": 26, "text": "Забавно, что в 1930‑е годы ТАУ не признавали искусством, но выставка АЛЬФ ТАУ прошла с успехом. Слова «АЛЬФА» и «ТАУ» восходят к одному и тому же корню. Напишите два слова, которые мы заменили словами «АЛЬФЫ ТАУ».", "answer": "фотографии граффити.", "complexity": "11.54", "handout": "0"}, {"number": 27, "text": "Каким итальянским словом называется композиционный приём, применённый на этой табличке?", "answer": "диминуэ́ндо.", "complexity": "61.54", "handout": "1"}, {"number": 28, "text": "Первая версия игры Microsoft Flight Simulator [ма́йкрософт флайт симулятор] вышла в 1982 году. Себастьян Ма́ке разработал эмулятор, который позволяет поиграть в неё на современных компьютерах. В 2022 году проект Себастьяна стал... ответьте максимально точно, чем?", "answer": "пасхальным яйцом [в Microsoft Flight Simulator 2022].", "complexity": "11.54", "handout": "0"}, {"number": 28, "text": "Слоган на рекламном календаре, выпущенном Почтой России, гласит: \"Помогите роботам: пишите индекс правильно\". На иллюстрации изображен индекс, заполненный от руки, а над ним — увеличительное стекло в руке робота. В стекло видны только три цифры. Какие?", "answer": "404.", "complexity": "", "handout": "0"}, {"number": 29, "text": "Перед вами цитата из трактата Декарта. Эта цитата заставила учёных предположить, что Декарт ДЕЛАЛ ЭТО. Что именно делал?", "answer": "читал «Дон Кихота».", "complexity": "7.69", "handout": "1"}, {"number": 30, "text": "В своём проекте американка Ха́нна Мэ́йри использует тыквы. Проект посвящён деколонизации... ответьте несклоняемым словом, чего?", "answer": "ба́нджо.", "complexity": "0.00", "handout": "0"}, {"number": 31, "text": "Кто укусил О́скара Пфу́нгста из‑за нескольких неправильных ответов?", "answer": "умный Ганс.", "complexity": "73.08", "handout": "0"}, {"number": 32, "text": "Английское слово «vest» [вэст] означает майку. Автор-исполнитель Ги́лберт О’Са́лливан был известен эксцентричностью в одежде. ЭТО О’Салливана называлось «Ягодная майка». Назовите ЭТО.", "answer": "сборник лучших песен.", "complexity": "11.54", "handout": "0"}, {"number": 33, "text": "Карл Бо́йер и Ю́та Ме́рцбах считают, что ОНО, которое сейчас встречается редко, отражает этап в истории, когда первобытные люди только начинали учиться считать. Назовите ЕГО двумя словами.", "answer": "двойственное число.", "complexity": "57.69", "handout": "0"}, {"number": 34, "text": "Несмотря на то, что Микеланджело работал на семейство Ме́дичи, он поддержал флорентийскую республику, и после возвращения Медичи к власти не чувствовал себя в безопасности. В этот период он создал статую, которая держит в руке АЛЬФУ. Дэн Кру́кшенк считает, что по задумке Микеланджело эта АЛЬФА — его собственная ТАКАЯ АЛЬФА. Какие два слова, которые начинаются на согласные буквы, мы заменили словами «ТАКАЯ АЛЬФА»?", "answer": "посмертная маска.", "complexity": "3.85", "handout": "0"}, {"number": 35, "text": "Однажды автор вопроса отправил другу ссылку, сказав, что это клип Михаила Шуфути́нского. Но по ссылке был клип другого исполнителя. Ответьте одним словом абсолютно точно: что же произошло?", "answer": "рикроссинг.", "complexity": "7.69", "handout": "0"}, {"number": 36, "text": "Вавило́няне для вязкости добавляли муки́, поэтому можно сказать, что они делали только две ошибки. Где?", "answer": "в слове «хлеб».", "complexity": "69.23", "handout": "0"}]}, {"id": "5738", "title": "Негритянское ЧГК. Асинхронный турнир", "questions": [{"number": 1, "text": "(4) Первой травмой Се́рхио Агуэ́ро стал перелом ключицы, полученный во время НИХ. Назовите ИХ.", "answer": "роды.", "complexity": "", "handout": "0"}, {"number": 2, "text": "(3) В комиксах о Дэдпу́ле встречаются словесные облачка двух разных цветов, даже когда супергерой находится в одиночестве. Дело в том, что у Дэдпу́ла — два ИХ. Назовите ИХ двумя словами, начинающимися на соседние буквы алфавита.", "answer": "внутренние голоса.", "complexity": "", "handout": "0"}, {"number": 3, "text": "(1) Герой одного фильма из-за НЕЁ никогда не стрелял первым и по той же причине предпочитал дробовик. ОНА сплотила персонажей картины 1568 года. Назовите ЕЁ.", "answer": "слепота.", "complexity": "", "handout": "0"}, {"number": 4, "text": "(6) Некоторые приближённые к фараону рабы обильно намазывались ИМ. Какой ОН фигурирует в переводе названия произведения 1880 года?", "answer": "вересковый.", "complexity": "", "handout": "0"}, {"number": 5, "text": "(5) Если аризонский индеец находит ИКС, то внимательно изучает извлечённую в ходе строительства почву, ведь в этой почве часто попадаются гранаты весом около карата. «ИКС» — название изделия, которое после приготовления следует подержать в холодильнике. Назовите ИКС.", "answer": "муравейник.", "complexity": "", "handout": "0"}, {"number": 6, "text": "Восстановите подпись под правым логотипом на социальной рекламе, призывающей не садиться пьяным за руль.", "answer": "Mercedeath.", "complexity": "", "handout": "1"}, {"number": 6, "text": "На раздатке — верхняя часть игрового поля со страницы одного сайта. Найдите короткий ответ: какую форму имеет всё игровое поле?", "answer": "404.", "complexity": "", "handout": "1"}, {"number": 7, "text": "(4) В одном фильме ставят оперу Бе́нджамина Бри́ттена. Участвующие в оперной массовке дети одеты разнообразно — у каждой пары свой костюм. Какой известный сюжет лёг в основу этой оперы?", "answer": "Всемирный потоп.", "complexity": "", "handout": "0"}, {"number": 8, "text": "«Композиция VIII» Василия Канди́нского входит в НЕЁ, выпущенную издательством «Манн, Иванов и Фе́рбер». Назовите ЕЁ словом с приставкой.", "answer": "раскраска.", "complexity": "", "handout": "1"}, {"number": 9, "text": "(5) На ноге Визиря, умершего в 1826 году, была выжжена буква «N». Буква появилась после того, как в девятилетнем возрасте он был отправлен во Францию султаном Селимом III. Этот Визирь — один из самых известных ИХ. Назовите ИХ точно.", "answer": "кони/лошади Наполеона Бонапарта.", "complexity": "", "handout": "0"}, {"number": 10, "text": "(3) Перед тем как обсудить с подругой нового бойфренда, героиня сериала «Ри́вердэйл» говорит, что существует большой риск провалить ЕГО. Назовите ЕГО.", "answer": "тест Бе́кдел.", "complexity": "", "handout": "0"}, {"number": 11, "text": "(2) Антрополог Юва́ль Хара́ри пишет, что зачастую нельзя точно сказать, что изображено на пещерных рисунках, а значит любая интерпретация — не более, чем ОН. Назовите учёного, разработавшего ЕГО.", "answer": "Ге́рман Ро́ршах.", "complexity": "", "handout": "0"}, {"number": 12, "text": "[Указание ведущему: текст вопроса не зачитывать. После того, как команды получат раздаточный материал, сказать: «Вопрос номер 6. Время»]", "answer": "Ри́феншталь.", "complexity": "", "handout": "1"}, {"number": 13, "text": "Назовите произведение, первые слова которого приведены на раздаточном материале.", "answer": "«Цветы для Э́лджернона».", "complexity": "", "handout": "1"}, {"number": 14, "text": "(5) В американском мультсериале «Danger Rangers» [дэ́йнджер рэ́йнджерз] часто присутствует игра слов. Внутри горы Ра́шмор расположена ОНА рейнджеров. Назовите ЕЁ.", "answer": "штаб-квартира.", "complexity": "", "handout": "0"}, {"number": 15, "text": "(1) Известная японская компания назвала серию карманных компьютеров именем собственным греческого происхождения. На эмблеме серии изображена буква «W» [дабл ю], ведь эта буква помогает… Что сделать?", "answer": "отыскать/найти созвездие Кассиопеи.", "complexity": "", "handout": "0"}, {"number": 16, "text": "(2) В конце семидесятых в США транслировался сериал под названием «ОНО», пародирующий произведения себе подобного жанра. Герой какого романа ХХ века занимался производством ЕГО?", "answer": "«Бойцовский клуб».", "complexity": "", "handout": "0"}, {"number": 17, "text": "(3) На научной карикатуре приведён изменённый логотип известной музыкальной группы, средние буквы на котором были заменены на «Т» [ти] и «G» [джи], а вместо АЛЬФЫ — нарисована БЕТА. Что мы заменили словами АЛЬФА и БЕТА?", "answer": "молния, спираль ДНК.", "complexity": "", "handout": "0"}, {"number": 18, "text": "(4) В юмористическом фэнтезийном романе состоящий из одной только воды персонаж жалуется, что периодически страдает от НИХ. Назовите ИХ.", "answer": "приливы.", "complexity": "", "handout": "0"}, {"number": 19, "text": "(5) После переворота 1965 года в Индонезии было убито более миллиона человек, в основном — приверженцев левых идеологий. В фильме, посвящённом тем событиям, одного из убийц преследует ОН. В стихотворении Сла́вы Лё́на ОН носит цыганское мони́сто. Назовите ЕГО двумя словами.", "answer": "призрак коммуниста.", "complexity": "", "handout": "0"}, {"number": 20, "text": "(1) Стаю бабочек энтомологи называют так же, как игрушку, изобретённую в 1816 году. Какую?", "answer": "калейдоскоп.", "complexity": "", "handout": "0"}, {"number": 21, "text": "На раздаточном материале — отель в Сан-Франциско, в котором в середине прошлого века снимали несколько эпизодов известного фильма. Название отеля заретушировано белыми вертикальными полосами. Напишите это название.", "answer": "Vertigo.", "complexity": "", "handout": "1"}, {"number": 22, "text": "(4) [Указание ведущему: максимально чётко произнести слово «Bob» [боб]]\nПесня «Bob» [боб] Странного Э́ла Я́нковича состоит из тридцати восьми ИХ. Назовите ИХ.", "answer": "палиндромы.", "complexity": "", "handout": "0"}, {"number": 23, "text": "(3) [Ведущему: не сообщать об особенностях написания слова «jenner-ation»]\nСоздателю АЛЬФЫ, которую иногда называли jenner-ation [дженере́йшн], благодарно не одно поколение. Назовите АЛЬФУ тремя словами.", "answer": "вакцина от оспы.", "complexity": "", "handout": "0"}, {"number": 24, "text": "(2) Известным номером актрисы Аннабе́лы Мур был танец под названием ОН, состоящий из извивающихся движений тела. В китайской провинции Гуйчжо́у есть ОН под названием «24 поворота». Назовите ЕГО.", "answer": "серпантин.", "complexity": "", "handout": "0"}, {"number": 25, "text": "На раздаточном материале — название инсталляции, появившейся осенью 2014 года около Тауэра. Эта инсталляция была составлена из 888246 [восьмисот восьмидесяти восьми тысяч двухсот сорока шести] искусственных ИХ. Назовите ИХ точно.", "answer": "красные маки.", "complexity": "", "handout": "1"}, {"number": 26, "text": "(1) На НЁМ, появившемся после недавнего события, размещены калифорнийские маки, серебряная птица и лев. Назовите ЕГО.", "answer": "герб Меган Маркл.", "complexity": "", "handout": "0"}, {"number": 27, "text": "(6) В 1937 году Ева Браун встретилась на официальном уровне с НЕЙ, воплощавшей несбыточную мечту любовницы Гитлера. Назовите ЕЁ.", "answer": "Уо́ллис Симпсон.", "complexity": "", "handout": "0"}, {"number": 28, "text": "(3) Фильм Тима Блейка Нельсона, вышедший на экраны в 2001 году, является вольной экранизацией шекспировской пьесы. Напишите инициалы чернокожего спортсмена, являющегося главным героем этой экранизации.", "answer": "O.J. [оу джэй].", "complexity": "", "handout": "0"}, {"number": 29, "text": "(4) В приложении для обучения новичков итальянскому языку вместе со словами приводятся мнемонические картинки. На первом уроке изучается частица, для запоминания которой приводится изображение распространённого химического элемента. Какого?", "answer": "кремний.", "complexity": "", "handout": "0"}, {"number": 30, "text": "(5) В одном из европейских музеев хранится ОН, привезённый крестоносцами, как доказательство существования драконов. На карикатуре сытый персонаж советской сказки сидит возле НЕГО на необитаемом острове. Назовите ЕГО двумя словами.", "answer": "скелет крокодила.", "complexity": "", "handout": "0"}, {"number": 31, "text": "(1) По одной из версий, кондитерское изделие получило ЭТО название из-за того, что выпускалось в золотистой упаковке. Напишите ЭТО название.", "answer": "Oreo [о́рио].", "complexity": "", "handout": "0"}, {"number": 32, "text": "(6) Во французском детективе «Из мира мёртвых» героиня сначала вроде бы погибает, но потом «воскресает», поскольку её смерть была инсценирована. О том, что героиня «воскреснет», читателю должно подсказать её имя. Назовите учёного, который является тезкой этой героини.", "answer": "Рене Декарт.", "complexity": "", "handout": "0"}, {"number": 33, "text": "(3)  Если исход спортивного поединка уже решён, остающееся до окончания игры время американцы язвительно называют ИКС-time [икс тайм], поскольку вместо лидеров тренеры выпускают игроков запаса. ИКС — название рок-группы из города Ма́дисон. Какое слово мы заменили ИКСОМ?", "answer": "Garbage [га́бидж].", "complexity": "", "handout": "0"}, {"number": 34, "text": "(4) В американском военном шутере Commandos 2 [комма́ндос два] фигурирует пёс с кличкой, начинающейся на «W» [дабл ю]. Напишите эту кличку.", "answer": "Whiskey [уи́ски].", "complexity": "", "handout": "0"}, {"number": 35, "text": "(2) Недостаточное финансирование французских музеев привело к тому, что была повреждена картина известного импрессиониста. Статья об этом получила название, которое переводится как «ОН и ОНИ». Назовите ЕГО и ИХ.", "answer": "[Клод] Моне, деньги.", "complexity": "", "handout": "0"}, {"number": 36, "text": "(5) Труп обнаружил Рихард Рейш в 1926 году, а год спустя отрезал в качестве сувенира ухо. Назовите писателя, начавшего своё произведение с рассказа об этом трупе.", "answer": "Эрнест Хемингуэй.", "complexity": "", "handout": "0"}]}, {"id": "4563", "title": "\"Дополнительное время\". Турнир по ЧГК на вопросах спортивной тематики", "questions": [{"number": 1, "text": "Анонсируя матч между мужскими волейбольными командами из Екатеринбурга и Калининграда, журналист интернет-портала sports66.ru окрестил его \"ТАКИМ дерби\". Один из \"ТАКИХ ИХ\" известен с 1998 года. Какие два слова мы заменили словосочетанием \"ТАКОЙ ОН\"?", "answer": "\"Каменный цветок\".", "complexity": "", "handout": "0"}, {"number": 1, "text": "Этими двумя словами названо произведение, законченное в 1854 году. Этими двумя словами могла бы быть названа, например, статья об удачном выступлении эстонского конкуриста Пилла на этапе Кубка мира 2006 года в Москве. Назовите имя этого конкуриста.", "answer": "Рейн.", "complexity": "", "handout": "0"}, {"number": 1, "text": "Перед вами фрагмент программы передач телеканала \"Спорт\" за 20 января этого года. В анонсе трансляции некоторого спортивного соревнования, начинавшейся в 22:25, присутствовало словосочетание из двух слов, что могло показаться парадоксальным. Назовите это словосочетание.", "answer": "Короткая программа.", "complexity": "", "handout": "1"}, {"number": 2, "text": "Дуплет.\n1. До нынешнего сезона игрок московского \"Динамо-Ямал\" Владислав Шаяхметов был многолетним лидером екатеринбургского мини-футбольного клуба \"ВИЗ-Синара\". У болельщиков Шаяхметов получил короткое прозвище. Воспроизведите его.\n2. Переход Владислава Шаяхметова в стан московского \"Динамо-Ямал\" у многих болельщиков не нашел понимания. А в первый после трансфера приезд в Екатеринбург фанаты даже встретили своего экс-кумира баннером, в тексте которого присутствовал глагол в прошедшем времени. Напишите этот глагол.", "answer": "1. Шах.\n2. Умер.", "complexity": "", "handout": "1"}, {"number": 2, "text": "Если верить Википедии, ТАКИМ прозывали не только известного человека, но и его деда — двойного тезку. А вот другой ТАКОЙ сейчас работает в ТАКОМ. Какое слово мы заменили словом \"ТАКОЙ\"?", "answer": "Грозный.", "complexity": "", "handout": "0"}, {"number": 2, "text": "Диана Миронова, ставшая вице-чемпионкой мира по русскому бильярду в 12 лет, в авторском ролике, посвященном ей самой, делает на бильярдном столе два противоположных по сути действия. Назовите эти действия однокоренными словами.", "answer": "Просыпается, засыпает.", "complexity": "", "handout": "0"}, {"number":

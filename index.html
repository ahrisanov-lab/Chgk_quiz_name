ut": "0"}, {"number": 38, "text": "Любопытно, но эти два известных с античности кулинарных ингредиента — близкие родственники, и растения, дающие их, принадлежат к одному семейству вечнозеленых деревьев. Название одного дало название семейству. В латинском названии другого присутствует южный остров, но знаем мы этот ингредиент по русскому названию, которое буквально указывает на то, что именно использовать. Назовите оба ингредиента.", "answer": "Лавр и корица.", "complexity": "", "handout": "0"}, {"number": 38, "text": "На самом деле ОНА — это целый баран на вертеле над костром, поэтому и готовится редко — дорого. А то, что привыкли так называть, правильно именуется другим словом, которое означает \"вращающийся\". Назовите ЕЕ.", "answer": "Шаурма.", "complexity": "", "handout": "0"}, {"number": 38, "text": "Этот эпиграф — на самом деле не точная, а искаженная цитата. В нем некий параметр, который в оригинале относился к известному стражу, оказался увеличенным более чем в 33 раза. Назовите человека, использовавшего этот эпиграф в своем произведении.", "answer": "Радищев.", "complexity": "", "handout": "0"}, {"number": 39, "text": "Снятый сорок с лишним лет назад мюзикл \"Смешная девчонка\" имел и политический подтекст: ведь исполнительница главной женской роли Барбра Стрейзанд родом из бедной бруклинской семьи. А кто сыграл в этом фильме главную мужскую роль?", "answer": "Омар Шариф.", "complexity": "", "handout": "0"}, {"number": 39, "text": "Историки науки недоумевают: в распоряжении Ричарда Оуэна было прекрасное слово \"герпетон\". Тем не менее, в 1841 году он придумал новое слово, которое, как считают сейчас, оказалось куда менее удачным. Какое слово придумал Оуэн?", "answer": "Динозавр.", "complexity": "", "handout": "0"}, {"number": 39, "text": "Семилетняя героиня Энид Блайтон собиралась стать детективом, и очень расстроилась, узнав, что придется иметь дело со ВТОРЫМИ: ведь они, по ее словам, очень скользкие. ПЕРВЫЕ и ВТОРЫЕ в русско-английском словаре Мюллера расположены рядом. Назовите первые и вторых.", "answer": "Улики и улитки.", "complexity": "", "handout": "0"}, {"number": 39, "text": "Некий Марко потерял любимую девушку и работу, а потом попал в реабилитационную группу. Закончив реабилитацию, Марко отправился в интернет-кафе и написал письмо, в котором, в частности, говорилось: \"Спорим, в душе ты была рада, что меня уволили, ведь с того момента я больше от тебя не уходил\". Назовите адресата письма на санскрите.", "answer": "Аватара.", "complexity": "", "handout": "0"}, {"number": 39, "text": "ПРОПУСК 1 и ПРОПУСК 2 состоят из двух слов каждый. Назовите произведение 1979 года, в котором, по мнению автора вопроса, содержатся ПРОПУСК 1 и ПРОПУСК 2.", "answer": "\"Сказка сказок\".", "complexity": "", "handout": "1"}, {"number": 39, "text": "С ноября 1839-го по март 1840-го существовал кружок выходцев из аристократических семей, неравнодушных к судьбе России. Был у них неформальный лидер, и, учитывая это, Андроников называл членов кружка храбрецами и ИМИ. Назовите ИХ одним словом.", "answer": "Фаталисты.", "complexity": "", "handout": "0"}, {"number": 39, "text": "По мнению большинства исследователей, система \"колесо-ось-колесо\" (и ныне основная для колесной техники) еще раньше применялась людьми другой профессии. Какой?", "answer": "Гончарами.", "complexity": "", "handout": "0"}, {"number": 39, "text": "В газете \"Троицкий вариант\" публикуются шутки на тему неизвестных страниц истории науки. В их сюжетах известные ученые одновременно работали и отдыхали в одном университете. Однажды в этом университете разбирали хлам и нашли спрятанную игру \"Монополия\". Назовите лауреата Нобелевской премии в области физики, которому она принадлежала.", "answer": "Поль Дирак.", "complexity": "", "handout": "0"}, {"number": 40, "text": "В рассказе \"Надувательство как точная наука\" Эдгар По пишет, что надувала отличается от финансиста лишь размахом надувательства. Согласно По, надувала — это банкир в миниатюре, и наоборот: финансовая операция — это надувательство в ИКСЕ. Место под названием ИКС было подробно описано за сотню лет до По. Мы не спрашиваем вас, кем — назовите ИКС.", "answer": "Бробдингнег.", "complexity": "", "handout": "0"}, {"number": 40, "text": "Заполните оба пропуска в цитате из одного ЖЖ-юзера.", "answer": "Нирвана, Nirvana.", "complexity": "", "handout": "1"}, {"number": 40, "text": "Считается, что впервые ЭТО появилось у австралопитеков оррорина и салехантропа, живших около шести миллионов лет назад. А вот название за ЭТО получил один из видов Homo, живший много позднее. Какой?", "answer": "Homo Erectus.", "complexity": "", "handout": "0"}, {"number": 40, "text": "Политолог, ученый и писатель Федор Бурлацкий вспоминает: дело было в Подмосковье, на бывшей даче Горького. Шел 1961 год. Как-то утром, после крепкой вечерней пьянки, сидели в беседке и чаевничали и фантазировали. Один говорил \"мир\", другой \"свобода\", третий \"солидарность\"... Говорили, что нужно исходить из заповедей Моисея, Христа, тогда всё действительно \"ляжет\" на общественное сознание. Это был сознательный акт включения в коммунистическую идеологию религиозных элементов. Назовите то, что стало результатом этих фантазий.", "answer": "Моральный кодекс строителя коммунизма.", "complexity": "", "handout": "0"}, {"number": 40, "text": "Известная своим аналитическим мышлением Лидия Гинзбург считала, что ЕГО сочинения были справочником, в котором умудренные мыслью подростки десятых годов выбирали себе трагедию. О ком она так говорила?", "answer": "О Фрейде.", "complexity": "", "handout": "0"}, {"number": 40, "text": "Согласно одной из статей в Сети, ОНА ведет себя как дзенский наставник — не рассказывает, что, как и почему, а показывает. Согласно другой — ОНА учит, что нужно всегда быть готовым к переменам. Именно стремясь к переменам, жительница Саранска Марина Константиновна Девяткина сменила СВОИ имя и фамилию на ЕЕ. Зановоназванная утверждает, что на работе уже привыкли — имя-то похожее... И уверяет, что в Англию переезжать не собирается. Как же теперь по паспорту значится бывшая Марина Константиновна Девяткина?", "answer": "Мэри [Константиновна] Поппинс.", "complexity": "", "handout": "0"}, {"number": 40, "text": "В одном из выпусков передачи \"Мир и Ной\" на телеканале А1 ведущий как обычно встретился с умершим человеком. Гость студии все время переспрашивал вопросы ведущего и упомянул боксера. Назовите фамилию этого гостя.", "answer": "Ван Гог.", "complexity": "", "handout": "0"}, {"number": 40, "text": "В 1916 году акушер из городка Феррис близ Далласа пришел к выводу, что скополамин может заставить человека правдиво ответить на любой заданный вопрос, и в дальнейшем настаивал на применении этого вещества в работе полиции. Назовите фамилию этого врача.", "answer": "Хаус.", "complexity": "", "handout": "0"}, {"number": 41, "text": "Норвежский город Тромсё, население которого составляет около 62 тысяч жителей, является четвёртым по величине ТАКИМ городом мира. Три самых крупных ТАКИХ города находятся в одной стране. Что объединяет все эти города?", "answer": "Они находятся за [Северным] полярным кругом.", "complexity": "", "handout": "0"}, {"number": 41, "text": "В мультфильме \"Маленький Аршлох\" незадачливые исполнители спели песню на собрании исламских фундаменталистов, после чего слушатели нанесли артистам тяжкие телесные повреждения. Мы не просим вас назвать композитора. Скажите, кто был автором поэтического текста песни.", "answer": "Салман Рушди.", "complexity": "", "handout": "0"}, {"number": 41, "text": "Один из номерных альбомов группы \"Iron Maiden\" носил название \"The X Factor\" [Зе Икс Фактор]. Напишите абсолютно точно, какое число было вынесено в название следующего альбома группы.", "answer": "XI.", "complexity": "", "handout": "0"}, {"number": 41, "text": "Внимание, в вопросе есть замены.\nВо время ссылки ОВИДИЙ какое-то время, среди прочих, ухаживал за Калипсо Полихрони, хотя она и не была красавицей. По версии Вересаева, ОВИДИЯ стимулировали слухи о том, что Полихрони была связана с КАТУЛЛОМ. Кого мы заменили на ОВИДИЯ и КАТУЛЛА?", "answer": "Пушкина и Байрона.", "complexity": "", "handout": "0"}, {"number": 41, "text": "В ответ на обвинения в том, что в \"Бэтмене\" Джокеру уделяется больше внимания, чем главному герою, Бёртон объяснял, что всё совершенно не так. А причина такого впечатления будто бы кроется в том, что Джокер — ИКС, а Бэтмен — ИГРЕК. К ИКСАМ относятся Гамлет и Штирлиц, к ИГРЕКАМ — Есенин и Достоевский. Назовите ИКС и ИГРЕК в правильном порядке.", "answer": "Экстраверт, интроверт.", "complexity": "", "handout": "0"}, {"number": 41, "text": "В 40-е годы прошлого века шла дискуссия по поводу введения астрономического термина. Харлоу Шепли возражал, поскольку в английском языке это слово означало еще и \"собрание красивых дам или выдающихся лиц\". Однако же сам Шепли пишет, что такая полисемия не мешает существовать в астрономии термину \"звезда\". Любопытно, что сейчас такое двусмыслие осталось \"на слуху\" не в английском, а в испанском языке. Назовите этот термин.", "answer": "Галактика.", "complexity": "", "handout": "0"}, {"number": 41, "text": "Второе слово ЕЕ названия на самом деле означает \"прошедших\", а не разделенных на даты. Назовите ЕЕ тремя словами.", "answer": "\"Повесть временных лет\".", "complexity": "", "handout": "0"}, {"number": 41, "text": "По одной из версий, свое прозвище этот человек получил из-за того, что имел право назначать священников парижской капеллы. Согласно другой версии — это прозвище происходит от латинского слова, означающего... Что именно?", "answer": "Голова.", "complexity": "", "handout": "1"}, {"number": 42, "text": "Опрос показал: это не совпадение, а осознанный выбор. А теперь вопрос: назовите марку автомобиля, наиболее популярную у сотрудников Специальной астрофизической обсерватории РАН.", "answer": "Субару.", "complexity": "", "handout": "0"}, {"number": 42, "text": "Внимание, в вопросе есть замены.\nАлен Демурже пишет, что ТАКОЙ ОН тамплиеров издалека наводил ужас на современников. А вот ЭТАКИЙ ОН прославился беззаветной борьбой с преступностью. Его ближайшим помощником в этой борьбе был выходец, видимо, с Британских островов. Назовите этого помощника.", "answer": "Зигзаг [МакКряк].", "complexity": "", "handout": "0"}, {"number": 42, "text": "Оценка важнейшего ЕГО качества базируется на том, сколько нужно выпить сладкой воды, чтобы нейтрализовать действие алкалоида капсаицина. И название того ЕГО, что стоит в начале шкалы и не содержит алкалоид, и название того ЕГО, что стоит ближе к другому концу шкалы, — связаны со странами. Назовите обе страны.", "answer": "Болгария, Чили.", "complexity": "", "handout": "0"}, {"number": 42, "text": "Внимание, в вопросе есть замены.\nИнтервью с создателем операционной системы в журнале \"Домашний компьютер\" называется \"Волшебный КВАДРАТ ГИПОТЕНУЗЫ\". КВАДРАТ ГИПОТЕНУЗЫ содержит, в частности, атропин, гиоцимин и скополамин. Что мы заменили на \"ГИПОТЕНУЗА\"?", "answer": "Мандрагора.", "complexity": "", "handout": "0"}, {"number": 42, "text": "Телеграмма, отправленная в Москву 13 июня 1955 года, гласила: \"Закурили трубку мира зпт табак отличный тчк Авдеенко зпт Елагина зпт Хабардин тчк\". Как сейчас называется тот субъект федерации России, из которого ушла эта телеграмма?", "answer": "Республика Саха.", "complexity": "", "handout": "0"}, {"number": 42, "text": "На территории этого небольшого карельского поселка до сих пор стоит сосна, под которой, согласно легенде, и работал знаменитый врач. Как с 1963 года называется этот поселок?", "answer": "Калевала.", "complexity": "", "handout": "0"}, {"number": 42, "text": "В одном из выпусков \"Камеди вумен\" поэтессе, находящейся в творческом застое, советуют завести щенка. Она отвечает, что тот сможет вдохновить ее лишь на повторяющееся звукоподражание, и размышляет, достаточно ли этого будет для выступления на юбилее известного артиста. О каком артисте идет речь?", "answer": "О Валентине Гафте.", "complexity": "", "handout": "0"}, {"number": 42, "text": "За восемьдесят с лишним лет такое совпадение произошло лишь дважды: оба раза — благодаря одному и тому же человеку: американскому писателю и продюсеру. Мы не спрашиваем вас, о каком совпадении идет речь, и даже не просим назвать фамилию этого продюсера. Назовите его имя.", "answer": "Оскар.", "complexity": "", "handout": "0"}, {"number": 43, "text": "Вальдемар ди Бриту был в свое время очень известным футболистом. С 1933 по 1945 год играл в ведущих бразильских и аргентинских клубах, за свою сборную сыграл 18 матчей и забил 18 мячей. Но сам ди Бриту считал главным своим спортивным успехом то, что он сделал спустя девять лет после завершения своей карьеры нападающего. Что же он сделал?", "answer": "Привел в большой спорт Пеле.", "complexity": "", "handout": "0"}, {"number": 43, "text": "В предисловии к сборнику \"Каньон\" говорится, что ПЕРВЫЙ дал Купера, По и Мелвилла, ТРЕТИЙ — Фолкнера. А вы назовите одним словом то, что, согласно этому предисловию, дал ЧЕТВЕРТЫЙ.", "answer": "Вестерн.", "complexity": "", "handout": "0"}, {"number": 43, "text": "Когда немецкий император созывал рыцарей в поход, то между призывом и вступлением должно было пройти не более сорока дней. Исключения имели место лишь при необходимости ЭТОГО. ЭТО изображено и на известной картине. Назовите человека, фамилия которого также упоминается в названии этой картины.", "answer": "Суворов.", "complexity": "", "handout": "0"}, {"number": 43, "text": "Настоящая итальянская ИКС обязательно покрыта тонким слоем белой плесени. А героиня одного из постов в Живом Журнале собиралась принять ванну с ИКС. Что мы заменили на \"ИКС\"?", "answer": "Салями.", "complexity": "", "handout": "0"}, {"number": 43, "text": "13 июля 1930 года в лондонском Альберт-холле собралась многотысячная толпа, чтобы почтить память человека, скончавшегося несколькими днями ранее. Когда его вдову и детей пригласили на сцену, они расселись в стоявшие там кресла, оставив центральное из них свободным. Тем самым они отдали своеобразную дань тому, чем этот человек был увлечен на протяжении многих лет своей жизни. Назовите этого человека.", "answer": "Артур Конан Дойл.", "complexity": "", "handout": "0"}, {"number": 43, "text": "Одна из самых известных работ скульптора Бартоломео Карло Растрелли — бронзовая конная статуя Петра I, созданная в 1743-1744 годах, а в 1800 году установленная перед Инженерным замком в Петербурге. Бюст Петра 1723-1724 годов менее известен, к тому же до наших дней он не сохранился. Мы не спрашиваем, из какого материала был сделан этот бюст. Ответьте, где он был установлен.", "answer": "На носу корабля.", "complexity": "", "handout": "0"}, {"number": 43, "text": "ЕГО название происходит от греческого слова, означающего \"бегущий\", а ЕГО жизнь, если верить стихотворению одной маленькой девочки, проще, чем у ЕГО собрата. Напишите ЕГО название.", "answer": "Дромадер.", "complexity": "", "handout": "0"}, {"number": 43, "text": "Согласно Книге рекордов Гиннесса, самое ОНО весит 300 тонн и является заслугой австралийской Leipoa ocellata. Назовите имя человека, носившего прозвище ОНО.", "answer": "Всеволод.", "complexity": "", "handout": "0"}, {"number": 44, "text": "Рассказывая о том, что после пересечения Ла-Манша самолет \"БлериО-XI\" сразу превратился в предмет мечтаний многих, Виктор Гончаренко упомянул литературное произведение XIX века. Какое?", "answer": "\"Гадкий утенок\".", "complexity": "", "handout": "0"}, {"number": 44, "text": "Накануне 9 мая в военном городке Чкаловский все памятники приводили в порядок. Для того чтобы очистить от грязи два монумента, представляющие собой настоящие реактивные истребители, почти вертикально взмывающие в небо, пришлось пригласить ИХ. ОНИ действуют в книге, которая в аниме-сериале \"Библиотечные войны\" входит в число запрещенных. Назовите автора этой книги.", "answer": "Рэй Брэдбери.", "complexity": "", "handout": "0"}, {"number": 44, "text": "В одном популярном русскоязычном ЖЖ-сообществе была высказана мысль, что по нормам ОНИ в Нью-Йорке не живут. Следуя логике высказывания, ОНИ по нормам не живут также, например, в Пярну, Тарту и в Ираке. Назовите ИХ.", "answer": "Женщины.", "complexity": "", "handout": "0"}, {"number": 44, "text": "Перед вами — снимок известного веймарца, родившегося в 1818 году. По иронии судьбы, снимок не очень резкий. Назовите фамилию этого человека.", "answer": "Цейсс.", "complexity": "", "handout": "1"}, {"number": 44, "text": "Перед вами — гравюра из издания дневников Пржевальского за время путешествий по Центральной Азии. Какими известными всем тремя словами она называется?", "answer": "\"Буря в пустыне\".", "complexity": "", "handout": "1"}, {"number": 44, "text": "В ходе интервью с Анатолием Бышовцем, обнародованного 25 мая, тренер признался, что ЭТОТ человек \"словно бы пришел к нам из будущего, показал дальнейшее развитие нашей игры\". Каким словом Анатолий называет этого человека, делая одно добавление?", "answer": "Мессия.", "complexity": "", "handout": "0"}, {"number": 44, "text": "В очерке \"Пленный дух\", посвященном Андрею Белому, Марина Цветаева писала, что это — \"отказ от отечества, ибо отца не включает\". Перечисляя имена и фамилии, она вопрошает: \"Кто им отец?\". О чем так писала Марина Ивановна?", "answer": "О псевдонимах.", "complexity": "", "handout": "0"}, {"number": 44, "text": "Внимание, в вопросе есть замены.\nПрослушайте фрагмент стихотворения Виктора Коллегорского:\nВсе смешалось, и век наш ему предстает\nКак манхэттенско-нюрнбергский кворум —\nИ Эйнштейн, и Манштейн... Только недостает\nАЛА ГОРДОНА с САШЕЮ ГОРОМ.\nВ известной книге другой АЛ использовал другого САШУ в качестве транспортного средства. Какие имена и фамилии должны стоять на месте \"АЛ ГОРДОН\" и \"САША ГОР\" соответственно?", "answer": "Нильс Борман и Мартин Бор.", "complexity": "", "handout": "0"}, {"number": 45, "text": "В одном из недавних интервью этот человек сказал, что своей хорошей формой обязан немецким бомбардировщикам, бомбившим Англию, — и, следовательно, умеренной диете в младенчестве. Само интервью озаглавили известными словами песни из кинофильма \"Земля Санникова\", изменив всего одну букву. Воспроизведите получившиеся три слова.", "answer": "\"Есть только Мик\".", "complexity": "", "handout": "0"}, {"number": 45, "text": "ОНА фигурирует еще в старинной католической молитве, символизируя чистоту и недоступность Девы Марии для соблазнов, а вот Михаил ОсоргИн вместо довольно громоздкой переводной кальки предложил ЕЕ русскоязычный эквивалент — \"келья под елью\". Назовите ЕЕ.", "answer": "Башня из слоновой кости.", "complexity": "", "handout": "0"}, {"number": 45, "text": "В России XVIII века этот показатель составил около 67% — благодаря четырем. В Великобритании XIX века — 63%, благодаря всего лишь одной. А в Нидерландах в XX веке достиг абсолютной величины в 100% — и для этого хватило трех. Назовите каждую из этих трех одним словом.", "answer": "Королева.", "complexity": "", "handout": "0"}, {"number": 45, "text": "Герой сериала \"Теория большого взрыва\" в процессе транспортировки мебели вверх по лестнице обзывает ЕЕ \"бессердечной сукой\". А один сайт называет черные дыры ЕЕ триумфом. Назовите ЕЕ.", "answer": "Гравитация.", "complexity": "", "handout": "0"}, {"number": 45, "text": "Это — на самом деле растение, относящееся к семейству бромелиевых. Так что один бывший заключенный не был таким уж идиотом, а режиссер вполне мог найти ее, только где-нибудь в Южной Америке. Назовите ЕЕ тремя буквами.", "answer": "Пуя.", "complexity": "", "handout": "0"}, {"number": 45, "text": "Трансфер Криштиано Роналдо, несмотря на молодость футболиста, стоил президенту мадридского \"Реала\" Флорентино Пересу более ста миллионов долларов. Немецкий журнал \"Sportbild\" замечает, что Перес мог бы распорядиться этими деньгами по-другому, с пользой для души, например, приобрести ЕЕ. Напишите ЕЕ название.", "answer": "Картина \"Мальчик с трубкой\".", "complexity": "", "handout": "1"}, {"number": 45, "text": "Название этого прибора образовано от греческих корней со значениями \"мозг\" и \"голос\". Назовите фильм, в адресе официального сайта которого фигурирует название этого прибора.", "answer": "\"Гостья из будущего\".", "complexity": "", "handout": "0"}, {"number": 45, "text": "Радиодиджей Кенни Эверетт вспоминал: \"Он принес ее на студию в 1975 году и здорово сомневался, что ОНА сможет стать хитом. Слушатели решат, что диск-жокей пошел в туалет и забыл вернуться...\". Однако Эверетт был уверен в ЕЕ успехе. Назовите ЕЕ двумя словами.", "answer": "\"Богемская рапсодия\".", "complexity": "", "handout": "0"}, {"number": 46, "text": "В начале 20-х, когда художественная жизнь кипела, некоторые молодые актеры глубокомысленно простаивали в фойе Камерного театра, боясь показаться несовременными. Назовите двумя словами причину такого поведения.", "answer": "\"Черный квадрат\".", "complexity": "", "handout": "0"}, {"number": 46, "text": "Первых звали Энн и Дэвид, а вторых, появившихся более чем через полвека, — Джейн и Джон. Первые обязаны своим существованием королю саспенса, а вторые приобрели кое-что от первых. Назовите фамилию и первых, и вторых.", "answer": "Смит.", "complexity": "", "handout": "0"}, {"number": 46, "text": "Федор Толстой-Американец объяснял, что просто исправляет ошибки фортуны. Но когда Пушкин в эпиграмме описал Толстого ИКСОМ, тот слезно просил поэта изменить стихотворение, указав какой-то другой свой грех. Назовите ИКС.", "answer": "Шулер.", "complexity": "", "handout": "0"}, {"number": 46, "text": "Язвительный Набоков в середине 40-х создал свою классификацию эмиграции, где первыми были люди обывательского толка, которые невзлюбили большевиков за то, что те у них отобрали землицу, денежки и некие обиходные предметы. Назовите эти предметы двумя словами.", "answer": "Двенадцать стульев.", "complexity": "", "handout": "0"}, {"number": 46, "text": "В одном из фельетонов Булгаков описывал церковь и большевистскую школу, находившиеся в одном здании. Благодаря отличной слышимости здесь рождались удивительные произведения, например — \"Попрыгунья стрекоза лето красное пропела, оглянуться не успела — яко Спаса родила\". Ответьте, на какое известное утверждение фельетонный батюшка невольно отвечает \"Всегда, ныне и присно и во веки веков\".", "answer": "Пролетарию нечего терять, кроме его оков.", "complexity": "", "handout": "0"}, {"number": 46, "text": "Внимание, в вопросе есть замены.\nВ процессе работы над предыдущим вопросом один из авторов призналась, что ей приятнее было бы искать в Гугле АУРУ АУРЕЛИО. Какие два слова мы заменили на \"АУРУ АУРЕЛИО\"?", "answer": "Торс Торреса.", "complexity": "", "handout": "0"}, {"number": 46, "text": "Сергей Аверинцев писал: когда литература вбирает в себя основной смысл всей культуры в целом, который не может быть реализован помимо литературы, вступает в действие тезис, будто бы впервые сформулированный в эпоху инквизиции. Воспроизведите этот тезис, состоящий из трех слов.", "answer": "Рукописи не горят.", "complexity": "", "handout": "0"}, {"number": 46, "text": "Внимание, цитата: \"И было от чего содрогнуться столице. Такие \"жесты\" приравнивались к кощунству, ведь в Священном Писании говорится, что царь касается скипетром того, кому хочет выказать благорасположение и свою милость\". Чей поступок так прокомментировала детская энциклопедия?", "answer": "Царя Дадона.", "complexity": "", "handout": "0"}, {"number": 47, "text": "Перед вами — фотография девочки. Молодой человек 22 лет, по собственным словам, мучил ее до смерти примерно месяц. Назовите фамилию мучителя.", "answer": "Серов.", "complexity": "", "handout": "1"}, {"number": 47, "text": "Внимание, в вопросе есть замены.\nВИЗИТ ДАМЫ, в принципе, — дело известное. К примеру, ВИЗИТ ДАМЫ практиковался в Польше в XVII веке. Но, пожалуй, самый необычный ВИЗИТ ДАМЫ состоялся 27 февраля 1918 года в Москве. Для определения использовались ярлычки входных билетов. Мы не спрашиваем, какие слова мы заменили на \"ВИЗИТ ДАМЫ\". Просто напишите, как звали ДАМУ, появившуюся в последнем случае.", "answer": "Игорь Северянин.", "complexity": "", "handout": "0"}, {"number": 47, "text": "По слухам, читательнице досталось \"Элементарное руководство по теории детерминантов\". Но автор уверял, что всё это выдумки, и в конце жизни даже опубликовал опровержение. Назовите этого автора.", "answer": "Льюис Кэрролл.", "complexity": "", "handout": "0"}, {"number": 47, "text": "Внимание, в вопросе есть замена.\nВ тематическом наборе конструктора \"Лего\" ШАРИКОВЫЕ РУЧКИ больше всего напоминают милицейские дубинки. А журналисты журнала \"Здоровье Вологодчины\" назвали статью о кисломолочных продуктах \"ШАРИКОВАЯ РУЧКА\". Какие два слова мы заменили на \"ШАРИКОВАЯ РУЧКА\"?", "answer": "Волшебная палочка.", "complexity": "", "handout": "0"}, {"number": 47, "text": "Фантастический роман Кантора, вышедший в 1961 году, описывает, что только к 1960-м годам созрели условия к объединению Конфедерации, Союза и Техаса. Название этого романа содержит глагол в сослагательном наклонении. Воспроизведите, хотя бы приблизительно, это название.", "answer": "\"Если бы Юг выиграл гражданскую войну\".", "complexity": "", "handout": "0"}, {"number": 47, "text": "Одним из главных компонентов жевательной смеси бетель является лист бетелевой лианы. Вкус листа зависит не только от сорта бетелевой лозы — дополнительные оттенки добавляют в него и другие растения. Какие именно растения?", "answer": "Те, вокруг которых обвивается лиана.", "complexity": "", "handout": "0"}, {"number": 47, "text": "Визит Александра Лукашенко в Италию в апреле 2009 года стал выдающимся событием во внешней политике Белоруссии. Одна из встреч на высшем уровне, проведенная в ходе этого визита, побудила интернет-газету \"Взгляд\" озаглавить статью о ней следующим образом: \"[Пропуск] пришел к [пропуск]\". Заполните оба пропуска.", "answer": "Батька, Папе.", "complexity": "", "handout": "0"}, {"number": 47, "text": "По мнению авторов русской Абсурдопедии, часть его названия следовало бы заменить словом \"царь\". В поисковой системе Яндекс находится более 150 тысяч страниц, на которых в его названии фигурирует имя. Это имя было дано при рождении режиссеру, у которого снимались Сильвестр Сталлоне, Вупи Голдберг и Эрик Робертс. Назовите фамилию этого режиссера.", "answer": "Кончаловский.", "complexity": "", "handout": "0"}, {"number": 48, "text": "В каталоге Мессье ОНА занимает 31-е место, в новом общем каталоге — 224-е, а первое упоминание о НЕЙ относится аж к 946 году и принадлежит персу Ас-Суфи. Однако мы смело можем заявить, что \"ОНА\" появилась в 1957 году, или что в СССР \"ЕЕ\" впервые увидели еще десять лет спустя. Назовите ЕЕ двумя словами.", "answer": "Туманность Андромеды.", "complexity": "", "handout": "0"}, {"number": 48, "text": "В одной школе проводились выборы монархов, в ходе которых дети предложили кандидатуру учительницы. Учительница ответила на это немного измененным устойчивым выражением из пяти слов. Как стало звучать это выражение?", "answer": "\"Я вам в королевы-матери гожусь\".", "complexity": "", "handout": "0"}, {"number": 48, "text": "Внимание, в вопросе есть замена.\nЕсли в супермаркете WalMart РАСПУСКАЕТСЯ ЦВЕТОК, то по супермаркету объявляется \"Код Адам\", названный так в память о погибшем в 1981 году Адаме Волше. Сотрудники службы безопасности берут под контроль все выходы из здания, а через десять минут обязательно вызывается полиция. Что мы заменили на \"РАСПУСКАЕТСЯ ЦВЕТОК\"?", "answer": "Теряется ребенок.", "complexity": "", "handout": "0"}, {"number": 48, "text": "В переводе на японский в составе группировки могли бы оказаться оками, инугами и недзуми. Назовите заглавную фамилию четвертого члена этой странной банды, для которого подходящего японского аналога не нашлось.", "answer": "Поттер.", "complexity": "", "handout": "0"}, {"number": 48, "text": "Внимание, в вопросе есть замены.\nПерсонаж одного рассказа, желая блеснуть перед девушкой образованностью, сочиняет историю о пароходе \"БУРАТИНО\", впоследствии переименованном в честь ЮНГА. Мы не спрашиваем, как стал называться пароход и какую фамилию мы заменили на \"ЮНГ\". Ответьте, какое имя мы заменили на \"БУРАТИНО\".", "answer": "Зигфрид.", "complexity": "", "handout": "0"}, {"number": 48, "text": "Советский генетик Владимир Эфроимсон полагал, что судьи были не столь уж и неправы. По его мнению, имел место диагноз синдрома Морриса. На это указывает, к примеру, полное отсутствие волос, упомянутое в материалах дела. К сожалению, нет никакой возможность провести генетическую экспертизу останков. Назовите субъект процесса.", "answer": "Жанна д'Арк.", "complexity": "", "handout": "0"}, {"number": 48, "text": "Художник XIX века Домье был признанным мастером динамического рисунка. Но выполненный им портрет Берлиоза резко отличался от всех остальных работ. Чем воспользовался Домье при создании этого портрета?", "answer": "Фотографией Берлиоза.", "complexity": "", "handout": "0"}, {"number": 48, "text": "\"Учительская газета\" предлагает вариант урока живописи для младших школьников на тему \"портрет\". Урок носит название \"Удивительный ОН\". Во время урока звучат \"Времена года\" Вивальди, а на учительском столе стоит плетеная корзина, наполненная муляжами. Выбор ЕГО творчества основан на том, что малыши любят всё яркое и нестандартное. Назовите ЕГО.", "answer": "Арчимбольдо.", "complexity": "", "handout": "0"}, {"number": 49, "text": "Внимание, в вопросе есть замена.\nОдним из итогов операции \"Вихрь антитеррор\" в Орловской области в 2007 году стали 4,5 тысячи ИКСОВ. В русскоязычной Абсурдопедии есть статья \"ИКСЫ сиамских близнецов\". Назовите ИКС.", "answer": "Протоколы.", "complexity": "", "handout": "0"}, {"number": 49, "text": "Внимание, в вопросе есть замена.\nВ Голливуде говорят, что существует список из пяти самых популярных у публики актеров, и ПЕРВОЕ МЕСТО в нем занимает Том Круз. ПЕРВОЕ МЕСТО успешных переговоров — это вести за собой, присоединяться к другому, беспристрастно оценивать ситуацию. А еще ПЕРВОЕ МЕСТО рук — одна из основ классического танца. Какие два слова мы заменили на \"ПЕРВОЕ МЕСТО\"?", "answer": "Три позиции.", "complexity": "", "handout": "0"}, {"number": 49, "text": "По свидетельству критика Льва Аннинского, ОН просмотрел миллионы метров парадов, воплей, речей, а использовал долю процента. Назовите ЕГО.", "answer": "Михаил Ромм.", "complexity": "", "handout": "0"}, {"number": 49, "text": "По странному стечению обстоятельств или из-за предчувствия, но последняя опера Бенджамина Бриттена написана по произведению, которое было опубликовано за год до рождения Бриттена. Назовите автора этого произведения.", "answer": "Томас Манн.", "complexity": "", "handout": "0"}, {"number": 49, "text": "В свои молодые годы главную роль в этом произведении хотели сыграть такие звезды, как Марлон Брандо, Джек Николсон и Леонардо ди Каприо. А в 2009 году появилось своеобразное продолжение, судя по названию которого герой то ли пробирается, то ли шагает через НЕЕ. Назовите ЕЕ.", "answer": "Рожь.", "complexity": "", "handout": "0"}, {"number": 49, "text": "В одном из эпизодов детского кинофильма \"Элвин и бурундуки\" один из героев (что неудивительно, бурундук) вдруг начинает говорить низким басовитым голосом. Ответьте максимально точно, какой предмет он перед этим использовал не по назначению.", "answer": "Шарик, наполненный гелием.", "complexity": "", "handout": "0"}, {"number": 49, "text": "Рассказывают, будто бы во время революции мародеры вскрыли ЕГО могилу, но, увидев на истлевшем теле золотой медальон с надписью \"1789\", в панике бежали. А чья это была могила?", "answer": "[Мишель] Нострадамус.", "complexity": "", "handout": "0"}, {"number": 49, "text": "Леонид Баткин считает, что дело скорее в расставании с ренессансными иллюзиями, когда гротескно-мощная ярость стала жалким сумасбродством, шлем — предметом для личной гигиены, а Баярдо стал... Кем?", "answer": "Росинантом.", "complexity": "", "handout": "0"}, {"number": 50, "text": "Для обложки одного из сольных дисков с исполнением эвергринов своей группы ОН сфотографировался около ржавого остова автомобиля. Назовите ЕГО.", "answer": "Макаревич.", "complexity": "", "handout": "0"}, {"number": 50, "text": "Перед вами — слово из сибирского пиджина. Персонаж популярного итальянского романа, занимавшийся торговлей тем, что это слово означает, в своих путешествиях не раз пересекал Сибирь. Переведите надпись на раздатке с пиджина на русский.", "answer": "Шелк.", "complexity": "", "handout": "1"}, {"number": 50, "text": "Британский журналист Билл Брайсон в книге \"Краткая история почти всего на свете\" пишет, что ЭТО величественное МЕСТО было создано за время, которое уходит на приготовление сэндвича. Назовите ЭТО МЕСТО.", "answer": "Вселенная.", "complexity": "", "handout": "0"}, {"number": 50, "text": "Побывав в гостях у Бориса Тенина, Фаина Раневская была поражена роскошным внутренним убранством и крайне неказистым внешним видом здания. Какое слово она придумала, изменив всего одну букву в существующем термине?", "answer": "Баракко.", "complexity": "", "handout": "0"}, {"number": 50, "text": "В природе ЭТО делают некоторые виды пауков, ос, а иногда и муравьев. Согласно известной шутке, ЭТО предлагает делать песня \"Битлз\". Ответьте двумя словами, что именно делать.", "answer": "Есть пчелу.", "complexity": "", "handout": "0"}, {"number": 50, "text": "В своей неоконченной \"Истории\" Пушкин зачастую оставлял комментарии к собранным документам. Так, просматривая суммы вознаграждения за доставленное властям, Пушкин написал: \"Сам он был странный монарх!\". Назовите одним словом немецкого происхождения место доставки.", "answer": "Кунсткамера.", "complexity": "", "handout": "0"}, {"number": 50, "text": "В Берлине по адресу Унтер ден Линден, 63 в 1942-1944 годах находилось главное здание Имперского министерства оккупированных восточных территорий, а до войны и после нее там располагалось ОНО. Когда накануне Тегеранской конференции спецслужбам стало известно о готовящихся покушениях на глав государств \"большой тройки\", в качестве резиденции Рузвельта было выбрано ОНО, что вызвало возмущение американской общественности. Назовите ЕГО двумя словами.", "answer": "Советское посольство.", "complexity": "", "handout": "0"}, {"number": 50, "text": "Перед вами — работа Андрея Кузнецова из серии \"Чебураки\". Что мы закрыли от вас черным квадратиком?", "answer": "Апельсин.", "complexity": "", "handout": "1"}, {"number": 51, "text": "Во время войны в Институте радио осталось работать всего два человека. Один — пожилой техник, которого не взяли в действующую армию из-за серьезных проблем с сердцем. Догадавшись о небольших изменениях в тексте вопроса, назовите второго человека.", "answer": "Мария Склодовская-Кюри.", "complexity": "", "handout": "0"}, {"number": 51, "text": "Закончите абсолютно точно лозунг Владимира Владимировича к своему спектаклю: \"Дома-коммуны вместо хаты! Массовым действием заменяйте...\".", "answer": "\"... МХАТы\".", "complexity": "", "handout": "0"}, {"number": 51, "text": "Семпроний Азеллион так отзывался о своем современнике, великом понтифике Дивесе Муциане: \"Он обладал пятью главными достоинствами, ибо был человеком очень богатым, очень знатным, очень красноречивым, знатоком права...\". Назовите тремя словами пятое достоинство Дивеса Муциана.", "answer": "Титул великого понтифика.", "complexity": "", "handout": "0"}, {"number": 51, "text": "Согласно энциклопедии мифических существ и духов, ОН, напоминающий мохнатого зверька вроде кошки, по ночам портит волосы людей, шерсть скота и посуду. У Арта Вителло ОН мохнатым отнюдь не был, но нашкодить тоже любил. Парадоксальным образом ЕГО друзьями были... Ответьте тремя словами: кто?", "answer": "Охотники за привидениями.", "complexity": "", "handout": "1"}, {"number": 51, "text": "Назовите город, в котором сделаны эти фотографии.", "answer": "Саратов.", "complexity": "", "handout": "1"}, {"number": 51, "text": "В статье \"Кот\" русской Абсурдопедии утверждается, что есть всего один кот в мире, имеющий дворянскую фамилию. Напишите эту фамилию.", "answer": "Д'Ивуар.", "complexity": "", "handout": "0"}, {"number": 51, "text": "В романе Умберто Эко \"Баудолино\" Фридрих Барбаросса крайне возмущается тем, что Кремона, Бергамо, Пьяченца, Венеция, Тревизо, Падуя и ряд других итальянских городов вступили в сговор с целью противостоять империи. С особым негодованием он встречает известие об участии в коалиции ЭТОГО города, в котором будто бы только благодаря Барбароссе профессора стали обирать студентов. Назовите ЭТОТ город.", "answer": "Болонья.", "complexity": "", "handout": "0"}, {"number": 52, "text": "После столичных беспорядков 2005 года Николай Сванидзе отметил, что европейцам еще придется найти золотое сечение политкорректности и здравого смысла, или их ждет \"Мечеть...\". Закончите прогноз Сванидзе двумя словами.", "answer": "\"... Парижской Богоматери\".", "complexity": "", "handout": "0"}, {"number": 52, "text": "Назовите фамилию человека, для доступа к поваренным книгам которого требуется не только доступ в национальную библиотеку Франции, но и заявление об отказе от претензий, а также соответствующая спецодежда.", "answer": "Кюри.", "complexity": "", "handout": "0"}, {"number": 52, "text": "Некоторые из вас любят бардовские песни, некоторые знают о легендарном барде Оссиане, а многие были уверены, что знакомы с его творчеством. А вот произведения Крестьянского, или Эрширского барда большинство из вас любит благодаря отнюдь не барду, родившемуся в 1887 году. Назовите этого \"не барда\".", "answer": "Самуил Маршак.", "complexity": "", "handout": "0"}, {"number": 52, "text": "Внимание, в вопросе есть замены.\nПервым эпиграфом к конспекту урока по русской литературе учитель из Великого Новгорода Ольга Матвейчук дала слова Николая Страхова: \"НЕКРАСИВАЯ картина человеческой жизни. НЕКРАСИВАЯ картина тогдашней России. НЕКРАСИВАЯ картина того, в чем люди полагают свое счастье и величие, свое горе и унижение\". Слова второго эпиграфа к этому же уроку — \"Дребедень многословная...\" — принадлежали УРОДЛИВОМУ. Мы не спрашиваем вас, какое слово мы заменили на \"НЕКРАСИВАЯ\". Ответьте, кого мы заменили на УРОДЛИВОГО.", "answer": "Лев Николаевич Толстой.", "complexity": "", "handout": "0"}, {"number": 52, "text": "Заказывая \"Лесенку\", читатель таганрогской библиотеки имел в виду произведение немца. Впрочем, сегодня гораздо больше на слуху однофамилица этого немца. Мы не спрашиваем вас, что недавно принесло этой однофамилице известность у нас. Назовите ее имя и фамилию.", "answer": "Дорис Лессинг.", "complexity": "", "handout": "0"}, {"number": 52, "text": "Бертран Рассел писал, что в основе мощного централизованного государства лежали римские армии, римское право, римские чиновники и ОНИ. Назовите ИХ.", "answer": "[Римские] дороги.", "complexity": "", "handout": "0"}, {"number": 52, "text": "Авторы передачи \"Следствие по делам хищников\" пришли к выводу, что толчком к смене рациона для танзанийских львов-людоедов стала ОНА. Назовите поэта, который посвятил ЕЙ оду.", "answer": "Роберт Бернс.", "complexity": "", "handout": "0"}, {"number": 53, "text": "Под конец жизни ОН становился всё более и более эксцентричным и непостоянным. В связи с этим популяризатор науки Пол Стразерн сказал, что решение американской группы оказалось весьма точным. Мы не спрашиваем вас, о каком решении идет речь. Назовите ЕГО фамилию.", "answer": "Менделеев.", "complexity": "", "handout": "0"}, {"number": 53, "text": "В разговоре о том, когда же, наконец, швейцарец станет ходить в ИКСЕ, пользователь одного специализированного форума предположила, что ИКС он бы только примерил, а потом убрал бы: уши уж больно хороши. Назовите ИКС двумя словами.", "answer": "Большой шлем.", "complexity": "", "handout": "0"}, {"number": 53, "text": "Став канцлером, Ангела Меркель распорядилась повесить в своей резиденции портрет этой соотечественницы. Назовите ее.", "answer": "Екатерина II.", "complexity": "", "handout": "0"}, {"number": 53, "text": "В названии московской компании, предоставляющей услуги по ИКСУ, дважды присутствует слово, в переводе с английского означающее \"высший, ведущий\". Согласно шутке одного сайта, из ИКСА, если поменять ударения, получится прекрасный французский писатель. Назовите ИКС двумя словами.", "answer": "Ремонт обуви.", "complexity": "", "handout": "0"}, {"number": 53, "text": "Внимание, в вопросе есть замены.\nПышная церемония, проведенная на городской площади 7 февраля 1497 года, когда публично были сожжены ценности и предметы роскоши, конфискованные у граждан Флоренции по наущению религиозного реформатора Джироламо Савонаролы, получила название \"Костер НЕПОЛНОЦЕННОСТИ\". Но гораздо известнее \"КОМПЛЕКС НЕПОЛНОЦЕННОСТИ\" 1846 года. Какие два слова мы заменили на \"КОМПЛЕКС НЕПОЛНОЦЕННОСТИ\"?", "answer": "Ярмарка тщеславия.", "complexity": "", "handout": "0"}, {"number": 53, "text": "\"Ярко своеобразные люди встречались, конечно, всегда и всюду. Надо предполагать их даже в палеолите, иначе мы бы...\". Закончите, хотя бы приблизительно, высказывание историка Леонида Баткина.", "answer": "\"... до сих пор там и оставались\".", "complexity": "", "handout": "0"}, {"number": 53, "text": "Внимание, в вопросе есть замена.\nРассказывают, будто бы по рекомендации директора свердловского рок-клуба часть копий альбома распространялась в укороченном виде из-за РОБКИХ. Какое слово мы заменили словом \"РОБКИЕ\"?", "answer": "Скованные.", "complexity": "", "handout": "0"}, {"number": 54, "text": "Специалисты из Центра исследований спортивных катастроф и травм Университета Северной Каролины составили рейтинг самых опасных видов спорта для женщин. К их удивлению, гимнастика заняла лишь третье место. На втором месте оказался хоккей с мячом, а на первое вырвался ЭТОТ вид спорта. Интересно, что изначально он вообще не был травматичным, но с тех пор, как перестал выполнять сугубо сервисные функции, травматичность растет. Назовите ЭТОТ вид спорта.", "answer": "Черлидинг.", "complexity": "", "handout": "0"}, {"number": 54, "text": "Историк Андре Боннар, рассуждая об истоках геометрии, упоминает периодическое природное явление. Этому явлению посвящен эфиопский \"Праздник Слезы\", отмечаемый в середине июня. Назовите это явление.", "answer": "Разлив Нила.", "complexity": "", "handout": "0"}, {"number": 54, "text": "Забравшись в художественную галерею Galleri MGM в Осло, воры весьма своеобразно поступили с работой \"Относительная стоимость\" норвежского художника Яна Кристенсена. Стоимость картины составляла около 16300 долларов без учета холста и клея. Однако грабители не вынесли ее из музея. А что же они с ней сделали?", "answer": "Ободрали.", "complexity": "", "handout": "0"}, {"number": 54, "text": "По словам Павла Пепперштейна, у ПЕРВОГО ребенок из хорошей семьи падал на дно, заселенное ошметками социума, а у ВТОРОГО ребенок из хорошей семьи падал на дно, заселенное ошметками дискурсов. Назовите в правильном порядке этих земляков и современников.", "answer": "Диккенс и Кэрролл.", "complexity": "", "handout": "0"}, {"number": 54, "text": "Астроном Владимир Сурдин пишет, что разброс масс у звезд очень напоминает ему разброс масс у НИХ. Прямо как от МИРА (15 тонн) до МОРА (4 килограмма). Какие слова мы заменили на \"МИР\" и \"МОР\"?", "answer": "Кит и кот.", "complexity": "", "handout": "0"}, {"number": 54, "text": "ОН подогревается посредством медленно текущих реакций окисления. ОН диаметром в 1 метр ежедневно собирает 300-400 граммов трупов. А согласно многим источникам, для ЕГО создания нужны яйца, мука, масло, молоко и сгущенка. Назовите ЕГО одним словом.", "answer": "Муравейник.", "complexity": "", "handout": "0"}, {"number": 54, "text": "4 ноября 1922 года в Лондон отправилась телеграмма, в которой были и следующие слова: \"До Вашего приезда все снова засыпано. Поздравляю\". Кто ее отправил?", "answer": "Говард Картер.", "complexity": "", "handout": "0"}, {"number": 55, "text": "На рекламном плакате, фрагмент которого вы видите перед собой, фигурирует слово греческого происхождения. Напишите это слово с удвоенной согласной.", "answer": "Аллергия.", "complexity": "", "handout": "1"}, {"number": 55, "text": "В газете \"Троицкий вариант\" публикуются шутки на тему неизвестных страниц истории науки. Так, утверждается, что однажды этот великий человек глубокой ночью на спор съел конституцию. Тогда-то он и произнес свою знаменитую фразу, которая на самом деле звучала несколько иначе. Назовите этого человека.", "answer": "Иммануил Кант.", "complexity": "", "handout": "0"}, {"number": 55, "text": "Для характеристики детища постановщика и графика Николая Акимова современники в известном выражении упоминали плакат. Как стало выглядеть измененное выражение?", "answer": "\"Театр начинается с плаката\".", "complexity": "", "handout": "0"}, {"number": 55, "text": "В постмодернистском заголовке рецензии на \"Унесенные призраками\" Хаяо Миядзаки упоминается запах Иеронима Босха и японский ОН. Назовите ЕГО.", "answer": "Дух.", "complexity": "", "handout": "0"}, {"number": 55, "text": "Герой романа Умберто Эко \"Таинственное пламя царицы Лоаны\" страдает амнезией: он прекрасно помнит прочитанные книги, но ничего не может вспомнить о себе самом. Врач сообщает, что у пациента есть супруга. В ответ герой волнуется лишь о том, не произойдет ли некий казус. Какой именно?", "answer": "Не примет ли он жену за шляпу.", "complexity": "", "handout": "0"}, {"number": 55, "text": "На одном из юбилейных вечеров собрались бывшие \"синеблузники\", которые, несмотря на преклонный возраст, пытались построить пирамиду. На протяжении всего действа с актерами, благодаря специальным мешочкам, происходило ЭТО. Что?", "answer": "Из них песок сыпался.", "complexity": "", "handout": "0"}, {"number": 55, "text": "Юная мать души не чаяла в своем первенце, чего нельзя было сказать о немолодом и суровом отце. Персонаж одной шуточной пьесы предполагает, что другой ее персонаж получил прозвище именно в честь упомянутого первенца. Впрочем, прозвище оказывается вовсе не прозвищем, а настоящим отчеством, которое могли бы носить четверо жителей Беотии. Назовите и первенца, и отчество.", "answer": "Фрейд, Эдипович.", "complexity": "", "handout": "0"}, {"number": 56, "text": "Одна из статей, посвященных подготовке запуска первого спутника, называлась так: \"1947-1957. 10 лет от [пропуск] до ПС-1\". ПС-1 — это название первого спутника. Восстановите пропуск тремя символами.", "answer": "V-2.", "complexity": "", "handout": "0"}, {"number": 56, "text": "Перед вами — название варианта игры в шахматы, придуманного чемпионом мира Робертом Фишером. В этом варианте правила в основном совпадают с классическими шахматами, но начальная расстановка фигур выбирается случайным образом. Допишите пять букв, которые мы пропустили в названии этого варианта.", "answer": "andom.", "complexity": "", "handout": "1"}, {"number": 56, "text": "Журнал \"Максим\" публикует воображаемые десктопы известных людей. Так, например, на рабочем столе Александра Маслякова есть задача: \"Проверить ЕГО на чердаке\". Назовите ЕГО, если эта задача могла бы быть и на десктопе, например, Софии Ротару.", "answer": "Портрет.", "complexity": "", "handout": "0"}, {"number": 56, "text": "ЭТО ЧУДОВИЩЕ обитает в непроходимой местности, может задушить, выпить кровь или просто искусать. Широкую известность ОНО приобрело сравнительно недавно, хотя появилось более тридцати лет назад в восточноевропейском городе. ЕМУ даже хотят установить памятник на родине. А как зовут ЭТО ЧУДОВИЩЕ?", "answer": "Йожин (з бажен).", "complexity": "", "handout": "0"}, {"number": 56, "text": "Корни этого заблуждения кроются в том факте, что в 1896 году швейцарскую систему оценок \"перевернули\". Назовите человека, биографы которого не учли этот факт.", "answer": "Альберт Эйнштейн.", "complexity": "", "handout": "0"}, {"number": 56, "text": "Спущенная на воду в 1960 году первая английская атомная подводная лодка открыла новую эпоху в британском кораблестроении. Она не боялась длительных автономных переходов, всплытий в районе Северного полюса и встреч с подводными лодками противника. Какое название унаследовала эта подводная лодка?", "answer": "\"Дредноут\".", "complexity": "", "handout": "0"}, {"number": 56, "text": "В аннотации к книге Жозе Сарамаго \"Двойник\" можно прочитать, что поиски человека, крайне похожего на него, оборачиваются для героя \"доподлинным наваждением, путешествием в самое [ПЕРВОЕ СЛОВО ПРОПУЩЕНО] метафизической [ВТОРОЕ СЛОВО ПРОПУЩЕНО]. Два пропущенных слова составляют название повести, легшей в основу культового фильма. Назовите этот фильм.", "answer": "\"Апокалипсис сегодня\".", "complexity": "", "handout": "0"}, {"number": 57, "text": "Исследователь Горюнков считает, что под маской знакомого нам персонажа скрывается опекун русского морского офицерства и распорядитель работ по созданию флота в Воронеже и Азове Федор Апраксин. Что это за персонаж?", "answer": "Дядька Черномор.", "complexity": "", "handout": "0"}, {"number": 57, "text": "В Америке XIX века женам, жившим отдельно от мужей, давали прозвище, появившееся из-за \"болезни\". Какой?", "answer": "Золотой лихорадки.", "complexity": "", "handout": "0"}, {"number": 57, "text": "Экологи пришли к выводу, что ЭТО способно привести к вымиранию древних ящериц гаттерий, не убив ни одного экземпляра, просто переключив часть X на Y. Назовите ЭТО двумя словами.", "answer": "Глобальное потепление.", "complexity": "", "handout": "0"}, {"number": 57, "text": "Дуплет.\n1. ЭТО ПРОИЗВЕДЕНИЕ было завершено в 1899 году, а в пародии \"Квартета И\" автор закончил ЕГО в среду. Назовите ЭТО ПРОИЗВЕДЕНИЕ.\n2. ОНА появилась в 2000 году, а в пародии \"Квартета И\" у НЕЕ во вторник был субботник. Назовите ЕЕ.", "answer": "1. \"Воскресение\".\n2. Группа \"Пятница\".", "complexity": "", "handout": "0"}, {"number": 57, "text": "В забайкальско-маньчжурском препиджине всех начальников разных уровней, независимо от занимаемых ими должностей, называют ЭТИМ СЛОВОМ. В русском названии французского романа 1878 года ЭТОГО СЛОВА нет, а вот в русских названиях романов 1864 и 1867 годов, написанных тем же автором, — есть. Напишите ЭТО СЛОВО из восьми букв.", "answer": "Капитана.", "complexity": "", "handout": "0"}, {"number": 57, "text": "Очень короткий вопрос. Назовите первый в истории кино мюзикл.", "answer": "\"Певец джаза\".", "complexity": "", "handout": "0"}, {"number": 57, "text": "В романе итальянского писателя Федерико Мочча влюбленные Степ и Джин клянутся друг другу в верности у третьего фонаря на мосту Мильвио, перекинутом через Тибр. Ответьте тремя словами, что они при этом бросают в Тибр.", "answer": "Ключ от замка.", "complexity": "", "handout": "0"}, {"number": 58, "text": "Их координаты — 49 градусов 45 минут южной широты и почти 180 градусов восточной долготы. Назовите это владение Новой Зеландии двумя словами.", "answer": "Острова Антиподов.", "complexity": "", "handout": "0"}, {"number": 58, "text": "Современная наука утверждает, что в каждом из нас есть кое-что от Джона Дальтона. А вот от Курчатова, увы, нет: ведь он умер относительно недавно. Чего же в каждом из нас от Дальтона — миллиард?", "answer": "Атомов.", "complexity": "", "handout": "0"}, {"number": 58, "text": "В аннотации к монографии, вышедшей в Америке, Алексея Васильевича назвали \"величайшим геометром XX века\". Говорят, что очень сложно объяснить неспециалистам, какой рывок в науке сделал Алексей Васильевич. Впрочем, возможно, объясняющие просто не обладают его талантом объяснять сложные вещи простыми словами. Назовите фамилию Алексея Васильевича.", "answer": "Погорелов.", "complexity": "", "handout": "0"}, {"number": 58, "text": "Внимание, в вопросе есть замена.\nВ настоящее время среди судов научного флота России одним из главных поставщиков ценной информации является \"ГЛАВВРАЧ МАРГУЛИС\". Какие слова мы заменили словами \"ГЛАВВРАЧ МАРГУЛИС\"?", "answer": "Академик Иоффе.", "complexity": "", "handout": "0"}, {"number": 58, "text": "Ильич советовал убрать из брошюры конкретизацию случаев, когда \"свободная любовь \"чище брака\", предоставив это искусству. Кому, ушедшему из жизни за четыре года до него, он давал этот совет?", "answer": "Инессе Арманд.", "complexity": "", "handout": "0"}, {"number": 58, "text": "Все вы наверняка видели старые здания, окна первого этажа которых находятся наполовину ниже уровня земли. Амели Пулен хотелось, чтобы там находились некие люди, которые помогали бы таким же скромным, как она, противостоять хамам. Назовите этих людей одним словом.", "answer": "Суфлеры.", "complexity": "", "handout": "0"}, {"number": 58, "text": "Этот скверный второстепенный персонаж произведения, вошедшего в сокровищницу английской литературы, вряд ли может вызывать положительные эмоции. Впрочем, Хорхе Луис Борхес все-таки посвятил ему стихотворение. Назовите этого персонажа.", "answer": "Слепой Пью.", "complexity": "", "handout": "0"}, {"number": 59, "text": "Они появились в Европе в XV веке и были совсем другого, серо-зеленого цвета. Цвет, привычный для нас сегодня, — результат направленной селекции, поскольку в дикой популяции такая мутация маловероятна. Назовите этот цвет абсолютно точно.", "answer": "Канареечный.", "complexity": "", "handout": "0"}, {"number": 59, "text": "Историк Шуньгун разъяснял: \"Сначала у японцев не было вееров, но, увидев, как выглядели комори, веера начали изготовлять\". Назовите любого из воплотивших самого коммерчески успешного \"комори\".", "answer": "Кристиан Бейл.", "complexity": "", "handout": "0"}, {"number": 59, "text": "Старый Анио — Пирр, Эмилиева базилика — Галлия. Как назывался самый распространенный вид сооружений, созданных по вышеуказанному принципу?", "answer": "Триумфальные арки.", "complexity": "", "handout": "0"}, {"number": 59, "text": "Предпоследняя строка стихотворения Сергея Школьника звучит так: \"Увы, на разных вешалках повисли...\". Мы не спрашиваем вас, кто вдохновил поэта на создание этого КОРОТКОГО стихотворения. Перечислите в любом порядке то, что повисло на вешалке.", "answer": "Лицо, одежда, душа, мысли.", "complexity": "", "handout": "0"}, {"number": 59, "text": "Перед вами — стихотворение Иосифа Бродского:\nСверни с проезжей части в полу-\nслепой проулок и, войдя\nв костел, пустой об эту пору,\nсядь на скамью и, погодя,\nв ушную раковину Бога,\nзакрытую для шума дня,\nшепни всего [ПРОПУСК]:\n— Прости меня.\nЗаполните пропуск двумя словами.", "answer": "Четыре слога.", "complexity": "", "handout": "1"}, {"number": 59, "text": "Замечательный поэт Орхан Вели Канык с детства изучал французский язык, что помогло ему создать ставшие классическими переводы Лафонтена. А стихотворные переложения рассказов о НЕМ до сих популярны в народе. Назовите ЕГО.", "answer": "Ходжа Насреддин.", "complexity": "", "handout": "0"}, {"number": 59, "text": "Благодаря переводу Мериме и либретто Скриба в 1850 году состоялась премьера в Комической опере. Правда, развязка теперь наступала в специализированном карлсбадском доме. Какую фамилию носил главный герой в оригинале?", "answer": "Германн.", "complexity": "", "handout": "0"}, {"number": 60, "text": "Исследование, опубликованное в 1999 году сотрудниками психологического факультета Принстонского университета, показало, что, вопреки расхожему мнению, ежедневно количество появляющихся новых ИХ равняется нескольким тысячам. Назовите ИХ словом греческого происхождения.", "answer": "Нейроны.", "complexity": "", "handout": "0"}, {"number": 60, "text": "То, что внутри ядра атома существует нейтрон, Резерфорд предположил еще в 1921 году, однако его коллеге Джеймсу Чедвику потребовалось целых 11 лет, чтобы подтвердить это предположение. Как отмечает историк науки Генри Бурс, в этой задержке есть огромное благо. Что же случилось бы, если бы нейтрон открыли сразу же?", "answer": "Германия успела бы создать атомную бомбу.", "complexity": "", "handout": "0"}, {"number": 60, "text": "Пршебуз — один из городов Чехии, в районе Соколов Карловарского края. Поселение на месте залежей олова получило права города в 1553 году. Сейчас у города есть футбольная команда и даже свой сайт в сети Интернет. Какой показатель для этого города, рекордный для Чехии, равен 78?", "answer": "Число жителей.", "complexity": "", "handout": "0"}, {"number": 60, "text": "Внимание, в вопросе есть замены.\nПрекрасный знаток мировой культуры Алехо Карпентьер писал, что на поиски ИРОНИИ ПАНТЕРЫ отправился однажды прекрасный знаток воскрешаемой эпохи СТРУП. Мы не спрашиваем вас, кого мы заменили на \"СТРУП\". Напишите, что мы заменили на \"ИРОНИЯ ПАНТЕРЫ\".", "answer": "Потерянный рай.", "complexity": "", "handout": "1"}, {"number": 60, "text": "Рассказывая о студийной работе группы \"Калинов мост\", Александр Кушнир приводит прозвище звукорежиссера группы, совпадающее с именем животного из известной сказки. А что это было за животное?", "answer": "Гусь.", "complexity": "", "handout": "0"}, {"number": 60, "text": "На первом ЕГО этаже, занимавшем площадь около девятисот квадратных метров, располагался военный гарнизон, а сам ОН, кроме прочего, был наблюдательным пунктом, поскольку система зеркал позволяла обнаружить неприятеля на значительном расстоянии. Назовите ЕГО двумя словами.", "answer": "Александрийский маяк.", "complexity": "", "handout": "0"}, {"number": 60, "text": "Перед вами — отрывок из романа Жозе Сарамаго \"Воспоминания о монастыре\" в изящном переводе Александры Косс. Заполните пропуски существительным, глаголом и устойчивым выражением из трех слов.", "answer": "\"... треской...\", \"... стрескали...\", \"... за ушами трещало\".", "complexity": "", "handout": "1"}, {"number": 61, "text": "230 нанометров — оранжевый, 200 — синий, 170 — зеленый, 100 — тускнеет, 30 нанометров — конец. Биографию чего мы вам описали?", "answer": "Мыльного пузыря.", "complexity": "", "handout": "0"}, {"number": 61, "text": "Среди ИХ аналогов — индийские kartali, швейцарские chefeli, японские yotsudake, китайские cha pan и турецкие kasik. Игрушечные ОНИ, призванные стимулировать сенсомоторное развитие ребенка, изготовлены в виде пасти бегемота. А когда ОНИ с ручкой, то напоминают маленькие гитары. Назовите ИХ.", "answer": "Кастаньеты.", "complexity": "", "handout": "0"}, {"number": 61, "text": "Однажды Маргарите, урожденной Нарышкиной, приснилось, что ее муж, полковник Ревельского полка, погибнет в каком-то месте со странным названием. Названия на карте не нашли, и решили, что это какой-то маленький городок в Италии. Но сон оказался пророческим, и муж действительно погиб менее чем через год. Напишите название, приснившееся Маргарите.", "answer": "Бородино.", "complexity": "", "handout": "0"}, {"number": 61, "text": "Внимание, в вопросе есть замена.\nТим Бёртон признавался, что ненавидит названия типа \"ХАЛИФ НА ЧАС\": \"Это похоже на татуировку, которую человек наколол, удолбавшись, или на запись в ежегодном школьном альбоме\". Какое название мы заменили на \"ХАЛИФ НА ЧАС\"?", "answer": "\"Бэтмен навсегда\".", "complexity": "", "handout": "0"}, {"number": 61, "text": "Считается, что первые свидетельства о том, что ОН уже задуман, кроются в строках из письма: \"Надо, чтобы мой неизвестный не имел ни малейшего соприкосновения с остальным человечеством, от которого он полностью отделен\". Среди ЕГО прототипов называют американский \"Аллигатор\" и французский \"Plongeur\". Как ОН называется?", "answer": "\"Наутилус\".", "complexity": "", "handout": "0"}, {"number": 61, "text": "Под натиском Сахары саванны превращались в полупустыни, а могучий тропический лес оставлял после себя саванну и заболоченные почвы. Приводя это описание, Игорь Андреев упоминает произведение позапрошлого века. Какое?", "answer": "\"Шагреневая кожа\".", "complexity": "", "handout": "0"}, {"number": 61, "text": "Если ЕГО название переводить, то получится что-то вроде селА Камыши. Забавно, что оригинальное слово во множественном числе, а вот в русском языке ОН в единственном числе. Хотя многие неграмотные журналисты снова, так сказать, восстанавливают справедливость. Назовите ЕГО правильно.", "answer": "Канн.", "complexity": "", "handout": "0"}, {"number": 62, "text": "В фильме \"Австралия\" героиня Николь Кидман в годы Второй мировой войны переезжает из Англии в Австралию — страну с другой природой, необычными животными и настоящими шаманами. В одном из эпизодов она поет песенку из мюзикла. Назовите этот мюзикл.", "answer": "\"Волшебник страны Оз\".", "complexity": "", "handout": "0"}, {"number": 62, "text": "Недавно была опубликована статью под названием \"Про бедную овечку\", где приведен список, в который входят: внедрение каучуконоса Кок-Сагыз в средней полосе; чеканка хлопчатника; значительное увеличение урожайности проса и многое другое. Кому предлагают воздать хвалу за это в статье?", "answer": "Академику Лысенко.", "complexity": "", "handout": "0"}, {"number": 62, "text": "Александр Бенуа, приехавший в 1896 году в Париж, пишет, что ЕГО он в Париже уже не застал. Да и из всех его произведений смог увидеть лишь выставленную в лавке кровать из красного дерева в окружении раковин и ритуальных масок. Назовите ЕГО.", "answer": "Гоген.", "complexity": "", "handout": "0"}, {"number": 62, "text": "В Физико-техническом институте в Брауншвейге хранятся 23 небольшие лампы, которые достаются из-под замкА и включаются всего на 20 минут в году. Ответьте двумя словами, чем является каждая из этих ламп.", "answer": "Эталоном канделы.", "complexity": "", "handout": "0"}, {"number": 62, "text": "Николай Сванидзе указывает, что, как ни парадоксально, власть всегда любила и любит этот жанр и пишущих в этом жанре, а умнейшие из литераторов это понимают. Если вы не верите в это утверждение, то Сванидзе предлагает спросить у НЕГО. Назовите ЕГО имя и фамилию.", "answer": "Сергей Михалков.", "complexity": "", "handout": "0"}, {"number": 62, "text": "В рассказе Леопольдо Лугонеса \"Два великих лунатика, или Полное несходство взглядов\" Гамлет рассказывает Дон Кихоту об Офелии. По его словам, нос у нее был немного вздернутый, юбка довольно короткая, грудь под блузкой совсем незаметна. Офелия якобы умела петь и вышивать, а также была не чужда спорту. А каким именно видом спорта, по слова Гамлета, занималась Офелия?", "answer": "Плаванием.", "complexity": "", "handout": "0"}, {"number": 62, "text": "Внимание, в вопросе есть замены.\nРусская Википедия называет Алабаму \"ДУША ЧЕРНОГО\". ДУША БЕЛОГО, вероятно, была чувствительней, нежели у его предшественников, поскольку он разрешил солдатам своей армии жениться во время службы. Какое слово мы заменили на слово \"БЕЛЫЙ\"?", "answer": "Север.", "complexity": "", "handout": "0"}, {"number": 63, "text": "Действие одной из картин Тима Бёртона происходит в странном доме. Живущие в этом доме супруги после ряда безуспешных попыток прибегают к услугам некоего Бетельгейзе. Интересно, что к его же услугам могла бы прибегнуть и героиня Николь Кидман, а также один британец. А где этот британец проживал?", "answer": "Кентервиль.", "complexity": "", "handout": "0"}, {"number": 63, "text": "Реклама июньской передачи к юбилею на \"Эхе Москвы\" звучала так: \"Узнай [СЛОВО ПРОПУЩЕНО] про [ДВА СЛОВА ПРОПУЩЕНО]\". Восстановите второй пропуск.", "answer": "Наше всё.", "complexity": "", "handout": "0"}, {"number": 63, "text": "Михаил Гаспаров писал, будто бы Василий Розанов обозначал одним сокращением писателя Боборыкина и ЕГО. Назовите ЕГО.", "answer": "Бог.", "complexity": "", "handout": "0"}, {"number": 63, "text": "В 1977 году Польша заявила свои права на эксклюзивное использование этого названия для своей продукции. Однако историк и исследователь Вильям Похлебкин сумел доказать беспочвенность таких заявлений, обнаружив, что в России этот продукт появился на сто лет раньше. Во французском языке названия для русской и польской разновидностей разнятся лишь написанием первой буквы. Напишите эти две разнящиеся буквы.", "answer": "W, V.", "complexity": "", "handout": "0"}, {"number": 63, "text": "Персонажи рассказа \"Приходите, леди Смерть\" составляют приглашение на бал для Смерти. Однако возникает спор о том, как следует титуловать Смерть. Сравняешь смерть с виконтами и баронами — обидится, с королем — слишком уж смело, \"ваша милость\" — отдает лицемерием. Вариант, к которому приходят в итоге персонажи, в русском переводе кажется не совсем уместным, однако для английского языка он совершенно адекватен. Как же обращаются к Смерти герои рассказа, если так могли обращаться, например, к Бекету?", "answer": "Ваше преосвященство.", "complexity": "", "handout": "0"}, {"number": 63, "text": "Сергей Образцов в детстве удивлялся, что отец называл Сусанина прекрасным ЭТИМ человека, ведь Сусанин не святой. Назовите ЭТО.", "answer": "Образ.", "complexity": "", "handout": "0"}, {"number": 63, "text": "На просторах Сети можно найти ИКС в форме свиньи, таксы и даже бутылки. Итальянская фирма Paderno S.r.l. производит настенные ИКСЫ. А художник Андрей Кузнецов придумал и нарисовал джедайский ИКС. Назовите ИКС.", "answer": "Штопор.", "complexity": "", "handout": "0"}, {"number": 64, "text": "Дуплет.\n1. К середине XVI века в Париже было всего несколько карет. Одна из них принадлежала королеве, вторая — одной из заглавных героинь произведения 1848 года. Назовите это произведение.\n2. Как вы уже знаете, к середине XVI века в Париже было всего несколько карет. Третья, по спецразрешению короля, принадлежала страдальцу Раймону де Лавалю, которого можно назвать так же, как и заглавных героев произведения 1924 года. Назовите это произведение.", "answer": "1. \"Две Дианы\".\n2. \"Три толстяка\".", "complexity": "", "handout": "0"}, {"number": 64, "text": "Американцы называют ЭТО словосочетанием \"милуокский зоб\". Словосочетание образовано от названия американского города, выросшего в середине XIX века благодаря переселенцам из европейской страны. Назовите ЭТО двумя словами.", "answer": "Пивной живот.", "complexity": "", "handout": "0"}, {"number": 64, "text": "ОНА упоминается в заглавии статьи об одном из видов полигамии. ЕЕ имя носит вата производства \"Укрвата\" и серия косметики \"Биокон\" для выведения пигментных пятен и веснушек. А однажды автору вопроса встретилась садовая ОНА. Назовите ЕЕ.", "answer": "Белоснежка.", "complexity": "", "handout": "0"}, {"number": 64, "text": "В английской Абсурдопедии в названии этого футбольного клуба фигурирует знак доллара, а вот один из футболистов этого клуба, согласно тому же источнику, является черным джедаем. Назовите этого футболиста.", "answer": "Джон Оби Микел.", "complexity": "", "handout": "0"}, {"number": 64, "text": "Замысел произведения пришел автору в голову на даче, когда он вернулся в ненастный день с прогулки и увидел свою семью в полутемной избе. Назовите это произведение.", "answer": "\"Меншиков в Берёзове\".", "complexity": "", "handout": "0"}, {"number": 64, "text": "ЕГО название — оксюморон. В этом году мы отметили его 90-летие. А шутники утверждают, что ОН — контрольный выстрел в печень. Назовите ЕГО тремя словами.", "answer": "Старый Новый Год.", "complexity": "", "handout": "0"}, {"number": 64, "text": "На карикатуре, опубликованной в журнале \"Итоги\", изображен человек в изрядном подпитии. Вокруг него валяются пустые бутылки из-под шампанского, а человек пытается вытрясти хоть каплю из еще одной. Какие три слова говорит он ей с безнадежным укором?", "answer": "\"И ты, Брют!\".", "complexity": "", "handout": "0"}, {"number": 65, "text": "В произведении \"Ересиарх\" Гийом Аполиннер придумал ересь, в которой считается, что помимо Бога-сына одновременно на земле воплотились Бог-отец и Святой дух. Впрочем, те, кого эта ересь считает воплощениями, известны и из канонической Библии. А вот их земные имена стали известны только из апокрифического евангелия от Никодима, но мы уверены, что их знаете и вы. Назовите эти имена.", "answer": "Дисмас и Гестас.", "complexity": "", "handout": "0"}, {"number": 65, "text": "В ТАКОМ зале лондонского Музея естественной истории (зал открыт только для ученых) — 15 миль полок с образцами животных. А в прошлом году Феррари презентовала ТАКОЙ автомобиль — правда, только в варианте концепта. Какой — ТАКОЙ?", "answer": "Спиртовой.", "complexity": "", "handout": "0"}, {"number": 65, "text": "До начала XIII века пол в китайском доме был основной плоскостью бытовых действий, но с распространением использования стульев и стола положение изменилось, и некое правило поведения перестало действовать. В чем оно заключалось?", "answer": "Снимать обувь перед входом в дом.", "complexity": "", "handout": "0"}, {"number": 65, "text": "Закончите двумя словами четверостишие, размещенное на главной страничке сайта одной мастерской:\nНе буду вкусно кушать,\nне стану длинно спать,\nслабаю вам обувку —\nкрутую!..", "answer": "Твою мать.", "complexity": "", "handout": "0"}, {"number": 65, "text": "Видимо, по следам красавицы по имени Икуку и старухи из загадочного места Иргиль сайт dvddom.ru вписал в название этого фильма Никиту Сергеевича, а на обложке упомянул рать, кровать, спать и мать. Как называется этот фильм в оригинале?", "answer": "\"Миллионер из трущоб\".", "complexity": "", "handout": "0"}, {"number": 65, "text": "Как вы уже знаете, во время подготовки к экспедиции на \"Тигрисе\" было внесено предложение восстановить Вавилонскую башню. Следующим шагом в этом \"восстановлении\" должно было стать открытие школы. Чему, появившемуся в конце позапрошлого века, там должны были обучать?", "answer": "Эсперанто.", "complexity": "", "handout": "0"}, {"number": 65, "text": "Персонаж скетч-шоу приходит устраиваться охранником. На собеседовании ему задают вопросы, например, просят назвать столицу экзотической страны. После успешных ответов ему говорят, что он принят на работу, и дают пачку ИХ. Назовите ИХ словом, заимствованным из английского языка.", "answer": "Кроссворд(ы).", "complexity": "", "handout": "0"}, {"number": 66, "text": "На картинке, которую вы видите перед собой, лишь 5 из 626. Их создатель, Джон Стоукс, из соображений сохранности рекомендует свои работы только коллекционерам. Коллекционерам чего?", "answer": "Пазлов.", "complexity": "", "handout": "1"}, {"number": 66, "text": "На музыкальном канале A1 [эй уан] существует передача, в которой вымышленный ведущий встречается в студии с умершими людьми. Эта передача называется \"Мир и [Пропуск]\", где Пропуск — ветхозаветное имя ведущего. Восстановите это имя.", "answer": "Ной.", "complexity": "", "handout": "0"}, {"number": 66, "text": "Физик Митио Каку считает, что первым описанием ЭТОГО в фантастической литературе стал случай из Деяний Апостолов, когда апостол Филипп попал в филистимлянский город Азот. ЭТО сейчас научились делать и ученые, для чего используется феномен квантовой запутанности. Назовите ЭТО.", "answer": "Телепортация.", "complexity": "", "handout": "0"}, {"number": 66, "text": "Воспроизведите два слова, пропущенные в обеих цитатах.", "answer": "Кроме Бога.", "complexity": "", "handout": "1"}, {"number": 66, "text": "Рассуждая о фильме \"Ангелы и демоны\" и отмечая, что главный герой в нем много бегает, кинообозреватель сайта Infox.ru [инфокс ру] упоминает заглавного персонажа американского романа 1986 года. Назовите имя и фамилию этого персонажа.", "answer": "Форрест Гамп.", "complexity": "", "handout": "0"}, {"number": 66, "text": "Внимание, вопрос c заменами.\nВ пародии \"Камеди-клаба\" две старушки вспоминают \"БЕВЕРЛИ ХИЛЛЗ 90210\". Его разместили возле атомной станции, а одним из победителей стала красная трехметровая собака. Какое слово мы заменили на \"БЕВЕРЛИ ХИЛЛЗ\" и какое число — на 90210?", "answer": "Дом, 666.", "complexity": "", "handout": "0"}, {"number": 66, "text": "Этот футбольный клуб Бундеслиги до сих пор не имеет официального талисмана, хотя уже несколько лет маскотом хотят выбрать одного из НИХ, но никак не решат, кого именно \"канонизировать\". Назовите этот футбольный клуб.", "answer": "\"Вердер\".", "complexity": "", "handout": "0"}, {"number": 67, "text": "ЭТО ОРУЖИЕ разработано в Московском институте теплотехники. По мнению журнала \"Максим\", по первоначальному замыслу, в результате его применения враг должен был погибать от аллергии, но впоследствии боевую часть заменили на еще более разрушительную. Назовите ЭТО ОРУЖИЕ.", "answer": "Ракетный комплекс \"Тополь\".", "complexity": "", "handout": "0"}, {"number": 67, "text": "Анекдот из мира науки. Встречаются два бывших одноклассника. Один ученый, другой — новый русский. Новый русский спрашивает, как дела. Ученый отвечает: просто замечательно, только что опубликовал свою лучшую работу! Новый русский задает вопрос и получает ответ: \"А ты откуда знаешь?\". Воспроизведите вопрос нового русского.", "answer": "В натуре?", "complexity": "", "handout": "0"}, {"number": 67, "text": "Церковь Святого Николая, находящаяся ТАМ, называется русской по традиции: среди ее прихожан русских нет, а служба идет на английском языке. Не отличавшаяся особыми внешними данными Кортни Лав смогла заработать нормальные деньги стриптизом только ТАМ. Где именно?", "answer": "На Аляске.", "complexity": "", "handout": "0"}, {"number": 67, "text": "Алексей Герман, комментируя решение интернационального жюри, сказал: \"Когда ИКС плывет на большой рыбе, это вовсе не означает, что это про рыбу: это что-то про меня. И ИГРЕК — это вовсе не то, что он задымил пленку. Это тоже про меня. Это какие-то сны. И это — чудо\". Какие слова мы заменили на \"ИКС\" и \"ИГРЕК\"?", "answer": "Ежик, туман.", "complexity": "", "handout": "0"}, {"number": 67, "text": "Перед вами — иллюстрация к анонсу спектакля \"Двенадцатая ночь\". Человека, который сделал эту постановку возможной, зовут Джеймс Грант Бентон. Что же он сделал?", "answer": "Перевел Шекспира на пиджин-инглиш.", "complexity": "", "handout": "1"}, {"number": 67, "text": "Историк Михаил Андреев пишет: средневековая мысль о том, что деньги, данные жонглеру, украдены у бедняка, была невозможна в предыдущую эпоху, когда господствовало двуединство. Назовите оба компонента этого двуединства.", "answer": "Хлеб и зрелища.", "complexity": "", "handout": "0"}, {"number": 67, "text": "Алехо Карпентьер считал, что Дон Кихот был бы вполне современным персонажем и в двадцатом веке, будучи вовлеченным в процесс непонимания порядка вещей в мире, лишь обманчиво выступающем как послушная реальность. Ответьте-ка, какого литературного героя сравнил с Дон-Кихотом Карпентьер. Надеемся, что внимательность поможет вам сделать это без особых усилий.", "answer": "К.", "complexity": "", "handout": "0"}, {"number": 68, "text": "По ЕГО собственным словам, в связи с кризисом в ЕГО профессиональной среде всё уменьшается, поэтому следующая ЕГО работа будет называться \"Новая Зеландия\". А заметка в газете \"Коммерсант\", посвященная ЕМУ, называется \"ОН дал маху\". Какие четыре буквы в заглавии заметки мы пропустили?", "answer": "Росо.", "complexity": "", "handout": "0"}, {"number": 68, "text": "Константин Юон в начале 40-х писал: преимущество ЭТОГО заключается в том, что в руках мастера ЭТО становится искусством, будучи в то же время всегда документом. Назовите ЭТО.", "answer": "Фотография.", "complexity": "", "handout": "0"}, {"number": 68, "text": "Говоря об актрисе, в шутку описывали следующую ситуацию: \"Перед театром остановилась ТАКАЯ карета, и из нее вышла Сара Бернар\". А судейская коллегия примет от вас только ТАКОЙ ответный носитель. Время!", "answer": "[Пустая ответная карточка.]", "complexity": "", "handout": "0"}, {"number": 68, "text": "Доктор филологических наук Всеволод Сахаров считает, что первым нашим исследователем эмигрантской литературы стал писатель и композитор. Кого он так охарактеризовал?", "answer": "Ивана Грозного.", "complexity": "", "handout": "0"}, {"number": 68, "text": "Марко Поло свидетельствует, что монгольские воины в случае необходимости питались исключительно ЭТИМ. Для транспортировки ЭТОГО у воина всегда была пара десятков жеребцов и кобыл. Назовите ЭТО двумя словами.", "answer": "Лошадиная кровь.", "complexity": "", "handout": "0"}, {"number": 68, "text": "Когда Бернарда Шоу спросили, какие пять книг он взял бы на необитаемый остров, он ответил, что хотел бы взять с собой пять ТАКИХ книг. ТАКАЯ книга вышла в США в 1974 году с подзаголовком \"Лучшая насмешка над ничтожными книгами\". По-видимому, книга пользовалась успехом, потому что в конце того же года вышло второе издание. Приведите основное содержание ТАКИХ книг.", "answer": "[Пустая ответная карточка.]", "complexity": "", "handout": "0"}, {"number": 68, "text": "Как вы уже знаете, в \"Сказке о рыбаке и репке\" смешиваются различные сказочные и не очень сюжеты. Так, старуха мечтает родить 33 богатырей, а рожает и не сына, и не дочь. Ответьте, кого или что она рожает. Подскажем, что помог ей в этом горец.", "answer": "\"Черноморец\".", "complexity": "", "handout": "0"}, {"number": 69, "text": "Финальную часть песни можно перевести с английского примерно так: \"Я борец, и я одинок. Я вышел из трущоб, не имея ничего, я подоил пуговицу, я погладил всех своих людей и заморозил Никсона\". А чему эта песня была посвящена?", "answer": "81-й церемонии награждения премии \"Оскар\".", "complexity": "", "handout": "0"}, {"number": 69, "text": "Сергей Дмитриевич Полторацкий, известный книголюб и библиограф, был весьма эксцентричным человеком. Так, к примеру, он подписывал свои письма оригинальным способом — не меняя общего звучания, сокращал написание до девяти символов. Воспроизведите первые четыре из них.", "answer": "1 1/2.", "complexity": "", "handout": "0"}, {"number": 69, "text": "Сигизмунд Кржижановский в своих киевских лекциях 1916 года делил авторов на преобразующих земное в запредельное и наоборот. Среди приведенных Кржижановским примеров самыми известными являются двое современников. Назовите их псевдонимы.", "answer": "Андрей Белый и Саша Черный.", "complexity": "", "handout": "0"}, {"number": 69, "text": "Сначала Карл был нерадивым учеником, но после угрозы отца отдать его в сапожники из-за книг больше не вылезал и занимался только учебой. Да и впоследствии Карл очень гордился своей ученостью и всячески ее выпячивал. Любопытно, что сам он именовал себя ИХ царем. Назовите ИХ.", "answer": "Ботаники.", "complexity": "", "handout": "0"}, {"number": 69, "text": "Заполните пропуски в стихотворных строках Ильи Сельвинского:\nИскусство делится на две струи.\nНа царство бриза и царство фурий.\nПрозрачная гладь — с одной стороны,\nС другой — одержимость бурей.\nТак и плывут эти струи досель,\nПочти не сливаясь, но профилем вровень,\nМоцарт, Пушкин и [пропуск],\nШекспир, Микеланджело и [пропуск].", "answer": "Рафаэль, Бетховен.", "complexity": "", "handout": "0"}, {"number": 69, "text": "Некоторые механические наручные часы снабжены поворотным кольцом с делениями — люнетом. Люнет служит для засекания времени. Назовите специалистов, которые пользуются часами, в которых люнет крутится только против часовой стрелки.", "answer": "Водолазы.", "complexity": "", "handout": "0"}, {"number": 69, "text": "Заглавный герой пьесы Шмитта \"Распутник\" беседует с двумя женщинами. Одна из них заявляет, что ее впервые в жизни сравнивают с ведром. Назовите француза, которого непосредственно перед этой репликой упоминает герой.", "answer": "Буридан.", "complexity": "", "handout": "0"}, {"number": 70, "text": "В эпоху Средневековья ОНА иногда использовалась как эквивалент 2000, а позднее ЕЕ вид приводил в трепет, вселял надежду и разжигал страсть. Изобразите ЕЕ в своих ответах.", "answer": "Z.", "complexity": "", "handout": "0"}, {"number": 70, "text": "Изданная в Германии детская карта Европы испещрена множеством забавных рисунков. Например, Ливерпуль обозначает группа \"Битлз\", а территорию Румынии украшают чеснок и осиновый кол. В списке украинских \"достопримечательностей\" первое место занимает целая композиция: человек, несколько предметов, животные, растения. Обозначено всё это одним словом из десяти букв. Мы не просим вас написать это слово правильно — напишите, как сможете.", "answer": "Борщ.", "complexity": "", "handout": "0"}, {"number": 70, "text": "Впервые этот термин появился в русском языке в 1932 году. Именно поэтому вариант перевода на русский был выбран не совсем удачно: в те време

го мы заменили на ПАНА?", "answer": "Лира.", "complexity": "", "handout": "0"}, {"number": 12, "text": "Джон Мильтон в своей эпиграмме 1625 года спрашивал:\n\"Уж не мечтал ли ты, зверь, в берлоге своей семихолмной\nЭтим путем короля на небеса вознести?\".\nКакое изобретение дало название описанному событию?", "answer": "Порох.", "complexity": "", "handout": "0"}, {"number": 12, "text": "Генерал Ермолов назвал ЕГО огромной крепостью, защищаемой полумиллионным гарнизоном. Назовите ту его точку, которая имеет наивысшие характеристики.", "answer": "Эльбрус.", "complexity": "", "handout": "0"}, {"number": 12, "text": "Астрономы из Рокфеллерского университета на основе имеющегося детального описания звезд и небесных явлений сумели установить, что трагедия случилась 17 апреля 1178 года до нашей эры. Все убитые были ИКСАМИ. Команда КВН \"ИКСЫ из Ташкента\" недавно отпраздновала свое двадцатилетие, что ставит под сомнение тот факт, что все ее члены — до сих пор ИКСЫ. Кто же такие ИКСЫ?", "answer": "Женихи.", "complexity": "", "handout": "0"}, {"number": 13, "text": "В 2008 году в Епархиальном музее ЭТОГО ГОРОДА в присутствии Папы Римского открылась постоянная выставка. Экспозиция представляла собой огромные ткани цвета индиго, расписанные религиозными сюжетами в XVI веке. Назовите ЭТОТ ГОРОД.", "answer": "Генуя.", "complexity": "", "handout": "0"}, {"number": 13, "text": "На самом деле ОНА так и не стала царицей по-настоящему, а умерла через две недели после свадьбы, так что современный источник явно грешит против истины. Вам вряд ли известна ЕЕ фамилия, зато хорошо известны имя и отчество. Назовите их.", "answer": "Марфа Васильевна.", "complexity": "", "handout": "0"}, {"number": 13, "text": "Первая открытая публикация состоялась 16 марта 1956 года. Правда, тогда \"New York Times\" пересказала всё \"своими словами\". Полное и точное ЕГО содержание опубликовал Госдепартамент США 4 июня того же года. Первая же публикация в СССР состоялась в 1989 году в журнале \"Известия ЦК КПСС\". Назовите ЕГО.", "answer": "Доклад Хрущева о культе личности.", "complexity": "", "handout": "0"}, {"number": 13, "text": "От обеих этих тезок мы неоднократно слышали одно и то же короткое слово. Старшая в результате получила \"Золотой Остап\" и \"Тэфи\", младшая ограничилась 11-м местом. Многие зрители после выступления младшей признались, что на ум упорно шли слова Любови, обращенные к старшей. Назовите фамилии старшей и младшей.", "answer": "Заворотнюк, Приходько.", "complexity": "", "handout": "0"}, {"number": 13, "text": "Рассказывая об Испании в период освоения Южной Америки, когда казна страны получала громадные средства из колонизируемых земель и вкладывала всё в ведение войны, Аркадий Локерман упоминает ЕЕ. Согласна ряду сонников, ОНА символизирует сексуально-ненасытную женщину. Назовите ЕЕ двумя словами, начинающимися на одну и ту же букву.", "answer": "Бездонная бочка.", "complexity": "", "handout": "0"}, {"number": 13, "text": "Один абитуриент на вступительном экзамене по истории на вопрос \"Что ЭТО такое?\" ответил, что ЭТО — буддийская церемония. Впрочем, в том, что ЭТО церемония, он был прав. А вот происходит название ЭТОГО от слова со значением \"человек\" — то есть вверение себя, как человека. Назовите ЭТО.", "answer": "Оммаж.", "complexity": "", "handout": "0"}, {"number": 13, "text": "По воспоминаниям Николая Караченцова, во время подготовки премьеры \"Юноны и Авось\" приходилось проводить особые репетиции. Эти репетиции назывались так, что можно подумать, что в них принимал участие лидер современной группы. Какой? Мы примем любой из двух вариантов ответа.", "answer": "\"Ленинград\".", "complexity": "", "handout": "0"}, {"number": 13, "text": "Николай Акимов с грустью замечал, что в трудные для комедии времена стрелы сатирика приобретали свойства других предметов. Каких?", "answer": "Бумерангов.", "complexity": "", "handout": "0"}, {"number": 13, "text": "После завершения суда над создателями Pirate Bay писатель Кирилл Еськов грустно пошутил, что ЕМУ и его изобретению крупно повезло — в наше время ОН получил бы иск от гильдии монахов за недополученную выгоду. Назовите ЕГО.", "answer": "Гутенберг.", "complexity": "", "handout": "0"}, {"number": 13, "text": "Старик из юкагирской сказки встретил женщину, на которой решил жениться. Улыбнулся старик женщине, та ему в ответ улыбнулась. Решил старик, что понравился он женщине, и отдал ей все свои деньги. Не станем спрашивать, почему женщина после этого пропала. Назовите персонажа написанной в 1963 году сказки, заблуждавшегося точно так же, как и этот старик.", "answer": "Крошка Енот.", "complexity": "", "handout": "0"}, {"number": 14, "text": "[Видеовопрос! Вопрос задает Борис Грачевский.]\nА вы знаете, каким образом появился на свет журнал \"Ералаш\"? В 1974 году Алла Сурикова, ныне известный режиссер, а тогда студентка Высших режиссерских курсов, написала письмо в Госкино СССР. \"У взрослых есть свой сатирический киножурнал, а у детей нет, и это плохо\", — писала она. Так и появился наш журнал, а название \"Ералаш\" придумала дочка сценариста Александра Хмелика. Изначально Алла Сурикова предлагала другое название для детского журнала, но оно не понравилось Сергею Михалкову. Скажите, что это за название.", "answer": "\"Фитилек\".", "complexity": "", "handout": "0"}, {"number": 14, "text": "Японский самолет Aichi B7A Ryusei создавался как палубный торпедоносец. Однако, поступив в императорские войска в январе 1945 года, самолет использовался только с наземных аэродромов. Почему Aichi B7A использовался столь нерационально?", "answer": "К тому времени у японцев не осталось действующих авианосцев.", "complexity": "", "handout": "0"}, {"number": 14, "text": "В книге \"Письма в Кейптаун о русской поэзии\" публицист Кобрин рассуждает о современном русском поэтическом мэйнстриме. Он отмечает, что генеалогия этого мэйнстрима включает в себя по культурно-поэтической склонности либо Мандельштама, либо Ходасевича. А перед подачей автор предлагает припудрить мэйнстрим пыльцой с раздавленных... Кого и чьих?", "answer": "Бабочек Набокова.", "complexity": "", "handout": "0"}, {"number": 14, "text": "Самый известный из них получил в 1938 году швейцарский химик. Вот его формула. А их общее название говорит о том, что они должны нечто сделать явным. А что именно?", "answer": "Душу.", "complexity": "", "handout": "1"}, {"number": 14, "text": "У барда Леонида Сергеева есть песня о шоке советского туриста, побывавшего в НЕМ, хотя сначала всё было \"внутренне и внешне хорошо\". А в июне 2009 года ОН под названием \"Ромео и Джульетта\" открылся в Страдфорде-на-Эйвоне. Назовите ЕГО.", "answer": "Секс-шоп.", "complexity": "", "handout": "0"}, {"number": 14, "text": "В литературном первоисточнике его сперва хотят назвать Мафусаилом, а на одном рекламном плакате его имя и фамилия написаны справа налево. Назовите его имя и фамилию.", "answer": "Бенджамин Баттон.", "complexity": "", "handout": "0"}, {"number": 14, "text": "Внимание, в вопросе есть замена.\nОдин лимерик начинается так: \"Жил да был один КРОКОДИЛ, // Он в коробку жену посадил\". Газета \"Киевские ведомости\" упоминает КРОКОДИЛА в заголовке статьи о диггерах. Какое слово мы заменили на \"КРОКОДИЛ\"?", "answer": "Клаустрофил.", "complexity": "", "handout": "0"}, {"number": 14, "text": "Как мы уже знаем, в своей эпиграмме\n\"Уж не мечтал ли ты, зверь, в берлоге своей семихолмной\nЭтим путем короля на небеса вознести?\"\nМильтон имел в виду вполне конкретное событие. Кстати, и обращался он к вполне конкретной личности. Кто сегодня занимает место адресата Мильтона?", "answer": "Бенедикт XVI.", "complexity": "", "handout": "0"}, {"number": 14, "text": "С Останкинской телебашней ЭТО в среднем случается 30 раз в год. Причем всего два раза из тридцати — по направлению В, а остальные — по направлению ИЗ. Назовите ЭТО.", "answer": "Удар молнии.", "complexity": "", "handout": "0"}, {"number": 14, "text": "Искусствоведы шутят, что ОН однажды заказал Леонардо вылепить скульптуру, изображающую ЕГО верхом, а тот в это время изобретал. В итоге Леонардо совместил занятия, а ОН получил свое прозвище. Назовите ЕГО и ЕГО прозвище.", "answer": "Лоренцо Великолепный.", "complexity": "", "handout": "0"}, {"number": 15, "text": "Согласно исламской легенде, архангел Джебраил заплакал от сострадания, когда Адам и Ева покидали райский сад. Слезы архангела упали на его посох, который тут же пустил побеги и дал плоды. Увидев эти плоды, дьявол напустил на них порчу и лишил благодати. Назовите эти плоды.", "answer": "Виноград.", "complexity": "", "handout": "0"}, {"number": 15, "text": "Около 1960 года автор создал вторую версию своего произведения. Факт этот известен, но даже специалистам непросто различить версии при исполнении. Назовите фамилию автора.", "answer": "Кейдж.", "complexity": "", "handout": "0"}, {"number": 15, "text": "Социологи Мичиганского университета пришли к выводу, что ЭТО отрицательно влияет на состояние окружающей среды. Ведь обычно после ЭТОГО количество работающих телевизоров, холодильников и газовых плит увеличивается на единицу. Любопытно, что по статистике чаще всего ЭТО случается в январе. Назовите ЭТО.", "answer": "Развод.", "complexity": "", "handout": "0"}, {"number": 15, "text": "На одном из сайтов в разделе, посвященном карнавальным костюмам, для ЕЕ изготовления рекомендуется использовать пятилитровую пластиковую бутылку. В экстренном случае специалист может передавать с ЕЕ помощью информацию со скоростью 60-80 знаков в минуту. Назовите ЕЕ.", "answer": "Бескозырка.", "complexity": "", "handout": "0"}, {"number": 15, "text": "Недавние исследования показали, что скорость увеличения ЭТОГО отчасти зависит от того, как часто мужчина думает о сексе. Один из известнейших книжных злодеев о сексе наверняка думал часто: ведь, согласно тексту произведения, только мыслями у него всё и ограничивалось. Назовите ЭТО.", "answer": "Борода.", "complexity": "", "handout": "0"}, {"number": 15, "text": "Персонаж Дианы Уинн Джонс, девушка по имени Софи Хаттер, за работой разговаривает с ИКСАМИ. Для формирования ИКСОВ используются зажимное и ударное устройства. Назовите ИКС шестью буквами.", "answer": "Шляпка.", "complexity": "", "handout": "0"}, {"number": 15, "text": "Небольшое углубление в кратере Гусева, в котором марсоход \"Spirit\" должен был находиться в промежутке времени между \"приземлением\" на красной планете и полной проверкой всех систем, то есть фактически отдыхать, получило такое же название, как и фильм 1999 года, ставший экранизацией классического американского произведения. Назовите автора этого произведения.", "answer": "Вашингтон Ирвинг.", "complexity": "", "handout": "0"}, {"number": 15, "text": "Гамбургской железной дороге Вундерленд принадлежит несколько рекордов. Например, число курсирующих по ней поездов превышает десять тысяч, а длина ее колеи составляет восемьсот километров. В одном из слов этого вопроса три буквы — лишние. Напишите эти буквы.", "answer": "сот.", "complexity": "", "handout": "0"}, {"number": 15, "text": "В знаменитом комплексе мавзолеев Шахи-Зинда, помимо мавзолея Кусама-ибн-Аббаса, а также нескольких мавзолеев жен и дочерей Тимура, есть два мавзолея ТАКИХ. ТАКИЕ есть и у каждого из нас. А между чем и чем они находятся?", "answer": "Между средним и мизинцем.", "complexity": "", "handout": "0"}, {"number": 15, "text": "В финале фильма Клода МиллЕра \"Малышка Лили\" герой, ставший режиссером, снимает кино с героиней в главной роли — кино о своей драматичной любви с самоубийством в конце. По словам Клода МиллЕра, это отклонение от НЕЕ вызвано веяниями современности и нежеланием создавать рядовую экранизацию. Назовите еще одну знаменитую ЕЕ, которая перед, так сказать, \"премьерой\" предложила небу снять шляпу.", "answer": "Валентина Терешкова.", "complexity": "", "handout": "0"}, {"number": 16, "text": "Обложку первого номера периодического издания, впервые вышедшего в 1933 году, украшали шесть фотографий, посвященных главным событиям. Что это за издание?", "answer": "\"Newsweek\".", "complexity": "", "handout": "0"}, {"number": 16, "text": "Интересные бывают совпадения. Назовите английского литератора, который серьезно интересовался фокусами и давал представления под именем Несравненного Чернокнижника Риа Рама Росса.", "answer": "Диккенс.", "complexity": "", "handout": "0"}, {"number": 16, "text": "Японские ножи янаги-ба, используемые для приготовления суши, затачиваются с одной стороны. Это позволяет нарезАть рыбу слоями не толще рисовой бумаги. Ножи имеют две модификации, которые не различаются ни размерами, ни дизайном. Назовите две категории людей, для которых они предназначены.", "answer": "Правши, левши.", "complexity": "", "handout": "0"}, {"number": 16, "text": "\"Не сама ли Франция, потерпевшая катастрофу, но не потерявшая надежды, гонимая бурей истории?!\" — так размышлял молодой Делакруа. Рядом с чем он при этом находился?", "answer": "С картиной \"Плот \"Медузы\"\".", "complexity": "", "handout": "0"}, {"number": 16, "text": "После появления в советской печати рисунка, на котором мужчина с неестественно скрученными ногами говорит: \"Маша, нырни, пожалуйста, на минутку!\", один из типовых проектов был изъят из обращения. А что высмеивалось в этой карикатуре?", "answer": "Совмещенный санузел.", "complexity": "", "handout": "0"}, {"number": 16, "text": "Кошки этой удивительной турецкой породы — единственные, которые с удовольствием плавают и купаются, поскольку у них полностью отсутствует боязнь воды. Какое слово из трех букв входит в название этой породы?", "answer": "Ван.", "complexity": "", "handout": "0"}, {"number": 16, "text": "В одной из серий сериала \"Доктор Хаус\" подчиненные главного героя в ответ на перечисленные симптомы говорят: \"Это может быть что угодно\". В ответ на это Хаус предлагает дать пациенту известное с древности лекарство. Назовите это лекарство.", "answer": "Панацея.", "complexity": "", "handout": "0"}, {"number": 16, "text": "Перед вами — карикатура, которая называется \"Дед Мазай и зайцы\". В тексте вопроса мы пропустили одну букву. Назовите ее.", "answer": "Д.", "complexity": "", "handout": "1"}, {"number": 16, "text": "Исследователи катастрофы \"Титаника\" большое внимание уделяют тому, что айсберг был обнаружен слишком поздно, и предполагают, что с айсбергом незадолго до столкновения нечто произошло. Что именно?", "answer": "Он перевернулся.", "complexity": "", "handout": "0"}, {"number": 16, "text": "Внимание, в вопросе есть замена.\nЖурнал \"Максим\" в одном из номеров опубликовал \"10 признаков того, что ты скоро станешь отцом\". Один из признаков гласит: \"Увидев слово АКМ, тебе впервые приходит в голову не автомат\". Какое слово мы заменили словом \"АКМ\"?", "answer": "УЗИ.", "complexity": "", "handout": "0"}, {"number": 17, "text": "Журнал \"Вокруг света\" назвал их \"Божьими плугами\". Самый быстрый из них — Якобсхавн, его скорость — 42,5 метра в сутки. Как называются те, кто их изучает?", "answer": "Гляциологи.", "complexity": "", "handout": "0"}, {"number": 17, "text": "В римских Дигестах умаление правоспособности имело три степени. Наибольшая — \"потеря свободы и гражданства\", средняя — \"потеря гражданства\", а при наименьшей происходило изменение ЭТОГО. Назовите самую частую причину изменению ЭТОГО у нас.", "answer": "Замужество.", "complexity": "", "handout": "0"}, {"number": 17, "text": "Издательство \"Амфора\" недавно выпустило составленную Павлом Крусановым \"Синюю книгу\", на задней обложке которой упоминаются Анакреонт, Гаршин, Хемингуэй и другие. Назовите словом из восьми букв основную тему произведений этой антологии.", "answer": "Алкоголь.", "complexity": "", "handout": "0"}, {"number": 17, "text": "Детская карта Европы испещрена множеством забавных рисунков. Например, Ливерпуль обозначает группа \"Битлз\", а территорию Румынии украшают чеснок и осиновый кол. Недалеко от точки, обозначающей Мадрид, изображен известный человек за работой, хотя, по мнению автора вопроса, этот рисунок стоило бы перенести немного севернее, в другую \"страну\". Ответьте абсолютно точно, над чем работает на рисунке известный человек.", "answer": "Над \"Герникой\".", "complexity": "", "handout": "0"}, {"number": 17, "text": "Журнал \"Красная Бурда\" критикует будущие скульптуры Зураба Церетели, замечая, что скульптура \"Алкоголик в вытрезвителе\" будет создавать помехи движению самолетов своим шестидесятиметровым железобетонным ИМ. Назовите ЕГО.", "answer": "Перегар.", "complexity": "", "handout": "0"}, {"number": 17, "text": "Перед вами — портреты двух людей. О первом мы знаем, что он родился в 1736 году, учился в Абердине, а в 1758 году опубликовал свою первую поэму \"Горец\". Назовите второго, чей портрет работы Николая Абилгаарда датируется 1782 годом.", "answer": "Оссиан.", "complexity": "", "handout": "1"}, {"number": 17, "text": "Среди лимериков есть целое \"лингвистическое\" направление, пародирующее те или иные языковые нормы. Например, по образу \"Mr.\" [эм ар с точкой] (английское сокращение слова \"мистер\") слово \"sister\" сокращают до \"sr.\" [эс ар с точкой], а слова \"kissed her\" — до \"kr.\" [кей ар с точкой]. В \"лингвистическом\" лимерике, который вы видите перед собой, мы заменили на пропуск пять символов и два пробела. Восстановите пропуск.", "answer": "И т.д.", "complexity": "", "handout": "1"}, {"number": 17, "text": "Одним из главных аргументов сторонников исторической непрерывности актерской традиции является то, что средневековый энциклопедист Исидор Севильский, говоря об античных мимах, использовал ИКС. В английском языке ИКСОВ — четыре. Назовите ИКС двумя словами.", "answer": "Настоящее время.", "complexity": "", "handout": "0"}, {"number": 17, "text": "8 марта 1895 года в Париже начался процесс по знаменитой Панамской афере. Назовите фамилию одного из шести подсудимых, технического руководителя проекта, в итоге попавшего под амнистию.", "answer": "Эйфель.", "complexity": "", "handout": "0"}, {"number": 17, "text": "Есть сведения, что эта игра была изобретена в XI веке в местечке, которое нелегко найти на карте. Изначально это было примитивное состязание, но потом игра усложнилась. Истинные ее мастера используют прием \"Ястребиная голова\", а также двойную восьмерку и даже зеркальную защиту. Розыгрыш Кубка Славы по этой игре два года назад состоялся в подмосковном Ступино. Как называется эта игра?", "answer": "Квиддич.", "complexity": "", "handout": "0"}, {"number": 18, "text": "В НЕМ находится крупнейший на Ближнем Востоке храм Благовещения и православная церковь архангела Гавриила. В этом случае ЕМУ много больше двух тысяч лет. А еще \"ОН\" появился всего 31 год назад — в Шотландии, и тоже существует до сих пор. Назовите ЕГО.", "answer": "Назарет.", "complexity": "", "handout": "0"}, {"number": 18, "text": "В конце статьи Википедии об этом человеке приводятся, кроме прочих, ссылки на статьи о бейсболистах США, о чемпионах летних Олимпийских игр 1992 года и людях, родившихся в Бруклине. Назовите этого человека.", "answer": "Майкл Джордан.", "complexity": "", "handout": "0"}, {"number": 18, "text": "Орхан Памук описывает соревнование между художниками, в котором необходимо было украсить две противоположные стены большого помещения. Когда пришло время ознакомиться с работами участников, отдернули занавес, разделявший зал, и на одной стене открылась огромная панорама Стамбула: праздничные площади и карусели, старые трамваи, конные повозки, минареты, парки, кофейни на набережной... Однако приз выиграл второй художник, предоставивший для конкурса... Что именно?", "answer": "Зеркало.", "complexity": "", "handout": "0"}, {"number": 18, "text": "Детская карта Европы испещрена множеством забавных рисунков. Например, Ливерпуль обозначает группа \"Битлз\", а территорию Румынии украшают чеснок и осиновый кол. Вдоль берега Тирренского моря человек катит колесо, судя по направлению движения — откуда-то из Флоренции. А кто изображен на колесе?", "answer": "Витрувианский человек.", "complexity": "", "handout": "0"}, {"number": 18, "text": "Как известно, католическая церковь к контрацептивам относится отрицательно. Вот и приходится набожным гражданам пользоваться календарным методом, снижающим риск беременности, но не стопроцентно. В шутку этот способ называют \"Ватиканская ОНА\". Назовите ЕЕ.", "answer": "Рулетка.", "complexity": "", "handout": "0"}, {"number": 18, "text": "Роберт Шон Леонард был первым актером, которого утвердили на роль создатели сериала \"Доктор Хаус\". А вот отечественный режиссер долго не мог определиться с исполнителем, пока ему на глаза не попалась архивная фотография артиста с приклеенными усами. Назовите этого артиста.", "answer": "[Виталий] Соломин.", "complexity": "", "handout": "0"}, {"number": 18, "text": "Прослушайте \"лингвистический\" лимерик без первой строки:\nПостоялец вдруг взял да и п.\nА сосед сел на стул,\nЗакричал: \"Караул!\"\nИ уехал к зазнобе в Жит.\nМы не спрашиваем вас, куда возвратился герой в первой строке. Ответьте, какой значок стоит после \"п.\" и \"Жит.\".", "answer": "° (маленький кружочек).", "complexity": "", "handout": "0"}, {"number": 18, "text": "Назовите восьмого по счету президента Интерпола, единственного, приговоренного судом к смертной казни и казненного через повешение.", "answer": "Кальтенбруннер.", "complexity": "", "handout": "0"}, {"number": 18, "text": "В советском мультфильме \"Рассказы старого моряка\" кашалот охотится за кальмаром, но тот ускользает, применив ловкий маневр. Чем после этого советует закусить кашалоту юный наблюдатель?", "answer": "Промокашкой.", "complexity": "", "handout": "0"}, {"number": 18, "text": "Дуплет.\n1. Назовите выходца из Восточной Европы, которому, желая выразить восхищение его талантом, посвятила очерк Жорж Санд.\n2. Назовите выходца из Восточной Европы, с которым связано шесть музыкальных произведений, написанных Полиной Виардо.", "answer": "1. Тургенев.\n2. Шопен.", "complexity": "", "handout": "0"}, {"number": 19, "text": "Этот эпиграф впервые прозвучал 24 февраля 1973 года и звучит по сей день. Любопытно, что в том виде, в котором мы его знаем, он никогда не существовал. Некоторые слова автор и вовсе вычеркнул, но исследователи их восстановили. Назовите родственную пару, упомянутую в эпиграфе.", "answer": "Опыт, сын ошибок трудных.", "complexity": "", "handout": "0"}, {"number": 19, "text": "На выставке New York World's Fair 1939 года компания \"General Motors\" представила свое вИдение будущего. И хотя \"General Motors\" говорила всего лишь о будущих 1960-х, ответьте, каким неологизмом называлась экспозиция.", "answer": "Футурама.", "complexity": "", "handout": "0"}, {"number": 19, "text": "По словам Янины Маркулан, молодых людей в хиппизме привлекала общность, а вот истоки коллективных сеансов с марихуаной она видела в НЕЙ. Назовите ЕЕ двумя словами.", "answer": "Трубка мира.", "complexity": "", "handout": "0"}, {"number": 19, "text": "Детская карта Европы испещрена множеством забавных рисунков. Например, около точки, обозначающей Ливерпуль, изображена группа \"Битлз\". Моря и океаны тоже заполнены рисунками: так, в Атлантическом можно найти крейсер, скутер, каяк, а также четыре вполне конкретных судна. Три из них — это \"Санта-Мария\", \"Пинта\" и \"Нинья\". Назовите четвертое двумя или тремя словами.", "answer": "Желтая подводная лодка.", "complexity": "", "handout": "0"}, {"number": 19, "text": "Журнал \"LQ\" предлагает простой и эффективный способ решения извечной семейной проблемы: повесить дома ИКС. В кафе \"Шоколадный Пушкин\" ИКС выглядит как ярко накрашенный рот. Назовите ИКС.", "answer": "Писсуар.", "complexity": "", "handout": "0"}, {"number": 19, "text": "В книге Уильяма Гибсона за много лет ЭТО закрутилось в единую метакаракулю гнева и нигилизма, а вот по мнению Анны Берестовой, ЭТО — почти целиком мужское занятие: ведь таким образом самцы метят территорию. Назовите ЭТО одним словом.", "answer": "ГраффИти.", "complexity": "", "handout": "0"}, {"number": 19, "text": "Белорусский актер Александр Васько, дублирующий героев сериала \"Доктор Хаус\", отвечая в интервью на вполне предсказуемый вопрос, вспомнил одну из первых своих ролей на сцене. Эту же роль, но в кино, в 1967 году исполнил Олег Ефремов. Назовите эту роль.", "answer": "Айболит.", "complexity": "", "handout": "0"}, {"number": 19, "text": "Один из номеров \"Огонька\" за 2009 год посвящен четырехлетнему внебрачному сыну Лукашенко, которого Батька все время возит с собой — даже на военные парады и встречи с Папой Римским. Учитывая политические реалии Белоруссии, ответьте, какое произведение 1943 года дало главный заголовок номеру.", "answer": "\"Маленький принц\".", "complexity": "", "handout": "0"}, {"number": 19, "text": "Лингвисты обнаружили, что в языке пираа, на котором говорят жители одного из племен Бразилии, вообще нет слов для обозначения ИХ. А вот в ПЯТИ первых ОНИ идут ЧЕТВЕРТЫМИ. Назовите ИХ.", "answer": "Числа.", "complexity": "", "handout": "0"}, {"number": 19, "text": "Один из современников назвал ЕЮ судьбу композитора Чарлза Айвза. ОНА упоминается в статье, посвященной неудачным выступлениям Энди Роддика и Андре Агасси на Кубке Дэвиса в 2005 году. ОНА увидела свет в ноябре 1925 года. Назовите ЕЕ.", "answer": "Американская трагедия.", "complexity": "", "handout": "0"}, {"number": 20, "text": "Какой топоним фигурирует в названии клуба, в котором играют эти баскетболисты?", "answer": "Родос.", "complexity": "", "handout": "1"}, {"number": 20, "text": "Внимание, в вопросе есть замена.\nНа состоявшейся в январе 2009 года в провинции Онтарио конференции, посвященной травмам головного мозга, достаточно серьезно обсуждалась идея перехода на систему \"джип\". Какие три слова мы заменили на \"джип\"?", "answer": "Четыре на четыре.", "complexity": "", "handout": "0"}, {"number": 20, "text": "Леонид Андреев, умерший в 1919 году, очень горевал по поводу того, что ОН никогда не заговорит. Какие два слова мы заменили на \"ОН\"?", "answer": "Великий Немой.", "complexity": "", "handout": "0"}, {"number": 20, "text": "Внимание, в вопросе есть замена.\nПопулярная актриса рассказывала, что во время съемок в фильме \"ПЕРЕМЕНА\" режиссер другого фильма, Алехандро Гонсалес Иньяриту, буквально замучал ее ПЕРЕМЕНАМИ. Какое слово мы заменили словом \"ПЕРЕМЕНА\"?", "answer": "Звонок.", "complexity": "", "handout": "0"}, {"number": 20, "text": "Однажды Наполеон наградил крестом за храбрость некоего Кристаллини, чем вызвал немало споров и кривотолков. Конец разговорам положила придворная дама, заявив, что Наполеон и его наградил \"за рану\". Назовите род деятельности господина Кристаллини.", "answer": "Оперный певец.", "complexity": "", "handout": "0"}, {"number": 20, "text": "Автор вопроса как-то наткнулась на книгу \"Вопрос-ответ\" Викаса Сварупа стоимостью чуть более 150 рублей. Рядом стояла точно такая же книга, изданная на три года позже и стоимостью под 300 рублей. На обложке появилась влюбленная пара, а к названию было добавлено четыре слова. Одно из них — \"или\". Назовите остальные.", "answer": "\"Миллионер из трущоб\".", "complexity": "", "handout": "0"}, {"number": 20, "text": "[Видеовопрос! Вопрос задает Ровшан Аскеров.]\nЭТОТ город известен как родина известного литературного героя и киноперсонажа. Кроме того, он дал свое название растению, которое используется как в кулинарии, так и в парфюмерии. Между прочим, готовясь к сегодняшней съемке, я употребил продукт, в состав которого входит это растение. Назовите ЭТОТ город.", "answer": "Бергамо.", "complexity": "", "handout": "0"}, {"number": 20, "text": "[Видеовопрос! Вопрос задает Найк Борзов.]\nЯ знаю три слова. Говорят, эти три слова запрещено произносить на проекте \"Дом-2\". Этими тремя словами названа фотография в разделе подводной макросъемки. Назовите эти три слова.", "answer": "\"Я маленькая лошадка\".", "complexity": "", "handout": "0"}, {"number": 20, "text": "Согласно Википедии, ОН гасит подъемную силу. А вот сайт lurkmore.ru в качестве примеров ЕГО приводит фразу \"Дарт Вейдер — отец Люка!\". Назовите ЕГО.", "answer": "Спойлер.", "complexity": "", "handout": "0"}, {"number": 20, "text": "Рассуждая о творчестве Льва Толстого, Святослав Логинов приходит к выводу, что творчество классика полно штампов, фальши и слов-паразитов. В заголовке статьи Логинов недвусмысленно дает понять, что Толстой был как ПЕРВЫМ, так и ВТОРЫМ. ВТОРОЙ отличается от ПЕРВОГО добавлением четырех букв. Напишите эти четыре буквы.", "answer": "оман.", "complexity": "", "handout": "0"}, {"number": 21, "text": "Как пишут специалисты, сам ЭТОТ англоязычный ТЕРМИН-неологизм появился тогда, когда вышла операционная система Windows Vista со всеми ее проблемами и сложностями и когда большинство компьютеров \"по умолчанию\" продавались с ней. До этого массовым процесс, названный ЭТИМ ТЕРМИНОМ, не был, а, значит, в отличие от антонима, не было и ЭТОГО ТЕРМИНА. Воспроизведите ЭТОТ ТЕРМИН.", "answer": "Даунгрейд.", "complexity": "", "handout": "0"}, {"number": 21, "text": "По мнению Краснухина, дело было в символике народной сказки и борьбе светлых и темных сил за душу. Чхеидзе утверждал, что начальный этап вполне укладывается в рамки известной теории, а роковая неудача произошла из-за случайного слипания. Какое произведение они так интерпретировали?", "answer": "\"Пиковая дама\".", "complexity": "", "handout": "0"}, {"number": 21, "text": "Внимание, в вопросе есть замены.\nДжин Родденберри, создатель знаменитого сериала \"Стар Трек\", завещал ЗАКОПАТЬ свой прах В ЗЕМЛЮ, что и было сделано через шесть лет после его смерти. С 2008 года одна калифорнийская компания по желанию заказчика ЗАКАПЫВАЕТ В ЗЕМЛЮ всё что угодно весом не более 350 граммов всего за 99 долларов. Какие слова мы заменили на \"ЗАКОПАТЬ В ЗЕМЛЮ\"?", "answer": "Отправить в космос.", "complexity": "", "handout": "0"}, {"number": 21, "text": "Художник Калининский при помощи проволоки, булавок и степлера сделал елку из ПЕРВЫХ и украсил ее ВТОРЫМИ. А в известном произведении итальянца ПЕРВЫЕ везли карету ВТОРОГО. Назовите ВТОРОГО.", "answer": "Помидор.", "complexity": "", "handout": "0"}, {"number": 21, "text": "17-летняя румынская теннисистка Симона Халеп, занимающая 317-ю позицию в рейтинге WTA [Вэ-Тэ-А], рассчитывает на успешную карьеру в большом спорте. По ее словам, самой значительной преградой на этом пути является ШЕСТЬ. А что именно обозначает эта шесть?", "answer": "Размер ее груди.", "complexity": "", "handout": "0"}, {"number": 21, "text": "Событиям в какой стране ведущие программы \"Прожекторперисхилтон\" посвятили строку \"Каким ты был, таким ты и остался\", дважды добавив в нее одну букву?", "answer": "Северная Корея.", "complexity": "", "handout": "0"}, {"number": 21, "text": "Внимание, в вопросе есть замены.\nГероиня пьесы Шмитта утверждает, что время более милосердно к мужчинам, чем к женщинам: \"Немного снега в волосах, чуть меньше резкости в чертах лица, больше плавности в жестах, и ГОЙЯ превращается в ТЁРНЕРА, а мне так нравится ТЁРНЕР!\". Слова \"ГОЙЯ\" и \"ТЁРНЕР\" пришли в русский из одного и того же языка, более того — происходят от слов, обозначающих одно и то же понятие. Восстановите слова, замененные нами на \"ГОЙЯ\" и \"ТЁРНЕР\".", "answer": "Офорт и акварель.", "complexity": "", "handout": "0"}, {"number": 21, "text": "В 1978 году ЭТА компания официально получила новое название вместо старого \"Blue Ribbon Sports\". Через год ОН стал заведующим отделом оборонно-массовой и спортивной работы ЦК ЛКСМУ. Назовите компанию и ЕГО фамилию.", "answer": "\"Найк\", Борзов.", "complexity": "", "handout": "0"}, {"number": 21, "text": "У Цзи Канна — брат изменил прежней дружбе, в \"Шицзине\" — царь отдалился от родни, в \"Ханьских песнях\" — старший брат забыл о своем долге. Комментируя вышеизложенные аморальные примеры, синолог Лисевич приводит выражение из пяти слов, появившееся в 1808 году. Процитируйте его.", "answer": "В семье не без урода.", "complexity": "", "handout": "0"}, {"number": 21, "text": "В финале постановки Дмитрия Богомазова на сцене между двумя гипсовыми шарами стоит заглавный герой пьесы в окровавленной повязке. Назовите имя героя.", "answer": "Эдип.", "complexity": "", "handout": "0"}, {"number": 22, "text": "В романе \"Государство и светомузыка\" один из героев плохо переносит низкие температуры, а вдохновение посещает его при созерцании горящего камина. Как называется созданное им при этом произведение?", "answer": "\"Поэма Огня\".", "complexity": "", "handout": "0"}, {"number": 22, "text": "Согласно закону ЕС, с декабря 2008 года любой автомобиль, выпускающийся в ЕС, должен на 85% состоять из ТАКИХ деталей. А к 2015 году ТАКИХ деталей должно стать 100%. Нарисуйте на бумажке — КАКИХ?", "answer": "", "complexity": "", "handout": "0"}, {"number": 22, "text": "Закончите двумя словами шутку Сергея Минаева: \"За 150 лет американский английский сильно поменялся. Была \"Хижина дяди Тома\" — стал...\".", "answer": "\"... Барак Обама\".", "complexity": "", "handout": "0"}, {"number": 22, "text": "В ВМС США у подводников есть церемония посвящения. Когда ЭТО случается с ними впервые, они получают прозвище Синий Нос и сертификат. По легенде, однажды всего за ящик водки ЭТО сделал целый советский поселок. Что же все они сделали?", "answer": "Пересекли Северный полярный круг.", "complexity": "", "handout": "0"}, {"number": 22, "text": "В белорусском Гомеле злоумышленники украли туалетную кабинку с остановки общественного транспорта. Однако, к огорчению преступников, их быстро поймали и вдобавок предъявили намного более серьезное обвинение, чем банальная кража. Назовите причину столь серьезного обвинения.", "answer": "Кабинка в момент похищения была занята.", "complexity": "", "handout": "0"}, {"number": 22, "text": "В известном ролике о футбольном матче философов Германии и Греции за немецкую команду рядом с Лейбницем, Кантом и Гегелем выступает настоящий футболист — Франц Беккенбауэр. Правда, в составе сборной греков тоже можно увидеть настоящего футболиста. Назовите его фамилию.", "answer": "Сократес.", "complexity": "", "handout": "0"}, {"number": 22, "text": "Творчество группы \"The Decembers\" [зэ дисемберс] имеет истоки в кантри-музыке, а большое количество текстов посвящено пиратам, подводникам и другим проходимцам без твердой почвы под ногами. Рассуждая об этой группе, обозреватель сайта Infox.ru [инфокс ру] характеризует ее стиль устойчивым словосочетанием из двух слов, в одном из которых согласная заменена на парную ей глухую. Воспроизведите название этого придуманного стиля.", "answer": "Морской фолк.", "complexity": "", "handout": "0"}, {"number": 22, "text": "В отличие от первых четырех, постулат Евклида о параллельных прямых еще в античные времена был подвергнут сомнению. Уже в эпоху бурного развития математики умнейший Гаусс имел свои соображения, но предпочитал о них не распространяться. Для иллюстрации этой ситуации в одной отечественной книге аксиома о параллельных сравнивается с ЭТИМ. Назовите ЭТО.", "answer": "Пятый пункт.", "complexity": "", "handout": "0"}, {"number": 22, "text": "Название \"Аляска\" происходит от алеутского слова, которое означает обилие ИХ. Назовите того из НИХ, кто стал заглавным персонажем мировой литературы.", "answer": "Моби Дик.", "complexity": "", "handout": "0"}, {"number": 22, "text": "В своей постановке \"Эдипа\" Богомазов при помощи костюмов и белил превратил каждого из актеров в НЕЕ. Впрочем, вам должно быть известно, что на самом деле ОНИ выглядели несколько иначе. ОНА — известный способ спрятать любовника от мужа. Назовите ЕЕ двумя словами.", "answer": "Античная статуя.", "complexity": "", "handout": "0"}, {"number": 23, "text": "В 1479 году Иван III выделил средства на храм Иоанна Златоуста. Почему храм освятили в память этого святого, конечно, понятно всем — именно в честь Иоанна Златоуста и крестили великого князя. А почему Иван особо оговорил строительство при этом храме придела святого Тимофея?", "answer": "Он родился в день святого Тимофея.", "complexity": "", "handout": "0"}, {"number": 23, "text": "Законы ЕС, как вы уже знаете, предписывают цивилизованную утилизацию автомобилей. Первыми к утилизируемому автомобилю на заводе подходят оценщики, которые осматривают машину и составляют технологическую карту и калькуляцию. А затем, перед самой разборкой, автомобилем обязательно занимаются ЭТИ ЛЮДИ. Не ошибитесь и назовите главное качество ЭТОГО ЧЕЛОВЕКА, согласно известной поговорке.", "answer": "Он ошибается один раз.", "complexity": "", "handout": "0"}, {"number": 23, "text": "В бенефисе 2008 года ЕГО место неизвестно ПОЧЕМУ занял \"промокатор\". Назовите ЕГО.", "answer": "Гладиолус.", "complexity": "", "handout": "0"}, {"number": 23, "text": "Как известно, журнал \"Максим\" публикует воображаемые десктопы известных людей. Какие слово и знак препинания добавлены к копии одной из СТАНДАРТНЫХ иконок рабочего стола братьев Запашных, если это могла бы быть и иконка с десктопа боксеров Кличко?", "answer": "\"Нет,\".", "complexity": "", "handout": "0"}, {"number": 23, "text": "На главной странице сайта этого московского театра крупными буквами написано название знаменитого мюзикла, а все артисты театра поделены на две группы по наличию или отсутствию ЕГО. Назовите ЕГО.", "answer": "Хвост.", "complexity": "", "handout": "0"}, {"number": 23, "text": "ОНА и ОНО происходят от одного и того же славянского слова, обозначающего метод их нанесения. ЕГО покупают в гастрономах, а ЕЕ — в других специализированных магазинах. Назовите ЕГО и ЕЕ.", "answer": "Масло и мазь.", "complexity": "", "handout": "0"}, {"number": 23, "text": "Виктор Васильевич Приклонский долгое время был начальником Донецкой железной дороги. Какое учреждение дополнительного образования, появившееся в Донецке в 1972 году, сейчас носит имя Виктора Приклонского?", "answer": "Детская железная дорога.", "complexity": "", "handout": "0"}, {"number": 23, "text": "Одной из ярчайших страниц истории компании \"Heineken\" [Хайнекен] стало возобновление заокеанских поставок спустя 72 часа. После чего?", "answer": "После отмены \"сухого закона\" в США.", "complexity": "", "handout": "0"}, {"number": 23, "text": "В стихотворении Александра Кабанова действует персонаж по имени Николай Васильевич ИКС, сочиняющий еврейский horror. В одной энциклопедии ИКС расположен между гоблинами и гомозулями. Назовите ИКС.", "answer": "Голем.", "complexity": "", "handout": "0"}, {"number": 23, "text": "Роберт Браун назвал свое выдающееся открытие \"орешек\". Назовите его открытие двумя словами.", "answer": "Ядро клетки.", "complexity": "", "handout": "0"}, {"number": 24, "text": "Первые полвека имя ЕЕ автора было неизвестно. Предполагается, что ОНА служила рекламой \"Новороссийского общества каменноугольного, железного и рельсового производств\". В 1959 году исследователи нашли Филиппа Шкарина, который все еще работал и помнил Алексея Ивановича. Назовите фамилию Алексея Ивановича.", "answer": "Мерцалов.", "complexity": "", "handout": "0"}, {"number": 24, "text": "У Одоевского в \"Русских ночах\", среди прочего, показан \"мир по Мальтусу\", где ОНИ считались героями. Назовите любого из двух неевропейских лауреатов Нобелевской премии по литературе, ставших ИМИ.", "answer": "Хемингуэй или Кавабата.", "complexity": "", "handout": "0"}, {"number": 24, "text": "Внимание, в вопросе есть замены.\nТатьяна Цявловская выходила из сложнейших ситуаций по атрибуции рисунков Пушкина, прибегая к советам Бориса Томашевского. По ее словам, с его смертью ПРОКРУСТОВО ЛОЖЕ ПРОЛОМИЛОСЬ. Какие три слова мы заменили на \"ПРОКРУСТОВО ЛОЖЕ ПРОЛОМИЛОСЬ\"?", "answer": "Нить Ариадны порвалась.", "complexity": "", "handout": "0"}, {"number": 24, "text": "Из русской Абсурдопедии можно узнать, что 45-й калибр обладает намного более сильным убеждающим действием, чем ЭТО. Назовите ЭТО абсолютно точно.", "answer": "25-й кадр.", "complexity": "", "handout": "0"}, {"number": 24, "text": "Исследование \"Пью Рисерч\" показало, что половина взрослых американцев хоть раз да ДЕЛАЛИ ЭТО с самими собой. В первую очередь такое поведение характерно для мужчин: женщины предпочитают ДЕЛАТЬ ЭТО со своими знакомыми мужского пола. По мнению одного ЖЖ-юзера, сегодняшнее поколение всё больше ДЕЛАЕТ ЭТО, чем думает. Скажите \"ДЕЛАТЬ ЭТО\" одним словом.", "answer": "Гуглить.", "complexity": "", "handout": "0"}, {"number": 24, "text": "Математик Юрий Пухначев подверг научному анализу строки Марины Цветаевой. Так, он замечает, что у Цветаевой к \"гроздьям\" применено слово, обозначающее химический процесс и в то же время некое передвижение в пространстве. Что же гроздья \"делают\"?", "answer": "Бродят.", "complexity": "", "handout": "0"}, {"number": 24, "text": "Некоторые исследователи полагают, что этот сюжет — переложение легенды, которую автор услышал, обучаясь в местном лицее. Также в этом сюжете можно увидеть противостояние между язычеством и христианством. Более того, в заглавном герое многие видят воплощение славянского бога Перуна и в итоге — победу исконного над пришлым. Назовите этого заглавного героя.", "answer": "Вий.", "complexity": "", "handout": "0"}, {"number": 24, "text": "В стихотворении Софии Парнок в момент, когда раздаются первые звуки оркестра, дирижерская палочка сравнивается с НЕЙ. Исторический фильм о деятельности СС называется \"Замерзшие ОНИ\". Назовите ЕЕ.", "answer": "Молния.", "complexity": "", "handout": "0"}, {"number": 24, "text": "В конце 1980-х годов в СССР опубликовали лингвистическую работу, в которой был сделан вывод о существовании графической традиции, отличной от книжной. Она отличалась архаизацией и \"запаздыванием\" начертаний, графическим неразличением букв \"есть\" и \"ер\". Назовите материал, на основании которого был сделан этот вывод.", "answer": "Берестяные грамоты.", "complexity": "", "handout": "0"}, {"number": 24, "text": "Согласно одной из гипотез, вселенные последовательно образуются, расширяются, функционируют, а потом снова сжимаются. Таким образом, получается, что наша вселенная не является чем-то принципиально новым, она уже была, и, может быть, не один раз. Такую модель Ричард Докинз сравнивает с НИМ. Назовите ЕГО.", "answer": "Баян.", "complexity": "", "handout": "0"}, {"number": 25, "text": "Герой произведения Филипа Жозе Фармера, желая похвалить товарища, говорит, что в воде тот быстр и силен как ОН. Один их НИХ за манеру передвижения и пугливые повадки получил соответствующее название. Напишите это название из двух слов.", "answer": "Морской заяц.", "complexity": "", "handout": "0"}, {"number": 25, "text": "В одном из вариантов настольной игры \"Манчкин\" существует оружие, которое могут применять только представители кошачьей расы — очевидно, из-за анатомических особенностей. Название этого оружия образовано на стыке двух пятибуквенных слов, одно из которых — это особенность строения, а другое — часть оружия. Воспроизведите это название.", "answer": "Хвоствол.", "complexity": "", "handout": "0"}, {"number": 25, "text": "Один из интернет-пользователей так охарактеризовал свои впечатления от Евровидения-2009: \"класс, класс, ПРОПУСК, клево, неплохо, симпатишно, тоже хорошо...\". Заполните пропуск словом из четырех букв.", "answer": "Каас.", "complexity": "", "handout": "0"}, {"number": 25, "text": "Для адмирала Исакова ТАКОЙ была американская улыбка кассирш и продавщиц на рекламе сигарет и автомашин, ТАКОЙ же, по его мнению, была и прическа тамошних блондинок. Какой эпитет мы заменили на \"ТАКАЯ\"?", "answer": "Перманентная.", "complexity": "", "handout": "0"}, {"number": 25, "text": "Нам не удалось найти, кто сделал ЭТО с матерью Терезой. Но точно знаем, что Михаил Горбачев делал ЭТО неоднократно, причем однажды — с целым экипажем подводной лодки! Назовите ЭТО максимально точно.", "answer": "Выдвижение на Нобелевскую премию мира.", "complexity": "", "handout": "0"}, {"number": 25, "text": "Для среднего человеческого сердца это около шести с половиной минут. А для \"Новой волны\" — серьезная веха 1958 года. Назовите ЭТО.", "answer": "400 ударов.", "complexity": "", "handout": "0"}, {"number": 25, "text": "Перед вами — \"Мотоцикл\" Мэттью Бартика. Работая над ним, Бартик при помощи рук и специальных инструментов делал нечто с ИКСАМИ. То же самое, но более необычным способом, делал с ИГРЕКОМ известный киногерой. Назовите его фамилию.", "answer": "Андерсон.", "complexity": "", "handout": "1"}, {"number": 25, "text": "После выхода в 1967 году в советский прокат картины \"Замерзшие молнии\" ОН получил предложение сыграть эту же роль в советской киноэпопее, но поначалу отказался, поскольку опасался стать заложником одной роли. Назовите ЕГО имя или фамилию.", "answer": "Фриц Диц.", "complexity": "", "handout": "0"}, {"number": 25, "text": "В начале шутливого перевода известного произведения упоминаются педофил и батарейки \"Energizer\". Назовите имя собственное, которое фигурирует в названии этого произведения.", "answer": "Алиса.", "complexity": "", "handout": "0"}, {"number": 25, "text": "Испанский историк Луис Мигель Апариси Лапорта в 2008 году обнаружил в мадридском архиве записи с именами похороненных в начале XIX века в братской могиле на Горе принца Пио. Это — первое историческое свидетельство с именами погибших. Хорошо известно и другое свидетельство их гибели. Кто его автор?", "answer": "Гойя.", "complexity": "", "handout": "0"}, {"number": 26, "text": "Мигель де Унамуно упоминает ЭТО, рассказывая о солнечном затмении. Если верить советскому фильму, ЭТО связано с определенным моментом. Назовите этот момент одним словом.", "answer": "Полдень.", "complexity": "", "handout": "0"}, {"number": 26, "text": "Эта цитата из фильма \"Распутник\" приводится в статье Википедии, посвященной известному адритскому слову, которое позже вошло во многие языки мира. Напишите это слово.", "answer": "Сепульки.", "complexity": "", "handout": "1"}, {"number": 26, "text": "В рассказе Леопольдо Лугонеса \"Два великих лунатика, или Полное несходство взглядов\" во время забастовки железнодорожников на пустынном перроне встречаются двое незнакомцев. ПЕРВЫЙ — невысокий безбородый блондин в черном, склонный к полноте, — признает себя социалистом и ратует за то, чтобы рабочие действовали не с помощью силы, а законным образом. ВТОРОМУ — высокому и худощавому, с орлиным носом — близки анархисты, он называет их рыцарями с бомбой и признаётся, что не в силах видеть горе слабого. Назовите хорошо знакомых вам ПЕРВОГО и ВТОРОГО.", "answer": "Гамлет и Дон Кихот.", "complexity": "", "handout": "0"}, {"number": 26, "text": "Гранитный камень к юбилею заказали на каменоломне Ваневикс в земле Смоланд. Доставку в Ригу морем и далее по железной дороге оплатил Эммануэль Нобель. А где поставили камень?", "answer": "Под Полтавой.", "complexity": "", "handout": "0"}, {"number": 26, "text": "Известный медицинский блоггер опубликовал в своем ЖЖ текст под названием \"Вся правда о врачах\". Назовите самую уважаемую, согласно этому тексту, врачебную специальность, если уважение к ней основано на том, что врачи этой специальности обеспечивают работой всех остальных врачей.", "answer": "Акушеры.", "complexity": "", "handout": "0"}, {"number": 26, "text": "В своих путешествиях по Средней Азии автор вопроса и его супруга, несмотря на стесненность в средствах, решили съездить ТУДА. Они сняли с кредитной карточки определенную сумму, наняли небольшой автомобиль и поехали. Поездка была длинной, но до НЕЕ автор вопроса все-таки не добрался, лишь сфотографировал ее через водохранилище. Назовите ЕЕ.", "answer": "Брич-Мулла.", "complexity": "", "handout": "1"}, {"number": 26, "text": "Борис Кустодиев утверждал, что похожий портрет — это такой портрет, который внутренне похож, который дает представление о душевной сути данного человека. И тут нужно предоставить художнику выражать свое понимание этой сути. По несколько снобистскому мнению Кустодиева, если человек не согласен с его мнением, то он должен обратиться... К кому?", "answer": "К фотографу.", "complexity": "", "handout": "0"}, {"number": 26, "text": "Римская мраморная статуя, проданная на аукционе Bonhams за 42 тысячи долларов, служила в качестве украшения античного саркофага. Ажиотаж на мировом рынке коллекционеров бюст вызвал, в частности, из-за прически — по словам специалистов, совершенно не характерной для II века нашей эры. Неизвестно, изображал ли бюст покойного римлянина, но наверняка он дал очередной повод многим поставить под сомнение не только вторую, но и первую дату, связанную с ЭТИМ человеком. Назовите ЭТОГО человека.", "answer": "Элвис Пресли.", "complexity": "", "handout": "0"}, {"number": 27, "text": "Внимание, в вопросе есть замены.\nВ 1998 году Граса Машел из Мозамбика, вдова погибшего в авиакатастрофе Самора Машела, вышла замуж за бывшего арестанта. Таким образом, ей первой и единственной удалось стать ПИКОВОЙ ДАМОЙ двух КОЛОД. Какие слова мы заменили на \"ПИКОВОЙ\", \"ДАМОЙ\" и \"КОЛОД\"?", "answer": "Первой леди стран (государств).", "complexity": "", "handout": "0"}, {"number": 27, "text": "В декабре 1758 года Иммануил Кант подал прошение на замещение места профессора в университете по месту жительства. Назовите адресата прошения.", "answer": "Елизавета Петровна.", "complexity": "", "handout": "0"}, {"number": 27, "text": "В старину единственным способом регулировать ЕГО качество было пристальное наблюдение за цветом побежалости. Поэтому-то многие мастера чувствовали цвет гораздо лучше художников. Сейчас же законодательство обычно регулирует ЕГО продолжительность. Назовите ЕГО.", "answer": "Отпуск.", "complexity": "", "handout": "0"}, {"number": 27, "text": "Некоторые исследователи-лингвисты считают, что ОНА — это на самом деле ОН — противопоставление главному злодею-разбойнику, герой-воин, снабженный ореолом романтического восточного колорита, а ЕГО отношения с главным героем — это мужская дружба, а не материнская забота. Однако же в русскоязычной масскультуре ОН давно стал ЕЮ. Назовите ЕЕ.", "answer": "Багира.", "complexity": "", "handout": "0"}, {"number": 27, "text": "Абсурдопедия приписывает этому французу идею, что бог является гармонической последовательностью божков и един в алеф-нуль лицах. Назовите этого француза.", "answer": "Фурье.", "complexity": "", "handout": "0"}, {"number": 27, "text": "Готовясь в 1930-х годах к войне в Тихом океане, японское руководство не без оснований полагало, что США не будут строить линейные корабли водоизмещением более 60 тысяч тонн. А теперь ответьте, падение чего вызвало драму в шутливом стихотворении Игоря Сапегина.", "answer": "Панама.", "complexity": "", "handout": "0"}, {"number": 27, "text": "На самом деле все получилось само собой: маркиза де Рамбуйе отличалась слабым здоровьем, но затворничества не хотела. Так в культуре того времени впервые появилось ЭТО. Что?", "answer": "Салоны.", "complexity": "", "handout": "0"}, {"number": 27, "text": "То, что историческую личность прозвали ЕЮ, объясняется просто: отказом от французской традиции в пользу родной. С ЕЕ исчезновения началась история одной страны. Назовите эту страну.", "answer": "Швамбрания.", "complexity": "", "handout": "0"}, {"number": 28, "text": "Перед вами — фрагмент социальной рекламы, призывающей обратиться к врачу прежде, чем ОН доберется до вас. Назовите ЕГО.", "answer": "Паркинсон.", "complexity": "", "handout": "1"}, {"number": 28, "text": "Не всё купишь за деньги. Однако уже во времена Римской империи малоазиатские служители культа были не прочь подзаработать. Жрецом малоизвестной богини Ге можно было стать за 10 драхм. Назовите бога, жрецом которого можно было стать за целых 10 тысяч драхм.", "answer": "Асклепий.", "complexity": "", "handout": "0"}, {"number": 28, "text": "Произведения Умберто Эко \"Баудолино\" и Ильфа и Петрова \"Двенадцать стульев\" — очень и очень разные. Однако если верить авторам, их отечески объединяют ДВЕНАДЦАТЬ АПОСТОЛОВ, появившиеся в 1904 году. Если верить КВН-овской шутке, ДВЕНАДЦАТЬ АПОСТОЛОВ — это палата в маленькой специализированной клинике. Какие слова мы заменили на \"ДВЕНАДЦАТЬ АПОСТОЛОВ\"?", "answer": "Шесть наполеонов.", "complexity": "", "handout": "0"}, {"number": 28, "text": "В заметке журнала \"LQ\", посвященной этой модели солнцезащитных очков, помимо ее создательницы, дизайнера Анны Тер Хаар, упоминается еще один европеец. Назовите его.", "answer": "Сальвадор Дали.", "complexity": "", "handout": "1"}, {"number": 28, "text": "Как известно, Лусиу Коста планировал Бразилиа как город будущего и строил его сразу как город XXI века. Очевидно, Коста не читал советских сатириков и счел, что в XXI веке в городах ИХ попросту не будет. Ответьте одним французским словом, чего же до сих пор нет в Бразилиа.", "answer": "Тротуаров.", "complexity": "", "handout": "0"}, {"number": 28, "text": "В сборнике эзоповых басен, собранных вольноотпущенником Федром, среди прочих персонажей упоминается царь Скилур, правивший на ныне украинской территории. Это обстоятельство позволило этнографу Джекобсу выдвинуть гипотезу, что у сборника был и второй автор. Назовите этого соавтора.", "answer": "Мудрец Анахарсис.", "complexity": "", "handout": "0"}, {"number": 28, "text": "ОН является правильным ответом на эвенкийскую загадку: \"По горе ходил, по реке плавал, в город вернулся\". А в студенческой песне после смерти ЕМУ поставили венок из силикатов. Назовите ЕГО.", "answer": "Геолог.", "complexity": "", "handout": "0"}, {"number": 28, "text": "Внимание, в вопросе есть замены.\nВ пародии \"Камеди-клаба\" \"Дом-2 через 60 лет\" пожилая Ксения Сергеевна Бородина сообщает пожилой Ксении Анатольевне Собчак, что Анна Семенович до сих пор ПОЕТ. В ответ Собчак заявляет: \"Я думала, она уже ПОМЕРЛА\". Мы не спрашиваем вас, какое слово мы заменили на слово \"ПОЕТ\". Ответьте, какие два слова мы заменили на \"ПОМЕРЛА\".", "answer": "Коньки откинула.", "complexity": "", "handout": "0"}, {"number": 29, "text": "Питание в космосе, хоть и вышло за пределы тюбиков, отличается от земного. Во-первых, все продукты поступают на орбиту в герметичной полиэтиленовой упаковке, подобно \"земным\" колбасным нарезкам. Обеденный стол представляет собой доску с магнитными держателями для трех столовых приборов. А какие это три прибора?", "answer": "Вилка, нож, ножницы.", "complexity": "", "handout": "0"}, {"number": 29, "text": "Внимание, в вопросе есть замена.\nОдесские студенты-филологи придумали песню о том, что ХАВБЕКИ — это не игра. По словам известного писателя, сперва он хотел поселить своих персонажей в современность, но потом разбудил в себе ХАВБЕКА от зимней спячки и отправил рыться в собственном архиве. Какой роман получился в итоге?", "answer": "\"Имя розы\".", "complexity": "", "handout": "0"}, {"number": 29, "text": "Детская карта Европы испещрена множеством забавных рисунков. В одном из европейских морей изображено судно, к мачте которого привязана женщина с рыбьим хвостом и лицом, искаженным гримасой муки. Догадавшись, что это за женщина, ответьте, кто изображен рядом с ней на палубе и что он при этом делает.", "answer": "Одиссей, поет.", "complexity": "", "handout": "0"}, {"number": 29, "text": "К награждению медалью \"За освоение целинных земель\" представлялись работники, проработавшие в районах освоения целинных и залежных земель, как правило, не менее двух лет. Но высокий гость, посетивший Саратовскую область с краткосрочным визитом, по некоторым данным, сразу после прибытия был представлен к этой награде. Назовите этого гостя.", "answer": "[Юрий] Гагарин.", "complexity": "", "handout": "0"}, {"number": 29, "text": "Назовите фамилию режиссера, который о диснеевских мультфильмах говорил так: \"Спросите любого ребенка, и он скажет, что в \"Пиноккио\" есть достаточно жуткие места. Помню, в какое я приходил возбуждение, когда смотрел его в детстве, помню, как кричали малыши\".", "answer": "Бёртон.", "complexity": "", "handout": "0"}, {"number": 29, "text": "Торговая марка, представляющая на Украине продукцию ведущих белорусских производителей мебели, называется двумя словами. Этими же двумя словами журналисты \"Магнолия-ТВ\" озаглавили сообщение о ДТП. Этими же двумя словами можно обратиться к исполнителю одной из ролей в фильме \"Властелин колец\". Напишите эти два слова.", "answer": "\"Здравствуй, дерево!\".", "complexity": "", "handout": "0"}, {"number": 29, "text": "В книге Борхеса \"Иной и прежний\" есть стихотворение, названное придуманным словом \"Everness\". Считается, что в нем Борхес полемизирует с другим автором, жившим за полтора столетия до Борхеса. Назовите этого автора.", "answer": "По.", "complexity": "", "handout": "0"}, {"number": 29, "text": "Лидия Гинзбург считала, что ПЕРВОГО читатель воспринимает \"как он есть\", во всяком случае — в его эстетических закономерностях, а ВТОРОГО судит не по его, а по своим законам. Назовите ПЕРВОГО и ВТОРОГО, если в СССР \"ПЕРВЫЕ и ВТОРЫЕ\" были весьма популярны у интеллигенции.", "answer": "Классик и современник.", "complexity": "", "handout": "0"}, {"number": 30, "text": "ПЕРВЫЙ — дикая арабская лошадь, которая может втащить вас на Монблан и свергнуть оттуда в трущобу. А ВТОРОЙ — умная, хорошо выезженная европейско-русская полукровка: на Монблан не втащит, но и в трущобу не заведет. О каких коллегах и соотечественниках так отзывался Лев Толстой соответственно?", "answer": "О Достоевском и Тургеневе.", "complexity": "", "handout": "0"}, {"number": 30, "text": "Когда Тур Хейердал со своей интернациональной командой занимался в Эль-Курне строительством \"Тигриса\", кто-то в шутку предложил заодно заняться и другим проектом, благо ходу было минут двадцать. Что же было предложено сделать?", "answer": "Восстановить Вавилонскую башню.", "complexity": "", "handout": "0"}, {"number": 30, "text": "На самом деле у этой, так сказать, заглавной героини было и другое название. Автор добавил к заглавному имени латинскую букву \"E\", и она из несуществующей стала благой или счастливой. Назовите ЕЕ.", "answer": "Утопия.", "complexity": "", "handout": "0"}, {"number": 30, "text": "Из письма адмирала Исакова жене, написанного в конце 30-х годов прошлого века: \"Нью-Йорк. 7-8 марта. Некогда отбирать хлеб у ПЕРВОГО и особенно у ВТОРОГО, поэтому в двух словах скажу об обстановке на лайнере...\". Назовите ПЕРВОГО И ВТОРОГО, упомянутых в непривычном порядке.", "answer": "Петров и Ильф.", "complexity": "", "handout": "0"}, {"number": 30, "text": "Народный календарь советует сеять горох при ущербной Луне на закате солнца. А кто является причиной таких сложностей?", "answer": "Птицы.", "complexity": "", "handout": "0"}, {"number": 30, "text": "Рассуждая о скучности похождений Джакомо Казановы, Федерико Феллини упоминал ЕЕ. В произведении Клиффорда Саймака в НЕЙ фигурировали названия звезд. Назовите ЕЕ.", "answer": "Телефонная книга.", "complexity": "", "handout": "0"}, {"number": 30, "text": "В последнее время в России всё популярнее становится вариант известного выражения, в котором фигурирует ривер. Назовите топоним, который также упоминается в этом выражении.", "answer": "Сочи.", "complexity": "", "handout": "0"}, {"number": 30, "text": "Титан — единственный из спутников планет Солнечной системы, у которого есть плотная атмосфера. Силы тяжести в одну седьмую земной хватает, чтобы удержать газовую смесь вдвое плотнее, чем на Земле. Специалисты отмечают, что именно на Титане один древний сюжет мог быть реализован на практике. Назовите имена двух главных действующих лиц этого сюжета.", "answer": "Дедал и Икар.", "complexity": "", "handout": "0"}, {"number": 31, "text": "Эпиграфом к вопросу может стать один пост в ЖЖ, в котором говорится, что почти все записи в \"Живом Журнале\" мотивированы одним чувством: \"Почему меня никто не любит?\". А теперь сам вопрос.\nЖЖ-френд автора вопроса очень удачно описала \"Живые Журналы\" своих френдов, а отчасти и большую часть блогосферы, всего тремя словами. Для этого ей пришлось вставить в произведение великого латиноамериканца одну букву. Что у нее в итоге получилось?", "answer": "Сто лент одиночества.", "complexity": "", "handout": "0"}, {"number": 31, "text": "12 октября 2004 года в Каракасе ЕГО статую скинули с постамента, а пьедестал расписали надписями \"ОН = геноцид\" и \"ОН = Буш\". По некоторым источникам, ЕГО тезка был выдающимся советским ученым. Назовите фамилию тезки.", "answer": "Хунта.", "complexity": "", "handout": "0"}, {"number": 31, "text": "Поэт описывал ЕГО так: \"Идиотское выражение сменяло эфиопское, зверское, царственное, каменно-титаническое, люциферическое, духовное, ангельское\". А знакомый автора вопроса, будучи маленьким мальчиком, называл ЕГО словом, наталкивающим на мысли о нечистоплотности. Назовите ЕГО.", "answer": "Сфинкс.", "complexity": "", "handout": "0"}, {"number": 31, "text": "О ком Илья Фаликов сказал: \"Он свел в себе Державина с Раскольниковым, Шаляпина с Базаровым, \"Гром победы, раздавайся!\" с \"Долой!\", Черную речку и Машук с Лубянкой\"?", "answer": "О Маяковском.", "complexity": "", "handout": "0"}, {"number": 31, "text": "В 373 году до н.э. греческий город Гелика был стерт с лица земли ужасным цунами. На следующее утро после катастрофы от некогда процветавшего города не осталось ничего, кроме торчащих из воды верхушек священного леса. Кому был посвящен этот лес?", "answer": "Посейдону.", "complexity": "", "handout": "0"}, {"number": 31, "text": "9 февраля 2005 года яхта-тримаран на подводных крыльях \"Гидроптер\" пересекла Ла-Манш за 34 минуты 24 секунды. Так впервые морское судно сумело перекрыть ЕГО достижение. Назовите ЕГО фамилию.", "answer": "Луи Блерио.", "complexity": "", "handout": "0"}, {"number": 31, "text": "В начале 1808 года состоялась аудиенция у самого Александра I, который разрешил продолжить службу под именем Александра Александрова. Назовите фамилию аудиента.", "answer": "Дурова.", "complexity": "", "handout": "0"}, {"number": 31, "text": "Князь Владимир Одоевский имел два парных псевдонима. Как расшифровывается первый — К.В.О. — понятно. Воспроизведите эксцентричный парный к К.В.О. псевдоним абсолютно точно.", "answer": "Ь.Ъ.Й.", "complexity": "", "handout": "0"}, {"number": 32, "text": "Внимание, в вопросе есть замены.\nВ списке фамилий жителей Хэмпшира на букву \"Б\" есть и ФИГЛИ, и МИГЛИ. Если когда-нибудь какой-нибудь ФИГЛИ сочетается браком с МИГЛИ и решит взять двойную фамилию, то получатся то ли \"куклы для выпускного\" по-болгарски, то ли название континента. Мы не спрашиваем вас, что мы заменили на \"ФИГЛИ\" и \"МИГЛИ\". Ответьте, как называется континент, если известно, что знаменитый путешественник на него спустился.", "answer": "Балнибарби.", "complexity": "", "handout": "0"}, {"number": 32, "text": "У одного столичного жителя был огромный, но совсем добродушный пес. Назовите двумя словами несуществующую породу, к которой он отнес своего пса.", "answer": "Московская несторожевая.", "complexity": "", "handout": "0"}, {"number": 32, "text": "Прослушайте анекдот на балетную тематику.\n— Вы слышали, постановщик потребовал 500 статистов.\n— В балетных костюмах?\n— Нет, в обычных.\nКакую роль отвел статистам постановщик?", "answer": "Заполнить зал.", "complexity": "", "handout": "0"}, {"number": 32, "text": "Это слово происходит от санскритского слова со значением \"светло-желтый\". На самом деле ОНА — не вид, а род. Что любопытно, из этого следует, что в известном произведении не только МАЛЬВИНА — ОНА, но и КАРАБАС-БАРАБАС — тоже ОНА. Какие слова мы заменили на \"МАЛЬВИНА\" и \"КАРАБАС-БАРАБАС\"?", "answer": "Багира и Шер-Хан.", "complexity": "", "handout": "0"}, {"number": 32, "text": "Перед вами — автограф, как мы сейчас говорим, управленца. Назовите позицию этого управленца абсолютно точно.", "answer": "Королева Франции.", "complexity": "", "handout": "1"}, {"number": 32, "text": "В романе Тибора Фишера во время ограбления кассирша вела себя так, будто СДЕЛАЛА ЭТО. Сообщение о том, что собака СДЕЛАЛА ЭТО, входит в классический арсенал школьника. А по мнению одного ЖЖ-юзера, еще одно животное, СДЕЛАВШЕЕ ЭТО, является символом течения времени, которое пытаются преодолеть герои. Назовите это животное.", "answer": "Крокодил.", "complexity": "", "handout": "0"}, {"number": 32, "text": "Древние египтяне почитали Исиду как вселенскую мать-богиню, обращались к ней за помощью и защитой, призывали в беде, произносили ее имя для защиты детей и семьи, в общем, решали с ее помощью самые главные жизненные вопросы. Назовите номер астероида, который носит имя Исида.", "answer": "42.", "complexity": "", "handout": "0"}, {"number": 32, "text": "Такая сыпь вызвана глубокими внутренними нарушениями. В средние века эта \"бабочка\" на лице напоминала людям укусы. Чьи?", "answer": "Волка.", "complexity": "", "handout": "1"}, {"number": 33, "text": "В 30-е годы XIX века задумывался альманах \"Тройчатка\", названный по числу авторов. Первые два автора — это профессор Ириней Модестович Гомозейко и Рудый Панько. Назовите фамилию третьего автора.", "answer": "Белкин.", "complexity": "", "handout": "0"}, {"number": 33, "text": "В природе эта особенность обусловлена накоплением в мышцах пигментов кантаксантина и астаксантина, содержащихся в панцирях планктонных рачков. Для достижения аналогичного результата в промышленности используются искусственные красители, чтобы общее название продукта соответствовало реальности. Что же это за название?", "answer": "Красная рыба.", "complexity": "", "handout": "0"}, {"number": 33, "text": "Городок Андермат расположен на границе Италии и Швейцарии и знаменит своей горной форелью и краеведческим музеем. Местные называют этот музей домом... Кого?", "answer": "Суворова.", "complexity": "", "handout": "0"}, {"number": 33, "text": "Писатель-фантаст Азимов отличался достаточно космополитичными взглядами и весьма огорчился после издания его книги в Израиле. Какое слово ему не понравилось?", "answer": "Исаак.", "complexity": "", "handout": "0"}, {"number": 33, "text": "В чем только не измеряют время! В фортнайтах, олимпиадах и пятилетках. А некоторые исследователи вообще перевели время в градусы и получили абсолютный ноль. А что они исследовали?", "answer": "Пьесу 4'33\".", "complexity": "", "handout": "0"}, {"number": 33, "text": "Согласно анекдоту, именно это сделал бы дагестанец, если бы у него была машина времени. Согласно словарю Ушакова, делать это — значит \"предписывать манеру поведения\". Так что неудивительно, что в Мюнхенской \"Баварии\", согласно газете \"РБК-daily\", манеру поведения предписывает ОН. Назовите ЕГО.", "answer": "Лука Тони.", "complexity": "", "handout": "0"}, {"number": 33, "text": "Специалисты говорят, что все дело было в красоте и личном обаянии, а мастерства танца не было никогда. Недаром в Париже Сергей Дягилев отказался принять ЕЕ в свою труппу. Назовите ЕЕ.", "answer": "Мата Хари.", "complexity": "", "handout": "0"}, {"number": 33, "text": "В относительно недавно вышедшей книге об уроженце Германии автор приводит версию, связанную с латинским словом, обозначающим быстроту, проворство. Напишите первую букву этого латинского слова.", "answer": "C.", "complexity": "", "handout": "0"}, {"number": 34, "text": "Внимание, в вопросе есть замена.\nВсе новое — это хорошо забытое старое. Внимание, цитата из поэмы, изданной в 1628 году:\nПересмотри свои занятья, ВАТСОН,\nПроверь до дна глубины всех наук.\nПо-прежнему будь богословом с виду,\nНо знаний всех ты цель определи.\n<...>\nТак чтенье брось! Ты цели той достиг,\nДостоин ты предмета выше, ВАТСОН.\nКакое слово мы заменили на \"ВАТСОН\"?", "answer": "Фауст.", "complexity": "", "handout": "0"}, {"number": 34, "text": "Внимание, в вопросе есть замены.\nСреди \"Микроскопических трагедий\", составленных Адамантом Полярным, есть и такая, на античную тему: \"Вернувшись с концерта, Жак застал Эммануэль в объятиях Жан-Жака\". Кого мы заменили на Жака, Эммануэль и Жан-Жака?", "answer": "Орфей, Эвридика, Морфей.", "complexity": "", "handout": "0"}, {"number": 34, "text": "В 576 году король Атанашильд сделал своей столицей неприметный Толетум. А куда перенесли столицу отсюда 985 лет спустя?", "answer": "В Мадрид.", "complexity": "", "handout": "0"}, {"number": 34, "text": "Вергилий описывает его, сражающимся с самим Зевсом и отражающим молнии Громовержца сотней щитов. Более близкий нам по времени источник, напротив, приписывает ему неуклюжесть и, как ее следствие, легкую травму. О ком идет речь?", "answer": "Бриарей.", "complexity": "", "handout": "0"}, {"number": 34, "text": "Владимир Набоков считал ЭТО ПРОИЗВЕДЕНИЕ научно-фантастическим. Любопытно, что в 1956 году, почти через 350 лет после написания, по сюжету ЭТОГО ПРОИЗВЕДЕНИЯ сняли настоящий фантастический фильм — \"Запретная планета\". Правда, отцом в фильме стал ученый Морбиус, дочерью — Альтаира, а остров превратился в планету Альтаир-4. Назовите ЭТО ПРОИЗВЕДЕНИЕ.", "answer": "\"Буря\".", "complexity": "", "handout": "0"}, {"number": 34, "text": "После того как известный в XVII веке Корнелиус де Брюин выпустил книгу с рисунками Малой Азии, Египта и островов Греческого архипелага, он получил прозвище. Такое же прозвище в разное время получали теннисист Том Оккер, конькобежец Йохем Юйтдехаге и даже бейсболист Хонус Вагнер — видимо, из-за фамилии. Назовите это прозвище.", "answer": "Летучий Голландец.", "complexity": "", "handout": "0"}, {"number": 34, "text": "По одной из версий, он считал подлинно революционным только то, что ничего не приносит, кроме ощущения свежего ветерка на шее. Что же он так описывал?", "answer": "Гильотинирование.", "complexity": "", "handout": "0"}, {"number": 34, "text": "Лирический герой песни группы \"Rekevin\" [рекЕвин] сетует, что его прикосновение к любимому человеку буквально ранит того. Имя, вынесенное в название этой песни, и в английском, и в русском языке содержит шесть букв. Воспроизведите это имя.", "answer": "Edward.", "complexity": "", "handout": "0"}, {"number": 35, "text": "Диалог от Константина Рылёва:\n— Одолжи гривну.\n— На.\n— Спасибо. Помнишь у Вознесенского: [Первый пропуск]?\n— Тогда цитируй дальше: [Второй пропуск].\nА какие слова отличают эти пропуски друг от друга?", "answer": "Забуду, увижу.", "complexity": "", "handout": "0"}, {"number": 35, "text": "Журнал \"Максим\" в каждом номере публикует придуманный в редакции \"Десктоп интересного человека\". На десктопе ЭТОГО человека открыта программа MyHeritage, которая ищет похожих на пользователей знаменитостей по фото. Среди похожих оказались Алексей Венедиктов, Хагрид, Лев Толстой, гном Гимли. Лидером же стал Чубакка, похожий на ЭТОГО человека на 110%. Назовите фамилию ЭТОГО человека.", "answer": "Вассерман.", "complexity": "", "handout": "0"}, {"number": 35, "text": "\"Это ж плакат! Это ж агитка!! Без психологической глубины. Зритель, прислушиваясь к их шуму, как-то стеснялся при них говорить: думать свою нехитрую думу: чем же [пропуск] все-таки морить\". Вы прослушали отрывок из пролога, написанного Николаем Асеевым к постановке Таирова, в котором мы пропустили одно слово. Чья пьеса ставилась?", "answer": "Маяковского.", "complexity": "", "handout": "0"}, {"number": 35, "text": "В одном из выпусков передачи \"Разрушители легенд\" проверку проходили различные средства, которые позволяют рождественской елке дольше стоять. Например, проверяли эффект применения лимонада, отбеливателя, лака для волос. А какое средство создатели передачи назвали \"маленький помощник Санты\"?", "answer": "Виагра.", "complexity": "", "handout": "0"}, {"number": 35, "text": "Помимо достижений техники, Мэттью Бартик создает и скульптуры людей. Фигурка за трибуной с молотком называется \"Судья\", человечек с микроскопом — \"Ученый\", человечек с блокнотом и ручкой — \"Журналист\". А как называется фигурка, сжимающая в ручках полноразмерную вилку?", "answer": "\"Автопортрет\".", "complexity": "", "handout": "0"}, {"number": 35, "text": "Перед вами — актуальная цитата из стихотворения Юнны Мориц. Добавим, что в последнее время в графе ПРОПУСК 2 становится все больше ПРОПУСК 1. Восстановите оба пропуска.", "answer": "Ссылок, источник.", "complexity": "", "handout": "1"}, {"number": 35, "text": "Через несколько лет работы ОН стал жаловаться на \"профзаболевание\" — сильную боль в плече. Однако подавать в суд на работодателей ОН не намерен — ведь каждый эпизод ЕГО трудовой деятельности весьма неплохо оплачивается. Назовите ЕГО.", "answer": "Хью Лори.", "complexity": "", "handout": "0"}, {"number": 35, "text": "В 961 году византийцы осаждали критскую крепость Кандакс, гарнизон которой упрямо сопротивлялся. Желая высмеять бессмысленность сопротивления, византийский военачальник приказал с помощью метательных машин забросить на территорию крепости \"снаряд\" массой примерно 160 килограммов. Назовите этот \"снаряд\".", "answer": "Осел.", "complexity": "", "handout": "0"}, {"number": 36, "text": "В 1956 году некий безымянный объект потерял в одном из своих параметров 209 метров, что составляло почти 7% этого параметра. Назовите причину этого катастрофического изменения.", "answer": "Извержение.", "complexity": "", "handout": "0"}, {"number": 36, "text": "На десктопе Анатолия Вассермана, придуманном редакцией журнала \"Максим\", открыта папка \"Мой компьютер\", в которой существует три объекта. Диск 3,5 (A), Локальный диск (C). Назовите третий объект.", "answer": "Жилетка (Ж).", "complexity": "", "handout": "0"}, {"number": 36, "text": "Герой одного эссе Оскара Уайлда утверждает, что природа меркнет перед НЕЮ — учитывая, как на траве твердо, колко и мокро. А актриса Элизабет Хёрли, согласно сайту kinokadr.ru, во всех своих фильмах играет одну и ту же роль — роль ЕЕ. Назовите ЕЕ собирательным существительным.", "answer": "Мебель.", "complexity": "", "handout": "0"}, {"number": 36, "text": "Заполните пропуски во фрагменте стихотворении Льва Лосева однокоренными словами.", "answer": "Шарманка, шарман.", "complexity": "", "handout": "1"}, {"number": 36, "text": "В наше время ПЕРВУЮ часто считают синонимом ВТОРОЙ. И не удивительно: ведь порой для того, чтобы ВТОРУЮ назвали именно ВТОРОЙ, необходима гибель человека, иначе событие назовут по-латыни. А вот в Древней Греции ВТОРАЯ была неотделима от ПЕРВОЙ, ибо развитие ПЕРВОЙ всегда неизбежно приводило ко ВТОРОЙ. Назовите ПЕРВУЮ и ВТОРУЮ в правильном порядке.", "answer": "Трагедия, катастрофа.", "complexity": "", "handout": "0"}, {"number": 36, "text": "В одной из комических пьес действие начинается на высоте 2911 метров. Секретарь предлагает главному герою обратиться к знакомому чучельщику, чтобы тот переделал свинью. В результате герой должен был получить приличный гонорар, хоть и с четвертой попытки. А кто является \"заказчиком\" нашего героя?", "answer": "Эврисфей.", "complexity": "", "handout": "0"}, {"number": 36, "text": "ИХ пытались даже учить и разработали учебную модель с посадочной лыжей и кабиной второго пилота. Назовите ИХ.", "answer": "Камикадзе.", "complexity": "", "handout": "0"}, {"number": 36, "text": "В статье, опубликованной на сайте Infox.ru [инфокс ру], утверждается, что из-за финансового кризиса ПЕРВАЯ в США скоро исчезнет. Дело в том, что одна ПЕРВАЯ обходится в среднем в два миллиона долларов и, что может показаться удивительным, гораздо дороже ВТОРОГО. Назовите ПЕРВУЮ и ВТОРОЕ.", "answer": "Смертная казнь и пожизненное заключение.", "complexity": "", "handout": "0"}, {"number": 37, "text": "Перед вами — названия композиций из саундтрека к фильму. Назовите этот фильм.", "answer": "\"Матрица\".", "complexity": "", "handout": "1"}, {"number": 37, "text": "Цитата. \"Зворыкин в начале 1920-х эмигрировал в США и там создал телевизионный приемник-кинескоп. Поддержал Зворыкина Дэвид СарнОв, а создать телепередатчик помог Оглобинский. В общем, телевизионная...\". Названием какого фильма начала 90-х заканчивается цитата?", "answer": "Россия, которую мы потеряли.", "complexity": "", "handout": "0"}, {"number": 37, "text": "24 декабря 1773 года Сенат издал указ, в котором от властей на местах требовалось \"возобновить те осторожности, которые по причине бывшей моровой язвы к исполнению всем селениям предписаны были\". Назовите причину этого повторного указа.", "answer": "Восстание Пугачева.", "complexity": "", "handout": "0"}, {"number": 37, "text": "Внимание, в вопросе есть замена.\nНакануне Второй мировой войны японское руководство считало линкоры главной ударной силой флота. Но адмирал Ямамото Исороку придерживался мнения о решающей роли авианосцев и говорил о линкорах так: \"Линкоры будут полезны Японии в будущей войне так же, как ЯПОНСКИЙ ГОРОДОВОЙ\". После капитуляции Японии страны антигитлеровской коалиции издали приказ об уничтожении всех ЯПОНСКИХ ГОРОДОВЫХ, однако впоследствии приказ изменили. Что мы заменили словами \"ЯПОНСКИЙ ГОРОДОВОЙ\"?", "answer": "Самурайский меч.", "complexity": "", "handout": "0"}, {"number": 37, "text": "ОН с отличием окончил физико-математическую школу, отказался присутствовать на вручении одной из самых престижных наград в ЕГО области деятельности, входит в список ста ныне живущих гениев, составленный \"The Daily Telegraph\". А вот гипотеза о том, что ОН — сын знаменитого ленинградца, скончавшегося от общего истощения, вызванного голодом во время блокады, не верна. Назовите фамилию этого знаменитого ленинградца.", "answer": "Перельман.", "complexity": "", "handout": "0"}, {"number": 37, "text": "Персонаж романа Жозе Сарамаго, рассуждая о том, как бы наверняка узнать, вражеское судно появилось на горизонте или рыбацкое, хотел бы призвать в помощь ПЕРВЫХ или ВТОРЫХ, но замечал, что ПЕРВЫЕ не владеют речью, а ВТОРЫХ он и вовсе сроду не видывал. Иллюстрируя известный бестселлер, украинский художник Владислав Ерко изобразил ВТОРЫХ вместо ПЕРВЫХ. Назовите писателя, книгу которого иллюстрировал Ерко.", "answer": "Ричард Бах.", "complexity": "", "handout": "0"}, {"number": 37, "text": "Шведский писатель и путешественник Бенгт Даниэльссон рассказывает, как пираты и контрабандисты в Тихом океане решали проблему запасов свежего мяса в плавании. На борту появлялись \"пассажиры\", которые могли по несколько месяцев жить на судне, не требуя воды. Назовите место в Тихом океане, где, если судить по названию, очень много таких \"пассажиров\".", "answer": "Галапагосы.", "complexity": "", "handout": "0"}, {"number": 37, "text": "Блиц.\n1. Согласно книге о \"кино и буржуазной массовой культуре\", если подогнать классическое произведение под стандарты масскульта, то ОНИ будут демонстрировать раннюю испорченность. Назовите ИХ.\n2. Согласно книге о \"кино и буржуазной массовой культуре\", если подогнать классическое произведение под стандарты масскульта, то ОН превратится в психопата — героя триллера. Назовите ЕГО.\n3. Согласно книге о \"кино и буржуазной массовой культуре\", если подогнать классическое произведение под стандарты масскульта, то ОНА станет персонажем из \"Комнаты ужасов\". Назовите ЕЕ.", "answer": "1. Ромео и Джульетта.\n2. Гамлет.\n3. Леди Макбет.", "complexity": "", "handout": "0"}, {"number": 38, "text": "Несмотря на поговорку, человечество не перестает изобретать велосипед. А житель Китая Гуан Байхуа пошел куда дальше большинства. На его велосипеде у переднего колеса — пять, а у заднего — три. Чего?", "answer": "Угла.", "complexity": "", "handout": "0"}, {"number": 38, "text": "В своем ЖЖ поэт Александр Кабанов приводит фрагмент письма от некой Светланы. Очевидно, при помощи слегка измененных в угоду эпистолярному жанру строк романса девушка намекает на невозможность сближения с адресатом. Какими четырьмя словами она это делает?", "answer": "\"С ней не надо\".", "complexity": "", "handout": "0"}, {"number": 38, "text": "В то время часто печаталась негативная информация о социально-экономической системе одной из стран, и молодой Пушкин в напутствии товарищу, уезжавшему на дипломатическую службу, использовал эпитет \"мрачный\". Мы же гораздо чаще используем \"натуральный\" эпитет. Какой?", "answer": "Туманный.", "complexity": "", "handout": "0"}, {"number": 38, "text": "Почитатели этого человека говорили, что тот совершил \"эйнштейновский переворот\" в этике. О ком идет речь?", "answer": "Об Альберте Швейцере.", "complexity": "", "handout": "0"}, {"number": 38, "text": "Прослушайте фрагмент белого стихотворения Октавио Паса, в котором мы пропустили первую строку:\n\"Остановился я. И повернулся\nСпиною к будущему:\n\"там не ждут меня\" —\nИ пройденным уже путем пошел\".\nА теперь восстановите первую строку.", "answer": "\"Земную жизнь пройдя до половины\".", "complexity": "", "hando

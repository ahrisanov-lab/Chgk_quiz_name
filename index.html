 {"number": 8, "text": "Персонаж пьесы Шекспира \"Тимон Афинский\", обвиняя другого персонажа в сумасбродстве, замечает:\n\"Ты полагаешь <...>\nчто к тебе в пажи наймутся эти\nГРАФЫ <...>,\nИ будут бегать за тобою?\"\nКакое слово мы заменили словом \"графы\"?", "answer": "Деревья.", "complexity": "", "handout": "0"}, {"number": 8, "text": "В одном из рассказов Конан-Дойл сравнил ЕЕ с клювом какой-то странной птицы. Назовите ЕЕ тремя словами.", "answer": "Трубка Шерлока Холмса.", "complexity": "", "handout": "0"}, {"number": 8, "text": "Сергей вспоминал, что даже на прогулках не разлучался с полученным от матери подарком, и он торчал тогда из рукава его полушубка. Назовите фамилию Сергея.", "answer": "Образцов.", "complexity": "", "handout": "0"}, {"number": 8, "text": "Имя этой уроженки городка Струмице означает \"Приносящая добрые вести\". Назовите ее.", "answer": "Ванга.", "complexity": "", "handout": "0"}, {"number": 9, "text": "Зритель инсталляции Жана ДюпюИ видит камеру, дно которой представляет собой мембрану, усыпанную красной пылью. Звук, передающийся на эту мембрану, подбрасывает пыль вверх. Назовите этот звук.", "answer": "Стук сердца.", "complexity": "", "handout": "0"}, {"number": 9, "text": "При приготовлении так называемого \"Баклажанного ИКСА\" баклажаны надрезаются вдоль до плодоножки, так чтобы сама плодоножка осталась нетронутой, после чего обжариваются и раскладываются на блюде. Японские повара иногда используют ИКС, имея дело со сваренным рисом, предназначенным для суши. Назовите ИКС.", "answer": "Веер.", "complexity": "", "handout": "0"}, {"number": 9, "text": "Индийская кобра, у которой рисунок на спинной стороне чаще всего состоит из одного кольца, называется \"левой\" коброй. Напишите пять букв, которые мы пропустили в предыдущем предложении.", "answer": "монок.", "complexity": "", "handout": "0"}, {"number": 9, "text": "Автор одного рассказа пишет, что войско Уильяма Уолласа перед битвой с англичанами ощетинилось копьями, словно ОН. В известном фильме девочка преподносит Уолласу ЕГО. Назовите ЕГО.", "answer": "Чертополох. Незачет: Еж, дикобраз.", "complexity": "", "handout": "0"}, {"number": 9, "text": "Вспоминая о НЕМ своего детства, Жан Поль Сартр упоминает \"мигающие пейзажи, иссеченные ливнями\" и \"огненный астероид\", перелетающий \"вдруг через гостиную какой-нибудь баронессы\". Назовите ЕГО.", "answer": "Кино.", "complexity": "", "handout": "0"}, {"number": 9, "text": "По легенде, когда вода в одном индейском ручье становилась красной, как кровь, ручей можно было перейти пешком. Статья в журнале \"GEO\", излагающая эту легенду, упоминает ЕГО. Согласно одному соннику, ОН символизирует стремление вперед наперекор всему. Назовите ЕГО.", "answer": "Лосось.", "complexity": "", "handout": "0"}, {"number": 10, "text": "В исламе самитами называют помощников пророка, задача которых — объяснять его высказывания. Под каким другим именем известен самит Бутрус?", "answer": "Петр.", "complexity": "", "handout": "0"}, {"number": 10, "text": "Давид Ливингстон писал, что \"глупый ХОЛОП ревет так же громко, как ПАН\". Фирма \"ПАНИ ХОЛОПП\" с 1996 по 1999 годы потеряла 28% объемов продаж из-за того, что не хотела расширять свою продукцию. Какие слова мы заменили на \"ПАН\" и \"ХОЛОП\"?", "answer": "Лев, страус.", "complexity": "", "handout": "0"}, {"number": 10, "text": "Эту фамилию носит шериф в романе Набокова \"Лолита\". Кем стал известный носитель этой фамилии через 17 лет после публикации \"Лолиты\"?", "answer": "Чемпионом мира по шахматам.", "complexity": "", "handout": "0"}, {"number": 10, "text": "Описывая архитектурную выставку, Кирилл Журенков сравнил себя с литературным персонажем. Каким?", "answer": "Гулливером.", "complexity": "", "handout": "0"}, {"number": 10, "text": "Однажды в лаборатории у автора вопроса вышел из строя дорогостоящий прибор. Инженер выяснил причину неисправности — отверстие диаметром 50 микрон забилось грязью — и стал ДЕЛАТЬ ЭТО, хотя ситуация не была безнадежной. Ответьте фразеологизмом, что такое \"ДЕЛАТЬ ЭТО\"?", "answer": "Рвать на себе волосы.", "complexity": "", "handout": "0"}, {"number": 10, "text": "В пьесе \"Троил и Крессида\" среди действующих лиц есть тезка героя другой пьесы Шекспира. Назовите их общее имя.", "answer": "Парис.", "complexity": "", "handout": "0"}, {"number": 11, "text": "В 2008 году в одном журнале был опубликован фантастический рассказ, в котором преемником Владимира Путина стал не либеральный Дмитрий Медведев, а жесткий Сергей Иванов. Последние два слова этого рассказа начинаются на одну и ту же букву. Напишите эти два слова.", "answer": "Грянул гром.", "complexity": "", "handout": "0"}, {"number": 11, "text": "Автор этого снимка озаглавил его словом, которым Кора Ландау назвала некрасивую, по ее мнению, Лидию Чуковскую. Напишите это слово.", "answer": "Крокодил.", "complexity": "", "handout": "1"}, {"number": 11, "text": "После трагической смерти своей жены ОН написал \"Смерть Беатриче\". Назовите ЕГО.", "answer": "Данте Габриэль Россетти.", "complexity": "", "handout": "0"}, {"number": 11, "text": "Однажды отец Мюло, взбешенный очередной жестокой шуткой кардинала Ришелье, прилюдно воскликнул: \"Вы злодей!\". В ответ на это кардинал обвинил святого отца в нарушении... Чего?", "answer": "Тайны исповеди.", "complexity": "", "handout": "0"}, {"number": 11, "text": "Путешествовавший по России в начале XIX века Робертсон писал, что его поездка едва не закончилась трагически, когда ИКСОМ ему чуть не вдребезги разбили крышу повозки. Назовите ИКС словом немецкого происхождения.", "answer": "Шлагбаум.", "complexity": "", "handout": "0"}, {"number": 11, "text": "Решив расширить круг приобщенных к классике, лондонский \"Ковент-Гарден\" продавал билеты на открытие нового сезона только \"ЕГО\" читателям. Благодаря классическому же искусству, несколько веков назад ИМ стал человек из другой европейской страны. Назовите этого человека.", "answer": "Людовик XIV.", "complexity": "", "handout": "0"}, {"number": 12, "text": "Герои новеллы Акутагавы, написанной в 1920-х годах, — собаки. Одна из них — белый пес с вполне подходящей для него кличкой, а другую хозяева ласково называют Напотяном. Автор вопроса предположил, что эту новеллу читал другой писатель. Назовите этого писателя.", "answer": "Оруэлл.", "complexity": "", "handout": "0"}, {"number": 12, "text": "В одном советском фильме рассказывается, как остаток армии Врангеля пытается сопротивляться после августовского разгрома 1920 года. В фильме звучит пессимистичная белогвардейская песня. Ее название с точностью до падежа совпадает с названием другой песни, которая, вероятно, посвящена Пушкину. Напишите это название.", "answer": "\"В последнюю осень\".", "complexity": "", "handout": "0"}, {"number": 12, "text": "В 1927 году вышел перевод на иврит одной книги. В этом переводе одного из персонажей называют Бен Нисан. А как этого персонажа называют в известных русских переводах?", "answer": "Мартовский заяц.", "complexity": "", "handout": "0"}, {"number": 12, "text": "В начале XX века Максимилиан из-за страха перед погромами симулировал болезнь, придав своему лицу болезненный желтый вид, и уехал из России сначала в Карлсбад, а потом и в США, Впоследствии он прославился в Голливуде, где работал, например, с Филлис Хэйвер, комической актрисой, мечтавшей о ролях женщины-вамп. Назовите фамилию Максимилиана.", "answer": "Фактор.", "complexity": "", "handout": "0"}, {"number": 12, "text": "Это слово обозначает устаревшее воинское звание. Автор вопроса назвал этим словом президента Гровера Кливленда, увидев один из его портретов. В последнее время это слово получило новое значение. Напишите это слово.", "answer": "Тысячник.", "complexity": "", "handout": "0"}, {"number": 12, "text": "Согласно иудейскому мифу, на земле живут огромные и свирепые буйвол и буйволица. Однажды одному человеку пришлось привязать их за рога. Назовите то, к чему он их привязал.", "answer": "Ноев ковчег.", "complexity": "", "handout": "0"}, {"number": 13, "text": "В 1893 году в Чикаго властями была конфискована картина художника-реалиста, показанная на художественной выставке. Под угрозой судебного преследования художника заставили перечеркнуть красными линиями некоторые изображенные предметы. Какие именно?", "answer": "Долларовые банкноты.", "complexity": "", "handout": "0"}, {"number": 13, "text": "[Ведущему: отточие в цитате игнорировать.]\nТатьяна Михайлова так пишет о романе Оксаны Робски: \"В отличие от канонических текстов западной гламурной литературы <...>, в романе \"Casual\" поразительно мало эмоций. ИКС, парализующий все внешние проявления эмоциональности, становится главной метафорой этой книги\". Какое слово мы заменили на \"ИКС\"?", "answer": "Ботокс.", "complexity": "", "handout": "0"}, {"number": 13, "text": "Кружок на розданной вам картинке находится сверху. Для какого небесного тела из Солнечной системы предлагается такой символ?", "answer": "Харон.", "complexity": "", "handout": "1"}, {"number": 13, "text": "Героиня новеллы Жорж Санд среди туч разглядела только созвездие Льва. В руках у героини в этот момент был предмет длиной около четырех метров. Назовите город — место действия новеллы.", "answer": "Венеция.", "complexity": "", "handout": "0"}, {"number": 13, "text": "Перед вами ОНА из спаржи, изготовленная по рецепту повара из Дартмута. В 1838 году для юной девушки изготовили облегченную ЕЕ из совсем других ингредиентов. Назовите имя этой девушки.", "answer": "Виктория.", "complexity": "", "handout": "1"}, {"number": 13, "text": "Рассказывают, что граф Глостер, узнав о грозящей Роберту Брюсу опасности, передал тому ИХ, подсказывая таким образом, что необходимо бежать. Назовите ИХ одним словом.", "answer": "Шпоры.", "complexity": "", "handout": "0"}, {"number": 14, "text": "Перед вами рисунок с \"Конкурса злобного детского рисунка\". Воспроизведите состоящее из двух слов название рисунка, которое мы закрыли белым прямоугольником.", "answer": "Бенгальский тигр.", "complexity": "", "handout": "1"}, {"number": 14, "text": "В статье об ЭТОМ рассказывается, как в 1945 году в Германии летчикам приходилось садиться на взлетно-посадочную полосу, на которой они видели воронки, куски бетона и даже траншею. Назовите ЭТО словом французского происхождения.", "answer": "Камуфляж.", "complexity": "", "handout": "0"}, {"number": 14, "text": "Рассказывая о дебатах в английском парламенте времен Генриха IV, Чарльз Диккенс пишет, что однажды на полу оказались сразу сорок ИХ. Назовите ИХ.", "answer": "Перчатки.", "complexity": "", "handout": "0"}, {"number": 14, "text": "Перед вами фотографии экспонатов из одной коллекции. Назовите женщину, портрет которой вы видите на одном из них.", "answer": "Николь Барб Клико-Понсардэн.", "complexity": "", "handout": "1"}, {"number": 14, "text": "Сюжет повести \"Старик и море\", по словам Дмитрия Быкова, сводится к двум известным историям, в каждой из которых действует пожилая супружеская пара. Назовите обе эти истории.", "answer": "\"Сказка о рыбаке и рыбке\", \"Репка\".", "complexity": "", "handout": "0"}, {"number": 14, "text": "Перед вами рисунок индейцев Юкатана. Существо, изображенное в правом верхнем углу, можно назвать двумя словами, которыми, с точностью до капитализации, обычно называют мультипликационную героиню. Напишите эти два слова.", "answer": "Пчела майя.", "complexity": "", "handout": "1"}, {"number": 15, "text": "В романе Фенимора Купера \"Следопыт\" индеец презрительно называет этот предмет \"глазом бледнолицего\". В том же романе прозвищем притягательной девушки стало то, что может помешать воспользоваться этим предметом. Назовите этот предмет.", "answer": "Компас.", "complexity": "", "handout": "0"}, {"number": 15, "text": "В повести Пола Гэллико человек, обращаясь к врачу, просит: \"Спасите мои глаза\". Назовите специальность врача.", "answer": "Ветеринар.", "complexity": "", "handout": "0"}, {"number": 15, "text": "Карету, в которой прибыла во Флоренцию красавица Симонетта Веспуччи, возлюбленная Джулиано Медичи, современники художника сравнивали с НЕЙ. Назовите ЕЕ одним словом.", "answer": "Раковина.", "complexity": "", "handout": "0"}, {"number": 15, "text": "Подписанный в 1813 году Гюлистанский договор провозглашал ТАКОЙ мир между российским самодержавием и ИКСОМ. ТАКОЙ ИКС сам по себе, как правило, приводит к заключению \"мира\". Что мы заменили словами \"такой икс\"?", "answer": "Вечный шах.", "complexity": "", "handout": "0"}, {"number": 15, "text": "В фильме Эмира Кустурицы показана псевдоцерковь имени великого футболиста Марадоны. После окончания одной церковной церемонии в фильме используется футбольный мяч. А какой предмет используется в таких случаях обычно?", "answer": "Букет невесты.", "complexity": "", "handout": "0"}, {"number": 15, "text": "Короткое стихотворение Ирины Ермаковой начинается так: \"Кривая алая молния вспорола бледное небо\". А заканчивается словами: \"Улыбайся, уходя [пропуск]\". Восстановите пропущенное наречие.", "answer": "По-японски.", "complexity": "", "handout": "0"}, {"number": 34, "text": "Во время отпуска некая Пейдж Бейли включает на своей рабочей электронной почте текстовый автоответчик. Напишите три символа, с которого начинается текст ее автоответчика.", "answer": "404.", "complexity": "67.58", "handout": "0"}]}, {"id": "5122", "title": "РЧ-пак весна-22", "questions": [{"number": 0, "text": "[Указание ведущему: Выделить голосом слово «малако», сделать акцент на обе буквы «а»]\nНулевой вопрос. За него команды не получат очко. Он необходим для разминки и проверки технической части. Автору очень нравится коктейль из местного ресторана. В состав коктейля входят текила, копчёный вермут, шраб фейхоá, кампáри и, конечно же, сок. А вот «малакó» в состав не входит. Как называется этот коктейль?\nВремя.", "answer": "Заводной апельсин.", "complexity": "", "handout": "0"}, {"number": 1, "text": "В 19-м веке велись споры на тему, чтó является основной причиной формирования геологических пластов. Одни учёные, названные уплотнúстами, связывали этот процесс с явлениями, происходящими под Землёй. В вопросе одно слово немного изменено. Мы не просим вас писать это слово в исходном виде. Ответьте, каким словом называли сторонников другой теории, согласно которой геологические пласты формировались силами вод мирового океана. Время.", "answer": "Нептунúст (в любом числе и падеже; незачёт: посейдонист)", "complexity": "50.00", "handout": "0"}, {"number": 2, "text": "Из рассказа Толстóго мы узнаём историю человека, который вырос в благородной семье, получил отличное образование, однако после крайне неприятного поступка был арестован, утратил поддержку отца и был отправлен на войну простым солдатом. Название рассказа заканчивается словом «Плутóн». Какое страдательное причастие, хотя, скорее, всё-таки существительное, заменено на «Плутон»? Время.", "answer": "Разжалованный", "complexity": "0.00", "handout": "0"}, {"number": 2, "text": "Сотрудники новосибирского рекламного агентства \"Бонжур\" называют ЭТО самым посещаемым ресурсом Интернета. А в какой день в связи с этим они предлагают отмечать праздник Интернета?", "answer": "4 апреля. Самый посещаемый ресурс Интернета — Error 404.", "complexity": "", "handout": "0"}, {"number": 3, "text": "Слова ТАКОЙ и СЯКОЙ заменяют слова, которые произносятся одинаково. Геологи, говоря о ТАКОЙ природе изучаемых объектов, имеют в виду, что они покинули места своего образования, вследствие чего их состав и структура заметно отличаются от окружающих пород. Один психолог считал, что освобождение человечества состоит в осознании СЯКОЙ природы человека. Восстановите любую из замен. Время.", "answer": "Эрратический/ эротический (зачёт по одному любому слову, допускается писать слово «эрратический» с одной «р» или через «о»)", "complexity": "50.00", "handout": "0"}, {"number": 4, "text": "Немного политологии. Все федеративные государства можно разделить на централизованные и децентрализованные. Но критерии такого разделения у разных учёных различны: кто-то рассматривает соотношение федеральных и региональных налогов, кто-то – соотношение федеральных и региональных законов или полномочий. Автор считает Россию централизованным государством ровно на 7/8 (семь восьмых). Назовите одним или двумя словами то, что автор получил мартовским утром 2018-го года, ознакомился и сделал этот вывод. Время.", "answer": "[Избирательный] бюллетень", "complexity": "50.00", "handout": "1"}, {"number": 5, "text": "Один магазин имеет интересное название. Его написание латиницей наводит на мысль, что торгует он рентгеновским оборудованием, а русское написание ассоциируется у автора с блаженством, которое ощущают покупатели от низких цен и образцового обслуживания. Однако одна покупательница была крайне недовольна посещением магазина и написала отзыв, в котором поменяла смысл названия магазина на противоположный, заменив первые три буквы двумя буквами. Какими двумя буквами? Время.", "answer": "Ад (зачёт: буквы «а» и «д» через пробел или запятую; незачёт: «да», «д, а» и т.п.)", "complexity": "50.00", "handout": "0"}, {"number": 6, "text": "[Указание ведущему: Выделить голосом слово ФАМИЛИЮ] К нему прилагается раздаточный материал: Автор вводил в интернет-поисковике однотипные запросы с фамилиями норвежских двоеборцев и обнаружил, что, оказывается, многократный чемпион мира Рúибер и олимпийские чемпионы Грóбак и Лỳндберг не очень популярны в России. Зато ЭТОТ ДВОЕБОРЕЦ, не ставший ни чемпионом мира, ни олимпиóником, выдаёт по запросу более 20 тысяч результатов, вероятно потому, что кое-что придумал. Назовите его ФАМИЛИЮ. Время.", "answer": "[Гỳндер] Гỳндерсен/ [Gunder] Gundersen (также в зачёте другие варианты написания фамилии, соответствующие норвежско-русской транскрипции: «нн» вместо «нд», «рш» или «ш» вместо «рс»)", "complexity": "50.00", "handout": "1"}, {"number": 7, "text": "Автор не смог найти ни одного вопроса ЧГК про австрийца Карла Эйлера… Зато про его, можно сказать, коллег: шведа, немца, норвежца и другого австрийца – вопросов ЧГК очень много. Назовите любого из перечисленных коллег Эйлера. Время.", "answer": "[Вéрнер] Рúттбергер/ [Ӳльрих] Сáльхов/ [Алóиз/Алóис] Луц/Лутц/ Ӓксел[ь] Пáул[ь]сен (последний – зачет по имени или фамилии, остальные – зачёт по фамилии) (зачёт: то же самое латиницей: [Werner] Rittberger/ [Karl Emil Julius Ulrich] Salchow/ [Alois] Lutz/ [Axel] Paulsen)", "complexity": "0.00", "handout": "0"}, {"number": 8, "text": "Великий конькобежец Свен Хóффман прибыл на Чемпионат Европы в классическом многоборье, будучи чемпионом этих соревнований прошлых лет и явным фаворитом. По мнению экспертов, если он не упадёт и не спутает дорожки, то точно выиграет. Вышедшая вскоре статья о его победе называлась так же, как фильм – обладатель пяти премий Оскар. Какое слово мы заменили в первом предложении вопроса? Время.", "answer": "Крáмер/ Kramer", "complexity": "0.00", "handout": "0"}, {"number": 9, "text": "[Указание ведущему: Чуть выделить голосом фразу ПОЗЖЕ ВСЕХ] Однажды утром в Орле шёл сильный и продолжительный дождь. Из-за него автор вопроса, как и многие коллеги, опоздал на работу. Про коллегу, который пришёл в офис ПОЗЖЕ ВСЕХ, автор сказал: «Должно быть, ты использовал один из четырёх!» Какие два слова на парные согласные заменены на «использовал один из четырёх»? Время.", "answer": "Приплыл брассом (зачёт: плыл/плавал вместо «приплыл», применил брасс; незачёт: ответы с упоминанием баттерфляя – отсечка «позже всех»)", "complexity": "50.00", "handout": "0"}, {"number": 10, "text": "$1a", "answer": "", "complexity": "50.00", "handout": "0"}, {"number": 11, "text": "Два брата получили необычное поручение: распределить между животными и людьми все умения, которые помогут тем в жизни. Увидев, как один брат раздал все самые важные умения животным, другой брат пожалел людей: научил их ремесленным и научным секретам, а также, на свой страх и риск, СДЕЛАЛ для них ЭТО. Какие 2 слова заменены на СДЕЛАЛ ЭТО? Время.", "answer": "Украл огонь (зачёт: принёс огонь, передал огонь, подарил огонь и др. синонимичные ответы)", "complexity": "0.00", "handout": "0"}, {"number": 12, "text": "[Указание ведущему: В 1-м вопросе дуплета выделить голосом слова ПРОЖИЛ и КОЛЛЕГА] Дуплет! 2 вопроса по 30 секунд размышления на каждый. Чтобы получить очко, команда должна ответить верно на оба вопроса. Ответы на оба вопроса нужно сдать на одном бланке по окончании минуты. К дуплету прилагается раздаточный материал:\n1. 16 февраля 2002 года французы начали сбор средств на памятник ему. Можно сказать, что он ПРОЖИЛ около 640 лет. Назовите его. Подскажем, что его российский КОЛЛЕГА сравняется с ним через почти 200 лет. Время.\n2. Один советский драматург, однофамилец двух композиторов, решил сократить свою фамилию. Вместо того чтобы отбросить последний слог и стать однофамильцем игрока «Что? Где? Когда?», он отбросил первые два слога, тем самым подчеркнув этнические корни. Какая фамилия получилась в итоге? Время.", "answer": "1. [Французский] франк.\n2. Штейн", "complexity": "0.00", "handout": "1"}, {"number": 13, "text": "К нему прилагается раздаточный материал: Перед вами стойка для микрофона одного рок-певца, разработанная известным художником и дизайнером. Назовите заглавного персонажа фильма, образ которого был создан этим же художником примерно двадцатью годами ранее. Время.", "answer": "Чужой (зачёт: чужие, alien[s]; незачёт: ксеноморф – отсечка «заглавный персонаж», также незачёт: особь/species (спэшес) – отсечка «двадцатью годами ранее»)", "complexity": "50.00", "handout": "1"}, {"number": 14, "text": "[Указание ведущему: Выделить голосом фразу \"некий дополнительный показатель\"] К нему прилагается раздаточный материал: Уважаемые знатоки, для ответа на этот вопрос вам помогут умение считать или знание футбольной истории. Представьте, что несколько футбольных клубов проводят турнир по правилам чемпионата СССР 47-го года. Каждый клуб играет с каждым по 2 раза, но за победу даются два очка, а не три. Место в турнире определяется по очкам, а при их равенстве смотрят на некий дополнительный показатель. На раздатке видно, что перед последним туром Вымпел уступает лидеру два очка. В последнем туре эти клубы играют между собой, и Метеор в начале матча забивает два гола. Сколько голов минимально должен забить Вымпел, чтобы стать чемпионом (при условии что больше не пропустит)? Время.", "answer": "5/ пять (незачёт: 6 и более, т.к. в вопросе сказано «минимально»)", "complexity": "0.00", "handout": "1"}, {"number": 15, "text": "Героиня одного фильма в возрасте 30 лет всё ещё живет с родителями. Чтобы подчеркнуть этот неприятный факт, они дарят ей на день рождения ИКС. Для изготовления ИКСОВ компания Henk (Хэнк) использует в том числе 12-й, 22-й и 47-й. Какое слово заменено на ИКС?", "answer": "Чемодан", "complexity": "0.00", "handout": "0"}, {"number": 16, "text": "Дуплет! 2 вопроса по 30 секунд размышления на каждый. Чтобы получить очко, команда должна ответить верно на оба вопроса. Ответы на оба вопроса нужно сдать на одном бланке по окончании минуты. К дуплету прилагается раздаточный материал: Уважаемые знатоки, прошу вас ознакомиться с раздаточным материалом.\n1. Перед вами фрагмент произведения «Великий плач о городе Париже» (в переводе). Его автор назвал жанр произведения «ТАКАЯ ОНА». В литературоведении термин не прижился. Восстановите замену. Время.\n2. В розданном фрагменте песни мы заменили два слова. Восстановите замену так, чтобы ОН перестал быть ТАКИМ. Время.", "answer": "1. Белая проза.\n2. Белый стих (зачёт: в любом порядке)", "complexity": "0.00", "handout": "1"}, {"number": 17, "text": "В первой половине 19-го века Николай показал только начатую работу авторитетному человеку и получил негативный отзыв, в котором упоминается в том числе Ахиллéс во французском платье. Тогда Николай понял, что работу надо начать заново и на этот раз воспользоваться камерами. В одном из слов вопроса пропущены три или четыре буквы. Напишите это слово целиком. Время.", "answer": "Экзáметр/ эксáметр/ гекзáметр/ гексáметр (в любом числе и падеже)", "complexity": "0.00", "handout": "0"}, {"number": 18, "text": "К нему прилагается раздаточный материал: Перед вами общепринятое русскоязычное название аргентинской провинции, в котором пропущены несколько букв. Это название не соответствует ни произношению аргентинцев, ни испанско-русской транскрипции. Однако причины, по которым закрепилось именно данное название провинции, должны быть вам всем понятны. Напишите название этой провинции целиком. Время.", "answer": "Жужỳй (зачёт: Хухỳй, Jujuy)", "complexity": "50.00", "handout": "1"}, {"number": 19, "text": "К нему прилагается раздаточный материал: Можно сказать, что на раздатке три ИКСА. В течение последних примерно 150 лет мы можем побывать в гостях у другого ИКСА на протяжении около 2 минут Назовите ИКСА двумя словами на парные согласные. Время.", "answer": "Горный король (в любом числе и падеже)", "complexity": "100.00", "handout": "1"}, {"number": 20, "text": "К нему прилагается раздаточный материал, а именно – ребус: На нём загадана фамилия известного испанского велогонщика. Используя знания социологии, программирования и лингвистики, разгадайте ребус. Время.", "answer": "Контадор (точный ответ, т.к. это ребус)", "complexity": "50.00", "handout": "1"}, {"number": 21, "text": "К нему прилагается раздаточный материал: Чтобы получить ТАКОЙ ИКС, нужно заплатить производителю не менее 110 тысяч долларов. Но можно поступить иначе – одержать много побед в гонках, как, например, Альбéрто Контадóр, несколько раз получавший награду ТАКОЙ ИКС, учреждённую французским журналом. Оригинальное название этой награды можно составить из некоторых букв полной фамилии спортсмена, а также апострофа. Мы не просим вас называть ТАКОЙ ИКС. Назовите эту награду по-русски или по-французски. Время.", "answer": "Velo d’Or/ Велодор/ золотой велосипед (зачёт: Velodor, Velod’or, Velo dor)", "complexity": "50.00", "handout": "1"}, {"number": 22, "text": "Однажды летом словак Юрай Сáган принял участие в престижной однодневной велогонке и пришёл к финишу только шестым, но, несмотря на это, был answer": "Завра (зачёт: Завро, Заура, Зауро, Завр, Заур – из перевода не до конца понятно)", "complexity": "50.00", "handout": "0"}, {"number": 27, "text": "В Великобритании есть много необычных ИКСОВ. Для участия в некоторых из них вам могут понадобиться гирлянды, платки или оленьи рога. А одному известному уроженцу Британии в фильме 1920-х годов для необычного ИКСА понадобились 2 АЛЬФЫ и 2 БЕТЫ. Мы не просим вас назвать ИКС. Назовите АЛЬФЫ и БЕТЫ словами, начинающимися на соседние буквы. Время.", "answer": "Вилка, булка (в любом порядке, падеже и числе; зачёт: «булочка» вместо «булка»)", "complexity": "0.00", "handout": "0"}, {"number": 28, "text": "К нему прилагается раздаточный материал: Перед вами фрагмент карты Европы, на которой для изображённых стран указано количество ИХ. А сколько ИХ у Ирландии? Время.", "answer": "Один (зачёт: 1)", "complexity": "100.00", "handout": "1"}, {"number": 29, "text": "В 70-е годы Министерство культуры СССР составило реестр, в котором в разделе ОНИ была только одна отечественная ОНА. Её названием было слово, которое чуть позже было дважды исковеркано в популярном советском телефильме. Как называлась упомянутая ОНА? Время.", "answer": "Интеграл (незачёт: рок-группа, интригал)", "complexity": "0.00", "handout": "0"}, {"number": 30, "text": "Не являясь членом духовенства, этот мистер однажды произнёс слово, связанное с религией, около 17 раз на протяжении примерно 3 минут, а спустя два дня – ещё больше! Если вы не знаете имя этого мистера, в этом нет ничего страшного. О каком слове идёт речь? Время.", "answer": "Аллилуйя/ hallelujah (незачёт: hard, rock)", "complexity": "0.00", "handout": "1"}, {"number": 31, "text": "[Указание ведущему: Игнорировать вопросы и удивление игроков по поводу того, что в вопросе один и тот же текст повторяется!] Автор написал этот вопрос 22-го февраля. На вопрос о происхождении названия их рок-группы они обычно отвечают, что любят одну американскую рок-группу и решили взять её название, слегка изменив. ой длины. Восстановите обе замены. Время.", "answer": "Аскет, атлет (зачёт в любом порядке)", "complexity": "0.00", "handout": "0"}, {"number": 36, "text": "К нему прилагается раздаточный материал: Перед вами 4 актёра (хотя список не является исчерпывающим). Джоша, Энтони и Дӭниела вы, конечно же, узнали. А вот поляк Станúслав гораздо менее известен. Несмотря на это, по одному показателю он, можно сказать, явно превосходит упомянутых конкурентов. Догадавшись, чтó означают числа на раздатке, ответьте, кого сыграл Станислав в советском фильме шестидесятых годов. Время.", "answer": "[Франклин Делано] Рузвельт/ [Franklin Delano] Roosevelt (также в зачёте другие варианты написания, соответствующие англо-русской транскрипции: «Фрэнклин» или «Френклин» вместо «Франклин», «Рузвелт» вместо «Рузвельт»). (незачёт: Теодор Рузвельт и др. неверные уточнения)", "complexity": "50.00", "handout": "1"}, {"number": 37, "text": "К нему прилагается раздаточный материал, а именно – ребус: В одном французском городке есть музей, посвящённый ЕЙ и ЕМУ. Это связано с тем, что приток туристов в городок вырос благодаря ЕЙ и ЕМУ. В этом музее можно увидеть скульптуру человека, загаданного ребусом. Мы не просим вас называть этого человека или восстанавливать замены. Назовите упомянутый городок. Время.", "answer": "Сен-Тропé/ Saint-Tropez (также в зачёте варианты написания через пробел вместо дефиса, «Сан» вместо «Сен», «Тропэ», «Тропэз» или «Тропез» вместо «Тропе»)", "complexity": "50.00", "handout": "1"}, {"number": 38, "text": "Небольшие знания медицины и мифологии позволяют автору утверждать, что ОНИ начинают нашу жизнь и ОНИ же её заканчивают. А «генетические ОНИ» принесли создателям Нобелевскую премию. Какое слово заменено на ОНИ? Время.", "answer": "Ножницы (незачёт: нити)", "complexity": "100.00", "handout": "0"}]}];let mode='random',active=null,qi=0,score=0;const $=x=>document.querySelector(x);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active')}function goHome(){show('home')}function showPacks(){show('packs');$('#packlist').innerHTML=packs.map((p,i)=>`<button class="pack" onclick="startPack(${i})"><strong>${p.title}</strong><small>${p.questions.length} вопросов</small></button>`).join('')}function startPack(n){mode='pack';active=packs[n];qi=0;score=0;start()}function randomQuestion(){mode='random';active=packs[Math.floor(Math.random()*packs.length)];qi=Math.floor(Math.random()*active.questions.length);score=0;start()}function start(){show('quiz');render()}function clean(x){return x.toLowerCase().replace(/ё/g,'е').replace(/\[[^\]]*\]/g,'').replace(/[«»"'.,!?;:()]/g,' ').replace(/\s+/g,' ').trim()}function render(){let q=active.questions[qi];$('#packname').textContent=active.title;$('#counter').textContent=mode==='random'?'СЛУЧАЙНЫЙ':`${qi+1} / ${active.questions.length}`;$('#qtext').textContent=q.text;$('#answer').value='';$('#feedback').textContent='';$('#bar').style.width=(mode==='random'?0:qi/active.questions.length*100)+'%';$('#answer').focus()}$('#form').onsubmit=e=>{e.preventDefault();let q=active.questions[qi],given=clean($('#answer').value),ans=clean(q.answer),ok=given&&(given===ans||ans.includes(given)||given.includes(ans));if(ok){score++;$('#score').textContent=score+' правильных';$('#feedback').innerHTML='<span class="ok">Правильно!</span>';setTimeout(()=>{if(mode==='random'){randomQuestion()}else{qi++;if(qi>=active.questions.length){$('#qtext').textContent=`Пакет завершён. Результат: ${score} из ${active.questions.length}.`;$('#form').style.display='none';$('#feedback').innerHTML='<span class="ok">Отличная работа.</span>';$('#bar').style.width='100%'}else render()}},500)}else{$('#feedback').innerHTML='<span class="bad">Неправильно, подумай ещё.</span>';$('#answer').select()}};</script></body></html>

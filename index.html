на второй вариант значения — \"поселок\" — употреблялся в СССР гораздо реже. Назовите получившееся в итоге словосочетание.", "answer": "Олимпийская деревня.", "complexity": "", "handout": "0"}, {"number": 70, "text": "Комментируя новость о том, что ЭТА иностранная КОМПАНИЯ сменила владельца, ведущие программы \"Прожекторперисхилтон\" предложили в качестве новой эмблемы оленя, убитого молнией. Назовите ЭТУ КОМПАНИЮ.", "answer": "\"Опель\".", "complexity": "", "handout": "0"}, {"number": 70, "text": "Внимание, в вопросе есть замена.\nГерой рассказа Милна \"Столик у оркестра\", не знающий, как поддержать разговор о КНИЖКЕ, рассуждает, что женщина тоже попадает в такое же неудобное положение, когда речь заходит, например, о новой бите для бейсбола. При этом он замечает, что бита ценится за совершенство формы, а КНИЖКА — за соответствующий цвет. Добавим, что редакторская группа Марафона ценит КНИЖКУ, в основном, за другие достоинства. Какое слово мы заменили словом \"КНИЖКА\"?", "answer": "Сумочка.", "complexity": "", "handout": "0"}, {"number": 70, "text": "Генрих Бебель рассказывает байку об ужасном хвастуне, который бахвалился, будто повидал всю Европу. Когда его попросили рассказать об ЭТОМ ГОРОДЕ, тот ответил, что проехал ЕГО лишь единожды, верхом и в сумерках. На что Бебель, то ли желая поддеть собеседника, то ли наоборот, помочь, предположил, что путешествие происходило зимой. О каком же городе попросили рассказать хвастуна?", "answer": "О Венеции.", "complexity": "", "handout": "0"}, {"number": 70, "text": "Григорий Михайлович писал в конце 60-х в Нарву: \"Дорогой Юрий Евгеньевич! Мне очень хотелось бы получить слово на Вашем 50-летии, но, увы, 80-летний старик с ужасным характером не желает отпускать меня даже на один день\". Что это был за старик, хорошо знакомый юбиляру?", "answer": "Король Лир.", "complexity": "", "handout": "0"}, {"number": 71, "text": "В одном из эпизодов сериала \"Доктор Хаус\" Хаус заявляет, что религия — не опиум для народа, а ЭТО. А теперь скажите на латыни \"лесть\".", "answer": "Плацебо.", "complexity": "", "handout": "0"}, {"number": 71, "text": "Детская карта Европы испещрена множеством забавных рисунков. Например, Ливерпуль обозначает группа \"Битлз\", а территорию Румынии украшают чеснок и осиновый кол. В северо-западной части Германии можно обнаружить изображение двух групп животных: одна ориентирована горизонтально, вторая — вертикально. Догадавшись, какие города имеются в виду, назовите того, кто возглавляет горизонтальную группу, и того, кто, будь карта издана в России, мог бы возглавить вертикальную.", "answer": "Крысолов (гамельнский) и трубадур.", "complexity": "", "handout": "0"}, {"number": 71, "text": "Уильям Шокли сначала разогнал всю команду, работавшую над созданием транзисторов, а затем сам покинул компанию и поселился на ранчо. Туда регулярно приезжали молодые инженеры и специалисты. Впрочем, столкнувшись с несносным характером Шокли, работать не оставались, но и из понравившихся солнечных мест уезжать не хотели. Назовите двумя словами то, что, по мнению Дэвида Боданиса, появилось вследствие этого.", "answer": "Силиконовая долина.", "complexity": "", "handout": "0"}, {"number": 71, "text": "Внимание, в вопросе есть замена.\n\"Красная Бурда\" утверждает, что вы знамениты, если, принимая душ, на всякий случай ПОЕТЕ. Перед вами эскиз Ильи Репина, на котором изображен человек, профессионально занимающийся ПЕНИЕМ. Назовите профессию этого человека.", "answer": "Натурщик.", "complexity": "", "handout": "1"}, {"number": 71, "text": "Виртуальный черный ящик. Перед вами — два знака пиктографического письма нбисиди, распространенного в Камеруне. Неоднократно расшифруйте их и тогда вы легко назовете предмет, находящийся в черном ящике. Что в черном ящике?", "answer": "Ромашка.", "complexity": "", "handout": "1"}, {"number": 71, "text": "Рецепт этого десерта придумали в конце XVII века кондитеры итальянского города Сиена. Новым лакомством, названным \"zuppa del duca\" (\"герцогский суп\"), они хотели удивить герцога Козимо III Медичи. Позднее рецепт попал во Флоренцию, а оттуда — в Венецию. Правда, сейчас этот десерт известен под другим, более возвышенным названием. Каким?", "answer": "Тирамису.", "complexity": "", "handout": "0"}, {"number": 71, "text": "В статье Советского энциклопедического словаря о ПЕРВОМ упоминается Мэдисон. В статье о ВТОРОЙ — Краков, Варшава и Гданьск. В одной из нескольких статей, находящихся между ними, упоминаются братья. Чьи именно?", "answer": "Рокко [Паронди].", "complexity": "", "handout": "0"}, {"number": 72, "text": "Героиню своего стихотворения Александр Кабанов называет двумя словами, потому что она всё преувеличивает и сжигает дотла. Для того чтобы получить эти два слова, поэт вставил одну букву в название классического произведения. Назовите его автора.", "answer": "Карамзин.", "complexity": "", "handout": "0"}, {"number": 72, "text": "Судя по одной из статей русской Абсурдопедии, первые успешные испытания ЕГО были проведены СССР в 1957 году в околоземном безвоздушном пространстве. Напишите название статьи из четырех слов.", "answer": "Сферический конь в вакууме.", "complexity": "", "handout": "0"}, {"number": 72, "text": "Сыгравшая Ирму Веп актриса Мюзидора носила обтягивающее черное трико и доводила мужчин до раболепия и покорности. По одной из версий, благодаря ей появилось некое выражение. Какое?", "answer": "Женщина-вамп.", "complexity": "", "handout": "0"}, {"number": 72, "text": "Внимание, в вопросе есть замена.\nГлавный герой фильма \"Легенда о пианисте\", рассуждая о том, как после взрыва он попадет на небеса и как его в спешке будут приводить в порядок, мечтательно отмечает, что ему удастся сыграть много нового БЕКХЭМОМ И КАМОРАНЕЗИ. Какие два слова мы заменили словами \"БЕКХЭМОМ И КАМОРАНЕЗИ\"?", "answer": "Двумя правыми.", "complexity": "", "handout": "0"}, {"number": 72, "text": "И, сдвинув губки бантиком,\nОт Польши до Аляски\nСмущенным юным франтикам\n[ПРОПУСК] строят [ПРОПУСК].\nЗаполните пропуски в четверостишии двумя существительными, одно из которых — имя собственное.", "answer": "\"... Анюты...\", \"... глазки\".", "complexity": "", "handout": "0"}, {"number": 72, "text": "Рассуждая об альбомах \"Москва и москвичи\", \"Европейцы\", \"От одного Китая до другого\", Сергей Образцов сравнил их автора, фотографа Картье-Брессона, с целой группой мастеров. Назовите ИХ одним словом.", "answer": "Передвижники.", "complexity": "", "handout": "0"}, {"number": 72, "text": "Фотография сделана в конце 60-х после концерта памяти композитора Дунаевского. Если не знать, как выглядит знаменитая пара, а судить только по подписи, то можно и перепутать. Под какой фамилией известен мужчина справа?", "answer": "Соловьев-Седой.", "complexity": "", "handout": "1"}, {"number": 73, "text": "В 1970 году вышло роскошное издание с факсимиле автографов знаменитых деятелей русской науки и культуры. Заканчивается книга космическим автографом Гагарина. Начинается же она с автографа диакона Григория. Этот автограф был оставлен им для человека, христианское имя которого было Иосиф. Назовите другое, некрестильное имя этого Иосифа.", "answer": "Остромир.", "complexity": "", "handout": "0"}, {"number": 73, "text": "Возможно, под влиянием личных неудач Цицерон сказал, что предпочел бы ЕГО жизнь жизни обладавшего верховной властью Дионисия или Дамокла. Назовите ЕГО.", "answer": "Архимед.", "complexity": "", "handout": "0"}, {"number": 73, "text": "Девиз ИХ официального клуба приблизительно переводится на русский как \"Лучше помалкивай\", а первым из НИХ отказался от восточного антуража и надел классический вечерний костюм француз Жан Эжен Роббер-Уден в XIX веке. Назовите ИХ.", "answer": "Фокусники.", "complexity": "", "handout": "0"}, {"number": 73, "text": "В абсурдистской комедии \"Адаптация\" в довольно традиционном виде камео появляется американский актер, начавший свою карьеру в кинематографе четверть века назад. Навряд ли ему было так уж сложно ИКС. Кстати, ИКС, как и \"Адаптация\", снят по сценарию Чарльза Кауфмана. Назовите ИКС.", "answer": "\"Быть Джоном Малковичем\".", "complexity": "", "handout": "0"}, {"number": 73, "text": "Корреспондент \"Вокруг света\", путешествовавший по Сицилии, отмечает, что на этом острове везде расставлены памятники Франциску Ассизскому. Отмечает он и то, что все эти типовые памятники напоминают одного актера в его роли 1986 года, причем роль эта — вовсе не роль Франциска Ассизского. Назовите ИМЯ этого актера.", "answer": "Шон.", "complexity": "", "handout": "0"}, {"number": 73, "text": "В 1988 году голландский конькобежец Кейлер установил достижение, равное 546,65 [пятиста сорока шести целым шестидесяти пяти сотым] км. Опишите, в чем суть этого рекорда.", "answer": "Суточный марафон.", "complexity": "", "handout": "0"}, {"number": 73, "text": "Внимание, в вопросе есть замена.\nС момента появления \"ЖИВОГО ТРУПА\" в конце 60-х его название считалось своего рода оксюмороном. Но создателям передачи \"Разрушители легенд\" удалось построить действующую модель ЖИВОГО ТРУПА и даже поднять с ее помощью груз. Восстановите замену.", "answer": "Свинцовый дирижабль.", "complexity": "", "handout": "0"}, {"number": 74, "text": "У этой внучки безумца не было счастливого детства. Из-за того что семье пришлось экономить на всём, она носила одно и то же платье, пока не вырастала из него. Вскоре она уверилась в том, что дамы, без конца меняющие наряды, — весьма безнравственны. Назовите ее имя.", "answer": "Виктория.", "complexity": "", "handout": "0"}, {"number": 74, "text": "Побратимами этого небольшого белорусского города являются Владимир и Наро-Фоминск в России, Днепродзержинск на Украине и Севлиево в Болгарии. Но Абсурдопедия указывает его побратимом столицу американского штата. Какого?", "answer": "Нью-Йорк.", "complexity": "", "handout": "0"}, {"number": 74, "text": "ОНИ довольно часто используются как метафора крайнего удивления, а вот персонаж Тонино Бенаквисты, писавший сценарии, считал, что в будущем все дети будут рождаться буквально с НИМИ, а заодно и мозолью на большом пальце. Назовите ИХ двумя словами.", "answer": "Квадратные глаза.", "complexity": "", "handout": "0"}, {"number": 74, "text": "В 1922 году по немецким экранам триумфально прошел фильм \"Герман\", ставший важной частью националистической пропаганды. А кого в этом фильме Герман побеждает?", "answer": "Вара.", "complexity": "", "handout": "0"}, {"number": 74, "text": "Название недавней статьи в \"Коммерсанте\", посвященной бойкоту саммита Организации Договора о Коллективной Безопасности президентом Белоруссии Александром Лукашенко, получено из известного выражения обращением порядка слов. Восстановите название статьи.", "answer": "\"Вредность за молоко\".", "complexity": "", "handout": "0"}, {"number": 74, "text": "Члены секты каинитов считали, что Каин был олицетворением всемогущества Создателя, а Авель — слабости. А из всей христианской литературы каиниты признавали только апокриф. Какой?", "answer": "Евангелие от Иуды.", "complexity": "", "handout": "0"}, {"number": 74, "text": "По мнению Алехо Карпентьера, свой творческий путь ОН проделал в компании голодающих акробатов и клоунов, облаченных в вылинявшие костюмы. Назовите ЕГО.", "answer": "Пабло Пикассо.", "complexity": "", "handout": "0"}, {"number": 75, "text": "ЭТОТ термин, пришедший из лексикона ювелиров XVI века, в XIX веке благодаря Вельфину и Панофскому стали применять и к литературе, а усилиями Шпенглера — к физике, философии и математике. Назовите ЭТОТ термин.", "answer": "Барокко.", "complexity": "", "handout": "0"}, {"number": 75, "text": "В одном из выпусков скетч-шоу девушка приходит в магазин одежды и просит продавщицу подобрать ей что-нибудь, что поможет ей выйти замуж. Продавщица приносит ЭТО, хотя ЭТО не является профильным для магазина товаром и явно не делает девушку стройнее. В известном источнике ЭТО сравнивалось с представителем класса земноводных. Назовите ЭТО одним словом.", "answer": "Подушка.", "complexity": "", "handout": "0"}, {"number": 75, "text": "В начале фильма \"Афера Томаса Крауна\" есть сцена в музее Метрополитен, в которой американским школьникам показывают полотно Моне \"Восход солнца. Впечатление\". Экскурсовод распинается об истории картины, но никто ее не слушает. Что экскурсоводу пришлось сообщить детям, чтобы они заинтересовались полотном?", "answer": "Стоимость картины.", "complexity": "", "handout": "0"}, {"number": 75, "text": "В стихотворении Октавио Паса ОН — ночная сорочка возлюбленной. А еще ОН — это 66 эпизодов, вышедших с 1985 по 1989 год. Назовите ЕГО двумя словами.", "answer": "Лунный свет.", "complexity": "", "handout": "0"}, {"number": 75, "text": "ЕЮ ударился о гроб невесты королевич Елисей. Согласно сайту regnum.ru, ОНА Саакашвили находится в Вашингтоне. Назовите фильм, запомнившийся обсуждением ЕЕ местонахождения.", "answer": "\"Брат-2\".", "complexity": "", "handout": "0"}, {"number": 75, "text": "Вскоре после провозглашения Мин император Чжу разыскал некоего Кун Кэцзяна, оказавшегося 55-м, и пожаловал ему почетные звания и наделы. Чья кровь сподвигла императора на такую щедрость к этому Куну?", "answer": "Конфуция.", "complexity": "", "handout": "0"}, {"number": 75, "text": "Недавно парфюмерный бренд \"Heeley\" представил новый аромат. Основной акцент этой цветочной композиции сделан на нотах жасмина, в состав входят также апельсин, иланг-иланг, тубероза. Кажется странным, что дизайнер Джеймс Хили не включил в состав духов с таким названием ни маргаритку, ни фиалку, ни розмарин. Особенно учитывая, что Хили — англичанин. Кстати, как называется парфюм?", "answer": "\"Офелия\".", "complexity": "", "handout": "0"}, {"number": 76, "text": "17 марта 1781 года в рабочем журнале появилась запись: \"Я искал комету или туманную звезду, и оказалось, что это комета, поскольку она поменяла положение\". В таком виде он и известил Лондонское королевское общество несколько дней спустя. Назовите его фамилию.", "answer": "Гершель.", "complexity": "", "handout": "0"}, {"number": 76, "text": "Внимание, в вопросе есть замена.\nСогласно Википедии, ЕГО состав зависит от многих факторов, включая благосостояние населения, климат и благоустройство, а также сезон и погодные условия. Сергей Довлатов в \"Соло на ундервуде\" рассказывает о ХИМИКЕ, который по НЕМУ мог легко установить ЕГО хозяина и номер квартиры. Другой ХИМИК хорошо известен нам как действующее лицо простой сказки. Какое слово мы заменили на \"ХИМИК\"?", "answer": "Дворник.", "complexity": "", "handout": "0"}, {"number": 76, "text": "Против использования ЕЕ, выращенной в специальных условиях, протестуют ценители острых ощущений, ревнители традиций, а также высококлассные сертифицированные специалисты, опасающиеся потерять работу. Назовите ЕЕ.", "answer": "Фугу.", "complexity": "", "handout": "0"}, {"number": 76, "text": "В начале прошлого века в письме, опубликованном в газете \"Новое время\", Николай Фигнер торжественно заявил, что никогда не пел и не будет петь для графа, потому что такой поступок был бы профанацией искусства. В предыдущем предложении мы пропустили несколько букв. Напишите их.", "answer": "фоно.", "complexity": "", "handout": "0"}, {"number": 76, "text": "Центральная площадь Дижона регулярно меняла свои названия. Сначала — Королевская, с 1792 года — площадь Оружия, в 1804 — Имперская, после 1814 — снова Королевская, с 1831 — снова Оружия, с 1941 — маршала Петена. Догадаться, какое имя она стала носить три года спустя, вам поможет то, что в 1971 году закончилось \"Последним штурмом\". Так как же площадь стала называться?", "answer": "Освобождения.", "complexity": "", "handout": "0"}, {"number": 76, "text": "В партитуре музыкального произведения Карлхайнца Штокхаузена \"Семь дней\" ИХ нет вообще. А в другом случае ОНИ должны начинаться и заканчиваться комплиментом. Назовите ИХ.", "answer": "Ноты.", "complexity": "", "handout": "0"}, {"number": 76, "text": "Рассуждая о весьма раскованном фильме \"Мечтатели\", действие которого происходит во время студенческих волнений 1968 года, авторы сайта \"Инверсия\" придумали для него новое, хотя и не совсем, название. Воспроизведите это название.", "answer": "\"Предпоследнее танго в Париже\".", "complexity": "", "handout": "0"}, {"number": 77, "text": "У поэта и критика Льва Озерова два раза в году при взгляде на календарь сердце наполнялось то радостью, то горем — когда расцветала природа и когда земля была заметена снегами. Вторая дата — 10 февраля. Назовите первую дату.", "answer": "6 июня.", "complexity": "", "handout": "0"}, {"number": 77, "text": "В абсурдистской комедии \"Адаптация\" сценарист Чарльз Кауфман в качестве героев вывел себя и своего ТАКОГО брата-близнеца Дональда. А в 2003 году ТАКОМУ Дональду Кауфману вместе с Чарльзом Кауфманом присудили Премию Британской Академии кино и телевидения за лучший сценарий. Какому — ТАКОМУ?", "answer": "Несуществующему.", "complexity": "", "handout": "0"}, {"number": 77, "text": "Архипов вспоминал, что Серов зажмуривал глаза и тряс головой, потом вскидывал глаза на модель — и сейчас же переводил их на холст, чтобы успеть раньше, чем мозг успеет догадаться, что значит это желтое пятно. Чем в ту пору увлекался Серов?", "answer": "Импрессионизмом.", "complexity": "", "handout": "0"}, {"number": 77, "text": "В одной из студенческих газет автор вопроса увидел такую шутку: \"Кружок ОРГАНИЧЕСКОЙ ХИМИИ объявил о своем РАЗЛОЖЕНИИ\". Мы не спрашиваем вас, какие слова мы заменили на \"ОРГАНИЧЕСКАЯ ХИМИЯ\". Какое слово из десяти букв мы заменили словом \"РАЗЛОЖЕНИЕ\"?", "answer": "Полураспад.", "complexity": "", "handout": "0"}, {"number": 77, "text": "На рекламном плакате одной службы можно увидеть мужчину и пса, которые наблюдают, как свет без всяких помех исходит... Откуда именно?", "answer": "Из холодильника.", "complexity": "", "handout": "0"}, {"number": 77, "text": "По утверждению героя Дюрренматта, сценическое воспроизведение всех подвигов Геракла невозможно. Например, когда могучий младенец с силой тянет Геру, то получается событие космического масштаба, которому мы обязаны появлением... Появлением чего?", "answer": "Млечного Пути.", "complexity": "", "handout": "0"}, {"number": 77, "text": "На сайте kyznica.ru [кузница ру] можно узнать, что для покупки одного стула кузнецу нужно продать ИХ. ОНИ — это народное название культового напитка. Назовите ИХ двумя словами, начинающимися на одну букву.", "answer": "Три топора.", "complexity": "", "handout": "0"}, {"number": 78, "text": "В 1930-х годах XX века в Оксфорде существовала литературная дискуссионная группа \"Инклинги\". Однажды в беседе двух ее членов было высказано утверждение о том, что английского эпоса не существует, и о дальнейших действиях в связи с этим. Назовите обоих собеседников.", "answer": "Толкин и Льюис.", "complexity": "", "handout": "0"}, {"number": 78, "text": "Дуплет. Второй вопрос задается через 20 секунд после первого.\n1. Одна из муз Маяковского, ТАТЬЯНА Яковлева, была очень умна и обаятельна, и многие, упоминая ее, называли ЭТУ фамилию. Какую?\n2. Однако близкие, знавшие о ее целеустремленной расчетливости, вносили поправку. Как же ее называли близкие?", "answer": "1. Ларина.\n2. Гремина.", "complexity": "", "handout": "0"}, {"number": 78, "text": "Тацит, который в юном возрасте пережил страшное потрясение, отвергал все обвинения и утверждал, что ОН немедленно направился в город и организовал за свой счет спасательные команды. Какие три буквы мы пропустили в тексте вопроса?", "answer": "НЕР.", "complexity": "", "handout": "0"}, {"number": 78, "text": "Говорят, что для Хемингуэя готовили особую разновидность ИКСА — \"Double Papa\". К чему именно относилось удвоение, догадаться нетрудно. Аккорд ИКСА присутствует в композиции аромата Guerlain Homme, специально для рекламы которого бразилец Рене Каструччи надел зеленые контактные линзы. А в Сети популярна фраза о том, что ИКС мхом тихо. Хотя на самом деле ИКС — конечно же, не оно, а он. Назовите ИКС.", "answer": "Мохито.", "complexity": "", "handout": "0"}, {"number": 78, "text": "Английский поэт Уистен Хью Оден был гомосексуалистом, однако в его биографии не обошлось без ИКСА. Благодаря тому что зрителям очень понравился ИГРЕКОВЫЙ блюз, после выхода фильма в 1994 году в Америке продали 40 тысяч сборников Одена. О каком фильме идет речь?", "answer": "\"Четыре свадьбы и одни похороны\".", "complexity": "", "handout": "0"}, {"number": 78, "text": "Строения на возвышенности должна была защищать крыша с более широкими полями, а те, в свою очередь, необходимо было подпирать снизу дополнительными бревнами. Назовите словом с удвоенной согласной то, что, по мнению Михаила Гаспарова, появилось из-за этого.", "answer": "Колоннада.", "complexity": "", "handout": "0"}, {"number": 79, "text": "В этом году в конкурсе журнала \"The Bookseller\", опередив таких конкурентов, как \"Бог или скамья\" и \"Метафизика бабуина\", победила книга \"Перспективы 60-миллиграммовых упаковок для творога на 2009-2014 годы\". Выбор победителя оказался сложнее обычного, поскольку автор \"Перспектив упаковок\", профессор Филип М. Паркер, является патентодержателем изобретения, прототип которого описан еще в XVIII веке. Назовите того, кто его описал.", "answer": "Джонатан Свифт.", "complexity": "", "handout": "0"}, {"number": 79, "text": "В Великобритании, в городке Ллануртид-Улсе на торфяных болотах ежегодно проходит увлекательное соревнование. Суть его проста: на утяжеленном горном велосипеде и с аквалангом въехать в заболоченное озеро, проехать 40 метров до воткнутого в дно шеста, дотронуться до него и вернуться обратно. Скажите, что в этом соревновании, по словам его участников, самое сложное.", "answer": "Найти шест на дне озера.", "complexity": "", "handout": "0"}, {"number": 79, "text": "ЕГО \"гибрид\" с человеком имеет специальное название, которое упоминается в \"Вульгате\" и \"Физиологе\". Этот гибрид якобы олицетворяет прямодушного на вид человека, скрывающего под маской невинности греховные помыслы. А вот ЕГО гибрид с драконом, увидевший свет в 2004 году, специального названия не имеет. Назовите ЕГО.", "answer": "Осел.", "complexity": "", "handout": "0"}, {"number": 79, "text": "В сериале \"Дживс и Вустер\" Берти Вустер разбирает присланные ему ноты и слова нового шлягера. У Берти никак не получается совместить слова и аккорды — \"слишком много слов для такого количества нот\". На что Дживс помогает ему, советуя сделать акцент на слова \"если\", \"где\" и \"высший свет\". Назовите заведение, упомянутое в песне.", "answer": "Отель \"Риц\".", "complexity": "", "handout": "0"}, {"number": 79, "text": "На родине ОН владеет магазинами одежды, которые работают под маркой CR7. Но после недавнего переезда ОН срочно зарегистрировал еще одну торговую марку: CR9. Назовите его.", "answer": "Криштиано Роналдо.", "complexity": "", "handout": "0"}, {"number": 79, "text": "Создатели мультипликационного фильма \"Коралина в стране кошмаров\" регулярно обзывают кинозрителей занудами. Впрочем, не всех, а небольшую их часть. Назовите абсолютно точно, какую именно.", "answer": "Ту, что досидела до конца финальных титров.", "complexity": "", "handout": "0"}, {"number": 80, "text": "Внимание, в вопросе есть замена.\nВ конце 1980-х барды Алексей Иващенко и Георгий Васильев написали песню, посвященную рыночной экономике. На концертах они представляли ее так: \"Следующая песня посвящена рынку. Мы написали ее в рок-стилистике, в стиле группы \"РОЛЛИНГ СТОУНЗ\", я бы сказал даже мать его рынок, с его рыночной экономикой\". Какие слова мы заменили на \"РОЛЛИНГ СТОУНЗ\"?", "answer": "\"Матиа Базар\".", "complexity": "", "handout": "0"}, {"number": 80, "text": "После победы сборной России на чемпионате мира по хоккею в Швейцарии ОНА вновь стала активно упоминаться в прессе. А вот если в 2010 году все-таки будет введен лимит в 40 миллионов фунтов, то легендарная ОНА может покинуть другой вид спорта. В последнем случае ОНА имеет имя собственное. Напишите это имя.", "answer": "Ferrari.", "complexity": "", "handout": "0"}, {"number": 80, "text": "Прослушайте пятистишие петербургского поэта Михаила Сапеги, написанное \"белым стихом\":\nникуда не спешу, одному —\nи легко мне, и грустно немного\nветер стих.\nтолько — белая ночь.\nтолько — черная черная [пропуск]\nМы облегчим вам задачу, попросив в качестве ответа написать не пропущенное слово, а два предыдущих, только без ошибок.", "answer": "черная Черная.", "complexity": "", "handout": "0"}, {"number": 80, "text": "В \"Холодном доме\" Диккенса в переводе Клягиной-Кондратьевой группа карточных шулеров названа тремя словами — правда, с заменой формы на цвет. Напишите эти три слова.", "answer": "Рыцари зеленого стола.", "complexity": "", "handout": "0"}, {"number": 80, "text": "Герой романа Умберто Эко \"Таинственное пламя царицы Лоаны\" страдает амнезией: у него нет личных воспоминаний, но зато он сыплет цитатами направо и налево. Когда ему в голову приходит идея о путешествии — он решает отправиться В ЭТУ СТОЛИЦУ. Ответьте четырьмя словами, куда именно.", "answer": "В Москву, в Москву.", "complexity": "", "handout": "0"}, {"number": 80, "text": "В настоящее время характер этой местности изменился. ИХ ширина составляет от 1,5 до 5 км, через НИХ проходит автомагистраль, с восточной стороны которой установлен коллективный памятник. Кому?", "answer": "Спартанцам.", "complexity": "", "handout": "0"}, {"number": 81, "text": "Фрэнсиса Гальтона традиционно считают основателем евгеники. Поскольку он считал, что умственные способности передаются исключительно по наследству, биографы не поленились проследить его предков. Среди них оказалось много знаменитостей, но любопытно, что и ЭТОТ ЧЕЛОВЕК, родившийся, предположительно, в 980 году, тоже оказался в числе его предков. Назовите ЭТОГО ЧЕЛОВЕКА.", "answer": "Ярослав Мудрый.", "complexity": "", "handout": "0"}, {"number": 81, "text": "Перед вами — сокращенная цитата из переводной книги по астрономии, изданной в 1947 году в СССР. Там, где пропуск, находится пять символов и один пробел. Восстановите пропуск.", "answer": "На фиг.", "complexity": "", "handout": "1"}, {"number": 81, "text": "Лоренцо Великолепный в своем \"Комментарии\" указывал на превосходное сочетание \"низкого, среднего и высокого стилей\". Где же он находил такое сочетание?", "answer": "В \"Божественной комедии\".", "complexity": "", "handout": "0"}, {"number": 81, "text": "Перед тем как заключить договор с волшебником, демон огня из сказки Дианы Уинн Джонс непродолжительное время был ЕЮ. ОНА — название японского торпедоносца — пикирующего бомбардировщика B7A. А еще сайт music.com.ua окрестил ЕЮ любительницу высоких каблуков и длинных плащей Бейонс. Назовите ЕЕ двумя словами.", "answer": "Падающая звезда.", "complexity": "", "handout": "0"}, {"number": 81, "text": "Рекламщики, берущиеся за продвижение на рынок всякого рода оздоровительных чудо-приборов, чаще всего весьма далеки от медицины. В частности, в рекламе ультразвукового аппарата \"Ретон\" указывается, что он эффективен при ТАКИХ болях, и сообщается, что аппаратом следует воздействовать на болевой очаг. О каких болях идет речь?", "answer": "Фантомных.", "complexity": "", "handout": "0"}, {"number": 81, "text": "Однажды Дэвид Бекхэм сказал: \"Да, я могу играть в центре, могу сместиться направо, но больше всего я люблю...\". Закончите мысль футболиста двумя словами.", "answer": "\"... ходить налево\".", "complexity": "", "handout": "0"}, {"number": 82, "text": "В 1896 году ОНИ совершили первое в современной истории плавание через Атлантику на веслах. Установленный в этом плавании рекорд — 55 дней — до сих пор не побит. Но гораздо более известен другой рекорд, установленный в 2009 году, так сказать, одним из НИХ. Назовите его фамилию.", "answer": "Рыбак.", "complexity": "", "handout": "0"}, {"number": 82, "text": "Журналистка Ольга Шервуд, рассказывая о Тарасе Бульбе, упоминает ЕГО. Согласно сайту libo.ru, ОН даже маршала не боится. А кто поведал нам о нарушении ИМ режима гигиены?", "answer": "[Алла] Пугачева.", "complexity": "", "handout": "0"}, {"number": 82, "text": "ОН случался дважды в истории, и оба раза в октябре. В последний раз — в 1987 году. Но если верить корреспонденту газеты \"Футбол Плюс\", еще раз ОН наступил в июле, более чем за четверть века до последнего случая. Мы не спрашиваем, для кого он наступил тогда. Назовите ЕГО двумя словами.", "answer": "Черный понедельник.", "complexity": "", "handout": "0"}, {"number": 82, "text": "В XIX веке, когда крупное судно стояло на якоре, для сообщения с берегом использовались небольшие суденышки, пребывавшие в постоянной готовности. Наиболее удобными оказались гребные ялики. Мы не спрашиваем, сколько весел было на них, — ответьте, какое название такие суденышки получили.", "answer": "\"Шестерки\".", "complexity": "", "handout": "0"}, {"number": 82, "text": "Заполните пропуски в высказывании о Джонни Деппе одним и тем же словом, в одном из случаев — с предлогом.", "answer": "Позы, в позу.", "complexity": "", "handout": "1"}, {"number": 82, "text": "Альфонс Алле в 1883 году устроил выставку, на которой показ \"Ночной драки негров в туннеле\" сопровождался \"Траурным маршем к погребению великого глухого\". А кого во втором случае намного опередил Альфонс?", "answer": "Джона Кейджа.", "complexity": "", "handout": "0"}, {"number": 83, "text": "В английском языке привычное нам слово обозначает более широкий круг вещей и понятий. Поэтому для обозначения ЕГО к этому слову добавляют слово Jigsaw — лобзиковый. А в наших магазинах одну из ЕГО разновидностей называют так, что можно подумать, будто платить за НЕГО не нужно. Назовите ЕГО.", "answer": "Пазл.", "complexity": "", "handout": "0"}, {"number": 83, "text": "Из-за специфической формы штат Западная Вирджиния носит шуточно-бытовое прозвище. Можно предположить, что в начале 2000-х ИМИ заинтересовались именно в Западной Вирджинии. Назовите ИХ.", "answer": "Чапельники.", "complexity": "", "handout": "0"}, {"number": 83, "text": "В 1857 году на Всемирной парижской выставке сбылось пророчество Диккенса, утверждавшего, что ОН скоро \"отправит на каторжные работы медные кастрюли\". Назовите ЕГО, использовав два символа.", "answer": "Al.", "complexity": "", "handout": "0"}, {"number": 83, "text": "Прослушайте фрагмент стихотворения Вадима Степанцова:\nЯ худ и строен, как [ПРОПУСК],\nМой ус достиг полутора аршин.\nМой лик сияющ, маслянист и глянцев,\nА нос завернут вверх, что твой кувшин.\nПропуск является заглавием классического произведения. Назовите автора этого произведения.", "answer": "Лопе де Вега.", "complexity": "", "handout": "0"}, {"number": 83, "text": "Перед одним своим шоу Джонни Карсон посоветовался с иллюзионистом Удивительным Рэнди, который предложил Карсону запастись своим комплектом столовых приборов. Карсон послушался, и гость был посрамлен. Кто же был \"в гостях\" у шоумена?", "answer": "Ури Геллер.", "complexity": "", "handout": "0"}, {"number": 83, "text": "Кира Сапгир пишет, что автор бульварных романов Анри Виллар нещадно эксплуатировал жену, которую держал в черном теле, и в пояснение своей мысли приводит термин, появившийся в XIX веке. Воспроизведите этот термин из двух слов.", "answer": "Литературный негр.", "complexity": "", "handout": "0"}, {"number": 84, "text": "Внимание, в вопросе есть замены.\nПо словам Октавио Паса, большинство современных людей ЖИЗНИ не имеют. У них есть только БИОГРАФИЯ. Профессор Тырсиков сообщает, что в конце XIX — начале XX века понятие ЖИЗНИ постепенно вытесняется из БИОГРАФИИ, заменяется более современными понятиями. Назовите слова, которые мы заменили на \"ЖИЗНЬ\" и \"БИОГРАФИЯ\".", "answer": "Душа и психология.", "complexity": "", "handout": "0"}, {"number": 84, "text": "После жесткого отсева в первом туре Всесоюзного конкурса артистов эстрады один из оставшихся заметил: \"Конкурс — это вам не борщ. ЭТОГО на всех не хватит\". Назовите ЭТО.", "answer": "Лавровый лист.", "complexity": "", "handout": "0"}, {"number": 84, "text": "В 1823 году в одном американском издательстве вышла небольшая поэма Клемента Кларка Мура, написанная им с целью развлечь своих дочек. Однако благодаря именно этому произведению отчасти и закрепился образ главного героя. А кем были те, кого в этой поэме зовут Лихач, Танцор, Гарцующий, Злобный, Комета, Купидон, Болван и Молниеносный?", "answer": "Оленями.", "complexity": "", "handout": "0"}, {"number": 84, "text": "Самые древние ИКСЫ, датированные периодом бронзового века, были обнаружены на берегу Южного Буга, недалеко от Одессы. Такие ИКСЫ изготавливались из фаланги передних ног животных. А какие ИКСЫ могут достигать в длину от 4 до 20 см?", "answer": "Морские.", "complexity": "", "handout": "0"}, {"number": 84, "text": "Сомнительно, что ИМ удавалось всё вмещать за голенище сапога, но 14-летний период ИХ расцвета в XX веке остается фактом. Назовите ИХ одним словом.", "answer": "Бутлегеры.", "complexity": "", "handout": "0"}, {"number": 84, "text": "Как известно, высочайшая вершина мира — Эверест, 8848 метров. Можно также считать высочайшей вершиной вулкан Мауна-Кеа, высота которого от подножия на дне Тихого океана до вершины — 10203 метра. А вот если считать по расстоянию от центра Земли, то высочайшая вершина неслучайно окажется на территории этой страны. Какой именно?", "answer": "Эквадор.", "complexity": "", "handout": "0"}, {"number": 85, "text": "Перед вами — наступательная граната РГ-42 времен Великой Отечественной войны. Уникальность ее в том, что, не уступая по боевым качествам сложным и дорогим аналогам, она была очень проста в производстве. Поэтому выпуск РГ-42 можно было мгновенно наладить на любой ТАКОЙ фабрике. Что выпускают ТАКИЕ фабрики и заводы?", "answer": "Консервы.", "complexity": "", "handout": "1"}, {"number": 85, "text": "В первой книге серии юный герой попадает в волшебный мир и знакомится там с мальчиком и девочкой. В третьей книге паук сообщает важную новость. Экранизации не совсем успевают за книгами, но, конечно, осуществляются при непосредственном участии автора. Мы не спрашиваем вас, в какой роли участвует в экранизациях автор. Ответьте, с какого имени начинаются все книги серии, равно как и все фильмы.", "answer": "Артур.", "complexity": "", "handout": "0"}, {"number": 85, "text": "Достаточно редкий вид может плавать со скоростью до 9,8 метров в секунду. Это — официально зарегистрированный представителями книги Гиннеса рекорд скорости для НИХ. Кого именно?", "answer": "Черепах.", "complexity": "", "handout": "0"}, {"number": 85, "text": "Как вы уже знаете, опрашивая россиян на тему их знакомства со второй половинкой, социологи предлагали варианты \"в компании\", \"на работе\", \"в институте\" и т.д. Наименьшее количество опрошенных — 2% — выбрали вариант \"в ЭТОМ\". Назовите человека, ЭТО которого в 1913-1914 годах уложилось в 19 номеров.", "answer": "Максим Горький.", "complexity": "", "handout": "0"}, {"number": 85, "text": "Члены музейного объединения города Череповец ЭТО СЛОВО наверняка слышат часто. Широко известен и даже воспет в песне случай, когда с ЭТИМ СЛОВОМ было перепутано другое. Назовите это другое слово.", "answer": "Мачо.", "complexity": "", "handout": "0"}, {"number": 85, "text": "Основатель этой компании начинал свой путь с изготовления дорожных сундуков, однако благодаря своему мастерству и буму путешествий быстро завоевал любовь даже самых взыскательных покупателей. Узнать эту компанию можно по монограмме из двух букв. Назовите их.", "answer": "L & V.", "complexity": "", "handout": "0"}, {"number": 86, "text": "Недавно журнал \"New Scientist\" [нью сайентист] объявил конкурс. По его условиям, любой житель Земли может придумать новый вариант известной фразы. Призом этого конкурса станет настоящий ОН. ОН стал названием английского романа 1868 года. Назовите автора этого романа.", "answer": "Уилки Коллинз.", "complexity": "", "handout": "0"}, {"number": 86, "text": "Николай Сванидзе замечает, что ни Тютчев, ни сам Толстой такого \"почетного звания\" не получили, а о советских классиках и говорить нечего. В русской истории так именовали всего одного политика, конечно, в переносном смысле. Назовите одним словом ЭТО, так сказать, \"звание\".", "answer": "Дедушка.", "complexity": "", "handout": "0"}, {"number": 86, "text": "По мнению французского исследователя Ги Шоссинан-Ногаре, ИХ культ — выродившаяся рыцарская традиция поклонения Прекрасной Даме. Назовите ИХ.", "answer": "Королевские фаворитки.", "complexity": "", "handout": "0"}, {"number": 86, "text": "В 1992 году американская компания выяснила, что регистрировать числа в качестве торговой марки нельзя. Как стал называться очередной продукт компании?", "answer": "\"Pentium\".", "complexity": "", "handout": "0"}, {"number": 86, "text": "У умершего во второй половине XVIII века английского драматурга была, среди прочих, поэма \"Economy\", что, по мнению некоторых ученых, делает подзаголовок произведения, опубликованного в 1836 году, неслучайным. Что это за произведение?", "answer": "\"Скупой рыцарь\".", "complexity": "", "handout": "0"}, {"number": 86, "text": "Лев Кулешов вспоминал, что в училище имени Александра II преподаватели особо поощряли ябедничество, а среди учеников это считалось самым страшным грехом. Тем не менее, начальство часто узнавало о проступках учеников благодаря... Чему?", "answer": "Исповеди.", "complexity": "", "handout": "0"}, {"number": 87, "text": "Античный миф повествует о том, как пастух Гиг проникает в тайную пещеру и находит там труп, с которого снимает прелестную вещицу. Позже Гиг соблазняет царицу, убивает царя и начинает властвовать над Лидией. Некоторые литературоведы намекают на то, что ОН был хорошо знаком с мифом о Гиге. Назовите ЕГО.", "answer": "Толкин.", "complexity": "", "handout": "0"}, {"number": 87, "text": "На самом деле ЕГО пока не существует, хотя есть классический с созвучным названием. Но, возможно, когда-нибудь ОН станет результатом интеллектуального творчества Чжунь Хван Чой или, например, Хо Чжинь Чжунь. А сайт \"Подробности\" назвал ИМ попытку Северной Кореи шантажировать мир ядерной угрозой. Назовите ЕГО двумя словами.", "answer": "Корейский гамбит.", "complexity": "", "handout": "0"}, {"number": 87, "text": "Юрий Визбор сказал, что голос человека — это его второе лицо. Тем не менее, критик Людвига Закржевская считает лучшей ролью Александра Балуева участие в экранизации классического произведения XIX века. Назовите это произведение.", "answer": "\"Му-му\".", "complexity": "", "handout": "0"}, {"number": 87, "text": "Какого сорта роза на картинке справа?", "answer": "American beauty.", "complexity": "", "handout": "1"}, {"number": 87, "text": "В одной из книг Джона Максвелла Кутзее рассказывается, в частности, о том, как ПОСЛЕДНЯЯ представительница некогда могущественного бурского рода плантаторов становится рабыней чернокожего работника фермы. Рассуждая об этой книге, Александр Вяльцев упоминает ИХ. С НИМИ сталкиваются лицом к лицу Карик и Валя. Назовите ИХ.", "answer": "Муравьи.", "complexity": "", "handout": "0"}, {"number": 87, "text": "Автор анекдота, опубликованного несколько лет назад на сайте os3e.ru, считает, что ему удалось найти максимально точное определение тещи, состоящее из двух слов или шести не повторяющихся букв. Воспроизведите эти два слова в правильном порядке.", "answer": "Мать её.", "complexity": "", "handout": "0"}, {"number": 88, "text": "Героиня этюда из серии \"Показывает Прожектор Перисхилтон\" разрешила своему сыну еще на 20 минут остаться у Кольки и велела отодвинуться от кондиционера. Герои рассказа Кортасара организовали группу для добычи воды и распределения продовольствия. В обоих случаях действие происходило в НЕЙ. Назовите ЕЕ.", "answer": "Автомобильная пробка.", "complexity": "", "handout": "0"}, {"number": 88, "text": "Герои романа \"Воспоминания о монастыре\", действие которого происходит в средневековой Португалии, трудятся над созданием пассаролы. Она приводится в действие с помощью янтаря, магнитов и заключенных в стеклянные сосуды людских воль. По сути пассарола представляет собой ИКС. В создании ИКСА в 1979 году приняли участие Боярский и Папанов. Назовите ИКС.", "answer": "Летучий корабль.", "complexity": "", "handout": "0"}, {"number": 88, "text": "Ученица одной студии предложила совместить выступление своей группы с фаер-шоу, объяснив это родственными чувствами. Назовите абсолютно точно то, чему обучают в упомянутой студии.", "answer": "Фламенко.", "complexity": "", "handout": "0"}, {"number": 88, "text": "Вместо хита середины 90-х эта группа могла бы написать и такое:\nЖили Джонни и Тим на Бриджстрит,\nДжонни — дюжина, Тиму — лишь три.\nС громким криком \"Ура!\"\nСтрит взорвала ИРА:\nТим убит, Джонни тоже убит.\nНазовите коллектив, о котором идет речь, а также его родной город.", "answer": "\"The Cranberries\", Лимерик.", "complexity": "", "handout": "0"}, {"number": 88, "text": "17 июня 2002 года из тюрьмы, расположенной на индонезийском острове Суматра, сбежали 48 заключенных. Причиной тому стало событие, проходившее в другом азиатском государстве. Назовите эту причину двумя словами.", "answer": "Футбольный матч.", "complexity": "", "handout": "0"}, {"number": 88, "text": "Хорошо известно выражение, в котором ЕГО используют не по назначению. Но вот другой способ использовать ЕГО не по назначению — это единственный возможный вариант подергать струны на гитаре, вошедшей в Книгу рекордов Гиннеса. Так чем же играют на этой гитаре?", "answer": "Микроскопом.", "complexity": "", "handout": "0"}, {"number": 89, "text": "Для группы \"LOVEBUGS\" это делает музыка, для \"Army Of Lovers\" — красота, для Мадонны — любовь. В советской песне любовь тоже имеет к этому отношение, однако делают это ОНИ. Назовите ИХ.", "answer": "Медведи.", "complexity": "", "handout": "0"}, {"number": 89, "text": "Согласно исследованию социологов, чаще всего знакомство со спутником жизни у современных россиян происходит в дружеской компании, на работе, в вузе и в общественных увеселительных местах: дискотеки, кинотеатры, музеи и т.д. А вот первая встреча персонажей романа \"Воспоминания о монастыре\" — впрочем, как и последняя — произошла во время... Ответьте одним словом — чего?", "answer": "Аутодафе.", "complexity": "", "handout": "0"}, {"number": 89, "text": "И поныне среди монголов очень распространен моренхур — подобие скрипки с грифом. Какую форму придают грифу?", "answer": "Лошадиной головы.", "complexity": "", "handout": "0"}, {"number": 89, "text": "Согласно шуточной версии, описанной в одном из блогов, на самом деле ОН был диктатором и готовил коварное нападение: вверенный ЕМУ народ мощными челюстями якобы способен был легко разгрызать самую твердую древесину. В доказательство набирающего силы культа личности приводится тот факт, что ЕГО статуи появились даже в городах. Мы не спрашиваем вас, кто ОН. Ответьте, какую букву в тексте вопроса мы пропустили.", "answer": "О.", "complexity": "", "handout": "0"}, {"number": 89, "text": "Внимание, ИГРЕК:\nВаляются шлемы — с забралом и без,\nТюрбаны, папахи.\nНа поле остались лишь граф ИКС\nИ князь ИГРЕК.\nУдарение в ИКСЕ в этом четверостишии изменено так, что ИКС становится ИКСОМ. Назовите редкие имена вельмож, замененные нами на \"ИКС\" и \"ИГРЕК\".", "answer": "Анапест, Амфибрахий.", "complexity": "", "handout": "0"}, {"number": 89, "text": "По версии Николая Сванидзе, заполняя анкету и без проблем ответив на вопросы о ФИО и должности, по пятому пункту называть себя \"поганым\" ОН не захотел, и был устроен тендер. Мы не спрашиваем, кто ОН. Ответьте, какое событие стало итогом.", "answer": "Крещение Руси.", "complexity": "", "handout": "0"}, {"number": 90, "text": "Знакомый автора вопроса — американец с хорошим чувством юмора, при этом неплохо освоивший русский. При поселении в гостиницу он в одной из граф записал: \"Соедини и отрежь\". Мы не спрашиваем вас, в какой графе это было написано. Что он написал в той же графе после недоуменного вопроса регистратора?", "answer": "Штат Коннектикут.", "complexity": "", "handout": "0"}, {"number": 90, "text": "На обзорной экскурсии по турецкому городу Алании местный гид, с трудом говорящий по-русски, рассказывал, что крепость в городе строили РЫБЫ-НАСЕКОМЫЕ. На самом деле он имел в виду ИХ. Назовите ИХ.", "answer": "Сельджуки.", "complexity": "", "handout": "0"}, {"number": 90, "text": "Лингвисты Шмелевы пишут, что этот типаж очень живуч. Сначала его место занимали выпившие купцы. Затем — представители одной из наций СССР, а затем — ОНИ. Назовите ИХ двумя словами.", "answer": "Новые русские.", "complexity": "", "handout": "0"}, {"number": 90, "text": "Итальянский король Умберто II, низложенный 2 июня 1946 года и правивший всего сорок дней, получил прозвище \"ТАКОЙ король\". А вот ТАКОЙ цветок стал музеем. Какое слово мы заменили на \"ТАКОЙ\"?", "answer": "Майский.", "complexity": "", "handout": "0"}, {"number": 90, "text": "Внимание, в вопросе есть замены.\nАбсурдопедия предлагает сперва зайти в Гугл или Яндекс и ввести слова \"посудная лавка\" в строку поиска. Затем, проделав некое действие, задать слова \"большой слон\". Затем перейти по предложенной ссылке. Что мы заменили на \"посудная лавка\" и \"большой слон\"?", "answer": "Темная комната, черная кошка.", "complexity": "", "handout": "0"}, {"number": 90, "text": "\"Глаз ... изумлен и ослеплен богатством и теплотой этих оттенков, которые представляют всю гамму желтого, от дымчатого топаза до светлого лимона: золото резьбы кажется тусклым и фальшивым по соседству с этим, особенно когда солнце падает на стены и пронизывает своими лучами прозрачные жилки, как бы скользя по ним...\" — писал пораженный Теофиль Готье о НЕЙ. Назовите ЕЕ.", "answer": "Янтарная комната.", "complexity": "", "handout": "0"}, {"number": 91, "text": "В конце 1990-х случился скандал. Арсен Хейтц признался, что в 1955 году он ничего не придумал сам, а срисовал всё с иконы Богоматери с необычным венцом. А это ставит под сомнение конфессиональную нейтральность. Что же создал Хейтц?", "answer": "Эмблему ЕС.", "complexity": "", "handout": "0"}, {"number": 91, "text": "Внимание, в вопросе есть замены.\nГерой произведения Джека Лондона так описывает свой автоматический пистолет: \"А посмотрите сюда, на защелку предохранителя. Вот что мне больше всего нравится в этой системе. Полная безопасность! Возможность несчастного случая абсолютно исключена!\". В ответ один из собеседников героя замечает, что порой ЛЫЖИ НЕ ЕДУТ. В статье Википедии о биатлоне словосочетание \"ЛЫЖИ НЕ ЕДУТ\" не встречается, а вот \"ЛЫЖИ\" и \"НЕ ЕДУТ\" по отдельности — встречаются, и не раз. Какое слово мы заменили на \"ЛЫЖИ\" и какое на \"НЕ ЕДУТ\"?", "answer": "Палка, стреляет.", "complexity": "", "handout": "0"}, {"number": 91, "text": "В \"Республике животных\" Фремо Абланкура царит мир и согласие. Так, правит республикой Феникс, аисты врачуют и даже есть свои переводчики. Кто выполняет их роль?", "answer": "Попугаи.", "complexity": "", "handout": "0"}, {"number": 91, "text": "В известной пьесе \"Дорога к храму\", написанной специально для предмета \"Основы православной культуры\", ОН молится Богу, а после получения желаемого произносит длинную заумную фразу на греческом. А \"Квартет И\" строку из группы \"Високосный год\" пародирует так: \"Нет, не пугала ее смерть, скорей ее пугал ОН\". Назовите ЕГО.", "answer": "Страшила.", "complexity": "", "handout": "0"}, {"number": 91, "text": "Перед вами — Михаил Романович Шура-Бура. На снимке он стар, ему почти 90 лет. Тем не менее, когда этот выдающийся советский ученый скончался в конце 2008 года, пережив большинство тех, с кем он начинал свои труды, его смерть все равно назвали безвременной. Прототипом какого персонажа Михаил Романович стал в 1960-х?", "answer": "Ойра-Ойра.", "complexity": "", "handout": "1"}, {"number": 91, "text": "Внимание, в вопросе есть замены.\nПсихологи шутят, что интроверта от экстраверта отличить довольно просто. После дозы алкоголя экстраверт говорит гадости ВСЛУХ, а интроверт — ПРО СЕБЯ. Какие два слова мы заменили на \"ВСЛУХ\", а какие — на \"ПРО СЕБЯ\"?", "answer": "О себе, о других.", "complexity": "", "handout": "0"}, {"number": 92, "text": "Аркадий Штейнберг дал в переводе \"Потерянного рая\" образец монументальной философской поэмы, создал пример возвышенного стиха, питаемого родной почвой, но имеющего особенное устройство — старинное и при этом не обветшалое. Сам Штейнберг полушутливо называл себя ИМ нашей эпохи. Кем же?", "answer": "Гнедичем.", "complexity": "", "handout": "0"}, {"number": 92, "text": "На портрете работы Рафаэля кардинал Томмазо Ингирами изображен с пером в руке и со взглядом, обращенным вверх и в сторону — словно в ожидании вдохновения. Рафаэль не случайно изобразил кардинала таким образом — сделано это было для того, чтобы отвлечь внимания зрителя от некоего дефекта. Какого именно?", "answer": "Косоглазия.", "complexity": "", "handout": "0"}, {"number": 92, "text": "Внимание, в вопросе есть замены.\nАвтор статьи в журнале \"Вокруг света\" вспоминает, как в детстве прикладывал линейку и возмущался несправедливостью — отчего в БИДОНЕ ничтожная часть БЕТОНА по сравнению с Бразилией. Какие слова мы заменили на \"БИДОН\" и \"БЕТОН\"?", "answer": "Эквадор, экватор.", "complexity": "", "handout": "0"}, {"number": 92, "text": "К литературным ИМ можно отнести \"Дом, который построил Джек\", \"Притчу о философе\", венок сонетов, венок венков сонетов, венок венков венков сонетов и так далее. Назовите ИХ словом латинского происхождения.", "answer": "Фракталы.", "complexity": "", "handout": "0"}, {"number": 92, "text": "В сборник \"Миры фантазий Питера Бигла\" 1978 года входят несколько фэнтезийных романов и рассказ \"Приходите, леди Смерть\". Возможно, именно этот сборник стал прототипом рекордсмена. Назовите этого рекордсмена.", "answer": "\"Сказки барда Бидля\".", "complexity": "", "handout": "0"}, {"number": 92, "text": "Специалисты НПО \"Сатурн\" пришли к выводу, что идеальная модель для них — это чайка. Птица должна весить 700 граммов, быть абсолютно здоровой перед умерщвлением и пройти рентгеновское обследование после смерти. Ответьте максимально точно, что производит НПО \"Сатурн\".", "answer": "Авиадвигатели.", "complexity": "", "handout": "0"}, {"number": 93, "text": "Корней Чуковский подсчитал, что ЭТО обычно равно четырем детским пальто и шести-семи взрослым. Назовите ЭТО пьесой Андреева.", "answer": "Жизнь человека.", "complexity": "", "handout": "0"}, {"number": 93, "text": "В постановке киевского режиссера Дмитрия Богомазова ИХ костюмы разукрашены таким образом, что полностью сливаются с зАмковыми стенами, а говорят ОНИ хором. Назовите того, кто в 1966 году сделал ИХ заглавными героями.", "answer": "Том Стоппард.", "complexity": "", "handout": "0"}, {"number": 93, "text": "Римский-Корсаков видел в своей опере \"Сказание о невидимом граде Китеже и деве Февронии\" последний крупный труд, завершающий, в сущности, всю его жизнь и подводящий ее итог. Поэтому одно время он даже думал разрешить публикацию и постановку оперы только при одном условии. Каком?", "answer": "После своей смерти.", "complexity": "", "handout": "0"}, {"number": 93, "text": "Лирический герой одного из стихотворений Льва Лосева попал в длинный коридор, где вели какой-то смутный разговор бледные мужчины. Закончилось всё весьма печально, что входит в логическое противоречие с первой строкой стихотворения. Что делает в этой первой строке Лосев, если однажды это сделал и известный вам мексиканский поэт?", "answer": "Цитирует Данте.", "complexity": "", "handout": "0"}, {"number": 93, "text": "Любопытно, что героиню рассказа Бигла \"Приходите, леди Смерть\" зовут ФАУНА МАУГЛИ: ведь персонаж по имени МАУГЛИ, как известно, наибольших успехов достиг именно в предмете, связанном с ФАУНОЙ. Мы не спрашиваем вас, кто придумал этого персонажа. Напишите имя и фамилию героини рассказа Бигла.", "answer": "Флора Невилл.", "complexity": "", "handout": "0"}, {"number": 93, "text": "После распространения дорожного покрытия \"макадам\", придуманного одноименным инженером, родившимся в 1756 году, появились его модификации. Так, была придумана трехполосная дорога со средней мощеной полосой для артиллерии. А кто был автором этого проекта?", "answer": "Наполеон Бонапарт.", "complexity": "", "handout": "0"}, {"number": 94, "text": "Критик Сергей Беликов констатирует, что после блестящего литературного дебюта и прекрасной эссеистики Толстой, в ее блоге язык, в основном, бесцветен и отсутствуют оригинальные мысли. Каким классическим вопросом при этом задается критик?", "answer": "\"Ужель та самая Татьяна?\".", "complexity": "", "handout": "0"}, {"number": 94, "text": "Внимание, слово \"АМСТЕРДАМ\" является заменой.\nОдин голландский путешественник сообщает, что дворец правителя древнего государства Бенин по площади был равен АМСТЕРДАМУ. Поселение Новый АМСТЕРДАМ было основано в 1658 году. Какой статус со временем приобрело это поселение?", "answer": "Район Нью-Йорка.", "complexity": "", "handout": "0"}, {"number": 94, "text": "Историки современной музыки считают, что фолк-рок появился тогда, когда Боб Дилан сменил ПЕРВУЮ на ВТОРУЮ. Назовите ПЕРВУЮ и ВТОРУЮ в правильном порядке.", "answer": "Акустическая гитара, электрогитара.", "complexity": "", "handout": "0"}, {"number": 94, "text": "Герой японского поэта Таками увидел яхту, холодильник, обнаженную натурщицу и — видимо, ближе к вечеру — кровавые плевки. Назовите любого из тех, кто в аналогичной ситуации увидел двух млекопитающих и одну птицу.", "answer": "Гамлет.", "complexity": "", "handout": "0"}, {"number": 94, "text": "Согласно одной шутке, ОНИ примерно на треть состоят из позитронов. Последним ИМ стал герцог Амадей Миролюбивый, сменивший имя в 1439 году. Назовите ИХ.", "answer": "Антипапы.", "complexity": "", "handout": "0"}, {"number": 94, "text": "Он получил свое название от небольшой реки, протекающей там же. Строго говоря, это название относится лишь к первому левому, однако в прессе так называют все три. Как же?", "answer": "\"О Руж\".", "complexity": "", "handout": "0"}, {"number": 95, "text": "Владимир Гаков пишет: \"13-летний царь уже был свидетелем, как трое Шуйских чуть не забили насмерть Воронцова, а в следующий раз уже сторонники боярина подговорили Андрея Шуйского. Так проходило ЭТО\". Мы не спрашиваем вас, какие два слова мы заменили на \"ЭТО\". Скажите, кто ЭТО снял.", "answer": "Тарковский.", "complexity": "", "handout": "0"}, {"number": 95, "text": "ОН был географом, журналистом, основателем российской скандинавистики, автором книг по истории и геральдике. Однако большинству ОН известен благодаря еще одному своему увлечению, которое роднит ЕГО с одним из знатоков. Назовите ЕГО.", "answer": "Вильям Похлебкин.", "complexity": "", "handout": "0"}, {"number": 95, "text": "Там брали начало 29, из которых 16 — главные. Неудивительно, что до нашего времени дожила поговорка. Какая?", "answer": "Все дороги ведут в Рим.", "complexity": "", "handout": "0"}, {"number": 95, "text": "Скульптор Кристофер Басгейт создает свои произведения из меди, латуни, стали, алюминия не совсем обычным для скульпторов методом. Можно смело назвать его мастером на все руки. Каким словом, бывшим в ходу в советской трудовой прессе, охарактеризовал Басгейта журнал \"Популярная механика\"?", "answer": "Многостаночник.", "complexity": "", "handout": "1"}, {"number": 95, "text": "Внимание, в вопросе есть замены.\nКомпания, предлагающая услуги мелкого бытового ремонта, называется \"ПОКЕМОН НАВСЕГДА\". \"БЭТМЕН НАВСЕГДА\" входит в знакомый вам с детства сборник. А ПОКЕМОН Лузы, дочери индийского царя, был БЭТМЕНОМ. Мы не спрашиваем вас, какие слова мы заменили на \"НАВСЕГДА\". Ответьте, что мы заменили на \"ПОКЕМОН\" и \"БЭТМЕН\".", "answer": "Муж и халиф (калиф).", "complexity": "", "handout": "0"}, {"number": 95, "text": "Китайские евреи к XV веку испытали сильное влияние китайской культуры. Так, первочеловека Паньгу они отождествляли с Адамом. А с кем они отождествляли прародительницу Нюйву?", "answer": "С Ноем.", "complexity": "", "handout": "0"}, {"number": 96, "text": "По словам Гарольда Рамиса, это продолжалось около десяти лет. По другим данным — чуть больше месяца. Достоверно известно, что всё закончилось 3 февраля. А когда началось?", "answer": "2 февраля.", "complexity": "", "handout": "0"}, {"number": 96, "text": "Название одного из одесских кафе, где подают, в частности, шоколад и кофе, заставляет вспомнить, например, о \"сорока пяти\". Напишите короткое название кафе.", "answer": "Шико.", "complexity": "", "handout": "0"}, {"number": 96, "text": "В этом году Юрий Лужков подал в суд иск о защите чести, достоинства и деловой репутации. Иск направлен против Германа Виноградова, который, как вы уже знаете, создал анаграмму \"уклюжий вор\". Назовите дату подачи иска.", "answer": "1 апреля.", "complexity": "", "handout": "0"}, {"number": 96, "text": "Алехо Карпентьера часто просили определить отличие ЭТОГО от \"чудесной реальности\". Назовите ЭТО двумя словами.", "answer": "Магический реализм.", "complexity": "", "handout": "0"}, {"number": 96, "text": "Во время войны Мануил Семенов перестал ДЕЛАТЬ ЭТО, чтобы не демаскировать блиндаж. Назовите имя и отчество персонажа, который делал ЭТО с противоположными целями.", "answer": "Христофор Бонифатьевич.", "complexity": "", "handout": "0"}, {"number": 96, "text": "Эта статья, опубликованная в 66-м томе словаря \"Брокгауза и Ефрона\", отсылает нас к статье \"Конножелезные дороги\". Как озаглавлена эта статья?", "answer": "Трамвай.", "complexity": "", "handout": "0"}, {"number": 97, "text": "Алексей Викторович писал, что он сразу же выбрал планировку такую, чтобы \"создать график движения, обеспечивающий пропуск значительных масс ... без сутолоки и пробки\". Назовите фамилию Александра Викторовича.", "answer": "Щусев.", "complexity": "", "handout": "0"}, {"number": 97, "text": "В китайской историографии конфликт, связанный с ЭТИМ, стал поводом для начала \"нового времени\". В Англии XIX века ЭТО было весьма популярным, и в произведении 1891 года человек скрывается среди поклонников ЭТОГО. А какой дефект у героя произведения можно было обнаружить?", "answer": "Рассеченную губу.", "complexity": "", "handout": "0"}, {"number": 97, "text": "Сохранились свидетельства, как однажды зимой Ленин с нетерпением ждал письма от самарского юриста Хардина, приговаривая: \"Интересно, что же он теперь сделает, как выкрутится из этого положения\". Назовите основное содержимое письма, которым Ленин так озадачил юриста.", "answer": "Ход в шахматной партии по переписке.", "complexity": "", "handout": "0"}, {"number": 97, "text": "В списке зарубежных фотографов Википедии фамилии, написанные латиницей, расположены в алфавитном порядке. Два основателя легендарного агентства \"Magnum\", Роберт Капа и Анри Картье-Брессон, стоят почти рядом. Их разделяет только одна фамилия, да и то — ненастоящая. Назовите ее.", "answer": "Кэрролл.", "complexity": "", "handout": "0"}, {"number": 97, "text": "Курсанты мореходного училища имени Воронина часто заказывают в вузовской библиотеке издание \"Высоты и азимуты светил\", которое выдается на руки вне читального зала только до утра. Сформулируйте четырьмя словами вопрос, благодаря которому эта книга получила такую популярность.", "answer": "Можно ВАС на ночь?", "complexity": "", "handout": "0"}, {"number": 97, "text": "В передаче на канале \"National Geographic\", посвященной малышке Любе, несколько раз упоминается одно и то же мужское имя. Назовите это имя.", "answer": "Дима.", "complexity": "", "handout": "0"}, {"number": 98, "text": "Открыв профессиональный российский журнал, вы увидите в НЕМ современные решения в области светодизайна, новинки светотехнического рынка, проекты освещения городов, интерьеров и природных ландшафтов. А что увидел в НЕМ в начале восьмидесятых годов двадцатого века поэт Анатолий Поперечный?", "answer": "Землю.", "complexity": "", "handout": "0"}, {"number": 98, "text": "В НЕЕ входили каноники Остолоса и Эскоикис, бывший носильщик, ставший доном Антонио Угарте, некогда водовоз и шут, известный под именем Педро Кальядо и даже русский Татищев. Юлиан Семенов, говоря о НЕЙ, упоминает Геббельса, Геринга, Гиммлера и Лея. Назовите ЕЕ.", "answer": "Камарилья.", "complexity": "", "handout": "0"}, {"number": 98, "text": "Культуролог Дюпрон считал, что ОН был \"философией великого возвращения\". Назовите ЕГО одним словом.", "answer": "Ренессанс.", "complexity": "", "handout": "0"}, {"number": 98, "text": "Фейерверк начался огромным залпом, затем посредством ракет, огней и шутих были изображены инфляция, взаимодействия и прочие процессы. Назовите европейскую организацию, в честь пятидесятилетия которой было устроено такое \"историческое\" шоу.", "answer": "ЦЕРН.", "complexity": "", "handout": "0"}, {"number": 98, "text": "Перед вами — рекламный слоган одной турфирмы, в котором мы пропустили два слова. Заполните их названием государства.", "answer": "Новую Зеландию.", "complexity": "", "handout": "1"}, {"number": 98, "text": "В мире аниме \"Battle Angel\" существуют два города, симметрично прикрепленных к космическому лифту. Город, находящийся ниже, называется Салем. Как называется город, расположенный выше?", "answer": "Йеру.", "complexity": "", "handout": "0"}, {"number": 99, "text": "Репортаж с \"Ролан Гарроса — 2006\" корреспондент \"Московского комсомольца\" озаглавил \"Медаль за отвагу\". На месте двух букв в тексте вопроса должны стоять другие две буквы. Какие?", "answer": "На.", "complexity": "", "handout": "0"}, {"number": 99, "text": "Камиль-Жакоб ПиссаррО родился на острове Сент-Томе, а итогом его творчества стали пейзажи Нормандии. Его биограф, Ксения Богемская, в качестве некоторой антитезы вспоминает путь другого человека. Назовите этого человека.", "answer": "Гоген.", "complexity": "", "handout": "0"}, {"number": 99, "text": "У каскадеров есть правило: сзади лошадей и ИХ не стоять. Википедия в числе известных ИХ называет Джеки Чана и Жана Маре. Назовите ИХ.", "answer": "Каскадеры.", "complexity": "", "handout": "0"}, {"number": 99, "text": "По мнению Фазиля Искандера, клюв идеологии никогда не попадает в ЭТО. ЭТО стало названием заведения в Санкт-Петербурге, в котором, по словам владельцев, можно подумать за чашечкой кофе. Назовите ЭТО двумя словами.", "answer": "Зерно истины.", "complexity": "", "handout": "0"}, {"number": 99, "text": "Внимание, в вопросе есть замены.\nНакануне своего спешного отъезда в континентальную Европу Холмс изучил многие ЗАКОНЫ ПЕРВОГО. Слушатели школы, открытой компанией \"Эспрессо-Центр\", изучают, в том числе, ЗАКОНЫ ВТОРОГО. Мы не спрашиваем, какое слово мы заменили на слово \"ЗАКОНЫ\". Напишите, что мы заменили на \"ПЕРВОЕ\" и \"ВТОРОЕ\".", "answer": "Баритсу, бариста.", "complexity": "", "handout": "0"}, {"number": 99, "text": "Знаменитая ОНА состоялась в 1997 году возле отделения \"Bank of America\" в Северном Голливуде. В ходе подготовки Марафона предполагалось, что ЕЕ основной параметр будет равен семидесяти семи, но от этой идеи благоразумно отказались. Назовите ЕЕ.", "answer": "Перестрелка.", "complexity": "", "handout": "0"}, {"number": 100, "text": "В русскоязычной Википедии в статье о ВТО [Вэ-Тэ-О] фигурирует \"синхронизация часов\" и \"вся Вселенная\". Восстановите букву, которую мы заменили в этом вопросе.", "answer": "С.", "complexity": "", "handout": "0"}, {"number": 100, "text": "В конце спектакля \"Король Лир\" Льва Додина инструмент, на котором перед этим аккомпанировал себе шут, играет сам. Ответьте, выбросив две буквы из названия произведения 1977 года, как озаглавили заметки о постановке Додина сразу несколько изданий.", "answer": "\"Оконченная пьеса для механического пианино\".", "complexity": "", "handout": "0"}, {"number": 100, "text": "Ее название в переводе на русский язык звучало бы как \"черноакациевая\". Впрочем, автору неизвестно, много ли там этой самой черной акации нынче растет. Где же?", "answer": "В Караганде.", "complexity": "", "handout": "0"}, {"number": 100, "text": "Прослушайте описание финальной сцены спектакля, поставленного по классической пьесе. Почти полностью пустая сцена. Выходит старик, печально озирается, ложится. Сверху, одно за другим, падают полотна белой ткани. Мы не будем спрашивать название пьесы, назовите имя старика.", "answer": "Фирс.", "complexity": "", "handout": "0"}, {"number": 100, "text": "По словам диакона Андрея Кураева, конец света — это ИКС на ИГРЕКЕ. В пародии на ИКС звучит фраза \"Не стрелять, они выпустили заложника!\", а в финале две барышни поют несколько видоизмененную песню \"Я сошла с ума\". В пародии на ИГРЕК звучит такая фраза: \"Завтра в Самаре, Саратове и низовьях Волги, которую воспевали Тютчев и Фет, в которой голышом плескался титан русской прозы Паустовскый — плюс 18\". Назовите ИКС и ИГРЕК.", "answer": "\"Дом-2\", канал \"Культура\".", "complexity": "", "handout": "0"}, {"number": 100, "text": "Туманность Андромеды — хорошо заметное невооруженным глазом пятнышко на звездном небе над головой. Назовите человека, который впервые догадался, что она состоит из таких же звезд, как и все звездное небо.", "answer": "Кант.", "complexity": "", "handout": "0"}, {"number": 256, "text": "Автору вопроса таки удалось найти в Интернете немало страниц, содержащих информацию про альгинат кальция, который используют при производстве желе и мороженого. Обозначение, принятое для него, на четыре символа короче известного ответа. Назовите это обозначение.", "answer": "E 404.", "complexity": "", "handout": "0"}]}, {"id": "4558", "title": "IX Чемпионат России среди студенческих команд по ЧГК (Нижний Новгород)", "questions": [{"number": 1, "text": "[Ведущему: раздаточный материал кладется изображением вниз! По одной раздатке на команду! Попросите команды не переворачивать раздатку до начала чтения вопроса.]\nНекоторое время назад в одном российском городе несколько десятков человек практически одновременно совершили, можно сказать, то, для чего известному ученому требовалась ОНА. Назовите ЕЕ двумя словами.", "answer": "Точка опоры.", "complexity": "", "handout": "1"}, {"number": 1, "text": "В Монголии ОН изначально находится между верблюдом и кибиткой. Монгольские мастера старались изготовить ЕГО особенно тщательно. Назовите ЕГО двумя словами.", "answer": "Шахматный конь.", "complexity": "", "handout": "0"}, {"number": 1, "text": "В конце одного американского романа из-за ИКСА мигает освещение во всём здании. В комплект аттракциона с ИКСОМ, предлагаемого фирмой Distortions [дистОршнс], входит манекен из латекса. Назовите ИКС двумя словами.", "answer": "Электрический стул.", "complexity": "", "handout": "0"}, {"number": 1, "text": "Так называемое \"Чудо Святого Януария\" заключается в том, что засохшая кровь этого святого, хранящаяся в церкви Санта Кьяра в специальной капсуле, закипает и становится жидкой. Это обычно происходит в день годовщины события, произошедшего в 1631 году. Назовите это событие максимально точно.", "answer": "Извержение вулкана Везувий.", "complexity": "", "handout": "0"}, {"number": 1, "text": "ОНА принадлежит к типу pudica [пУдика] — стыдливая, представительницы которого придерживают рукой спадающее одеяние. Назовите ЕЕ.", "answer": "Венера Милосская.", "complexity": "", "handout": "0"}, {"number": 1, "text": "В одной комедии ОН вменялся в обязанность некоторым марафонцам. Раздосадованный поражением Фернандо Алонсо однажды обогнал на НЕМ Льюиса Хэмилтона. Назовите ЕГО двумя словами.", "answer": "Круг почета.", "complexity": "", "handout": "0"}, {"number": 1, "text": "На рекламном постере компании \"DHL\" наряду со слоганом \"Всегда первые\" изображены ОНА и ОНО с серебряными медалями. Назовите ЕЕ и ЕГО.", "answer": "Курица и яйцо.", "complexity": "", "handout": "0"}, {"number": 2, "text": "ИКСОМ можно назвать некоторых из вас. Русскоязычный сайт, посвященный \"ИКСУ\", находится в итальянской доменной зоне. Назовите ИКС.", "answer": "Эрудит.", "complexity": "", "handout": "0"}, {"number": 2, "text": "Герой пьесы Виктора Большакова удивляется, найдя у себя под дверью незаметно подброшенное письмо, ведь ОНИ поют на все голоса, как нищие на Пасху. В монгольском фольклорном сборнике ОНИ рассказывают герою сказки, удерживая того от восхождения на трон. Назовите ИХ.", "answer": "Ступени.", "complexity": "", "handout": "0"}, {"number": 2, "text": "Перед вами часть одного из вариантов логотипа, предложенного для фильма 2001 года. Назовите этот фильм.", "answer": "\"Мулен Руж\".", "complexity": "", "handout": "1"}, {"number": 2, "text": "В рассказе, действие которого происходит на пароходе, Бунин сравнивает с НЕЙ тень от канатов, перил и скамеек. Индейцы муиски верили, что души после смерти переправляются через большую реку на лодках из НЕЕ. Поэтому муиски никогда не убивали... Кого?", "answer": "Пауков.", "complexity": "", "handout": "0"}, {"number": 2, "text": "Словом \"ИКС\" в этом вопросе мы заменили другое слово.\n\"ИКС\" — это название индийской ракеты, молниеносно разящей танки противника. В известном произведении конца XIX века ИКС раскачивался, как одуванчик под ветром. Напишите имя того, кто победил ИКСА в этом произведении.", "answer": "Рикки-Тикки-Тави.", "complexity": "", "handout": "0"}, {"number": 2, "text": "В оригинале одного немецкого романа действует Baron Lefuet. А какую короткую фамилию носит этот Барон в переводе Александры Исаевой?", "answer": "Треч.", "complexity": "", "handout": "1"}, {"number": 2, "text": "Согласно Валентину Пикулю, у солдат Апшеронского полка ОНИ появились после битвы при Кунерсдорфе, где полк понес большие потери, но выстоял. В сказке Сергея Козлова Гусь расхаживает, скрипя ИМИ. Назовите ИХ двумя словами.", "answer": "Красные сапоги.", "complexity": "", "handout": "0"}, {"number": 3, "text": "Став взрослым, этот уроженец провинции Таррагона воплотил в жизнь свои мечты и фантазии, родившиеся на песчаном морском берегу. Назовите его.", "answer": "Антонио Гауди.", "complexity": "", "handout": "0"}, {"number": 3, "text": "ЭТИМ ТИТУЛОМ британцы величали свою любимую принцессу Диану. А вот другая известная дама, также носившая ЭТОТ ТИТУЛ, стала воплощением нелепой и бессмысленной ярости. Назовите ЭТОТ ТИТУЛ по-английски тремя словами.", "answer": "Queen of hearts.", "complexity": "", "handout": "0"}, {"number": 3, "text": "На Всемирной выставке 1939 года в Нью-Йорке внимание посетителей привлекал один из аттракционов в павильоне \"Дженерал Моторс\". Этот популярный аттракцион представлял собой панораму Америки будущего. А как он назывался?", "answer": "Футурама.", "complexity": "", "handout": "0"}, {"number": 3, "text": "Словом \"ИКСЫ\" мы заменили другое слово.\nВ англоязычной загадке, ответом на которую являются \"ИКСЫ\", упоминаются несколько королей. На Руси ИКСЫ были известны как урмане. Сколько королей упоминается в загадке?", "answer": "6.", "complexity": "", "handout": "0"}, {"number": 3, "text": "В стихотворении Константина Кедрова в одной из строк упоминается гекзаметр. Название какого древнего животного есть в предшествующей ей строке?", "answer": "Птеродактиль.", "complexity": "", "handout": "0"}, {"number": 3, "text": "О Тенцинге Норгее, покорителе Эвереста, говорили, что у него есть ОНО. Елена Семенова пишет, что искусные волынщики ощущают мешок волынки как ЕГО. Назовите ЕГО двумя словами.", "answer": "Третье легкое.", "complexity": "", "handout": "0"}, {"number": 3, "text": "В одном стихотворении Омар Хайям упоминает застывшие формулы и сухой ИКС цитат. Назовите ИКС коротким словом.", "answer": "Изюм.", "complexity": "", "handout": "0"}, {"number": 4, "text": "Героиня фильма \"Maybe Baby\", прошедшая медицинскую процедуру, рассматривает снимок и говорит, что не у каждого есть своя фотография в возрасте нескольких лет. В предыдущем предложении в одном из слов мы удалили три буквы. Напишите измененное слово в исходном виде.", "answer": "Клеток.", "complexity": "", "handout": "0"}, {"number": 4, "text": "Дуплет.\n1. Когда Эдуард IV взошел на престол, то он, как пишет Чарльз Диккенс, не захотел проявить милосердие: он вознамерился не просто обломать ЕЙ ветки, но вырвать ЕЕ с корнем. Назовите ЕЕ двумя словами.\n2. Борис Владимирский отмечает, что этот художник любил красный, карминный и розовый. Назовите этого художника.", "answer": "1. Алая роза.\n2. Нико Пиросманишвили. Зачет: Пиросмани.", "complexity": "", "handout": "0"}, {"number": 4, "text": "Комментатор Роман Скворцов сравнил раскинувшегося в воздухе баскетболиста с НЕЙ. \"ОНА\" — название салата, в состав которого входят креветки и семга и который подают особым образом. Назовите ЕЕ двумя словами.", "answer": "Морская звезда.", "complexity": "", "handout": "0"}, {"number": 4, "text": "Перед вами фрагменты работ художника Егора Острова. Выставка, на которой были представлены эти работы, называлась \"ОНА\". Согласно Википедии, ОНА возникла в 1970-х годах в результате осмысления формул Венециано. Назовите ЕЕ.", "answer": "Теория струн.", "complexity": "", "handout": "1"}, {"number": 4, "text": "Перед вами фрагменты двух картин \"Распятие\", написанных одним художником. Одну из этих картин художник написал в возрасте 36-38 лет, другую — после 60 лет. Назовите этого художника.", "answer": "Эль Греко.", "complexity": "", "handout": "1"}, {"number": 4, "text": "Знаменитый летчик Чарльз Линдберг дружил с французским хирургом-новатором Каррелем и даже спроектировал некое устройство. Рассказывая об этом эпизоде в биографии Линдберга, сайт aviaport.ru приводит строчку из песни. Напишите эту строчку.", "answer": "\"А вместо сердца — пламенный мотор\".", "complexity": "", "handout": "0"}, {"number": 4, "text": "Кора Ландау пишет, что у высококлассного хирурга Симоняна во время операций не было ЕЕ. В продвинутом курсе теоретической физики Ландау и Лифшица ОНА не упоминается. Назовите ЕЕ.", "answer": "Левая рука.", "complexity": "", "handout": "0"}, {"number": 5, "text": "По совету Дэвида Маккалоу, туристу, когда гид непременно покажет ему лабиринт, стоит помнить известное утверждение. Какое?", "answer": "Все критяне лжецы.", "complexity": "", "handout": "0"}, {"number": 5, "text": "В посвященной средневековой истории книге описывается, как некий отважный рыцарь, получив сильный удар мечом по шлему, ненадолго отлучился с поля боя. Во время этой отлучки его голова на несколько мгновений в буквальном смысле оказалась ТАМ. Какие четыре слова мы заменили словом \"ТАМ\"?", "answer": "Между молотом и наковальней.", "complexity": "", "handout": "0"}, {"number": 5, "text": "Современные исследователи полагают, что имя, фигурирующее в одном русском фразеологизме, ведет к древнейшим божествам, таким как общеславянский бог Рарог и русский солнцебог Хорс. Напишите это имя.", "answer": "Горох.", "complexity": "", "handout": "0"}, {"number": 5, "text": "Каркас корректирующего бюстгальтера \"Нин\" состоял из двух перфорированных металлических полушарий. Англичанка Розмари Хоторн пишет, что, наверное, этот каркас можно было использовать и в качестве большого ЕГО. ОНО однажды стало предметом обмена. Назовите ЕГО.", "answer": "Чайное ситечко.", "complexity": "", "handout": "0"}, {"number": 5, "text": "Чтобы получить ЕГО, оператор Борис Травкин помещал каплю окрашенного в оранжевый цвет одеколона в водный раствор анилиновой краски. В посвященной ЕМУ статье Википедии упоминаются два города. Назовите оба этих города.", "answer": "Хиросима, Нагасаки.", "complexity": "", "handout": "0"}, {"number": 5, "text": "Мелкие ОНИ образуются при быстром выделении углекислого газа, крупные — при медленном. Перед вами интерьер отнюдь не захолустного ресторана, названного в честь НЕЕ. Назовите ЕЕ точно.", "answer": "Сырная дыра.", "complexity": "", "handout": "1"}, {"number": 5, "text": "Говоря о российской истории, Петр Вайль пишет, что ОНО проткнуло годы между 1917-м и 1991-м. В одной статье об использовании ЕГО приводится в пример \"поезд Москва — Иркутск — Хабаровск — Владивосток\". Назовите ЕГО одним словом.", "answer": "Тире.", "complexity": "", "handout": "0"}, {"number": 6, "text": "В древневосточных манускриптах говорится, что свет славы будет сверкать с висков падишаха Акбара и величие сиянием озарит чело падишаха. Светлана Воробьева пишет, что у персонажей могольской миниатюры ИХ бывает даже два. Назовите ИХ одним словом.", "answer": "Нимбы.", "complexity": "", "handout": "0"}, {"number": 6, "text": "Перед вами портрет Николая Ивановича Пирогова. Во время службы на Кавказе он вместо деревянных накладок для фиксации переломов стал применять повязки, пропитанные неким веществом. Назовите это вещество.", "answer": "Крахмал. Незачет: Гипс.", "complexity": "", "handout": "1"}, {"number": 6, "text": "Восстановите пропущенное прилагательное в стихотворении поэта и ученого Омара Хайяма:\n\"Мы попали в сей мир, как в силок — воробей.\nМы полны беспокойства, надежд и скорбей.\nВ эту [пропуск] клетку, где нету дверей,\nМы попали с тобой не по воле своей\".", "answer": "Круглую.", "complexity": "", "handout": "0"}, {"number": 6, "text": "АЛЬФА — это польское уменьшительное имя от имени Ричард. Сигизмунд Кржижановский ошибочно предположил, что слово \"линза\" происходит от итальянского выражения, означающего \"глаза АЛЬФЫ\". Какое слово мы заменили на \"АЛЬФУ\"?", "answer": "Рысь.", "complexity": "", "handout": "0"}, {"number": 6, "text": "Побывавший в Санкт-Петербурге турист рассказывал, что в центре города фасады домов весьма импозантны в отличие от неприглядных задних дворов. В своем рассказе он упомянул то, что стало причиной конфликта. Назовите эту причину двумя словами, начинающимися на одну и ту же букву.", "answer": "Перевязь Портоса.", "complexity": "", "handout": "0"}, {"number": 6, "text": "Внимание, цитата из стихотворения Нины Подгоричани:\n\"Гибнем, гибнем мы без счета,\nВсех ли, нет, смела волна?!\nНе считать же, полк иль рота,\nЕсли делу жизнь нужна.\nПусть трудна, сложна задача\nНам назад идти нельзя, —\nТолько [слово пропущено] при удаче\n[Три слова пропущены]\".\nВосстановите пропуски.", "answer": "Пешка, превращается в ферзя.", "complexity": "", "handout": "0"}, {"number": 7, "text": "Футболист Джованни Элбер однажды получил в первом тайме желтую карточку за разговоры с судьей. На второй тайм он вышел, использовав то, что мы называем словом британского происхождения. Что именно?", "answer": "Скотч.", "complexity": "", "handout": "0"}, {"number": 7, "text": "Распространенный среди катАров обряд консоламЕнтум предполагал строгий пост. Как пишет Генри Чарльз Ли, лишение ЭТОГО стоило жизни Вителу Гилберту, подвергнутому упомянутому обряду. Назовите ЭТО двумя словами, начинающимися на одну и ту же букву.", "answer": "Материнское молоко.", "complexity": "", "handout": "0"}, {"number": 7, "text": "Александр Макаров, в 60-х годах узнав от знакомого о существовании бриджа, отправился в Ленинскую библиотеку и некоторое время, можно сказать, ДЕЛАЛ ЭТО. Литературный персонаж, человек с лоснящимся на правом рукаве сукном, тоже некоторое время ДЕЛАЛ ЭТО. Какие три слова мы заменили на \"ДЕЛАЛ ЭТО\"?", "answer": "Переписывал Британскую энциклопедию.", "complexity": "", "handout": "0"}, {"number": 7, "text": "Перед вами образец ТАКОГО вывода данных. К ТАКИМ группам относят Mogwai, Sigur Ros, Fridge. Какое слово мы заменили словом \"ТАКОЙ\"?", "answer": "Построковый.", "complexity": "", "handout": "1"}, {"number": 7, "text": "По замечанию Ричарда Хьюза, не Мольтке, а именно этот человек одержал победу над французами под Седаном. Назовите имя внучки этого человека.", "answer": "Берта.", "complexity": "", "handout": "0"}, {"number": 7, "text": "Банкоталер — условная денежная единица, в которую в XIX веке пересчитывались все платежи, проходившие через один из банков. А в каком городе находился этот банк?", "answer": "В Гамбурге.", "complexity": "", "handout": "0"}, {"number": 8, "text": "[Ведущему: отточия в цитате игнорировать.]\nБиограф Пабло Пикассо так пишет о конце 1904-го — начале 1905 года: \"Появление Мадлен <...> в жизни художника <...> сыграло важную роль в его постепенном выходе из [слово пропущено] пессимизма\". Какое прилагательное мы пропустили в этой цитате?", "answer": "Голубого.", "complexity": "", "handout": "0"}, {"number": 8, "text": "Киаран Карсон пишет, что Святой Галле является покровителем птиц, Швейцарии, а также ИХ. Назовите ИХ как можно точнее.", "answer": "Часы с кукушкой.", "complexity": "", "handout": "0"},

 3, "text": "Вот слегка измененный новостной заголовок на Спорт.РБК: \"Костакурта возглавил клуб Сербии\". Восстановите измененную часть.", "answer": "Серии Б.", "complexity": "", "handout": "1"}, {"number": 3, "text": "Несколько десятков лет назад в газете \"Bild\" была опубликована фотография ЕГО на фоне памятника австрийскому монарху. Назовите ЕГО.", "answer": "Франц Беккенбауэр.", "complexity": "", "handout": "0"}, {"number": 3, "text": "Вообще-то это слово мужского рода, что должно быть известно не только химикам и автолюбителям. Но, оказывается, у него есть омоним женского рода; например, в одной из статей, посвященных тренерской работе, подход \"Добрый тренер и злой тренер\" был назван примером ЕЕ. Назовите ЕЕ.", "answer": "Полироль.", "complexity": "", "handout": "0"}, {"number": 4, "text": "Во время матча российской женской баскетбольной сборной против команды Израиля комментатор канала \"Спорт\" высказал предположение, что наша команда играет по системе \"3+2\" с переходом на \"4+1\". Поясняя свою мысль, он употребил два существительных, начинающихся на одну и ту же букву. Воспроизведите их.", "answer": "Брюнетки, блондинки.", "complexity": "", "handout": "0"}, {"number": 4, "text": "Вопрос задает депутат ставропольской городской Думы.\nИз рассказа о посещении Бангкока: \"... были-то всего полдня, всех ТАКИХ Будд не обошли, там еще СЯКОЙ есть\". Какие прилагательные были нами заменены на \"ТАКОЙ\" и \"СЯКОЙ\"?", "answer": "Гигантский, спящий.", "complexity": "", "handout": "0"}, {"number": 4, "text": "Статья на сайте \"В ОТПУСК.РУ\" рассказывает о крайне необычном способе игры в футбол для определенных людей. В качестве игрового поля выбирается застывший пруд или озеро. Играют обычно не более двух человек одновременно. Игроки упираются ногами в лед и бьют по мячу, пытаясь забить его в ворота-лунку. Ответьте одним английским словом, чем занимаются люди, которым посвящена эта статья?", "answer": "Дайвингом.", "complexity": "", "handout": "0"}, {"number": 5, "text": "Внимание, вопрос N 5. Кстати, возможно, его стоило отправить для отыгрыша в элитарном казино \"Что? Где? Когда?\".\nСтатья, посвященная одному из европейских клубов, разбита на две части, одна из которых повествует о позитивных моментах в жизни клуба, а вторая — о негативных. Заглавия обеих частей можно прочитать в названии известного литературного произведения. Назовите его автора.", "answer": "Стендаль.", "complexity": "", "handout": "0"}, {"number": 5, "text": "В своем интервью, данном в 2008 году, эти две девушки рассказали, что Чемпионат Европы они пропустили, потому что обе заболели, и у них поднялась температура до 38,5. Назовите имя и той, и другой.", "answer": "Анастасия.", "complexity": "", "handout": "0"}, {"number": 5, "text": "В меню екатеринбургского спортбара \"Play off\" некогда значился коктейль, ингредиентами которого являлись водка, голубой курасао и гренадин. Название этого коктейля состояло из двух слов, первое из которых можно было встретить в том же меню в разделе \"Супы\". Воспроизведите это название.", "answer": "\"Сборная России\".", "complexity": "", "handout": "0"}, {"number": 6, "text": "Автор статьи на сайте \"Чемпионат.Ру\", говоря о волевых победах в нескольких матчах ЧЕ-2008, вынес в заголовок своей статьи название экранизированной относительно недавно книги. Назовите эту книгу.", "answer": "\"Турецкий гамбит\".", "complexity": "", "handout": "0"}, {"number": 6, "text": "Во время довольно типичной остановки в матче с \"Лупаренсе\" один из игроков МФК \"ВИЗ-Синара\" сорвал аплодисменты трибун, взяв, так сказать, инициативу в свои руки. Кстати, назовите фамилию этого игрока.", "answer": "Чистополов.", "complexity": "", "handout": "1"}, {"number": 7, "text": "ПЕРВЫЙ и ВТОРОЙ — ровесники. Самое значительное достижение в 2008 году для обоих — победа в Кубке УЕФА, а в составе сборной России — полуфинал, и это после поражения от испанцев с разницей в три мяча! В августе 2008 года было немало разговоров об их переходах в другие клубы. У обоих есть короткие прозвища, начинающиеся на одну букву. Назовите эти прозвища.", "answer": "Шава, Шах.", "complexity": "", "handout": "0"}, {"number": 7, "text": "Анонс домашних матчей МФК \"ВИЗ-Синара\" против \"Спартака\", представлявшего подмосковный город Руза, был сопровожден заголовком \"ТАКАЯ команда против СЯКОЙ\". ТАКОЙ \"ВИЗ-Синару\" называют за то, что костяк команды составляют воспитанники собственной школы. Какие похожие прилагательные мы заменили словами \"ТАКАЯ\" и \"СЯКАЯ\"?", "answer": "Русская, рузская.", "complexity": "", "handout": "0"}, {"number": 8, "text": "Внимание, в вопросе есть замены.\nОлимпийская чемпионка Пекина в спортивной ходьбе Ольга Каниськина — настолько миниатюрная девушка, что журналист \"СЭ\" не смог не задать ей вопрос, суть которого перекликается с названием романа \"ОДЕРЖИМЫЕ БЕСОМ\". \"Так ведь БЕС бывает и в РЕБРО\", — ответила на этот вопрос спортсменка. Мы не спрашиваем, что мы заменили словом \"ОДЕРЖИМЫЕ\". Что мы заменили словами \"БЕС\" и \"РЕБРО\"?", "answer": "Ветер, спина.", "complexity": "", "handout": "0"}, {"number": 8, "text": "Внимание, в вопросе три слова заменены на \"НОЛЬ БЕЗ ПАЛОЧКИ\".\nВ Свердловской области есть детский творческий союз, который называется \"НОЛЬ БЕЗ ПАЛОЧКИ\". А в газете \"Советский спорт\" НОЛЬ БЕЗ ПАЛОЧКИ упоминается в заметке о человеке, родившемся 3 июня 1982 года. Назовите этого человека.", "answer": "Елена Исинбаева.", "complexity": "", "handout": "0"}, {"number": 9, "text": "Боб немецкого бобслеиста, имя и фамилию которого вы видите перед собой, украшен сложным словом и изображением... Кого?", "answer": "Зайчика.", "complexity": "", "handout": "1"}, {"number": 9, "text": "В одном футбольном ролике нарезка голов, забитых через себя в падении, демонстрируется под песню группы \"Queen\". Ответьте, какое мероприятие вдохновило Фредди Меркьюри на создание этой песни?", "answer": "\"Тур де Франс\".", "complexity": "", "handout": "0"}, {"number": 9, "text": "Шутники в Англии утверждают, что именно ЭТИМ была первая фраза на Земле, которой Адам учтиво представлялся Еве в райском саду. На русском языке ИХ сочинял, например, Велимир Хлебников. А в 1987 году на английском языке был составлен самый длинный ТАКОЙ текст, состоящий из ста тысяч слов и вошедший в Книгу рекордов Гиннесса. Было бы ошибкой просить вас написать в ответе этот текст. Напишите только известное большинству пользователей Интернета ТАКОЕ число.", "answer": "404.", "complexity": "", "handout": "0"}, {"number": 10, "text": "Телекомментатор, восхищенный очередным сложнейшим шаром, забитым бильярдистом Ярославом Тарновецким, воскликнул: \"И так он может делать ИКС ИГРЕК! Ну, то есть не ИКС ИГРЕК, а ИКС ЗЕТ\". В этой фразе ИКС — предлог, а ИГРЕК и ЗЕТ можно изобразить схожим образом. Назовите ИГРЕК и ЗЕТ.", "answer": "Бесконечность, восемь.", "complexity": "", "handout": "0"}, {"number": 10, "text": "Внимание, в вопросе есть замена.\nАбсолютная чемпионка мира по боксу во втором среднем весе Наталья Рагозина рассказывает: \"... [Тренер] Александр Зимин, недолго думая, предложил мне поспарринговать с Олей. ... В итоге мы провели в ринге три полноценных раунда. ... Уверена, эта встреча придаст эмоциональных сил мне и Оле\". Назовите фамилию Оли.", "answer": "Валуев.", "complexity": "", "handout": "0"}, {"number": 11, "text": "В начале июня 2008 года в юмористической передаче Гарик Мартиросян предложил проводить один из матчей сборной России не в Швейцарии, а в другом месте, где наши шансы якобы увеличатся. В ответ Александр Цекало высказал предположение, что там наши болельщики будут кричать промахнувшимся футболистам... Что?", "answer": "Мазепа!", "complexity": "", "handout": "0"}, {"number": 11, "text": "Оуэн Харгривз, проведший детство в Канаде, игравший за мюнхенскую \"Баварию\", а потом перешедший в \"Манчестер Юнайтед\", признался, что хотя и был в целом готов к английской жизни, но все же после перехода поначалу испытывал определенные неудобства. А вот один из его нынешних одноклубников сталкивался с аналогичными трудностями ранее, еще до своего переезда в Англию. В чемпионате какой страны он выступал в период с 2000 по 2003 год?", "answer": "Япония.", "complexity": "", "handout": "0"}, {"number": 12, "text": "Острословы, вероятно, намекая на традиционно невнятную игру этого клуба, отмечают созвучность его названия с немецким словом, что иллюстрирует розданная вам картинка, подпись на которой мы закрыли. Назовите упомянутое слово или его перевод.", "answer": "Totenkopf.", "complexity": "", "handout": "1"}, {"number": 12, "text": "В 2008 году игры Чемпионата Мира по этому виду спорта прошли на двух аренах — арене Нильсона Нельсона и \"МараканизИньо\". В этом виде спорта молодежную сборную Италии тренирует Паоло МиникУччи. О каком виде спорта идет речь?", "answer": "Мини-футбол.", "complexity": "", "handout": "0"}, {"number": 13, "text": "После фантастических успехов сборной России некоторые заговорили о том, что Гус Хиддинк, мол, продал душу дьяволу. А вот один интернет-пользователь на этом не остановился и — также в шутку — заподозрил голландца еще в одном злонамеренном деянии. Каком именно?", "answer": "В неуплате налогов после продажи души дьяволу.", "complexity": "", "handout": "0"}, {"number": 13, "text": "Когда этого футболиста, дебютировавшего в российском чемпионате в прошлом году, еще только представляли тренерскому штабу новой команды, он вдруг изумленно спросил, сколько же в клубе его соотечественников. Назовите этого футболиста.", "answer": "Саво Милошевич.", "complexity": "", "handout": "0"}, {"number": 14, "text": "Несмотря на наличие у этого мини-футбольного клуба \"тезки\" в большом футболе, неофициальное прозвище у него — свое, правда, различие лишь в первой букве. Назовите оба прозвища.", "answer": "Кони, пони.", "complexity": "", "handout": "0"}, {"number": 14, "text": "В испанской примере 1949/50 годов лидеры часто громили друг друга: \"Атлетико\" — \"Депортиво\", \"Валенсия\" — \"Атлетико\", \"Атлетик\" из Бильбао — \"Реал\", \"Реал\" — \"Барселона\" и еще несколько матчей закончились с похожим крупным счетом, который и хоккейным-то назвать не хочется. В истории тот чемпионат получил неофициальное название. Мы не спрашиваем вас, какое. Назовите известного племянника одного из игроков сборной Испании, игравшей на чемпионате мира по футболу в 2002 году.", "answer": "Рафаэль Надаль.", "complexity": "", "handout": "0"}, {"number": 15, "text": "По словам нобелевского лауреата, ПЕРВАЯ — это самая сложная ВТОРАЯ. А один болельщик \"Спартака\" пошутил, что если ВТОРАЯ на нуле, то пора браться за ПЕРВУЮ. Назовите ПЕРВУЮ и ВТОРУЮ.", "answer": "Химия, физика.", "complexity": "", "handout": "0"}, {"number": 15, "text": "Ну, что ж, последний вопрос турнира.\nВо время трансляции на канале \"Спорт\" в определенный момент комментатор сказал о датских спортсменках, что они \"... довольно бездарно провели (два слова пропущено)\", что звучало довольно тавтологично. А какой вид спорта транслировался?", "answer": "Керлинг.", "complexity": "", "handout": "0"}]}, {"id": "222", "title": "XXI Международный турнир по интеллектуальным играм «Беловежская зима — 2019»", "questions": [{"number": 1, "text": "Старейшины из романа И́во А́ндрича считали, что их знакомый визи́рь в душе́ был неверным. Ведь для вызова слуг визи́рь пользовался… чем?", "answer": "колокольчик.", "complexity": "78.26", "handout": "0"}, {"number": 2, "text": "В 2009 году после десятилетнего перерыва воссоединились в классическом составе иконы альтернативного метала, группа Faith no More. Прошедший в честь воссоединения тур получил название ОНО. Назовите ЕГО двумя словами.", "answer": "второе пришествие.", "complexity": "86.96", "handout": "0"}, {"number": 3, "text": "Этот термин впервые использовал в 1602 году Че́заре Баро́нио, сетуя на нехватку источников. А популярность получил в эпоху Просвещения. Напишите этот термин.", "answer": "тёмные века", "complexity": "32.61", "handout": "0"}, {"number": 4, "text": "Полотно Дега́ «Интерьер» изображает мужчину у две́ри, а также полураздетую женщину. Некоторые критики не разделяют мнение, будто полотно — просто упражнение художника со светом. Эти критики считают коричневые фрагменты покрывала не ПЕРВОЙ, а ВТОРОЙ. Назовите ПЕРВУЮ и ВТОРУЮ словами, заканчивающимися одинаковыми буквами.", "answer": "тень, кровь.", "complexity": "56.52", "handout": "0"}, {"number": 5, "text": "Во время эпидемии лихорадки Сэ́мюэл Мадд потребовал ДЕЛАТЬ ЭТО перед размещением на место погибшего нового больного. Для соответствия четырём, ЭТО должны ДЕЛАТЬ каждый день. Что именно ДЕЛАТЬ?", "answer": "менять постельное белье.", "complexity": "76.09", "handout": "0"}, {"number": 6, "text": "Для запуска стри́мингового сервиса Apple TV был выбран, в том числе, и биографический проект про НЕГО. Но Тим Кук лично забраковал отсня́тые серии из-за кокаина, стволов и оргий. ОН судился с гинекологом по поводу торговой марки. Назовите ЕГО.", "answer": "Dr. Dre.", "complexity": "0.00", "handout": "0"}, {"number": 7, "text": "В первом крупном сражении Гражданской войны северяне потерпели поражение. После чего Дже́ймс Са́ндерсон предложил выделить постоянного ЕГО на каждые сто человек. Для НЕГО характерен особый головной убор. Назовите ЕГО.", "answer": "повар.", "complexity": "26.09", "handout": "0"}, {"number": 8, "text": "Воспользовавшись отсутствием единой базы страховых компаний, Изабе́лла Па́ркер начиная с 1993 года около пятидесяти раз СДЕЛАЛА ЭТО в различных магазинах. Раньше причиной того, что актёры ДЕЛАЛИ ЭТО, часто была ОНА. Назовите ЕЁ двумя словами.", "answer": "банановая кожура.", "complexity": "71.74", "handout": "0"}, {"number": 9, "text": "В 1983 году археолог-любитель Ни́колас Клэпп позвонил и попросил помочь в поисках потерянного города. А приня́вший звонок Рон Блом участвовал в подготовке следующего ЕГО. Последний из НИХ состоялся 21 июля 2011 года. Какие слова мы заменили словом «ОН»?", "answer": "запуск шаттла.", "complexity": "30.44", "handout": "0"}, {"number": 10, "text": "Ни́колас Клэпп написал книгу о найденном в пустыне крупном городе Уба́ре. В своей книге археолог называет ИКС Уба́ра великим. ИКС — одна из пятнадцати. Какое слово мы заменили словом «ИКС»?", "answer": "колодец.", "complexity": "23.91", "handout": "0"}, {"number": 11, "text": "Члены влиятельного в XVIII веке научного общества Би́рмингема называли себя словом, образованным от слова «ОН». Дело в том, что свои собрания рационалисты проводили в дни, когда было удобнее и безопаснее расходиться по домам после долгих обсуждений. Напишите слово «ОН».", "answer": "лунатик.", "complexity": "8.70", "handout": "0"}, {"number": 12, "text": "Денис Горе́лов и Горде́й Пе́трик отмечают, что ОНА в кинематографе используется как кривое зеркало, отражение общенациональных душевных смут и бытового быдлячества. Один из фильмов о НЕЙ называется «Контракт». Назовите ЕЁ.", "answer": "cвадьба.", "complexity": "30.44", "handout": "0"}, {"number": 13, "text": "Первые детективы Э́да Макбе́йна про 87-й участок вышли в 1956 году и имели успех у публики. К 1960 году Э́ван Ха́нтер остановил деятельность пяти И́КСОВ. Ответьте как можно точнее, что мы заменили словом «ИКС»?", "answer": "своих псевдонимов.", "complexity": "0.00", "handout": "0"}, {"number": 14, "text": "В конце XVIII века Лапла́с мечтал о том, чтобы описать движение величайших тел Вселенной и легчайших атомов катанием фигур. Какие слова мы заменили словами «катанием фигур»?", "answer": "одной формулой.", "complexity": "2.17", "handout": "0"}, {"number": 15, "text": "В начале 1990-х из-за кризиса здания делового квартала Канэ́ри-Уорф в Лондоне оказались незавершёнными. Канэ́ри-Уорф стал символом упадка, а о НИХ, украшавших недостроенный район, услышали даже за пределами Британии. Назовите ИХ.", "answer": "пластиковые деревья.", "complexity": "0.00", "handout": "0"}, {"number": 16, "text": "В магазине, открытом Луи́джи Фри́ццо, книги предусмотрительно хранятся в НИХ. Назовите ИХ словом итальянского происхождения.", "answer": "гондолы.", "complexity": "36.96", "handout": "0"}, {"number": 17, "text": "Продолжим тему. При подготовке раздаточного материала редактор распечатал фотографию француза, а потом, так сказать, нарушил запрет. Назовите этого француза.", "answer": "Шарль Манту́.", "complexity": "69.57", "handout": "1"}, {"number": 18, "text": "Объясняя причины революции в России, Иван Бу́нин говорил, что бо́льшая часть русских людей — ИКСЫ. Реально существующий ИКС расположен в Ка́рском море. Какое слово мы заменили ИКСОМ?", "answer": "Буя́н.", "complexity": "23.91", "handout": "0"}, {"number": 19, "text": "В этом вопросе слово «ОНА» заменяет другое слово. По шуточной версии, название города связано с тем, что его центральный район, расположенный на острове, плавает в воде, как ОНА. На самом деле это название, конечно, не английского происхождения. О каком городе идёт речь?", "answer": "о Корке.", "complexity": "6.52", "handout": "0"}, {"number": 20, "text": "(Ведущему: во втором предложении сделать логическую паузу после слова «прозвищем»!) Когда хорватский полицейский Ми́рко Фили́пович стал бойцом ММА [эм-эм-а], у него появилось англоязычное прозвище из двух коротких частей. По созвучию с этим прозвищем Филиповича иногда называют ИМ. Кто ОН?", "answer": "крокодил.", "complexity": "23.91", "handout": "0"}, {"number": 21, "text": "Ми́рча Элиа́де писал, что румыны называли баста́рдов ИМИ — видимо, потому, что прелюбодеяние, как правило, совершалось вне дома. Кого стали называть ИМИ в двадцатом веке?", "answer": "хиппи.", "complexity": "54.35", "handout": "0"}, {"number": 22, "text": "По словам Николая Даниле́вского, пока древние монархии вроде Сте́фанов, Ягелло́нов и Палеолого́в считаются мёртвыми, они вызывают уважение. Но если они начинают предъявлять свои права на то, что принадлежит живым, остаётся одно средство — ТАКОЙ ОН. Какие слова мы заменили словами «ТАКОЙ ОН»?", "answer": "осиновый кол.", "complexity": "56.52", "handout": "0"}, {"number": 23, "text": "Дуплет: два вопроса по 30 секунд обсуждения каждый, оба ответа начинаются на одну и ту же букву.\n1. ПЕРВОЕ считалось символом бессмертия. Ту́ре Арне писал о глиняных ПЕРВЫХ, обнаруженных в захоронениях на территории России. Назовите ПЕРВОЕ одним словом.\n2. ВТОРОЕ считалось символом вечной юности. Герва́сий писал о волшебных ВТОРЫХ, которые ели жрецы, чтобы продлить себе жизнь. Назовите ВТОРОЕ одним словом.", "answer": "1) яйцо; 2) яблоко.\nЗачёт:\n1) в любом числе и падеже.", "complexity": "65.22", "handout": "0"}, {"number": 24, "text": "Перед вами название ТАКОГО динозавра. Если вы догадаетесь, какие две буквы пропущены в этом названии, то за минуту легко сможете проверить, что динозавр действительно ТАКОЙ. Какой ТАКОЙ?", "answer": "всеядный.", "complexity": "10.87", "handout": "1"}, {"number": 25, "text": "Крупную мафиозную организацию, которая пришла на смену одиночным бандитам, герой Дэна Си́ммонса сравнил с ЭТИМ. Создатель ЭТОГО Сэмюэ́ль Уо́лтон также создал «Sam`s Club» [сэмс клаб]. Назовите ЭТО.", "answer": "сеть магазинов «Walmart».", "complexity": "15.22", "handout": "0"}, {"number": 26, "text": "Персонаж романа «В мышеловке» утверждает, что каждый художник кладёт на холст мазки в особой манере, которую можно опознать при экспертизе. Художника он образно сравнивает с ПЕРВЫМ, а мазки со ВТОРЫМИ. Слово «ПЕРВЫЙ» и слово «ВТОРАЯ» начинаются на одну и ту же букву. Назовите ПЕРВЫЙ и ВТОРУЮ.", "answer": "пистолет, пуля.", "complexity": "8.70", "handout": "0"}, {"number": 27, "text": "В фильме «Девушка с жемчужной серёжкой» служанка собирается СДЕЛАТЬ ЭТО в мастерской, но боится повлиять на условия работы художника. Ответьте двумя словами: что именно сделать?", "answer": "вымыть окна.", "complexity": "82.61", "handout": "0"}, {"number": 28, "text": "(Ведущему: не обращать внимания команд на кавычки в тексте вопроса!)\nДуплет: два вопроса по 30 секунд обсуждения каждый. Вам достаточно сдать ответ только на первый или только на второй вопрос дуплета.\n1. Драму То́маса Га́рди, действие которой происходит в наполеоновскую эпоху, нередко сравнивают с «НЕЙ». Назовите ЕЁ.\n2. В романе 1969 года ОНА в двенадцать лет влюбилась в своего брата. Назовите ЕЁ.", "answer": "1. Илиа́да;\n2. Ада.", "complexity": "19.57", "handout": "0"}, {"number": 29, "text": "Отец героя Са́лмана Ру́шди увлекался римской историей. Сам герой действительно одевался со вкусом, но изменил своё имя, которое вызывало ассоциации с бензином. Напишите это имя.", "answer": "Петро́ний.", "complexity": "36.96", "handout": "0"}, {"number": 29, "text": "25 августа 1989 года один пассажирский самолёт бесследно исчез. По одной из версий, заголовки газет, сообщавших о безрезультатном ходе расследования, видел известный человек. Напишите номер рейса, который выполнял этот самолёт.", "answer": "404", "complexity": "58.90", "handout": "0"}, {"number": 30, "text": "Внимание, в вопросе есть замены. Книги, написанные авторами из крупных городов, чьи дороги разошлись с простым народом, в нацистской Германии презрительно называли ИКСОВОЙ литературой. ИКС позволил кораблю героя Утнапишти́ма уцелеть во время Всемирного потопа. Какое слово греческого происхождения мы заменили ИКСОМ?", "answer": "асфальт.", "complexity": "21.74", "handout": "0"}, {"number": 31, "text": "Когда расстроенный Альберт Шац написал письмо Гу́ставу VI [шестому], тот ответил, что не имеет права вмешиваться в дела ЕГО. Назовите ЕГО двумя словами.", "answer": "нобелевский комитет.", "complexity": "67.39", "handout": "0"}, {"number": 32, "text": "Человек, внедривший ЕЁ, однажды подвергся нападению, после чего стал инвалидом. По одной из версий, напавший в своё время подвергся ЕЙ. Назовите ЕЁ словом греческого происхождения.", "answer": "лоботоми́я.", "complexity": "73.91", "handout": "0"}, {"number": 33, "text": "Вспомнив способ, которым пользовался известный римлянин, Даниил Давыдов посчитал, что в наши дни операция обойдётся в сумму, эквивалентную стоимости ЕГО весом примерно 0,2 грамма. Назовите ЕГО.", "answer": "изумруд.", "complexity": "15.22", "handout": "0"}, {"number": 34, "text": "По легенде, верблюд считал себя столь безобразным животным, что перед тем, как удовлетворить потребность, напускал туман. Какие два слова были заменены в этом вопросе?", "answer": "мутил воду.", "complexity": "73.91", "handout": "0"}, {"number": 35, "text": "На одном из логотипов клуба «Готи́к д’Амье́н» изображена ОНА. По-болгарски ОНА — «водоли́вник». Назовите ЕЁ одним словом.", "answer": "горгулья.", "complexity": "54.35", "handout": "0"}, {"number": 36, "text": "В начале XX века Михаил впечатлился «ИМ» и по нескольку раз в день приходил к сараю. Назовите ЕГО двумя словами, начинающимися на соседние буквы алфавита.", "answer": "«Руанский собор».", "complexity": "6.52", "handout": "0"}, {"number": 37, "text": "В своём творчестве Вася Ло́жкин затрагивает остросоциальные темы, о которых не принято говорить публично. Персонажи одной из картин Ложкина стоят с топорами у проёма с надписью «ОНО». Назовите ЕГО двумя словами, начинающимися на одну и ту же букву.", "answer": "окно Овертона.", "complexity": "43.48", "handout": "0"}, {"number": 38, "text": "Напишите фамилию Уильяма, который однажды рассы́пал соль, после чего полил её вином.", "answer": "Спу́нер.", "complexity": "0.00", "handout": "0"}, {"number": 39, "text": "Ма́ртин Па́чнер пишет, что известный француз уделил много времени пропагандированию своего проекта, поэтому самой объёмной оказалась ОНА. Назовите ЕЁ двумя словами.", "answer": "статья «Энциклопедия».", "complexity": "10.87", "handout": "0"}, {"number": 40, "text": "Стивен Уи́лтшир прославился так называемым «лондонским алфавитом» — изображениями 26 лондонских строений. Позже Стивена приглашали и в другие города, заказывая для него вертолёт. Стивен — ИКС. В одном произведении отмечается, что у ИКСОВ есть талант. Назовите ИКСА.", "answer": "сава́нт.", "complexity": "23.91", "handout": "0"}, {"number": 41, "text": "В 1895 году в бельгийской деревне Эльзе́ль люди отравились неизвестным ядом. Подозрение в осознанном отравлении удалось развеять Эмилю Эрменгему. Михаил Шифрин пишет, что эта история попалась на глаза... Кому?", "answer": "[Агате] Кристи.", "complexity": "30.44", "handout": "0"}, {"number": 42, "text": "По словам Вадима Гриценко, рабочие ямальских лагерей изготавливали ИХ из чулок. Назовите ИХ словом с приставкой.", "answer": "накомарники.", "complexity": "13.04", "handout": "0"}, {"number": 43, "text": "В Осве́нциме семейству ИКСОВ разрешили оставить свои костюмы. Английское прилагательное, родственное слову «ИКС», означает в том числе «не сто́ящий выеденного яйца». Назовите ИКСА.", "answer": "лилипут.", "complexity": "26.09", "handout": "0"}, {"number": 44, "text": "ИКС является заменой. Персонаж романа Дональда Уэстлейка работает таксистом и отмечает, что не всем же ИКСАМ выступать в парламенте. Название какого блюда имеет тот же корень, что и слово «ИКС»?", "answer": "болтунья.", "complexity": "34.78", "handout": "0"}, {"number": 45, "text": "По данным опроса 2019 года 56 процентов жителей США выступили против изучения ИХ в школе. Автор вопроса не обошёлся без НИХ. Назовите ИХ двумя словами.", "answer": "арабские цифры.", "complexity": "50.00", "handout": "0"}, {"number": 46, "text": "Дети из рассказа Виктора Драгунского собираются в квартире и начинают играть. Забавно, что, когда в конце произведения герой ДЕЛАЕТ ЭТО, на нём оказываются шляпка и платье. КАКИЕ ТРИ СЛОВА мы заменили словами ДЕЛАЕТ ЭТО?", "answer": "выходит из шкафа", "complexity": "71.74", "handout": "0"}, {"number": 47, "text": "Диодор приводит случай, как после смерти иностранца две соотечественницы покойного спорили, кто из них более достоин ЭТОГО. Назовите ЭТО одним словом.", "answer": "сати.", "complexity": "43.48", "handout": "0"}, {"number": 48, "text": "(Комментарий: команды получают по одному экземпляру каждой раздатки, т.е. ДВЕ РАЗНЫЕ раздатки на команду)\n\nЗаполните либо ПРОПУСК 1, либо ПРОПУСК 2.", "answer": "красная", "complexity": "50.00", "handout": "1"}, {"number": 49, "text": "(Чётко прочитать корень «селен» в слове «селенецериус», слегка выделить слово «момент») При обсуждении вопроса «Что?Где?Когда?» игроки сидят вплотную друг к другу, склонившись головами к центру стола, а при взятии откидываются на спинки стульев. Отмечая этот факт, Тамара Климович сравнивает момент взятия вопроса с ЭТИМ. Для желающих наблюдать ЭТО селенеце́риуса организовывают ночные экскурсии. Назовите ЭТО.", "answer": "распускание цветка.", "complexity": "93.48", "handout": "0"}, {"number": 50, "text": "(Комментарий ведущему: сделать небольшую паузу после «Альф») Сюжет эпизода сериала «Альф» «Сто́я в тени́ любви» основан на произведении о НЁМ. Назовите ЕГО.", "answer": "Сирано [де Бержерак]", "complexity": "21.74", "handout": "1"}, {"number": 51, "text": "Известный человек часто мучился из-за фурункулов и в личной переписке отзывался об ИКСЕ с благодарностью. Рассказывая об этом, Курт Воннегут пишет, что в утверждении этого человека речь идёт не о порицании, а об утешении. Назовите ИКС.", "answer": "опиум.", "complexity": "30.44", "handout": "0"}, {"number": 52, "text": "(Ведущему: не выделять голосом «Он» во втором предложении.) Айварс Лие́пинс присутствовал на акции протеста в качестве фотографа. Айварс сетовал на приветствовавших его людей, ведь они тем самым ДЕЛАЛИ ЭТО. Циркач Пьер Гаснье́р умел ДЕЛАТЬ ЭТО грудной клеткой. Что мы заменили словами ДЕЛАТЬ ЭТО?", "answer": "рвать цепь", "complexity": "47.83", "handout": "0"}, {"number": 53, "text": "(Пояснение организаторам по оформлению раздатки: с обратной стороны должен быть чистый лист.)\nВ качестве ответного бланка на этот вопрос используйте обратную сторону раздаточного материала. На раздаточном материале подпишите номер команды. (Комментарий ведущему: сделать паузу 5 секунд) Марка Манлия казнили по политическим причинам. Так как Манлий был первым, кто во время осады Рима проснулся от шума гусей, судьи были вынуждены вынести приговор там, откуда ПРОПУСК. Заполните ПРОПУСК.", "answer": "Капитолий не виден.", "complexity": "50.00", "handout": "1"}, {"number": 54, "text": "В 1941-м году жителям Москвы угрожала смертельная опасность. По мнению автора вопроса, отказавшись от эвакуации, Сталин поступил умнее, чем герой известного произведения. Назовите точно топоним, который присутствует в его названии.", "answer": "Самарра.", "complexity": "0.00", "handout": "0"}, {"number": 55, "text": "В тесте вопроса слова «ПРОИЗОШЛО ЭТО» – замена. На картине Ренуара «Зонтики» изображены прогуливающиеся по улице люди. О том, что картина создавалась на протяжении нескольких лет, можно судить по тому, что с частью изображённых предметов ПРОИЗОШЛО ЭТО. В известном произведении говорится, что ЭТО ПРОИЗОШЛО… с чем?", "answer": "латынью.", "complexity": "19.57", "handout": "0"}, {"number": 56, "text": "Для наблюдений за образованием клеток крови Пер-Ингвар Бранемарк вставил в лапу подопытного животного линзу в металлическом корпусе. Несмотря на приложенные усилия, использовать эту линзу для повторных опытов врач не смог. Вскоре Бранемарк произвёл революцию в НЁМ. Назовите ЕГО одним словом.", "answer": "протезирование.", "complexity": "60.87", "handout": "0"}, {"number": 57, "text": "Вопрос-блиц. Три вопроса по двадцать секунд обсуждения на каждый.\n1. Представьте, что Вы играете шахматную партию с контролем времени с Хосе Раулем Капабланкой. Первого вопроса не будет.\n2. У Хосе Рауля Капабланки времени много, но позиция у него плохая. Второго вопроса не будет.\n3. Когда противники Хосе Рауля Капабланки оказывались в вашей ситуации, шахматист нередко ДЕЛАЛ ЭТО, надеясь на ошибку противника. Ответьте, использовав слово иностранного происхождения, что мы заменили на ДЕЛАЛ ЭТО.", "answer": "начинал играть блиц.", "complexity": "6.52", "handout": "0"}, {"number": 58, "text": "Пожалуйста, разорвите раздаточный материал. В переводе немецкой сказки XX века, название которой мы вам раздали, рассказывается о братьях Гу́ндаре и Фри́дериге. После банкротства фирмы, которой они владели, братья рассорились. Восстановите любое из слов названия сказки, написание которого мы слегка изменили.", "answer": "ГунДаР", "complexity": "13.04", "handout": "1"}, {"number": 59, "text": "Кристина Пизанская была одной из первых профессиональных писательниц. Кристину поддерживали меценаты, поэтому неудивительно, что у девушки уже в 14 веке была ОНА. Семья юного Бродского жила небогато, поэтому Иосиф, желая иметь ЕЁ, использовал в том числе и стопки книг. Назовите ЕЁ двумя словами.", "answer": "своя комната", "complexity": "54.35", "handout": "0"}, {"number": 60, "text": "В СССР некоторые организаторы, чтобы обойти запрет, искали человека, который родился в подходящий день. В результате этот человек получал подарок в виде посещения… ответьте одним словом: какого мероприятия?", "answer": "квартирника.", "complexity": "45.65", "handout": "0"}, {"number": 61, "text": "Редактор приветствует всех участников на втором дня фестиваля «Беловежская зима». Средневековые переписчики книг иногда делали на полях заметки, описывая условия своего труда. На что жаловался древнерусский писец, оставивший такую запись?", "answer": "на похмелье.", "complexity": "13.04", "handout": "1"}, {"number": 62, "text": "В вопросе есть замены. Желая привлечь в свои владения поселенцев, Уильям Пенн опубликовал описание провинции Пенсильвания через год после того, как впервые побывал в Америке. Напишите два слова, замененных в предыдущем предложении.", "answer": "за, до.", "complexity": "19.57", "handout": "0"}, {"number": 63, "text": "Второстепенный персонаж мультфильма – ИКС по имени Мэнни – предусмотрительно женился на бабочке. Напишите слово, замененное на ИКС.", "answer": "богомол.", "complexity": "36.96", "handout": "0"}, {"number": 64, "text": "Перед вами фрагмент обложки книги. Какой?", "answer": "«Мы».", "complexity": "15.22", "handout": "1"}, {"number": 65, "text": "В романе, действие которого происходит в 1945 году, ночное небо над горящим городом сравнивается с НИМ. Назовите ЕГО.", "answer": "немецкий флаг.", "complexity": "39.13", "handout": "0"}, {"number": 66, "text": "На немецком рекламном плакате начала прошлого века роковая красавица пылесосит красный ковер. Марка этого пылесоса назвалась ИКС. Другой ИКС – персонаж классического немецкого фильма. Напишите слово, замененное на ИКС.", "answer": "Вампир.", "complexity": "15.22", "handout": "0"}, {"number": 67, "text": "Антония Фрэзер отмечает, что первая из НИХ, возможно, была крёстной матерью последней. Кто ОНИ?", "answer": "жены Генриха VIII.", "complexity": "43.48", "handout": "0"}, {"number": 68, "text": "В 1823 году госсекретарь Джон Куùнси Адамс заявил, что в силу универсальных законов политики Куба в свое время отделится от Испании и придет в сферу влияния США. При этом Адамс сравнил Кубу с ЭТИМ. Назовите ЭТО одним словом.", "answer": "яблоко.", "complexity": "4.35", "handout": "0"}, {"number": 69, "text": "На розданной вам фотографии есть ОНА. В 1951 году ЕЕ озвучил британский комик Ричард Хейдн. Назовите ЕЕ одним словом.", "answer": "гусеница.", "complexity": "78.26", "handout": "1"}, {"number": 70, "text": "Во время работы над фильмом «Индиана Джонс и Храм судьбы» возникли сложности со съемкой сцен, в которых участвовал знаменитый индийский актер Амрùш Пýри. Рассказывая об этом, продюссер фильма Роберт Уотс упомянул еще 18. Чего?", "answer": "фильмов", "complexity": "13.04", "handout": "0"}, {"number": 71, "text": "В названии одного из более ранних образцов некоего жанра фигурируют урок теологии и Себаcтьèн Эгбертс. Какие две буквы пропущены в одном из слов предыдущего предложения?", "answer": "ос.", "complexity": "32.61", "handout": "0"}, {"number": 72, "text": "По мнению одного исследователя, судя по направлению руки Себастьèна Эгбертса, на картине изображен момент, когда он рассказывает слушателям об ЭТОМ. ЭТО описано во второй главе. Что такое ЭТО?", "answer": "сотворение Евы из ребра Адама.", "complexity": "45.65", "handout": "0"}, {"number": 73, "text": "Это английское диалектное слово означает безрассудного человека, который действует, не обращая внимания на риски и приличия. В 2019 году это слово вспомнил британский юморист Крейг Браун. Какие буквы в нем пропущены?", "answer": "BORIS.", "complexity": "60.87", "handout": "1"}, {"number": 74, "text": "В XIV веке в английской армии была осадная машина, получившая прозвище «Госпожа Гунùльда». Напишите то, что скорее всего появилось благодаря этой «Госпоже Гунùльде»?", "answer": "gun.", "complexity": "23.91", "handout": "0"}, {"number": 75, "text": "Дизайнер Росхùльдур Йонсдòттир создала набор, который назвала «исландское Лего». Ей помогал ученый-микробиолог, разработавший новый метод стерилизации. Ответьте двумя словами, что представляет собой каждый элемент набора.", "answer": "рыбная кость.", "complexity": "2.17", "handout": "0"}, {"number": 76, "text": "Изначально в английском языке этим существительным называли адвоката или присяжного, который берёт деньги и от истца, и от ответчика. Напишите это существительное латинского происхождения.", "answer": "амбидекстр.", "complexity": "32.61", "handout": "0"}, {"number": 77, "text": "Один из главных героев пьесы Викто́ра Гюго́ «Король забавляется» называет себя ИМ. Назовите ЕГО тремя словами.", "answer": "Человек, который смеётся.", "complexity": "43.48", "handout": "0"}, {"number": 78, "text": "Перед вами фрагмент рисунка из полемического сочинения 18-го века, написанного ИКСАМИ. Назовите ИКСА словом с двумя одинаковыми гласными, идущими подряд.", "answer": "старообрядец.", "complexity": "41.30", "handout": "1"}, {"number": 79, "text": "Предприниматель Козьма́ Солдатёнков издавал книги, финансировал журналы, покупал картины и помогал художникам. Солдатёнков — один из героев книги «Российские ПРОПУСК». Заполните ПРОПУСК несклоняемым словом.", "answer": "Ме́дичи.", "complexity": "43.48", "handout": "0"}, {"number": 80, "text": "В конце 19-го века молодые русские художники были хорошо знакомы не со всеми достижениями зарубежного искусства середины столетия. Поэтому, например, Игорь Граба́рь в своём обзоре назвал Вселенную «Девочкой с кошкой». Какое слово мы заменили в этом вопросе?", "answer": "«Оли́мпия».", "complexity": "17.39", "handout": "0"}, {"number": 81, "text": "В одном рассказе о НЁМ употребляется слово «ву́менспре́динг». ЕГО популярность привела к росту сталелитейной промышленности Англии в 1860-е годы. Назовите ЕГО.", "answer": "криноли́н.", "complexity": "43.48", "handout": "0"}, {"number": 82, "text": "Представьте, что одна головка магнитофона настроена на запись, а другая в то же время — на воспроизведение. Эван Ра́тлифф приводит это сравнение, иллюстрируя одну гипотезу, которая объясняет ЭТО. В статье об ЭТОМ Ра́тлифф также рассказывает о женщине, которая даже сдала в библиотеку свой читательский билет. Назовите ЭТО.", "answer": "дежавю́.", "complexity": "17.39", "handout": "0"}, {"number": 83, "text": "(Указание ведущему: читать слово «роси́стов» с безударным «о», то есть не давая понять, что слово написано именно через «о», а не через «а».) В первой половине 19-го века поклонники одного жанра в России делились на «арти́стов» и «роси́стов». В предыдущем предложении мы укоротили два слова — каждое на три буквы. Напишите эти два слова в исходном виде.", "answer": "моцарти́сты, россини́сты.", "complexity": "23.91", "handout": "0"}, {"number": 84, "text": "Этот барельеф украшает парижское здание, в котором располагалось известное учреждение. Какое прилагательное греческого происхождения впервые появилось в названии этого учреждения?", "answer": "политехническая.", "complexity": "13.04", "handout": "1"}, {"number": 85, "text": "В древнегреческой комедии бог говорит, что два ИКСА принесут удовольствие, за пятью последуют крики, за семью — синяки, за десятью — безумие. Один из других ИКСОВ назван не в честь этого бога, а в честь философа. Назовите ИКС.", "answer": "кратер.", "complexity": "13.04", "handout": "0"}, {"number": 86, "text": "Дэ́вид Со́лтмен приводит версию, согласно которой в начале 20-го века Га́рри Гуди́ни получил предложение разоблачить и заменить ЕГО. Э́ндрю Х́антер Мю́ррей, имея в виду популярную версию, в шутку предполагает, что Гуди́ни на ЕГО месте избежал бы гибели. Назовите ЕГО.", "answer": "Григорий Распу́тин.", "complexity": "45.65", "handout": "0"}, {"number": 87, "text": "Суперме́н — нечеловечески сильный герой, которого в 1930-е годы создали Дже́рри Си́гел, сын Ми́хеля Сегало́вича, и Джо Шу́стер, сын Ю́лиуса Шустеро́вича. Как отмечает Ма́ртин Лунд, Суперме́на нередко сравнивают с НИМ. Назовите ЕГО.", "answer": "Го́лем.", "complexity": "54.35", "handout": "0"}, {"number": 88, "text": "В одном из ранних выпусков Суперме́н борется с бизнесменом, который хочет помешать восстановлению экономики страны после Великой депрессии. В другом раннем выпуске Суперме́н борется с шарлатанами, которые продают средства, якобы помогающие…. От чего?", "answer": "по́лиомиели́т.", "complexity": "8.70", "handout": "0"}, {"number": 89, "text": "В романе Ма́ргарет Э́твуд у женщин нет многого из того, что есть у мужчин. В частности они лишены права писа́ть. Напишите пропущенные слова в лозунге из романа, говорящем о том, что писа́ть — это грех.", "answer": "pen [пэн], envy [энви].", "complexity": "4.35", "handout": "1"}, {"number": 90, "text": "$1a", "answer": "троцки́стко, зино́вьевская, шайка.", "complexity": "6.52", "handout": "1"}]}, {"id": "3316", "title": "VIII Одесский марафон (777 вопросов)", "questions": [{"number": 1, "text": "На двери главного собора Генуи, Сан-Лоренцо, висит объявление: \"ЗАКРОЙ РОТ, открой свое сердце\". О том, что необходимо ЗАКРЫТЬ РОТ, сказано и в кодексе МАК. Какие слова мы заменили на \"ЗАКРОЙ РОТ\"?", "answer": "Выключи телефон.", "complexity": "", "handout": "0"}, {"number": 1, "text": "Юморист Константин Рылёв замечает, что напечатанный ОН напоминает рецепт из поваренной книги, ведь \"вкус\" блюда можно почувствовать только на концерте. Недавно в честь НЕГО назвали бульвар. В каком городе?", "answer": "В Одессе.", "complexity": "", "handout": "0"}, {"number": 1, "text": "Александр Бенуа писал о своем жестоком разочаровании в очень юном возрасте. Его пленили слова \"ИГРЕКОВЫЙ ИКС\", но когда он туда попал, выяснилось, что ИКС — есть, даже обширный, но ИГРЕКОВ туда как раз не пускают. Какие слова мы заменили на \"ИГРЕКОВЫЙ ИКС\"?", "answer": "Детский сад.", "complexity": "", "handout": "0"}, {"number": 1, "text": "Александр Бенуа писал, что для него зима в Петербурге начиналась уже 20 июля, когда после некоторого перерыва вновь приступали к выполнению своих обязанностей ЭТИ люди. Назовите ИХ профессию.", "answer": "Фонарщики.", "complexity": "", "handout": "0"}, {"number": 1, "text": "По словам директора Института демографической безопасности Ирины Медведевой, ОНА в искусстве порождает шизофрению и \"скорбное бесчувствие\" в обществе. В \"элитарном обществе\" ОНА предпочитает оставаться естественной и не пытаться играть. Статья Википедии о НЕЙ содержит ссылку на статью, название которой в переводе означает \"мусор\". Назовите ЕЕ.", "answer": "Чернуха.", "complexity": "", "handout": "0"}, {"number": 1, "text": "По мнению одного нерадивого журналиста, из-за своего вращения Земля СДЕЛАЕТ ЭТО. В постмодернистской \"Сказке о рыбаке и репке\" вставная челюсть тоже СДЕЛАЕТ ЭТО. Ответьте тремя словами, что именно.", "answer": "Превратится в тыкву.", "complexity": "", "handout": "0"}, {"number": 1, "text": "Этот символ в Дагомее обозначал первопричину землетрясений. Египетский жрец Гораполлон пояснял, что его рисуют, желая написать вселенную. А вот среди игроков он обрел известность после неоднозначного четвертого. Что это за символ?", "answer": "Уроборос.", "complexity": "", "handout": "0"}, {"number": 1, "text": "Внимание, в вопросе есть замены.\nКорреспондент журнала \"GEO\", начиная рассказ о столице Бразилии, говорит так: \"Если встать посередине центральной площади, подобно УЧИТЕЛЬНИЦЕ в начале УРОКА, то президентский дворец окажется справа, слева расположено здание Федерального суда\". Мы не просим вас восстановить все замены, скажите, какое слово мы заменили на \"УЧИТЕЛЬНИЦА\".", "answer": "Стюардесса.", "complexity": "", "handout": "0"}, {"number": 1, "text": "Внимание, в вопросе есть замена.\nПомимо комедии дель арте, в Италии существовал и еще один вид театра. Его отцом считали одного из самых начитанных людей своего времени, поэта Лодовико Ариосто. Жанр именовался \"Ла комедиа МОНОПОЛИА\". Уважаемые знатоки, что мы заменили на \"МОНОПОЛИА\"?", "answer": "Эрудита.", "complexity": "", "handout": "0"}, {"number": 1, "text": "В Париже существует специальное \"спортивное\" подразделение полиции, следящее за исполнением запрета, введенного в 1955 году. В Одессе нет такого подразделения и нет такого запрета, хотя причин для беспокойства куда больше. А где работает это подразделение полиции?", "answer": "В катакомбах.", "complexity": "", "handout": "0"}, {"number": 2, "text": "Умберто Эко писал о людях этой профессии, что они населяют мир детищами, которые будут носить чужие фамилии, и никто не узнает, чьи они на самом деле. Говоря о детях, Эко не погрешил против истины, ведь на латыни их называют \"рождающими\". Назовите их.", "answer": "Редакторы.", "complexity": "", "handout": "0"}, {"number": 2, "text": "Кто был автором этих чертежей?", "answer": "Евклид.", "complexity": "", "handout": "1"}, {"number": 2, "text": "Внимание, цитата из биографического очерка в журнале \"XXL\": \"Однажды Уэйна Гретцки [пропуск], и он, не раздумывая, пошел в НХЛ\". Заполните пропуск четырьмя словами.", "answer": "\"... послали на три буквы...\".", "complexity": "", "handout": "0"}, {"number": 2, "text": "По мнению Робертсона Дэвиса, ЭТО — придумка пуритан, желающих пораньше загнать людей в постель. Назовите ЭТО двумя словами.", "answer": "Летнее время.", "complexity": "", "handout": "0"}, {"number": 2, "text": "В Лондоне появился очень полезный туристический сервис. При необходимости, вы можете отправить СМС с одним-единственным словом на соответствующий номер, и специальная спутниковая система определит по сигналу телефона ваше местоположение, компьютер сверится с картой и пришлет в ответ местонахождение ближайшего... Чего?", "answer": "Туалета.", "complexity": "", "handout": "0"}, {"number": 2, "text": "В немецком переводе, распространенном на Youtube, хорошо знакомая вам строка звучит как \"Und ich spiele Konzertina\". А автор другого ролика, уже на русском языке, озаглавил его \"Русский вариант ЭТОГО\". Сделайте приятное Анджею Сапковскому и Иэну Макьюэну, назовите ЭТО.", "answer": "\"Happy birthday to you\".", "complexity": "", "handout": "0"}, {"number": 2, "text": "После высылки в Ташкент в 1928 году по совету Юлиана Штуцкого она написала сборник \"Домик под грушевым деревом\" Ли-Сян-Цзы. Однако гораздо более известен другой случай. Назовите эту более известную личность.", "answer": "Черубина де Габриак.", "complexity": "", "handout": "0"}, {"number": 2, "text": "В некоторых источниках, рассказывающих о святом Христофоре, сообщается, что он был казнен на четвертом году правления императора Траяна Деция, пришедшего к власти в 249 году. Произойти этого не могло — даже в том случае, если все небылицы, рассказываемые о святом Христофоре, — чистейшая правда. Что же дает нам право это утверждать?", "answer": "Траян Деций правил всего два года.", "complexity": "", "handout": "0"}, {"number": 2, "text": "В конце апреля 2009 года в СМИ прошла новость о том, что в этой стране актеры, снимающиеся в \"мыльных операх\", настояли, чтобы из сценариев временно исключить эротические сцены и даже просто поцелуи. Назовите эту страну.", "answer": "Мексика.", "complexity": "", "handout": "0"}, {"number": 2, "text": "Уважаемые знатоки, в вопросе нет замен!\nНе слишком обремененный интеллектом герой Вилле Хаапасало в фильме \"Любовь в большом городе\" занимался поисками своего айпода в библиотеке. В Тихом океане есть архипелаг, который герой Вилле мог бы назвать островами Айподов. А как этот архипелаг называется на самом деле?", "answer": "Острова Антиподов.", "complexity": "", "handout": "0"}, {"number": 3, "text": "Первая часть этой книги называется \"Из окна 27 этажа\". А как называется сама книга?", "answer": "\"Одноэтажная Америка\".", "complexity": "", "handout": "0"}, {"number": 3, "text": "Распорядителем пира в Древней Греции был симпосиарх. В его обязанности входило многое — воздать жертву богам Олимпа, исполнить гимны Дионисию. Но главное и первое его дело было — установить параметр, касающийся ИКСА и ИГРЕКА, который сразу задавал тон вечеру. Чудесные манипуляции с участием ИКСА и ИГРЕКА описаны лишь одним. Назовите место, прославившееся благодаря этим манипуляциям.", "answer": "Кана Галилейская.", "complexity": "", "handout": "0"}, {"number": 3, "text": "Этот корабль нанес противнику довольно незначительный урон: 25 марта 1915 года он протаранил и потопил немецкую подводную лодку U-29. Назовите этот корабль.", "answer": "\"Дредноут\".", "complexity": "", "handout": "0"}, {"number": 3, "text": "Лирический герой стихотворения Девикова искал на ИКСЕ линию жизни. Героиня Кортасара любила обнажать \"линии\" на ИКСЕ так, чтобы паутинчатый призрак тенью ложился ей на кожу. А мы попросим вас назвать имя, которое носил известный ИКС.", "answer": "Ференц.", "complexity": "", "handout": "0"}, {"number": 3, "text": "Фотограф Крис Джордан сложил ЕЕ из 32 тысяч кукол Барби. Это число не случайно, ведь в США ЭТО делают 32 тысячи американок в месяц. Мы не просим вас назвать ЕЕ, назовите ЭТО двумя словами.", "answer": "Увеличение груди.", "complexity": "", "handout": "0"}, {"number": 3, "text": "Красоту аллюзии, скрытой в имени и фамилии главного героя — Лестера Бёрнэма — уловить довольно трудно. Зато главная героиня этого американского фильма — Анджела — практически ЕЕ однофамилица. ОНА была светом и огнем. Назовите ЕЕ имя.", "answer": "Лолита.", "complexity": "", "handout": "1"}, {"number": 3, "text": "В двойной пародии программы \"Большая разница\" персонажи фильма сидят за школьными партами, а во время звонка с урока начинают биться в конвульсиях. Заставку к пародии сопровождает хорошо знакомая вам песня. Каким словом из девяти букв она заканчивается?", "answer": "Массаракш.", "complexity": "", "handout": "0"}, {"number": 3, "text": "В 1916 году известный пианист Роберто Фирпо взял марш уругвайского студента Матоса Родригеса, добавил собственный материал во вторую часть, а для третьей использовал музыку из оперы Верди \"Трубадур\". Напишите абсолютно точно название того, что получилось в итоге.", "answer": "\"Кумпарсита\".", "complexity": "", "handout": "0"}, {"number": 3, "text": "Вот как описывают их исследователи современного русского фольклора лингвисты Шмелевы. Первый — взрослый, уверенный в себе мужчина, использующий ненормативную лексику. Второй — \"ребенок\", не знающий жизни и мата, иногда становящийся объектом сексуальной агрессии со стороны первого или других персонажей. Назовите нерусского человека, благодаря которому появились эти персонажи.", "answer": "Алан Милн.", "complexity": "", "handout": "0"}, {"number": 3, "text": "Свое произведение мексиканский писатель Октавио Пас начал со слова, которое \"произносят все люди с тех самых пор, как человек стал человеком\". По словам Паса, в романских языках набор значений этого слова — это и благодать, которую Господь ниспосылает людям, и телесная грация танцующей девушки, и благосклонность, и благодеяние. Догадайтесь, что это за слово, и ответьте, о каком произведении идет речь.", "answer": "Нобелевская лекция.", "complexity": "", "handout": "0"}, {"number": 4, "text": "На рубеже XIX и XX веков в Европе так называлось уже тогда бывшее классическим мошенничество. А на два века раньше ЭТО стало причиной крупного европейского конфликта. Назовите ЭТО двумя словами.", "answer": "Испанское наследство.", "complexity": "", "handout": "0"}, {"number": 4, "text": "В институте микрохирургии глаза, при помощи глаз свиней хирургов обучают удалять катаракту — помутнение хрусталика в результате денатурации. Для того чтобы \"заставить\" глаз заболеть катарактой, используется совсем не медицинский прибор, изобретенный в 1946 году. Назовите этот прибор двумя словами.", "answer": "Микроволновая печь.", "complexity": "", "handout": "0"}, {"number": 4, "text": "[Ведущему: не выделять голосом особенность написания \"бе-ки\" и \"ме-ки\".]\nВ 1908 году в газете \"Одесский вестник\" был опубликован фельетон, в котором в качестве идиллической утопии описывается, как мирно уживаются \"бе-ки и ме-ки\". Кто же такие \"беки \"и \"меки\"?", "answer": "Большевики и меньшевики.", "complexity": "", "handout": "0"}, {"number": 4, "text": "Собственно, ОНА начинается в древней поэме лишь с вышеприведенного 116-го стиха. Назовите ЕЕ одним словом.", "answer": "Теогония.", "complexity": "", "handout": "1"}, {"number": 4, "text": "Внимание, в вопросе есть замены.\nЗнакомая автора вопроса рассказывала, что однажды была на свадьбе, где в качестве нарядов молодоженов использовались футболки. На футболках мужа и жены были надписи \"ТРИ ЗВЕЗДЫ\" и \"ДВЕ ЗВЕЗДЫ\". Какое слово мы заменили на \"ТРИ ЗВЕЗДЫ\" и какое на \"ДВЕ ЗВЕЗДЫ\"?", "answer": "Полковник, подполковник.", "complexity": "", "handout": "0"}, {"number": 4, "text": "В одном из своих стихотворений Орхан Вели Канык, вдохновленный ЕЕ турецким аналогом, высказал желание стать рыбой. А солист советско-российской группы, вдохновленный ЕЮ, намеревался совершить другое превращение... Во что?", "answer": "В подводную лодку.", "complexity": "", "handout": "0"}, {"number": 4, "text": "Внимание, в вопросе есть замены.\nМак — это СЕМЕЙНАЯ ВСТРЕЧА, а вот чай — это СЕМЕЙНОЕ РАССТАВАНИЕ. СЕМЕЙНОГО призрака очень хотел завести герой рассказа Конан-Дойля \"Тайна замка Горсорп-Грэйндж\". Мы не спрашиваем, какое слово мы заменили на \"СЕМЕЙНОЕ\". Ответьте, какие слова мы заменили на \"ВСТРЕЧА\" и \"РАССТАВАНИЕ\".", "answer": "Приставка и окончание.", "complexity": "", "handout": "0"}, {"number": 4, "text": "Застигнутый врасплох стуком супруги в дверь во время интимного общения с женщиной, персонаж пьесы Эрика-Эмманюэля Шмитта говорит, что только один человек в мире — а именно его жена — способен с такой убежденностью произнести ЭТИ ДВА МЕСТОИМЕНИЯ. Назовите писателя, включившего ЭТИ ДВА МЕСТОИМЕНИЯ в название романа 1979 года.", "answer": "Эдуард Лимонов.", "complexity": "", "handout": "0"}, {"number": 4, "text": "Этнограф и тюрколог Карро считал якутов самым утонченным из народов Севера и указывал на то, что увлечение некоторых жителей республики Саха французским имеет исторические корни. Благодаря кому возникла эта традиция?", "answer": "Ссыльным декабристам.", "complexity": "", "handout": "0"}, {"number": 4, "text": "Правнук выходца из Германии Бернард был известным химиком и метеорологом, придумавшим применять йодид серебра для борьбы с грозовыми облаками. Назовите имя брата Бернарда, внимательно следившего за его научными успехами.", "answer": "Курт.", "complexity": "", "handout": "0"}, {"number": 5, "text": "Борис Тенин говорил, что ПЕРВЫЙ всегда как живая рыба на горячей сковородке, а ВТОРОЕ — лишь \"консервы\", порой вкусные и долго сохраняющиеся. Назовите ПЕРВЫЙ и ВТОРОЕ.", "answer": "Театр и кино.", "complexity": "", "handout": "0"}, {"number": 5, "text": "[Ведущему: читать диалог с выражением.]\nПрослушайте отрывок из интервью:\n— В \"Цирке\" мою постановочную мысль также вела музыка...\n— Да?! А я думала, что [пропуск]!\nВосстановите пропуск, если постановщик немедленно согласился.", "answer": "Любовь.", "complexity": "", "handout": "0"}, {"number": 5, "text": "Дворник, герой очерка из сборника \"Физиология Петербурга\", давал жильцам своего дома прозвища: \"двугривенный переплетчик\", \"трехрублевый чиновник\" и так далее. А по какому принципу эти жильцы получали прозвища?", "answer": "По сумме чаевых.", "complexity": "", "handout": "0"}, {"number": 5, "text": "Недавно монетный двор США анонсировал выпуск особых серебряных монет, посвященных 200-летнему юбилею. На реверсе монеты изображен ребенок, читающий книгу. Назовите человека, портрет которого можно увидеть на аверсе.", "answer": "Луи Брайль.", "complexity": "", "handout": "0"}, {"number": 5, "text": "Авторы сходятся в том, что Зевс любил богинь, женщин, да и вообще был любвеобилен. А вот по поводу Эгипана единства нет: одни называют его сыном, другие — молочным братом Громовержца. Назовите имя матери Эгипана.", "answer": "Амалфея.", "complexity": "", "handout": "0"}, {"number": 5, "text": "После открытия Левенгуком микроскопа мир охватила лихорадка рассматривания всего, что попадалось под руку. Правда, иногда люди выдавали желаемое за действительное. Что увидел в клетках спермы голландский наблюдатель Николаас Гартсокер, если тогда считалось, что впервые ЭТО сумел получить испанец Арнальдус Вилланованус в XIII веке?", "answer": "Гомункулус.", "complexity": "", "handout": "0"}, {"number": 5, "text": "Один из российских микробиологов рассказывает, что в профессиональной среде появившуюся недавно разновидность микроба, встречающуюся в больницах и сжигающую жизни больных, порой цинично называют термином, впервые появившимся еще во Франции середины XIX века. Назовите этот термин из двух слов.", "answer": "Золотая молодежь.", "complexity": "", "handout": "0"}, {"number": 5, "text": "Александр Солженицын в \"Архипелаге ГУЛАГе\" писал об одной паре, поженившейся под ЕЕ сенью. А вот авторы русской Абсурдопедии вставили ЕЕ перед последним словом в известное афористичное определение коммунизма. Назовите ЕЕ двумя словами.", "answer": "Колючая проволока.", "complexity": "", "handout": "0"}, {"number": 5, "text": "В газете \"Троицкий вариант\" публикуются шутки на тему неизвестных страниц истории науки. В их сюжетах известные ученые одновременно работали и отдыхали в одном университете. Однажды в этом университете разбирали хлам и нашли спрятанные игральные кости. Назовите лауреата Нобелевской премии, которому они принадлежали.", "answer": "Альберт Эйнштейн.", "complexity": "", "handout": "0"}, {"number": 5, "text": "Один ЖЖ-юзер придумал для блогеров птичью классификацию. Например, блогер, который ищет по свету опечатки и оговорки и обсмеивает их — это блогер-пересмешник, а блогер, который не слышит критики и не общается с читателями, — это блогер-глухарь.\nВнимание, блиц!\n1. Какая птица, согласно этой классификации, олицетворяет блогера, который тащит в свой блог яркие фотки из новостных агентств и сборников фотографий?\n2. Какая птица, согласно этой классификации, олицетворяет блогера, который все самое интересное прячет под кат?\n3. Какая птица, согласно этой классификации, олицетворяет блогера, который завел свой блог тогда, когда и блогов-то еще не было?", "answer": "1. Сорока.\n2. Страус.\n3. Археоптерикс.", "complexity": "", "handout": "0"}, {"number": 6, "text": "Сборник князя Одоевского \"Пестрые сказки\", помимо всего прочего, был еще и экспериментаторским в области русского языка. Кроме игр с устаревшими и новыми словами, Одоевский много заимствовал. Напишите название нашей игры с тем заимствованием Одоевского, которое он сделал (по собственным словам — для удобства чтецов) у одной из стран Западной Европы.", "answer": "¿Что? ¿Где? ¿Когда?", "complexity": "", "handout": "0"}, {"number": 6, "text": "Заголовок одной из статей в журнале \"Men's Health\" за июнь 2009 года гласит: \"Фитнес-клуб — Тренировки на свежем воздухе\". В заголовке пропущены три буквы, которые делают его злободневным. Напишите эти три буквы.", "answer": "ень.", "complexity": "", "handout": "0"}, {"number": 6, "text": "Сергей Образцов считал всё вполне понятным. В сосновом бору растет белый мох, а говорят в лесу лаконично. Как, по мнению Образцова, называли живших в сосновом бору знАхарок?", "answer": "[Баба-]яга.", "complexity": "", "handout": "0"}, {"number": 6, "text": "Переводчик Сергей Ошеров констатировал, что для римской поэзии бытописательство является необычным явлением. Хотя в одном из стихотворений Катулла описаны даже волокна шерсти, прилипшие к губам пряхи при работе, одно обстоятельство не позволяет считать это стихотворение исключением. Что прядет упомянутая пряха?", "answer": "Нить судьбы.", "complexity": "", "handout": "0"}, {"number": 6, "text": "В одном из романов Терри Пратчетта фигурирует мрачный средневековый город, населенный в основном вампирами и оборотнями. В русском переводе название города вполне соответствует его нехорошей сущности. Отбросьте чуть больше трех и напишите это название.", "answer": "Здец.", "complexity": "", "handout": "0"}, {"number": 6, "text": "Кем были главные героини повести Петра Боборыкина \"Морз и Юз\"?", "answer": "Телеграфистками.", "complexity": "", "handout": "0"}, {"number": 6, "text": "О том, что в России первая ОНА появилась в 1764 году, знают многие. То, что в государстве инков ОНА была учреждена в XIII веке, вызывает уважение к инкам. А вот сообщение \"Православного голоса Кубани\" о том, что первая кубанская ОНА для девочек появилась в 1849 году, вводит читателя в недоумение. Назовите ЕЕ двумя словами.", "answer": "Женская школа.", "complexity": "", "handout": "0"}, {"number": 6, "text": "Внимание, в вопросе есть замена.\nЕе целью было провозглашено представление сатирической и саркастической точки зрения в НЬЮ-формате. Ее польское название начинается со слова \"Nonsens\". Какие четыре буквы мы заменили на \"НЬЮ\"?", "answer": "Вики.", "complexity": "", "handout": "0"}, {"number": 6, "text": "Комментируя конфликт Марлена Хуциева и Никиты Михалкова в Союзе Кинематографистов России, Василий Ливанов отметил, что киносообщество находится в городской луже, и дальше упоминает ещё двух людей. Мы не спрашиваем у вас имена этих тезок. Напишите три буквы, которые мы пропустили в тексте вопроса.", "answer": "Мир.", "complexity": "", "handout": "0"}, {"number": 6, "text": "Вообще-то из НИХ готовят много, к примеру — эрболату, омлет с НИМИ. Поэтому неудивительно, что первая публикация этого произведения произошла не в литературном, а в кулинарном журнале \"Gourmet\", в 1952 году. Назовите это произведение.", "answer": "\"Вино из одуванчиков\".", "complexity": "", "handout": "0"}, {"number": 7, "text": "Во Франции запретили один из постеров к фильму \"Коко до Шанель\" о жизни легендарного модельера. К счастью, в фотосессии Одри Тоту, сыгравшей в картине главную роль, нашлись и подходящие кадры. Если бы речь шла о фотографиях самой Шанель, выкрутиться было бы гораздо сложнее: найти \"правильную\" фотографию Коко практически невозможно. А какую это — правильную?", "answer": "Без сигареты.", "complexity": "", "handout": "0"}, {"number": 7, "text": "В 1972 году, выступая в чемпионате Баку по блицу, Гарри Каспаров был вынужден играть именно ТАК, что не помешало ему выиграть все партии первого этапа. А для пламенного деятеля Коммунистической партии предпочтительнее было делать кое-что именно ТАК. Назовите этого деятеля.", "answer": "Долорес Ибаррури.", "complexity": "", "handout": "0"}, {"number": 7, "text": "Канадским исследователям удалось достать образец восьмидесятилетней стали. Они подвергли его нескольким тестам, в том числе тесту на ударную вязкость, и обнаружили, что сталь эта была низкокачественной, с большой примесью фосфора, что делало ее очень ломкой при пониженных температурах. Что, изготовленное из аналогичной стали, было предметом изучения этих канадский ученых?", "answer": "\"Титаник\".", "complexity": "", "handout": "0"}, {"number": 7, "text": "В какой-то момент, израсходовав резервы выдержки и терпения, ОН даже, по совету нового оракула, приказал бросить в Дунай двух львов с большим количеством благовоний, однако маркоманнов и квадов это не остановило. Назовите ЕГО.", "answer": "Марк Аврелий.", "complexity": "", "handout": "0"}, {"number": 7, "text": "В одном из выпусков сериала \"Все ненавидят Криса\" отец семейства покупает у знакомого технику, которая постоянно ломается. Жена после этого мысленно переносится на несколько лет назад и вспоминает о еще одной покупке мужа. Что же он приобрел?", "answer": "[Некондиционные] презервативы.", "complexity": "", "handout": "0"}, {"number": 7, "text": "Польские хронисты XVII века считали казацкого атамана Ивана Сирко харАктерником — воином, обладавшим необычными способностями — предвидеть будущее, наводить морок на целое войско и прочие чудеса. Еще одно уникальное свойство этого атамана позволяет предположить, что с легендами об этом человеке знакомы выходцы из Польши. Назовите их фамилию.", "answer": "Вачовски.", "complexity": "", "handout": "0"}, {"number": 7, "text": "Украина и Андорра — государства, между которыми установлен безвизовый режим. Однако попасть в Андорру без шенгенской визы украинцам все равно не удастся. Почему?", "answer": "В Андорре нет аэропорта.", "complexity": "", "handout": "0"}, {"number": 7, "text": "Участник группы \"Aerosmith\" Стив Тайлер однажды рассказал, как он определил, что его группа стала популярной. По его словам, это произошло, когда журналисты перестали делать с ним ЭТО. Конечно, в ЭТОМ был замешан не только Тайлер. А кто еще?", "answer": "Мик Джаггер.", "complexity": "", "handout": "1"}, {"number": 7, "text": "Успех к этой воскресной газете пришел не сразу. Лишь через 21 год после основания, в 1812 году, ее журналист не только воочию НАБЛЮДАЛ убийство английского премьера, но и самолично схватил убийцу. Назовите это издание.", "answer": "\"The Observer\".", "complexity": "", "handout": "0"}, {"number": 7, "text": "Внимание, в вопросе есть замена.\nЖЕНА ДЕТЕКТИВА КОЛОМБО — персонаж, известный своим чувством юмора. В Базе Степанова при помощи простого поиска удалось найти 105 упоминаний ЖЕНЫ ДЕТЕКТИВА КОЛОМБО. Какие слова мы заменили на слова \"ЖЕНА ДЕТЕКТИВА КОЛОМБО\"?", "answer": "Знакомый (ая) автора вопроса.", "complexity": "", "handout": "0"}, {"number": 8, "text": "Перед вами — ингредиенты коктейля, попробовав который можно прочувствовать всю напряженность и горечь ЕГО. Назовите и ЕГО, и коктейль двумя словами.", "answer": "Карибский кризис.", "complexity": "", "handout": "1"}, {"number": 8, "text": "Когда команда автора вопроса в очередной раз в своей карьере сыграла на официальном турнире вопрос о \"Прощальной симфонии\" Гайдна, капитан команды сказал, что это свечка. На что автор заметил, что это уже далеко не свечка, а ОНО. ОНО — в принципе, греческое слово, правда, сильно изменившееся в русском. Назовите ЕГО.", "answer": "Паникадило.", "complexity": "", "handout": "0"}, {"number": 8, "text": "21 марта 1893 года в собственном кабинете был ранен московский городской голова Николай Алексеев. Операцию пришлось проводить неотложно и прямо на месте. Назовите хирурга, который ее выполнил.", "answer": "Николай Склифосовский.", "complexity": "", "handout": "0"}, {"number": 8, "text": "Малоизвестный писатель обвинял создателей этого фильма в том, что они украли идею из его книги 1950 года. Создатели третьесортного фильма 1958 года \"It! The Terror from Beyond Space\" также хотели подать в суд за плагиат. Ну а наши соотечественники легко находили сюжетные параллели с \"Туманностью Андромеды\". Назовите этот, уже ставший классическим, фильм.", "answer": "\"Чужой\".", "complexity": "", "handout": "0"}, {"number": 8, "text": "По всей видимости, пиво \"Бланш де Брюссель\" сварено на основе очень чистой воды. Назовите изображенного на логотипе этой марки.", "answer": "Писающий мальчик.", "complexity": "", "handout": "0"}, {"number": 8, "text": "В книге Хью Лори \"Торговец пушками\" герой превращает одну \"знаменитую птичку\" в \"едва знакомую\", а затем и вовсе в ту, \"которую уже определенно где-то видел\". А что на самом деле делает в эти моменты герой?", "answer": "Разбавляет виски.", "complexity": "", "handout": "0"}, {"number": 8, "text": "\"Девочка Мимико — сирота. У нее нет ни папы, ни мамы, есть только старенькая бабушка, которой не по силам растить внучку. Но Мимико не унывает; она уверена, что справится со всем, благо стирать и готовить она умеет, а воров и разбойников не боится!\". Только что вы прослушали аннотацию к мультфильму \"Большая панда, маленькая панда\" Хаяо Миядзаки. А теперь ответьте, какую книгу Хаяо хотел экранизировать до работы над этим мультфильмом — и получил отказ?", "answer": "\"Пеппи Длинныйчулок\".", "complexity": "", "handout": "0"}, {"number": 8, "text": "Персонажи анимационного фильма \"Позвоночная история\", как несложно догадаться, страдают от проблем с позвоночником. У героя из-за искривления голова всегда опущена под углом 90 градусов, у героини — всегда закинута назад под углом 90 градусов. Казалось бы — идеальная пара, но эти двое, живя в одном доме и гуляя по одним и тем же улицам, никак не могут встретиться. А почему?", "answer": "Героиня выше героя.", "complexity": "", "handout": "0"}, {"number": 8, "text": "Выдающийся актер Алексей Дикий поражал и своими режиссерскими решениями. Так, в одном из спектаклей на сцене, в характерной бытовой атмосфере, сидели мужики. А что висело над ними?", "answer": "Топор.", "complexity": "", "handout": "0"}, {"number": 8, "text": "Первый военный ОН был применен в 1849 году, но цель не была достигнута из-за неблагоприятных погодных условий. Во время гражданской войны в США ИХ использовали для наблюдений. Исследователи считают ИХ предками. Предками чего?", "answer": "Авианосцев.", "complexity": "", "handout": "1"}, {"number": 9, "text": "С одной стороны — частота ЕГО равна нулю. Или: ОН — наиболее вероятный кандидат на позицию с номером 51. А с другой стороны... Напишите по-русски, что, появившееся в 1979 году, получится с другой стороны.", "answer": "Компакт-диск.", "complexity": "", "handout": "0"}, {"number": 9, "text": "Олег Кулик известен своими перфомансами, например, кусанием прохожих. Себя он считает последователем двух людей. Один из них — Лев Толстой. Назовите место рождения второго.", "answer": "Синоп.", "complexity": "", "handout": "0"}, {"number": 9, "text": "Американский писатель сравнил людей этой профессии с шахматистами, однако \"фигуры\" в их игре находятся на разных уровнях и двигать их нужно не только вперед, но и вверх-вниз. Назовите эту профессию.", "answer": "Авиадиспетчер.", "complexity": "", "handout": "0"}, {"number": 9, "text": "[Ведущему: после того как все команды получили раздатку, дается сигнал времени — ведущий только объявляет номер вопроса.]", "answer": "[Необходимо сдать раздатку обратно.]", "complexity": "", "handout": "1"}, {"number": 9, "text": "В 1999 году итальянский футбольный клуб \"Фиорентина\" продавал банки с воздухом со своего стадиона. Было три \"аромата\": \"Дух трибун\", \"Эссенция победы\" и \"Атмосфера...\". Чего?", "answer": "\"... раздевалки\".", "complexity": "", "handout": "0"}, {"number": 9, "text": "Внимание, цитата, в которой \"МОЛОДЕЖЬ\" и \"ФУТБОЛЬНЫЕ МАТЧИ\" — это замены: \"Если МОЛОДЕЖЬ предстает наиболее агрессивным и малоуправляемым элементом своего времени, то ФУТБОЛЬНЫЕ МАТЧИ, приводящие агрессию прозябающих без настоящего дела в игровые формы, возникают в качестве инструмента относительного умиротворения МОЛОДЕЖИ\". Какие слова в цитате мы заменили на \"ФУТБОЛЬНЫЕ МАТЧИ\", если \"МОЛОДЕЖЬ\" — центральный элемент известного мнемонического правила?", "answer": "Рыцарские турниры.", "complexity": "", "handout": "0"}, {"number": 9, "text": "Перед вами — волчок, который помогает принимать правильные решения. Этот необычный предмет из серебра 925-й пробы диаметром 44 мм и весом 25 граммов выпустили в Конго. Мы не спрашиваем, какой параметр этого предмета соответствует десяти. Ответьте, какое учреждение в Конго создало этот предмет.", "answer": "Национальный банк.", "complexity": "", "handout": "1"}, {"number": 9, "text": "Персонажи анимационного фильма \"Позвоночная история\" страдают от проблем с позвоночником и из-за неудачной разницы в росте не могут встретиться. Однако одним прекрасным звездным вечером встреча все-таки происходит — благодаря тому, что кое-что у героя все-таки оказывается выше, чем у героини. Что именно?", "answer": "Окно.", "complexity": "", "handout": "0"}, {"number": 9, "text": "На самом деле его наследственный титул звучит по-другому: фрайгер. Вопреки расхожему мнению, он не разбился, а погиб от пули 303-го калибра. Назовите его фамилию.", "answer": "Рихтгофен.", "complexity": "", "handout": "0"}, {"number": 9, "text": "Согласно шутке начала 1940-х, приписываемой Уинстону Черчиллю, если перерезать все тросы, удерживающие аэростаты заграждения, то произойдет ЭТО. Ответьте двумя словами, что произойдет.", "answer": "Британия утонет.", "complexity": "", "handout": "0"}, {"number": 10, "text": "В 1791 году Радищев писал, что мечтает, чтобы ОН \"... между нами не в ямбах явился, но в стихах, подобных его...\". Мы не спрашиваем, кто ОН. Скажите, кто, родившийся за семь лет до написания приведенных строк, исполнил мечту Радищева.", "answer": "Гнедич.", "complexity": "", "handout": "0"}, {"number": 10, "text": "В 1907 году ОН стал одним из первых европейцев, награжденных орденом Восходящего Солнца, поскольку ЕГО поступок соответствовал канонам самурайской чести. Но ОН никогда этот орден не носил. Назовите ЕГО фамилию.", "answer": "Руднев.", "complexity": "", "handout": "0"}, {"number": 10, "text": "Самый большим минометом из производившихся был советский комплекс 2Б1 \"Ока\" калибром 420 мм. Он начал разрабатываться в середине 50-х для стрельбы ЭТИМ. Назовите фамилию того, кого называли так же, как и первое ЭТО.", "answer": "Свантессон.", "complexity": "", "handout": "0"}, {"number": 10, "text": "Художники-участники проекта \"Чебурген\" пародируют известные сюжеты живописи, литературы и кино, делая их персонажами героев истории о Чебурашке. Комментаторы одной из работ, на которой изображены Чебурашка, Гена и Шапокляк, предложили добавить на картинку крыску Лариску — вместо козы. Кого на этой картинке олицетворяет Шапокляк?", "answer": "Эсмеральду.", "complexity": "", "handout": "0"}, {"number": 10, "text": "В \"Медицинском обозрении\" 1878 года немецкий врач Шапира описывает особые артериальные кровотечения. Эти кровотечения возникали при перерезании артерии сечением с толстую иглу. Судя по статье, в то время эта проблема была актуальной, и отсутствие квалифицированной медицинской помощи часто приводило к гибели человека. Назовите причину этого кровотечения одним словом.", "answer": "Обрезание.", "complexity": "", "handout": "0"}, {"number": 10, "text": "Британский искусствовед Линкольн Кирштейн писал: \"ОН постоянно боксировал со временем, время было одновременно противником и товарищем ... чтобы быть пораженным и нокаутированным; они танцуют вокруг мгновения, ожидая открытия\". Собственно, о подобном \"боксе\" ОН и сам очень неплохо написал. Назовите ЕГО.", "answer": "Картье-Брессон.", "complexity": "", "handout": "0"}, {"number": 10, "text": "Герои короткометражки Дидье ФонтАна — семейная пара, живущая в маленьком домике в пустынной заснеженной местности. Жена целыми днями смотрит по телевизору одну и ту же программу и беспокоится о том, чтобы погода не испортилась, а муж не вылезает из-под своего автомобиля. А в конце фильма домик начинает сотрясаться — и оказывается, что он находится... Где?", "answer": "В игрушечном шаре со снегом.", "complexity": "", "handout": "0"}, {"number": 10, "text": "Существует много международных клубов, для членства в которых необходимо быть обладателем IQ не ниже определенного уровня. К примеру, в ЭТОМ клубе требуется IQ не ниже 141. Такой коэффициент интеллекта наличествует лишь у одной десятой процента живущих на Земле людей. Название клуба состоит из двух слов. Первое слово — \"Тройная\". Воспроизведите второе.", "answer": "Девятка.", "complexity": "", "handout": "0"}, {"number": 10, "text": "Внимание, в вопросе есть замена.\nБразилец Ноэл ди Медейрус Роза, умерший в 1937 году в возрасте 26 лет, успел создать около 200 композиций и войти в историю как великий БОКСЕР. Россиянина Федора Емельяненко, одного из сильнейших тяжеловесов мира по версии многих изданий, эти самые издания тоже частенько называют выдающимся БОКСЕРОМ. Какое слово мы заменили словом \"БОКСЕР\"?", "answer": "Самбист.", "complexity": "", "handout": "0"}, {"number": 10, "text": "Эти двое носили одинаковое имя и имели одинаковый отличительный признак в глазах людей. Для первого из них этот признак вообще стал прозвищем. Правда, если второй получил высокий титул на чужбине, первый сумел стать у себя монархом. Назовите первого и второго в правильном порядке, если первый умер в 768 году, а второй, предположительно, — в 65 году новой эры.", "answer": "Пипин Короткий и Перегрин Тук.", "complexity": "", "handout": "0"}, {"number": 11, "text": "Они встретились на одной из закрытых киевских вечеринок. Вскоре, чтобы покорить сердце девушки, поклонник купил ей подарок за 190 тысяч долларов. Впрочем, ее лучшим другом он все равно вряд ли станет. Ответьте абсолютно точно, кем на момент описанных событий работала девушка.", "answer": "Солисткой \"ВИА Гра\".", "complexity": "", "handout": "0"}, {"number": 11, "text": "На одном из перфомансов зрители должны были выбрать человека, более других повлиявшего на развитие архитектуры в столице, но непосредственно к архитектуре не имеющего отношения. Причем имя человека не называлось, а были показаны только анаграммы. Расшифруйте анаграммы, которые вы видите перед собой.", "answer": "Юрий Лужков, Казимир Малевич.", "complexity": "", "handout": "1"}, {"number": 11, "text": "Переходя пустыню, казак Егоров увидел вдалеке дикого верблюда, неизвестного в тех местах, и чуть не погиб, погнавшись за ним. Чьим помощником был Егоров?", "answer": "Пржевальского.", "complexity": "", "handout": "0"}, {"number": 11, "text": "Как вы уже знаете, на карикатуре \"Notre Dame\" Шапокляк олицетворяет Эсмеральду. В роли Квазимодо — сильно потрепанный Чебурашка. А вот крокодилу Гене досталась самая статичная роль. Какая?", "answer": "Каменной горгульи.", "complexity": "", "handout": "0"}, {"number": 11, "text": "Как известно, птицу видно по полету. А вы ответьте двумя словами, как с помощью спутниковых данных исследователи из британской антарктической службы собрались изучать миграцию пингвинов.", "answer": "По помету.", "complexity": "", "handout": "0"}, {"number": 11, "text": "Восстановите хотя бы приблизительно пропущенные слова в последней строчке этого лимерика.", "answer": "\"Я люблю последнюю строчку делать намного длиннее, чем надо\".", "complexity": "", "handout": "1"}, {"number": 11, "text": "В телепередаче \"Английский с Хрюшей\" Хрюша рассказывает друзьям, что в Англии все очень воспитаны, и иллюстрирует свой тезис таким примером: как только в автобус входит какая-нибудь старушка, ей уступают место даже ОНИ. Назовите ИХ.", "answer": "Сидящие на втором этаже.", "complexity": "", "handout": "0"}, {"number": 11, "text": "На самом деле такого вещества не существует. Это всего лишь торговое наименование смеси парацетамола и гидрокодона, кстати, запрещенной для продажи в России. Воспроизведите это наименование.", "answer": "Викодин.", "complexity": "", "handout": "0"}, {"number": 11, "text": "В романе \"Государство и светомузыка\" одному из героев нужно написать книгу \"История русской общественной мысли\". Его друг советует развеять заблуждение об идеалистичности этой самой мысли и призывает \"бухнуть погромче\". Во что?", "answer": "В \"Колокол\" Герцена.", "complexity": "", "handout": "0"}, {"number": 11, "text": "Историк Фарид Алекперли утверждает, что храмов Венеры в Риме было значительно больше, а согласно Википедии, эпитетов древние римляне больше придумали для Марса. Тем не менее, поэт Виктор Коллегорский дает Риму другое название, чуть-чуть изменив и удлинив для этого название российского города. Как же называет Рим Коллегорский?", "answer": "Юпитербург.", "complexity": "", "handout": "0"}, {"number": 12, "text": "Бридость — это профессиональное заболевание, развивающееся из-за переутомления, нарушения функционирования органов секреции, ожога или, например, длительного пребывания в цехах с высокой температурой. Надеемся, что никто из вас не страдает бридостью, поэтому просим вас описать одним словом естественную реакцию большинства людей на денатониум или, например, фенилтиокарбамид.", "answer": "Горько.", "complexity": "", "handout": "0"}, {"number": 12, "text": "Какое слово мы заменили словом \"пропуск\"?", "answer": "куру.", "complexity": "", "handout": "1"}, {"number": 12, "text": "У героини Фрэнка Баума принцессы Лангвидер ИХ было тридцать — столько, сколько обычно дней в месяце. Она хранила ИХ в шкафчиках, обитых бархатом, и всегда носила простой белый наряд, подходящий к любой из НИХ. Герой короткометражки Хуана Диего Соланаса накануне встречи с девушкой купил ЕЕ по каталогу, однако, не успев свыкнуться с обновкой, на свидание так и не надел. А вы назовите того, у кого ОНА была прижата к левому бедру, почти касаясь колена.", "answer": "Всадник без головы.", "complexity": "", "handout": "0"}, {"number": 12, "text": "Внимание, в вопросе есть замены.\nАнонс матча сборной России в цикле отбора к чемпионату мира 2010 года звучал так: \"КИНО отменяется, добро пожаловать в ТЕАТР\". Мы не будем вас спрашивать, что мы заменили на \"кино\" и \"театр\". Назовите соперника сборной России в этом поединке.", "answer": "Сборная Финляндии.", "complexity": "", "handout": "0"}, {"number": 12, "text": "Назовите отдел высших растений, один из видов которых по-английски называется \"Девичьи волосы\".", "answer": "Мхи.", "complexity": "", "handout": "0"}, {"number": 12, "text": "Авторитетный английский еженедельник в прошлом году опубликовал очередной список 100 самых влиятельных личностей. 91-е место в нем занял украинский президент, 18-е — российский экс-президент, 3-е — президент азиатской конфедерации Мохаммед Хамам. Какие должности занимают второй в этом рейтинге и его лидер, соответственно?", "answer": "Президент УЕФА и президент ФИФА.", "complexity": "", "handout": "0"}, {"number": 12, "text": "Внимание, в вопросе есть замены.\nВ постановке Малого драматического театра ПАН, как и все остальные персонажи, говорит прозой. Дело в том, что все стихотворные русские переводы пьесы оказались более романтическими, чем это было нужно театру. Даже заметка о постановке в \"Коммерсанте\" называется \"Без ПАНИКИ\". Ко

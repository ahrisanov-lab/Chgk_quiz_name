<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUIZ / Кубок Оливье</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#0b0d12;--card:#131720;--line:#29303d;--muted:#8b93a4;--text:#f5f7fb;--accent:#c8ff35;--danger:#ff6b7d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#252b18 0,transparent 28%),var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;min-height:100vh}.wrap{max-width:840px;margin:auto;padding:28px 20px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:58px}.brand{font-weight:800;letter-spacing:-.04em;font-size:20px}.brand span{color:var(--accent)}.counter{font:500 13px 'DM Mono';color:var(--muted);border:1px solid var(--line);padding:9px 12px;border-radius:999px}.eyebrow{font:500 12px 'DM Mono';color:var(--accent);text-transform:uppercase;letter-spacing:.13em;margin-bottom:18px}.title{font-size:clamp(30px,6vw,58px);line-height:1.02;letter-spacing:-.055em;margin:0 0 16px;max-width:700px}.sub{color:var(--muted);font-size:15px;margin-bottom:38px}.question{background:linear-gradient(145deg,#171c27,#11151d);border:1px solid var(--line);border-radius:26px;padding:30px 30px 26px;box-shadow:0 20px 70px #0004}.qnum{font:500 12px 'DM Mono';color:var(--muted);margin-bottom:22px}.qtext{font-size:clamp(19px,3vw,28px);line-height:1.35;letter-spacing:-.025em;min-height:150px}.form{display:flex;gap:10px;margin-top:30px}.input{flex:1;background:#0c0f15;color:var(--text);border:1px solid #343c4a;border-radius:14px;padding:16px 17px;font:500 16px Manrope;outline:none;transition:.2s}.input:focus{border-color:var(--accent);box-shadow:0 0 0 4px #c8ff3520}.btn{border:0;border-radius:14px;padding:0 24px;background:var(--accent);color:#11170a;font-weight:800;font-size:15px;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}.feedback{min-height:27px;margin-top:16px;font-size:14px;font-weight:700}.wrong{color:var(--danger)}.right{color:var(--accent)}.hint{color:var(--muted);font-weight:500;margin-left:8px}.progress{height:5px;background:#222936;border-radius:9px;margin-top:26px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0;transition:.35s}.footer{display:flex;justify-content:space-between;color:var(--muted);font:12px 'DM Mono';margin-top:18px}@media(max-width:560px){.wrap{padding:20px 16px}.top{margin-bottom:42px}.question{padding:22px 20px}.form{flex-direction:column}.btn{height:52px}.qtext{min-height:210px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">QUIZ<span>.</span></div><div class="counter" id="counter">01 / 37</div></header><section><div class="eyebrow">Кубок Оливье · тренировочный режим</div><h1 class="title">Проверь, насколько<br>хорошо ты думаешь.</h1><p class="sub">Один вопрос. Один ответ. Без подсказок.</p><div class="question"><div class="qnum" id="qnum">ВОПРОС 01</div><div class="qtext" id="qtext"></div><form class="form" id="form"><input class="input" id="answer" autocomplete="off" placeholder="Введите ваш ответ…"><button class="btn">Проверить</button></form><div class="feedback" id="feedback"></div><div class="progress"><div class="bar" id="bar"></div></div></div><div class="footer"><span>ENTER — проверить</span><span id="score">0 правильных</span></div></section></main><script>
const questions=[{"number": 1, "text": "Рихард Штраус, описывая в симфонической поэме \"Дон Жуан\" похождения ловеласа, сразу переходит к делу. Как подметил критик, ОНА у Штрауса длится 11 секунд. Назовите ЕЕ.", "answer": "Прелюдия"}, {"number": 2, "text": "Перед вами название песни одной немецкой группы. В тексте песни звучит фраза \"два, три или четыре!\".  Восстановите в исходном виде слово на раздаточном материале, которое мы изменили.", "answer": "Beer [бир]"}, {"number": 3, "text": "На одной карикатуре работники тюрьмы пугают ЕГО, чтоб обнаружить подкоп. Назовите ЕГО.", "answer": "страус"}, {"number": 4, "text": "Фанаты полагают, что Даниэль Айяла очень любит Рождество. Свои догадки они подтверждают тем, что он не раз получал АЛЬФЫ в конце года, например 22 декабря. Назовите АЛЬФУ двумя словами, начинающимися на одну букву.", "answer": "красная карточка"}, {"number": 5, "text": "Бразильские СМИ сообщили, что одно слово стало именем нарицательным со значением “несравненный”. Напишите это слово, в котором все гласные одинаковые.", "answer": "Пеле."}, {"number": 6, "text": "В 1908 году в США вышел фильм \"Шерлок Холмс и великая загадка убийства\". Несмотря на название, фильм снят... Закончите мысль, использовав два омонима.", "answer": "по [произведению] По"}, {"number": 7, "text": "Фильм из предыдущего вопроса можно назвать первым в истории ИМ. Автомобильный журнал пишет, что первый ОН появился в 1948 году. Назовите ЕГО.", "answer": "кроссовер"}, {"number": 8, "text": "В Швеции произошла уникальная авария: автомобиль врезался в НЕЁ. Какой была ОНА в произведении 1968 года?", "answer": "желтой."}, {"number": 9, "text": "По мнению автора вопроса, персонаж Айзека Азимова, который становится смертным, это гробик. Какие два слова мы заменили одним?", "answer": "киборг наоборот."}, {"number": 10, "text": "Перед вами фрагмент картины \"Наполеон Бонапарт в своем рабочем кабинете в Тюильри\". Благодаря ПЕРВЫМ и ВТОРОЙ эта картина являлась тонкой пропагандой, подчеркивающей работоспособность Наполеона. Назовите ПЕРВЫЕ и ВТОРУЮ.", "answer": "часы, свеча"}, {"number": 11, "text": "В баскском языке слова “нож” и “топор” происходят от слова “ОН”, что считается доказательством древности этого языка. Назовите ЕГО.", "answer": "Камень."}, {"number": 12, "text": "Жители одной австрийской деревни устали от шума и выхлопных газов. Результатом стала постройка большой парковки на окраине деревни и появление второго ЕГО в Австрии. Назовите ЕГО.", "answer": "метрополитен"}, {"number": 13, "text": "На карикатуре в разговоре с женой ОН подтверждает, что ночью был в доме своей бывшей, и объясняет, что это его работа. Назовите ЕГО, используя дефис.", "answer": "Санта-Клаус."}, {"number": 14, "text": "Художник Энгель Набиуллин изобразил создание ЕГО. Рисунок выполнен в монохроме, с минимумом цветных деталей. Напишите целиком слово, от которого мы оставили треть.", "answer": "снеговика."}, {"number": 15, "text": "Плиний в своей \"Естественной истории\" сообщает, что материалом для ИХ хижин служат глина, скорлупа яиц и птичьи перья. Назовите ИХ.", "answer": "пигмеи."}, {"number": 16, "text": "Статья, посвящённая экодукам, называется «ОНА для НЕЁ». Назовите ЕЁ.", "answer": "зебра."}, {"number": 17, "text": "Рождественский штоллен это традиционная немецкая выпечка с миндалëм, изюмом и цукатами. В 1978 году в ГДР штоллен планировали запретить из-за дефицита ЕЁ. Назовите ЕЁ словом, восходящим к корню со значением “быть сильным”.", "answer": "валюта"}, {"number": 18, "text": "Немецкое выражение, в котором упоминается ПЕРВАЯ и ВТОРОЙ, не о неуклюжести, а о способности решить трудную задачу. Назовите ПЕРВУЮ и ВТОРОЙ словами на соседние буквы алфавита.", "answer": "корова, лед"}, {"number": 19, "text": "Полагают, что картина Дега «Интерьер» изображает ссору в супружеской спальне. Однако Феликс Кремер считает эту версию несостоятельной, ведь ОНА на картине ТАКАЯ. Назовите ТАКУЮ ЕЁ.", "answer": "односпальная кровать"}, {"number": 20, "text": "Британская газета The Guardian [Зе Гардиан] назвала Бэнкси новым ИКСОМ. Одно из слов вопроса мы сократили. Восстановите это слово в исходном виде.", "answer": "Диккенсом"}, {"number": 21, "text": "Предыдущий вопрос был написан несколько месяцев назад и мог войти в более ранние турниры, но автор твердо сказал себе — “ПРОПУСК”. Заполните ПРОПУСК несколькими словами.", "answer": "не трогай, это на “Оливье”"}, {"number": 22, "text": "Группа людей выстроила необычную конструкцию, используя целых десять тысяч двести книг. Экземпляры какой книги они использовали?", "answer": "Книга рекордов Гиннесса."}, {"number": 23, "text": "Юстус фон Либих назвал \"Лающей собакой\" реакцию, которая проходит с характерными пламенем и звуком. Примечательно, что превращение в произведении начала XIX-го века описано с похожими сопутствующими эффектами. Какой элемент выделяется в ходе упомянутой химической реакции?", "answer": "сера"}, {"number": 24, "text": "В немецкой традиции Крампус — существо, похожее на дьявола, которое сопровождает Санта-Клауса. На рождественской открытке начала прошлого века Крампус изображен ПРОПУСК. Название какого издания мы пропустили?", "answer": "за рулём\nЗачет; точный ответ"}, {"number": 25, "text": "В постмодернистском мультфильме три поросенка прячутся от волка в домике. Через некоторое время поросята слышат шум на крыше, разжигают огонь и ставят котел. Затем поросята замечают, что в окно заглядывают ОНИ. Назовите имя любого из НИХ.", "answer": "Рудольф"}, {"number": 26, "text": "На англоязычной карикатуре Санта-Клаус попросил нанять ему в помощники человека для определенной работы. Но вместо этого пригласили музыканта, выступающего… в каком жанре?", "answer": "рэп."}, {"number": 27, "text": "Фермеры устанавливают на полях высокие Т-образные конструкции, которые предназначены для НИХ. В других НИХ каждая героиня использует собственный стиль ведения боя. Назовите ИХ двумя словами.", "answer": "хищные птицы."}, {"number": 28, "text": "Главный герой фильма «Большой Лебовски» — безработный безамбициозный лентяй, заполняющий свободное время игрой в боулинг. В первых кадрах фильма можно увидеть ЭТО. В некоторых фильмах ЭТО используют для демонстрации заброшенности местности. Назовите ЭТО.", "answer": "перекати-поле"}, {"number": 29, "text": "На картине Шарля Хоффба́уера изображена модная дама, которая собирается уходить из людного ресторана, даже не сделав заказ. На картине можно увидеть ИХ. По мнению искусствоведа, именно ОНИ стали причиной ухода. Назовите ИХ двумя словами на соседние буквы алфавита.", "answer": "одинаковые платья."}, {"number": 30, "text": "На рождественском рекламном плакате изображение ЕГО сопровождается фразой: \"То, что пожелали бы себе Мария и Иосиф\". Назовите ЕГО словом с приставкой или заимствованным словом.", "answer": "подгузник"}, {"number": 31, "text": "Каким английским семибуквенным неологизмом называются такие головоломки?", "answer": "windoku."}, {"number": 32, "text": "Ученые обнаружили камень с картой, сделанной в IV веке до нашей эры. Одну из точек на этой карте учёные не смогли сопоставить с современными данными, поэтому полагают, что эта точка — ОНА. Назовите ЕЕ словом с приставкой.", "answer": "сверхновая"}, {"number": 33, "text": "В одном мультфильме находящийся на поверхности кит выполняет роль ИКСА для определенных рыб. Единственный немецкий ИКС назвали в честь Фердинанда Цеппелина. Назовите ИКС словом с двумя корнями.", "answer": "авианосец."}, {"number": 34, "text": "Китайская поэтесса Су Хуэй написала поэму, представляющую собой квадрат из иероглифов размером 29 на 29. Эта поэма — ИКС. ИКС не является ИКСОМ. Какое слово мы заменили на ИКС?", "answer": "палиндром"}, {"number": 35, "text": "Дуплет, два вопроса по 30 секунд обсуждения каждый, ответы сдаются на одном бланке.\n1. Журналист спросил орнитолога Игоря Землянских, действительно ли ПРОПУСК счастье? Заполните ПРОПУСК двумя словами.\n2. Группа сирийцев безуспешно пыталась пересечь границу, спрятавшись в грузовике с овощами. В итоге их ПРОПУСК пограничники. Заполните ПРОПУСК тремя словами.", "answer": "1. аист приносит 2. нашли в капусте."}, {"number": 36, "text": "«Поэма Конца» эго-футуриста Василиска Гнедова завершает цикл из пятнадцати поэм, в которых последовательно аннигилировались различные художественные элементы. Кирилл Корчагин сравнивает “Поэму конца” с… каким произведением второй половины двадцатого века?", "answer": "4’33”"}, {"number": 101, "text": "Уважаемые знатоки! Не забывайте, что брэйн-ринг — это всего лишь игра. Не будет ничего страшного, если в вашем ответе будет \"ошибка\"...\nВо время поиска в приложении к карте Киева автор вопроса нашел на одной из страниц маршрут такси, который начинается на улице Волгоградской и идет через Воздухофлотский проспект до бульвара Шевченко. Назовите номер этой маршрутки.", "answer": "404."}];let i=0,score=0;const qtext=document.querySelector('#qtext'),qnum=document.querySelector('#qnum'),counter=document.querySelector('#counter'),input=document.querySelector('#answer'),feedback=document.querySelector('#feedback'),bar=document.querySelector('#bar'),scoreEl=document.querySelector('#score');
function clean(x){return x.toLowerCase().replace(/ё/g,'е').replace(/\[[^\]]*\]/g,'').replace(/[«»"'.,!?;:()]/g,' ').replace(/\s+/g,' ').trim()}
function render(){if(i>=questions.length){qnum.textContent='ГОТОВО';qtext.textContent=`Раунд завершён. Результат: ${score} из ${questions.length}.`;input.disabled=true;document.querySelector('.btn').disabled=true;document.querySelector('.btn').textContent='Готово';feedback.innerHTML='<span class="right">Отличная работа.</span>';bar.style.width='100%';return}let q=questions[i];qnum.textContent='ВОПРОС '+String(q.number).padStart(2,'0');counter.textContent=String(i+1).padStart(2,'0')+' / '+questions.length;qtext.textContent=q.text;input.value='';input.focus();feedback.textContent='';bar.style.width=(i/questions.length*100)+'%'}
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();if(i>=questions.length)return;let given=clean(input.value),ans=clean(questions[i].answer),ok=given&& (given===ans || ans.includes(given) || given.includes(ans));if(ok){score++;scoreEl.textContent=score+' правильных';feedback.innerHTML='<span class="right">Правильно!</span>';setTimeout(()=>{i++;render()},550)}else{feedback.innerHTML='<span class="wrong">Неправильно, подумай ещё.</span><span class="hint">Попробуй другой вариант.</span>';input.select()}});render();
</script></body></html>
